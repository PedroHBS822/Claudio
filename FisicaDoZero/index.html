    for(let m=0;m<=s.p.h;m+=s.p.h>50?20:10){ const yy=top+m*k; g.line(cw*.32+8,yy,cw*.32+16,yy,moon?'#ddd':COL.ink,1.4); g.text(nt(s.p.h-m)+' m',cw*.32+19,yy+4,{size:10.5,c:moon?'#ddd':COL.ink,mono:true}); }
    const xa=cw*.6, xb=cw*.85, n=Math.floor(Math.min(s.t,s.T)/.5);
    for(let i=1;i<=n;i++){ const yy=top+s.p.g*(i*.5)**2/2*k; g.ctx.save(); g.ctx.globalAlpha=.25; SK.ball(g,xa,yy,11,COL.force); SK.ball(g,xb,yy,6,COL.vel); g.ctx.restore(); g.text(nt(i*.5)+' s',xb+12,yy+4,{size:10,c:moon?'#ccc':COL.muted,mono:true}); }
    const yy=top+s.y*k; SK.ball(g,xa,yy,12,COL.force,s.t*3); SK.ball(g,xb,yy,6.5,COL.vel,s.t*5);
    if(s.v>.3) g.arrow(xa-22,yy,xa-22,yy+clamp(s.v*2.2,10,90),COL.acc,null,2.5);
    g.tag('10 kg',xa,yy-22,COL.force,'center',11); g.tag('0,1 kg',xb,yy-18,COL.vel,'center',11);
    SK.watch(g,cw-6,top+14,14,Math.min(s.t,s.T));
    const vmax=s.p.g*s.T; g.plot(cw+50,top,g.W-cw-70,bot-top-12,{xr:[0,Math.max(1,s.T)],yr:[0,vmax*1.05],series:[{pts:s.tr,c:COL.acc,dot:true}],xl:'t (s)',yl:'velocidade (m/s)'}); },
  reads:s=>[['Tempo',nt(Math.min(s.t,s.T))+' s'],['Distância caída',nt(s.y)+' m'],['Velocidade',nt(s.v)+' m/s'],['Tempo total de queda',nt(s.T)+' s'],['Velocidade ao chegar',nt(s.p.g*s.T)+' m/s']]});

/* lançamento oblíquo num campo de futebol (também é o experimento da página inicial) */
SIMS.proj=(host,cfg)=>{ const hero=!!cfg.hero; const angs=[30,45,60];
  return Sim(host,{alt:'Bola chutada num campo, com o rastro do voo; 30° e 60° caem no mesmo lugar',anim:true,autoplay:hero,h:hero?260:340,speed:hero?1.4:1,
  legend:hero?[['force','30°'],['vel','45°'],['acc','60°']]:[['vel','vₓ (constante)'],['acc','v_y (muda por causa da gravidade)']],
  ctrls:hero?[]:[{k:'v0',l:'Velocidade de lançamento',min:5,max:30,step:1,v:20,u:'m/s'},{k:'th',l:'Ângulo',min:10,max:80,step:5,v:cfg.th||45,u:'°'},{k:'g',l:'Onde?',opts:[[10,'Terra (g=10)'],[1.6,'Lua']],v:10}],
  init(s){ if(hero){ s.p.v0=18; s.p.g=10; s.k=s.k||0; s.p.th=angs[s.k%3]; s.done=s.done||[]; s.wait=0; } s.tr=[]; s.x=0; s.y=0; s.top=null; },
  step(s,dt){ if(hero&&s.wait>0){ s.wait-=dt; if(s.wait<=0){ s.k++; if(s.k%3===0) s.done=[]; s.t=0; s.def.init(s); } return; }
    const th=s.p.th*Math.PI/180, vx=s.p.v0*Math.cos(th), vy=s.p.v0*Math.sin(th), T=2*vy/s.p.g, t=Math.min(T,s.t+dt);
    s.x=vx*t; s.y=vy*t-s.p.g*t*t/2; s.tr.push([s.x,Math.max(0,s.y),t]); if(!s.top&&t>=vy/s.p.g) s.top=[vx*vy/s.p.g,vy*vy/(2*s.p.g)];
    if(t>=T){ if(hero){ s.done.push({tr:s.tr,k:s.k%3}); s.wait=.9; } else s.play(false); } },
  done:s=>!hero&&s.tr.length>1&&s.y<=0,
  draw(g,s){ const g0=s.p.g, R=s.p.v0**2/g0, H=s.p.v0**2/(2*g0), W=g.W, x0=40, base=g.H-(hero?30:38), k=Math.min((W-80)/(R*1.08),(base-34)/(H*1.12));
    if(g0<2){ g.rect(0,0,W,base,isDark()?'#0b0f1a':'#1d2333'); g.rect(0,base,W,g.H-base,'#9aa0a8'); } else { SK.sky(g,base); SK.hills(g,base); SK.grass(g,base,g.H-base); for(let x=0;x<W;x+=60) g.rect(x,base,30,g.H-base,alpha('#ffffff',isDark()?.03:.12)); }
    g.line(0,base,W,base,'#f4f6f8',2);
    for(let m=0;m<=R*1.05;m+=R>60?20:R>25?10:5){ g.line(x0+m*k,base,x0+m*k,base+6,'#f4f6f8',1.4); g.text(m+' m',x0+m*k,base+19,{size:10.5,c:g0<2?'#eee':COL.ink,align:'center',mono:true}); }
    SK.person(g,x0-16,base,34,isDark()?'#d0d6df':'#2b3340','push');
    const cols=[COL.force,COL.vel,COL.acc], P=p=>[x0+p[0]*k,base-p[1]*k];
    (s.done||[]).forEach(d=>g.poly(d.tr.map(P),cols[d.k],2.5));
    const c=hero?cols[s.k%3]:COL.ink; g.ctx.save(); g.ctx.setLineDash([3,5]); g.poly(s.tr.map(P),hero?c:alpha(COL.ink,.6),2); g.ctx.restore();
    if(!hero){ let nt0=0; s.tr.forEach(p=>{ if(p[2]>=nt0-1e-9){ nt0+=.25; const [px,py]=P(p); g.ctx.save(); g.ctx.globalAlpha=.3; SK.ball(g,px,py,6,COL.force); g.ctx.restore(); } }); }
    if(!hero&&s.top){ const [tx,ty]=P(s.top); g.line(tx,ty,tx,base,COL.energy,1.2,[4,4]); g.tag('altura máx. '+nt(s.top[1])+' m',tx,ty-18,COL.energy,'center',11.5); }
    const [px,py]=[x0+s.x*k,base-Math.max(0,s.y)*k]; SK.ball(g,px,py,7.5,hero?c:COL.force,s.t*6);
    if(!hero&&s.tr.length){ const th=s.p.th*Math.PI/180, vx=s.p.v0*Math.cos(th), vy=s.p.v0*Math.sin(th)-g0*Math.min(s.t,2*s.p.v0*Math.sin(th)/g0), sc=2.2; if(s.y>0||s.tr.length<3){ g.arrow(px,py,px+vx*sc,py,COL.vel,'vₓ',2.5); if(Math.abs(vy)>.5) g.arrow(px,py,px,py-vy*sc,COL.acc,'v_y',2.5); } }
    if(!hero&&s.tr.length>2&&s.y<=0) SK.dim(g,x0,base-12,px,base-12,'alcance '+nt(s.x)+' m',COL.ink);
    if(hero) g.tag('30° e 60° caem no mesmo lugar',W/2,18,COL.ink,'center',13); },
  reads:s=>{ if(hero) return [['Velocidade de lançamento','18 m/s'],['Ângulo atual',s.p.th+'°'],['Alcance',nt(s.p.v0**2*Math.sin(2*s.p.th*Math.PI/180)/s.p.g)+' m']];
    const th=s.p.th*Math.PI/180,v=s.p.v0,g0=s.p.g; return [['vₓ = v₀·cos θ',nt(v*Math.cos(th))+' m/s'],['v<sub>y</sub> inicial = v₀·sen θ',nt(v*Math.sin(th))+' m/s'],['Tempo de voo',nt(2*v*Math.sin(th)/g0)+' s'],['Altura máxima',nt((v*Math.sin(th))**2/(2*g0))+' m'],['Alcance',nt(v*v*Math.sin(2*th)/g0)+' m']]; }}); };

/* movimento circular: roda-gigante (ou bola no barbante, quando há força) */
SIMS.mcu=(host,cfg)=>Sim(host,{alt:cfg.force?'Bola girando presa num barbante; corte o barbante e veja para onde ela vai':'Roda-gigante girando com os vetores de velocidade e aceleração centrípeta',anim:true,h:340,
  legend:[['vel','velocidade (tangente)'],['acc','aceleração centrípeta (para o centro)']].concat(cfg.force?[['force','força centrípeta (tração do barbante)']]:[]),
  ctrls:[{k:'R',l:'Raio R',min:.5,max:3,step:.1,v:1.5,u:'m'},{k:'T',l:'Período T (uma volta)',min:.5,max:5,step:.1,v:2,u:'s'}].concat(cfg.force?[{k:'m',l:'Massa',min:.2,max:5,step:.1,v:1,u:'kg'}]:[]),
  btns:cfg.force?[{l:'✂ Cortar o barbante',f(s){ if(!s.free){ s.free=true; const w=2*Math.PI/s.p.T; s.fv=[-Math.sin(s.ang)*w*s.p.R,Math.cos(s.ang)*w*s.p.R]; s.fp=[Math.cos(s.ang)*s.p.R,Math.sin(s.ang)*s.p.R]; if(!s.playing) s.play(true); } }}]:[],
  init(s){ s.ang=0; s.free=false; s.tr=[]; s.hist=[]; },
  step(s,dt){ if(s.free){ s.fp[0]+=s.fv[0]*dt; s.fp[1]+=s.fv[1]*dt; s.tr.push(s.fp.slice()); if(Math.hypot(...s.fp)>6) s.play(false); } else { s.ang+=2*Math.PI/s.p.T*dt; s.hist.push(s.ang); if(s.hist.length>40) s.hist.shift(); } },
  draw(g,s){ const cx=g.W/2, cy=g.H/2-(cfg.force?0:14), k=(Math.min(g.W,g.H)/2-34)/3, R=s.p.R*k, w=2*Math.PI/s.p.T, v=w*s.p.R, ac=v*v/s.p.R;
    if(!cfg.force){ SK.sky(g,g.H-26); SK.grass(g,g.H-26,26); g.poly([[cx,cy],[cx-R*.55-20,g.H-26],[cx-R*.55-8,g.H-26],[cx,cy+14]],null,0,isDark()?'#7d8796':'#5d6878',true); g.poly([[cx,cy],[cx+R*.55+20,g.H-26],[cx+R*.55+8,g.H-26],[cx,cy+14]],null,0,isDark()?'#7d8796':'#5d6878',true);
      g.circle(cx,cy,R,null,isDark()?'#c7cfdb':'#46505f',3); for(let i=0;i<12;i++){ const a=s.ang+i*Math.PI/6; g.line(cx,cy,cx+Math.cos(a)*R,cy-Math.sin(a)*R,isDark()?'#8f99a8':'#7b8696',1.2); const hx=cx+Math.cos(a)*R, hy=cy-Math.sin(a)*R; if(i) g.rect(hx-6,hy+2,12,10,mix(COL.vel,COL.paper,.4),null,3); } g.circle(cx,cy,6,COL.ink); }
    else { g.circle(cx,cy,R,null,COL.line,1.5,[4,4]); SK.person(g,cx,cy+44,40,isDark()?'#d0d6df':'#2b3340'); g.circle(cx,cy,5,COL.ink); }
    const p=s.free?s.fp:[Math.cos(s.ang)*s.p.R,Math.sin(s.ang)*s.p.R], px=cx+p[0]*k, py=cy-p[1]*k;
    if(!s.free&&s.hist.length>1){ g.ctx.save(); for(let i=1;i<s.hist.length;i++){ const a=s.hist[i]; g.ctx.globalAlpha=i/s.hist.length*.5; g.circle(cx+Math.cos(a)*R,cy-Math.sin(a)*R,3,COL.vel); } g.ctx.restore(); }
    if(s.free) g.poly(s.tr.map(q=>[cx+q[0]*k,cy-q[1]*k]),COL.muted,1.5,null); else if(cfg.force) g.line(cx,cy,px,py,COL.force,2);
    if(cfg.force) SK.ball(g,px,py,10,COL.energy,s.ang*3); else { g.rect(px-11,py-2,22,18,COL.energy,mix(COL.energy,'#000',.4),5,1.5); g.circle(px,py,3,COL.ink); }
    const tv=s.free?[s.fv[0]/v,s.fv[1]/v]:[-Math.sin(s.ang),Math.cos(s.ang)], vs=clamp(v*10,18,90); g.arrow(px,py,px+tv[0]*vs,py-tv[1]*vs,COL.vel,'v',3);

/* caixa empurrada: Newton e atrito (a câmera acompanha a caixa) */

  init(s){ s.x=0; s.v=0; s.vt=[[0,0]]; s.dust=[]; },

  step(s,dt){ const f=s.def.forces(s); s.v=Math.max(0,s.v+f.a*dt); s.x+=s.v*dt; s.vt.push([s.t+dt,s.v]); if(cfg.fric&&s.v>0&&Math.random()<.5) s.dust.push({x:s.x,y:0,a:1}); s.dust.forEach(d=>{ d.a-=dt*1.5; d.y+=dt*14; }); s.dust=s.dust.filter(d=>d.a>0); if(s.t>8) s.play(false); },
  done:s=>s.t>8,
  draw(g,s){ const f=s.def.forces(s), y=g.H-56, W=g.W, k=26, bw=58+s.p.m*2.2, bh=40+s.p.m*1.4, bx=W*.34, cx=bx+bw/2, cy=y-bh/2;

    const floor=isDark()?'#3b3f47':'#c9b79c'; g.rect(0,y,W,g.H-y,floor); const off=(s.x*k)%60;

    for(let m=Math.floor((s.x*k-bx)/ (k*2))*2-2;m<=(s.x*k+W)/k;m+=2){ const xx=bx+(m-s.x)*k; if(xx<-20||xx>W+20) continue; g.line(xx,y,xx,y+7,COL.ink,1.2); g.text(m+' m',xx,y+20,{size:10,c:COL.ink,mono:true,align:'center'}); }
    s.dust.forEach(d=>{ g.ctx.save(); g.ctx.globalAlpha=d.a*.6; g.circle(bx+(d.x-s.x)*k-2,y-4-d.y*.3,3+(1-d.a)*4,'#bfa98a'); g.ctx.restore(); });
    if(s.p.F>0) SK.person(g,bx-30,y,74,isDark()?'#d0d6df':'#2b3340','push');
    SK.crate(g,bx,y-bh,bw,bh,s.p.m+' kg');
    const sc=v=>clamp(v*1.1,0,120);
    g.arrow(cx-bw*.25,cy+10,cx-bw*.25,cy+10+sc(s.p.m*GRAV)+bh/2-10,COL.vel,'P = '+nt(s.p.m*GRAV)+' N',3); g.arrow(cx+bw*.25,y-bh,cx+bw*.25,y-bh-sc(f.N),COL.vel,'N',3);
    if(s.p.F>0) g.arrow(bx+bw+2,cy,bx+bw+2+sc(s.p.F),cy,COL.force,'F = '+nt(s.p.F)+' N',3);
    if(f.fat>0) g.arrow(bx,y-5,bx-sc(f.fat),y-5,COL.force,'Fat = '+nt(f.fat)+' N',3,[0,14]);

    g.plot(W-190,22,170,104,{xr:[0,8],yr:[0,Math.max(5,(s.p.F/s.p.m)*8*.6)],series:[{pts:s.vt,c:COL.acc,dot:true}],yl:'v (m/s)',xl:'t (s)'}); },
  reads:s=>{ const f=s.def.forces(s); return [['Peso P = m·g',nt(s.p.m*GRAV)+' N'],['Normal N',nt(f.N)+' N']].concat(cfg.fric?[['Atrito',nt(f.fat)+' N · '+f.kind],['Atrito máximo μₑ·N',nt(s.p.ue*f.N)+' N']]:[]).concat([['Força resultante',nt(s.p.F-f.fat)+' N'],['Aceleração a = F<sub>R</sub>/m',nt(f.a)+' m/s²'],['Velocidade',nt(s.v)+' m/s']]); }});

SIMS.incl=(host)=>Sim(host,{alt:'Caixa numa rampa com o peso decomposto em duas partes',anim:true,h:340,
  legend:[['vel','peso e suas componentes'],['force','atrito'],['acc','normal']],

  init(s){ s.d=0; s.v=0; },
  phys(s){ const th=s.p.th*Math.PI/180, P=s.p.m*GRAV, Px=P*Math.sin(th), Py=P*Math.cos(th), N=Py, fmax=s.p.mu*N; const slides=Px>fmax+1e-9; return {th,P,Px,Py,N,fmax,fat:slides?fmax:Px,slides,a:slides?(Px-fmax)/s.p.m:0}; },
  step(s,dt){ const f=s.def.phys(s); if(f.slides){ s.v+=f.a*dt; s.d+=s.v*dt; } if(s.d>6||!f.slides) s.play(false); },
  done:s=>s.d>6,
  draw(g,s){ const f=s.def.phys(s), th=f.th, L=Math.min(g.W*.8,540), x0=g.W*.08, y0=g.H-30, x1=x0+L*Math.cos(th), y1=y0-L*Math.sin(th);
    SK.sky(g,y0); SK.grass(g,y0,g.H-y0);
    const ramp=g.ctx.createLinearGradient(0,y1,0,y0); ramp.addColorStop(0,isDark()?'#6b5a45':'#c7a57a'); ramp.addColorStop(1,isDark()?'#4d4033':'#a8865c');
    g.poly([[x0,y0],[x1,y0],[x1,y1]],mix(isDark()?'#4d4033':'#a8865c','#000',.3),2,ramp,true);
    if(th>.01){ g.ctx.save(); g.ctx.strokeStyle=COL.energy; g.ctx.lineWidth=2; g.ctx.beginPath(); g.ctx.arc(x0,y0,46,-th,0); g.ctx.stroke(); g.ctx.restore(); g.tag(s.p.th+'°',x0+60,y0-12,COL.energy,'left',12); }
    const ux=-Math.cos(th), uy=Math.sin(th), nx=-Math.sin(th), ny=-Math.cos(th), t=clamp(.35+s.d/12,0,.95);
    const bx=x1+ux*L*t, by=y1+uy*L*t, cx=bx+nx*24, cy=by+ny*24;
    const c=g.ctx; c.save(); c.translate(cx,cy); c.rotate(-th); SK.crate(g,-32,-24,64,48); c.restore();
    const sc=v=>clamp(v*2.2,0,110); g.arrow(cx,cy,cx,cy+sc(f.P),COL.vel,'P',3);
    g.arrow(cx,cy,cx+ux*sc(f.Px),cy+uy*sc(f.Px),COL.vel,'P·sen θ',2); g.arrow(cx,cy,cx-nx*sc(f.Py),cy-ny*sc(f.Py),COL.vel,'P·cos θ',2);
    g.arrow(cx,cy,cx+nx*sc(f.N),cy+ny*sc(f.N),COL.acc,'N',3); if(f.fat>1e-6) g.arrow(bx-ux*34,by-uy*34,bx-ux*(34+sc(f.fat)),by-uy*(34+sc(f.fat)),COL.force,'Fat',3);
    g.tag(f.slides?'a caixa escorrega':'o atrito segura a caixa',g.W-14,24,f.slides?COL.force:COL.ok,'right',14); },
  reads:s=>{ const f=s.def.phys(s); return [['P·sen θ (puxa ladeira abaixo)',nt(f.Px)+' N'],['P·cos θ = N',nt(f.Py)+' N'],['Atrito máximo μ·N',nt(f.fmax)+' N'],['Aceleração',nt(f.a)+' m/s²'],['Ângulo em que começa a escorregar',nt(Math.atan(s.p.mu)*180/Math.PI)+'°']]; }});

/* gangorra: torque (momento) */

  draw(g,s){ const M1=s.p.m1*GRAV*s.p.d1, M2=s.p.m2*GRAV*s.p.d2, diff=M1-M2, ang=clamp(diff/40,-1,1)*.2, cx=g.W/2, cy=g.H-80, k=Math.min(70,(g.W-60)/6.4);

    g.text(Math.abs(diff)<1e-9?'equilíbrio: os momentos se anulam':diff>0?'gira para a esquerda':'gira para a direita',cx,24,{size:15,bold:true,align:'center',c:Math.abs(diff)<1e-9?COL.ok:COL.ink});

  ctrls:[{k:'rho',l:'Líquido',opts:LIQ.map(x=>[x[0],x[1]]),v:1000},{k:'h',l:'Profundidade do sensor',min:0,max:10,step:.5,v:4,u:'m',live:true},{k:'atm',l:'Somar a pressão do ar?',opts:[[1,'sim'],[0,'não']],v:1,live:true}],

    const sy=y0+s.p.h*k; g.line(x0+tw/2,y0-16,x0+tw/2,sy,COL.ink,1.5); g.circle(x0+tw/2,sy,9,COL.energy,COL.ink,2);

/* curva de aquecimento da água (−20 °C a 120 °C) */
SIMS.phase=(host)=>Sim(host,{alt:'Gráfico de temperatura contra calor recebido, com patamares de mudança de estado',anim:true,h:320,
  ctrls:[{k:'m',l:'Massa de gelo',min:50,max:500,step:50,v:100,u:'g'},{k:'P',l:'Potência do aquecedor',min:1,max:4,step:.5,v:2,f:v=>nsig(v,2)+'×'}],
  segs(m){ return [[m*.5*20,'aquecendo o gelo'],[m*80,'derretendo (0 °C)'],[m*1*100,'aquecendo a água'],[m*540,'fervendo (100 °C)'],[m*.5*20,'aquecendo o vapor']]; },
  TofQ(s,Q){ const S=s.def.segs(s.p.m); let q=Q; const T0=[-20,0,0,100,100], k=[.5*s.p.m,0,s.p.m,0,.5*s.p.m];
    for(let i=0;i<5;i++){ if(q<=S[i][0]||i===4) return {T:k[i]?T0[i]+Math.min(q,S[i][0])/k[i]:T0[i],phase:S[i][1],i,frac:q/S[i][0]}; q-=S[i][0]; } },
  init(s){ s.Q=0; s.tot=s.def.segs(s.p.m).reduce((a,b)=>a+b[0],0); s.pts=[[0,-20]]; },
  step(s,dt){ s.Q=Math.min(s.tot,s.Q+s.tot/24*s.p.P*dt); s.pts.push([s.Q/1000,s.def.TofQ(s,s.Q).T]); if(s.Q>=s.tot) s.play(false); },
  done:s=>s.Q>=s.tot,
  draw(g,s){ const st=s.def.TofQ(s,s.Q), pw=g.W*.64, r=g.plot(50,26,pw,g.H-74,{xr:[0,s.tot/1000],yr:[-30,130],series:[{pts:s.pts,c:COL.force,dot:true}],xl:'calor recebido (kcal)',yl:'temperatura (°C)'});
    let acc=0; s.def.segs(s.p.m).forEach((sg,i)=>{ acc+=sg[0]; if(i<4) g.line(r.X(acc/1000),26,r.X(acc/1000),g.H-48,COL.line,1,[3,3]); });
    const bx=pw+80, bw=g.W-bx-20, cy=g.H/2-10; g.text(st.phase,bx+bw/2,40,{size:13.5,bold:true,align:'center'}); g.text(nt(st.T,3)+' °C',bx+bw/2,66,{size:22,bold:true,align:'center',mono:true});
    const n=12; for(let i=0;i<n;i++){ const x=bx+10+(i%4)*(bw-20)/3, y=cy+Math.floor(i/4)*26; const melted=st.i>1||(st.i===1&&i/n<st.frac), vap=st.i>3||(st.i===3&&i/n<st.frac); if(vap) g.circle(x,y-30-(i%3)*6,4,COL.muted); else if(melted) g.circle(x,y,7,COL.vel); else g.rect(x-7,y-7,14,14,COL.vel+'77',COL.vel,2,1.5); } },
  reads:s=>{ const S=s.def.segs(s.p.m), st=s.def.TofQ(s,s.Q); return [['Calor recebido até agora',nt(s.Q)+' cal'],['Fase',st.phase],['Derreter todo o gelo: m·L<sub>f</sub>',nt(S[1][0])+' cal'],['Ferver toda a água: m·L<sub>v</sub>',nt(S[3][0])+' cal']]; }});

SIMS.gas=(host)=>Sim(host,{alt:'Partículas de gás num cilindro com pistão, e o diagrama pressão × volume',anim:true,autoplay:true,h:320,

/* diagrama de raios para espelhos esféricos e lentes (aproximação de raios paraxiais) */
function rayDiagram(g,s,kind){
  const mirror=kind==='mirror', conv=s.p.t==='c', f=(conv?1:-1)*s.p.f, p=s.p.p, inf=Math.abs(1/f-1/p)<1e-9, pi=inf?Infinity:1/(1/f-1/p), A=inf?Infinity:-pi/p;
  const xm=mirror?g.W*.66:g.W*.5, cy=g.H*.55, span=Math.max(p,Math.min(Math.abs(pi),60),2*s.p.f)*1.08, k=(mirror?xm-20:xm-20)/span, ho=Math.min(46,g.H*.2);
  const side=mirror?-1:1, xo=xm-p*k, ix=inf?null:(mirror?xm-pi*k:xm+pi*k), hi=inf?0:A*ho;
  g.line(0,cy,g.W,cy,COL.muted,1.2);
  if(mirror){ const bulge=conv?14:-14; g.ctx.save(); g.ctx.strokeStyle=COL.ink; g.ctx.lineWidth=3; g.ctx.beginPath(); g.ctx.moveTo(xm-bulge,cy-g.H*.42); g.ctx.quadraticCurveTo(xm+bulge,cy,xm-bulge,cy+g.H*.42); g.ctx.stroke(); g.ctx.restore(); g.text(conv?'lado refletor ←':'lado refletor ←',xm-4,cy-g.H*.42-6,{size:11,c:COL.muted,align:'right'}); }
  else { g.line(xm,cy-g.H*.42,xm,cy+g.H*.42,COL.ink,2.5); const tip=(y,d)=>{ g.line(xm,y,xm-8,y+d*8*(conv?1:-1),COL.ink,2.5); g.line(xm,y,xm+8,y+d*8*(conv?1:-1),COL.ink,2.5); }; tip(cy-g.H*.42,1); tip(cy+g.H*.42,-1); }
  const fx=xm+side*f*k, lab=(x,t)=>{ g.line(x,cy-5,x,cy+5,COL.ink,2); g.text(t,x,cy+20,{size:12,align:'center',c:COL.muted,bold:true}); };
  if(mirror){ lab(xm-f*k,'F'); lab(xm-2*f*k,'C'); } else { lab(xm-s.p.f*k,conv?'F':'F\''); lab(xm+s.p.f*k,conv?'F\'':'F'); }
  const O=[xo,cy-ho]; g.arrow(xo,cy,xo,cy-ho,COL.vel,'objeto',3);
  const rays=[[xm,cy-ho],mirror?[xm,cy]:[xm,cy]], out=(H,dir,c,dash)=>{ const L=2000/Math.hypot(dir[0],dir[1]); g.line(H[0],H[1],H[0]+dir[0]*L,H[1]+dir[1]*L,c,2,dash); };
  const cols=[COL.force,COL.acc];
  rays.forEach((H,i)=>{ g.line(O[0],O[1],H[0],H[1],cols[i],2);
    if(inf){ const v=[xm-O[0],cy-O[1]]; out(H,mirror?[-v[0],v[1]]:v,cols[i]); return; }
    const I=[ix,cy-hi], real=pi>0; if(real) out(H,[I[0]-H[0],I[1]-H[1]],cols[i]); else { out(H,[H[0]-I[0],H[1]-I[1]],cols[i]); g.line(H[0],H[1],I[0],I[1],cols[i],1.5,[5,5]); } });
  if(!inf&&Math.abs(pi)<400) g.arrow(ix,cy,ix,cy-hi,COL.energy,'imagem',3);
  return {pi,A,inf}; }
function rayReads(s,kind){ const conv=s.p.t==='c', f=(conv?1:-1)*s.p.f, p=s.p.p, inf=Math.abs(1/f-1/p)<1e-9; if(inf) return [['Posição da imagem p\'','no infinito (imagem imprópria)'],['Por quê?','o objeto está exatamente no foco']];
  const pi=1/(1/f-1/p), A=-pi/p, real=pi>0; return [['Posição da imagem p\'',nt(pi)+' cm'+(kind==='mirror'?(real?' (na frente do espelho)':' (atrás do espelho)'):(real?' (do outro lado da lente)':' (do mesmo lado do objeto)'))],['Aumento A = −p\'/p',nt(A)],['Natureza',`${real?'real':'virtual'}, ${A<0?'invertida':'direita'}, ${Math.abs(A)>1.001?'maior':Math.abs(A)<.999?'menor':'do mesmo tamanho'}`],['Vergência V = 1/f (f em metros)',nt(1/(f/100))+' di']]; }
SIMS.mirror=(host)=>Sim(host,{alt:'Espelho esférico com raios de luz formando a imagem de um objeto',h:w=>Math.min(360,Math.max(280,w*.5)),
  legend:[['vel','objeto'],['energy','imagem'],['force','raio paralelo ao eixo'],['acc','raio que bate no vértice']],
  ctrls:[{k:'t',l:'Espelho',opts:[['c','côncavo'],['v','convexo']],v:'c',live:true},{k:'f',l:'Distância focal |f|',min:5,max:20,step:1,v:10,u:'cm',live:true},{k:'p',l:'Distância do objeto p',min:2,max:40,step:1,v:25,u:'cm',live:true}],
  draw(g,s){ rayDiagram(g,s,'mirror'); }, reads:s=>rayReads(s,'mirror')});
SIMS.lens=(host)=>Sim(host,{alt:'Lente com raios de luz formando a imagem de um objeto',h:w=>Math.min(360,Math.max(280,w*.5)),
  legend:[['vel','objeto'],['energy','imagem'],['force','raio paralelo ao eixo'],['acc','raio pelo centro óptico']],
  ctrls:[{k:'t',l:'Lente',opts:[['c','convergente'],['v','divergente']],v:'c',live:true},{k:'f',l:'Distância focal |f|',min:5,max:20,step:1,v:10,u:'cm',live:true},{k:'p',l:'Distância do objeto p',min:2,max:40,step:1,v:25,u:'cm',live:true}],
  draw(g,s){ rayDiagram(g,s,'lens'); }, reads:s=>rayReads(s,'lens')});

/* refração e reflexão total */
const NS=[[1,'ar (1,00)'],[1.33,'água (1,33)'],[1.5,'vidro (1,50)'],[2.42,'diamante (2,42)']];
SIMS.refr=(host)=>Sim(host,{alt:'Raio de luz passando de um meio para outro e mudando de direção',h:320,
  legend:[['force','raio incidente'],['vel','raio refratado'],['muted','raio refletido']],
  ctrls:[{k:'n1',l:'Meio de cima',opts:NS.map(x=>[x[0],x[1]]),v:1,live:true},{k:'n2',l:'Meio de baixo',opts:NS.map(x=>[x[0],x[1]]),v:1.33,live:true},{k:'a',l:'Ângulo de incidência θ₁',min:0,max:89,step:1,v:40,u:'°',live:true}],
  draw(g,s){ const cx=g.W/2, cy=g.H/2, L=Math.min(g.W*.45,g.H*.47), a=s.p.a*Math.PI/180, sn=s.p.n1*Math.sin(a)/s.p.n2, tir=sn>1;
    g.rect(0,cy,g.W,g.H-cy,COL.vel+(s.p.n2>1.4?'30':s.p.n2>1?'1e':'08'),null,0); if(s.p.n1>1) g.rect(0,0,g.W,cy,COL.vel+(s.p.n1>1.4?'30':'1e'),null,0);
    g.line(0,cy,g.W,cy,COL.ink,1.5); g.line(cx,cy-L,cx,cy+L,COL.muted,1,[5,5]); g.text('normal',cx+6,cy-L+12,{size:11,c:COL.muted});
    const si=[cx-Math.sin(a)*L,cy-Math.cos(a)*L]; g.line(si[0],si[1],cx,cy,COL.force,3); g.arrow(si[0],si[1],(si[0]+cx)/2,(si[1]+cy)/2,COL.force,null,3);
    g.arrow(cx,cy,cx+Math.sin(a)*L,cy-Math.cos(a)*L,tir?COL.force:COL.muted,tir?'reflexão total':null,tir?3:1.5);
    if(!tir){ const b=Math.asin(sn); g.arrow(cx,cy,cx+Math.sin(b)*L,cy+Math.cos(b)*L,COL.vel,'θ₂ = '+nt(b*180/Math.PI,3)+'°',3); }
    g.text(NS.find(x=>x[0]===s.p.n1)[1],12,20,{size:12,c:COL.muted}); g.text(NS.find(x=>x[0]===s.p.n2)[1],12,g.H-10,{size:12,c:COL.muted});
    g.text('θ₁ = '+s.p.a+'°',si[0]+8,si[1]+16,{size:12,c:COL.force,bold:true}); },
  reads:s=>{ const a=s.p.a*Math.PI/180, sn=s.p.n1*Math.sin(a)/s.p.n2; return [['n₁·sen θ₁',nt(s.p.n1*Math.sin(a),3)],['θ₂ (Snell: n₁ sen θ₁ = n₂ sen θ₂)',sn>1?'não existe: reflexão total':nt(Math.asin(sn)*180/Math.PI,3)+'°'],['Ângulo limite',s.p.n1>s.p.n2?nt(Math.asin(s.p.n2/s.p.n1)*180/Math.PI,3)+'°':'não há (a luz vai para um meio mais refringente)'],['Velocidade da luz embaixo c/n₂',nf(3e8/s.p.n2)+' m/s']]; }});

/* lei de Coulomb */
SIMS.coulomb=(host)=>Sim(host,{alt:'Duas cargas elétricas com as forças de atração ou repulsão',h:250,
  legend:[['force','carga positiva'],['vel','carga negativa']],
  ctrls:[{k:'q1',l:'Carga 1',min:-5,max:5,step:1,v:2,u:'μC',live:true},{k:'q2',l:'Carga 2',min:-5,max:5,step:1,v:-3,u:'μC',live:true},{k:'d',l:'Distância',min:.1,max:1,step:.05,v:.3,u:'m',live:true}],
  draw(g,s){ const F=9e-3*s.p.q1*s.p.q2/s.p.d**2, k=(g.W-120)/1.1, cy=g.H/2+10, x1=g.W/2-s.p.d*k/2, x2=g.W/2+s.p.d*k/2, rep=F>0, L=F===0?0:clamp(18+24*Math.log10(1+Math.abs(F)*10),10,110);
    g.line(x1,cy+44,x2,cy+44,COL.muted,1.2); g.text('d = '+nt(s.p.d)+' m',(x1+x2)/2,cy+60,{size:12,c:COL.muted,align:'center'});
    [[x1,s.p.q1,-1],[x2,s.p.q2,1]].forEach(([x,q,sd])=>{ const r=12+Math.abs(q)*3, c=q>0?COL.force:q<0?COL.vel:COL.muted; g.circle(x,cy,r,c,COL.ink,1.5); g.text(q>0?'+':q<0?'−':'0',x,cy+6,{size:18,bold:true,align:'center',c:'#fff'}); g.text(nt(q)+' μC',x,cy-r-8,{size:12,align:'center',bold:true});
      if(L) g.arrow(x+sd*(r+4)*(rep?1:-1),cy,x+sd*(rep?1:-1)*(r+4+L),cy,COL.ink,'F',3,[0,-16]); });
    g.text(F===0?'sem força (uma das cargas é zero)':rep?'sinais iguais: repulsão':'sinais opostos: atração',g.W/2,26,{size:15,bold:true,align:'center'}); },
  reads:s=>{ const F=9e-3*s.p.q1*s.p.q2/s.p.d**2; return [['F = k·|q₁·q₂|/d²',nt(Math.abs(F))+' N'],['Com o dobro da distância',nt(Math.abs(F)/4)+' N (4× menor)'],['Força em cada carga','mesmo valor, sentidos opostos (ação e reação)'],['Constante k','9×10<sup>9</sup> N·m²/C²']]; }});

/* campo e potencial elétrico: arraste as cargas e a sonda */
SIMS.field=(host)=>Sim(host,{alt:'Mapa de vetores do campo elétrico de duas cargas arrastáveis',h:w=>Math.min(380,Math.max(290,w*.55)),
  legend:[['force','carga positiva'],['vel','carga negativa'],['energy','sonda: campo naquele ponto']],
  ctrls:[{k:'q1',l:'Carga A',min:-4,max:4,step:1,v:3,u:'μC',live:true},{k:'q2',l:'Carga B',min:-4,max:4,step:1,v:-3,u:'μC',live:true}],
  init(s){ if(!s.c){ s.c=[[.6,.5],[1.4,.5]]; s.pr=[1,.2]; } },
  geo:s=>{ const k=s.W/2; return {k,X:x=>x*k,Y:y=>y*k,ix:x=>x/k}; },
  E(s,x,y){ let ex=0,ey=0,V=0; [[s.c[0],s.p.q1],[s.c[1],s.p.q2]].forEach(([c,q])=>{ const dx=x-c[0], dy=y-c[1], r=Math.max(.03,Math.hypot(dx,dy)), e=9e3*q/(r*r); ex+=e*dx/r; ey+=e*dy/r; V+=9e3*q/r; }); return [ex,ey,V]; },
  drag:{ down(s,x,y){ const {k}=s.def.geo(s), pts=[s.c[0],s.c[1],s.pr]; s.dr=pts.findIndex(p=>Math.hypot(p[0]*k-x,p[1]*k-y)<20); return s.dr>=0; },
    move(s,x,y){ const {k}=s.def.geo(s), p=[clamp(x/k,.02,1.98),clamp(y/k,.02,s.H/k-.02)]; if(s.dr===2) s.pr=p; else s.c[s.dr]=p; } },
  draw(g,s){ const {k}=s.def.geo(s), st=Math.max(26,g.W/22);
    for(let x=st/2;x<g.W;x+=st) for(let y=st/2;y<g.H;y+=st){ const [ex,ey]=s.def.E(s,x/k,y/k), m=Math.hypot(ex,ey); if(!m) continue; const a=clamp(Math.log10(m)/3.5,.08,1), L=st*.42; g.ctx.globalAlpha=a; g.arrow(x-ex/m*L/2,y-ey/m*L/2,x+ex/m*L/2,y+ey/m*L/2,COL.ink,null,1.4); g.ctx.globalAlpha=1; }
    [[s.c[0],s.p.q1,'A'],[s.c[1],s.p.q2,'B']].forEach(([c,q,n])=>{ g.circle(c[0]*k,c[1]*k,14,q>0?COL.force:q<0?COL.vel:COL.muted,COL.ink,1.5); g.text(q>0?'+':q<0?'−':'0',c[0]*k,c[1]*k+6,{size:16,bold:true,align:'center',c:'#fff'}); });
    const [ex,ey]=s.def.E(s,...s.pr), m=Math.hypot(ex,ey), px=s.pr[0]*k, py=s.pr[1]*k; g.circle(px,py,7,COL.energy,COL.ink,1.5); if(m) g.arrow(px,py,px+ex/m*46,py+ey/m*46,COL.energy,'E',3);
    g.text('arraste as cargas e a sonda amarela',10,g.H-10,{size:12,c:COL.muted}); },
  reads:s=>{ const [ex,ey,V]=s.def.E(s,...s.pr); return [['Campo na sonda |E|',nf(Math.hypot(ex,ey)*1e3)+' N/C'],['Potencial na sonda V',nf(V*1e3)+' V'],['Força numa carga de +1 μC ali',nf(Math.hypot(ex,ey)*1e3*1e-6)+' N'],['Sentido do campo','sai das cargas + e entra nas −']]; }});

/* lei de Ohm */
SIMS.ohm=(host)=>Sim(host,{alt:'Circuito com bateria e resistor; as bolinhas mostram a corrente',anim:true,autoplay:true,h:280,
  ctrls:[{k:'U',l:'Tensão da bateria U',min:0,max:24,step:1,v:12,u:'V',live:true},{k:'R',l:'Resistência R',min:1,max:100,step:1,v:20,u:'Ω',live:true}],
  init(s){ s.ph=0; }, step(s,dt){ s.ph+=dt*s.p.U/s.p.R*.9; },
  draw(g,s){ const x0=30, y0=30, w=Math.min(g.W*.5,320), h=g.H-70, I=s.p.U/s.p.R, per=2*(w+h);
    g.rect(x0,y0,w,h,null,COL.ink,6,3); g.rect(x0-10,y0+h/2-26,20,52,COL.card,null,0); g.line(x0-14,y0+h/2-10,x0+14,y0+h/2-10,COL.ink,4); g.line(x0-8,y0+h/2+6,x0+8,y0+h/2+6,COL.ink,4); g.text('+',x0+20,y0+h/2-8,{size:14,bold:true}); g.text(s.p.U+' V',x0+22,y0+h/2+14,{size:12,mono:true});
    g.rect(x0+w/2-40,y0-10,80,20,COL.energy,COL.ink,4); g.text(s.p.R+' Ω',x0+w/2,y0+30,{size:13,bold:true,align:'center',mono:true});
    const pos=d=>{ d=((d%per)+per)%per; if(d<w) return [x0+d,y0]; d-=w; if(d<h) return [x0+w,y0+d]; d-=h; if(d<w) return [x0+w-d,y0+h]; d-=w; return [x0,y0+h-d]; };
    for(let i=0;i<24;i++){ const [x,y]=pos(i*per/24+s.ph*60); g.circle(x,y,4,COL.vel); }
    const r=g.plot(x0+w+60,y0,g.W-x0-w-80,h,{xr:[0,24],yr:[0,Math.max(1,24/s.p.R)*1.1],series:[{pts:[[0,0],[24,24/s.p.R]],c:COL.force}],xl:'U (V)',yl:'I (A)'}); g.circle(r.X(s.p.U),r.Y(I),6,COL.vel,COL.ink,1.5); },
  reads:s=>{ const I=s.p.U/s.p.R; return [['Corrente I = U/R',nt(I)+' A'],['Potência dissipada P = U·I',nt(s.p.U*I)+' W'],['Carga que passa por segundo',nt(I)+' C'],['Elétrons por segundo',nf(I/1.6e-19)]]; }});

/* associação de resistores */
SIMS.resist=(host)=>Sim(host,{alt:'Três resistores em série ou em paralelo com correntes e tensões',h:300,
  ctrls:[{k:'mode',l:'Ligação',opts:[['s','em série'],['p','em paralelo']],v:'s',live:true},{k:'U',l:'Tensão da fonte',min:1,max:24,step:1,v:12,u:'V',live:true},{k:'R1',l:'R₁',min:1,max:30,step:1,v:10,u:'Ω',live:true},{k:'R2',l:'R₂',min:1,max:30,step:1,v:20,u:'Ω',live:true},{k:'R3',l:'R₃',min:1,max:30,step:1,v:30,u:'Ω',live:true}],
  calc(s){ const R=[s.p.R1,s.p.R2,s.p.R3], U=s.p.U; if(s.p.mode==='s'){ const Req=R[0]+R[1]+R[2], I=U/Req; return {Req,I,it:R.map(()=>I),ut:R.map(r=>r*I)}; } const Req=1/(1/R[0]+1/R[1]+1/R[2]); return {Req,I:U/Req,it:R.map(r=>U/r),ut:R.map(()=>U)}; },
  draw(g,s){ const c=s.def.calc(s), x0=40, x1=g.W-40, y0=40, y1=g.H-40, R=[s.p.R1,s.p.R2,s.p.R3], th=i=>clamp(1.5+i*6,1.5,8);
    g.line(x0,y0,x0,y1,COL.ink,th(c.I)); g.line(x0,y1,x1,y1,COL.ink,th(c.I)); g.text(s.p.U+' V',x0+8,(y0+y1)/2+4,{size:13,bold:true,mono:true}); g.line(x0-12,(y0+y1)/2-6,x0+12,(y0+y1)/2-6,COL.ink,4); g.line(x0-6,(y0+y1)/2+6,x0+6,(y0+y1)/2+6,COL.ink,4);
    const box=(x,y,i)=>{ g.rect(x-34,y-12,68,24,COL.energy,COL.ink,4); g.text('R'+'₁₂₃'[i]+' = '+R[i]+' Ω',x,y+5,{size:11.5,bold:true,align:'center'}); g.text(nt(c.it[i])+' A · '+nt(c.ut[i])+' V',x,y+28,{size:11.5,align:'center',mono:true,c:COL.muted}); };
    if(s.p.mode==='s'){ g.line(x0,y0,x1,y0,COL.ink,th(c.I)); g.line(x1,y0,x1,y1,COL.ink,th(c.I)); [.25,.5,.75].forEach((f,i)=>box(x0+(x1-x0)*f,y0,i)); }
    else { const xs=[.4,.6,.8].map(f=>x0+(x1-x0)*f); g.line(x0,y0,xs[2],y0,COL.ink,th(c.I)); xs.forEach((x,i)=>{ g.line(x,y0,x,y1,COL.ink,th(c.it[i])); box(x,(y0+y1)/2-10,i); }); g.line(xs[2],y1,x1,y1,COL.ink,1); }
    g.text('espessura do fio ∝ corrente',g.W-10,g.H-10,{size:11.5,c:COL.muted,align:'right'}); },
  reads:s=>{ const c=s.def.calc(s); return [['Resistência equivalente',nt(c.Req)+' Ω'],['Corrente total I = U/R<sub>eq</sub>',nt(c.I)+' A'],['Potência total',nt(s.p.U*c.I)+' W'],['Regra',s.p.mode==='s'?'mesma corrente em todos; as tensões somam':'mesma tensão em todos; as correntes somam']]; }});

/* força magnética numa carga em movimento */

function lamColor(l){ if(l<380) return '#9b7bff'; const t=[[380,[120,0,200]],[440,[0,40,255]],[490,[0,200,255]],[510,[0,220,80]],[580,[255,230,0]],[645,[255,40,0]],[700,[200,0,0]]]; let i=0; while(i<t.length-2&&l>t[i+1][0]) i++; const [a,ca]=t[i],[b,cb]=t[i+1], f=clamp((l-a)/(b-a),0,1); return `rgb(${ca.map((c,j)=>Math.round(c+(cb[j]-c)*f)).join(',')})`; }

    s.el.forEach(e=>e.x+=e.v*dt); s.el=s.el.filter(e=>e.x<1); },

SIMS.conduc=(host)=>Sim(host,{alt:'Placa de um material entre um lado quente e um frio, com o calor atravessando por condução',anim:true,autoplay:true,h:300,
  legend:[['force','lado quente'],['vel','lado frio'],['energy','calor atravessando a placa']],
  ctrls:[{k:'k',l:'Material',opts:MATS.map(m=>[m[0],m[1]]),v:50,live:true},{k:'L',l:'Espessura L',min:1,max:20,step:1,v:5,u:'cm',live:true},{k:'A',l:'Área A',min:.5,max:4,step:.5,v:1,u:'m²',live:true},{k:'dT',l:'Diferença de temperatura ΔT',min:5,max:80,step:5,v:30,u:'°C',live:true}],
  phi:s=>s.p.k*s.p.A*s.p.dT/(s.p.L/100),
  inten:s=>clamp((Math.log10(s.def.phi(s))+1)/7,.03,1),
  init(s){ s.q=[]; s.acc=0; },

  geo(s){ const W=s.W, H=s.H, bw=Math.max(58,Math.min(90,W*.12)), sw=26+(s.p.L-1)/19*Math.max(40,W-2*bw-120), x0=(W-sw)/2, sh=(H-120)*(.4+.6*s.p.A/4), y0=58+(H-120-sh)/2; return {bw,sw,x0,sh,y0}; },
  draw(g,s){ const {bw,sw,x0,sh,y0}=s.def.geo(s), phi=s.def.phi(s), I=s.def.inten(s), Tf=20, Tq=20+s.p.dT, name=MATS.find(m=>m[0]===s.p.k)[1];
    g.rect(x0-bw,y0-14,bw,sh+28,COL.force+'30',COL.force,8,2); g.text(nt(Tq)+' °C',x0-bw/2,y0+sh/2+5,{size:14,bold:true,align:'center',c:COL.force});
    g.rect(x0+sw,y0-14,bw,sh+28,COL.vel+'30',COL.vel,8,2); g.text(nt(Tf)+' °C',x0+sw+bw/2,y0+sh/2+5,{size:14,bold:true,align:'center',c:COL.vel});
    const c=g.ctx, gr=c.createLinearGradient(x0,0,x0+sw,0); gr.addColorStop(0,COL.force); gr.addColorStop(1,COL.vel);
    c.save(); c.globalAlpha=.45; g.rect(x0,y0,sw,sh,gr); c.restore(); g.rect(x0,y0,sw,sh,null,COL.ink,0,1.5);
    s.q.forEach(p=>{ const x=x0-bw*.2+p.x*(sw+bw*.4), y=y0+p.y*sh; g.circle(x,y,3.2,COL.energy); });
    const ay=34, aw=Math.max(sw+bw,120); g.arrow(g.W/2-aw/2,ay,g.W/2+aw/2,ay,COL.energy,null,2+7*I);
    g.text('Φ = '+nt(phi)+' W',g.W/2,ay-14,{size:14,bold:true,align:'center',c:COL.energy});
    g.text(name,x0+sw/2,y0+sh+34,{size:13,bold:true,align:'center'});
    const yb=y0+sh+8; g.line(x0,yb,x0+sw,yb,COL.muted,1.2); g.line(x0,yb-4,x0,yb+4,COL.muted,1.2); g.line(x0+sw,yb-4,x0+sw,yb+4,COL.muted,1.2);
    g.text('L = '+s.p.L+' cm',x0+sw/2,y0+sh+50,{size:11.5,align:'center',c:COL.muted,mono:true}); },

SIMS.mhs=(host)=>Sim(host,{alt:'Bloco preso a uma mola e um pêndulo oscilando lado a lado, com o gráfico da posição de cada um no tempo',anim:true,autoplay:true,h:w=>w<560?440:400,

  step(){},
  pos(s,t){ const ws=Math.sqrt(s.p.k/s.p.m), wp=Math.sqrt(GRAV/s.p.L); return [Math.cos(ws*t),Math.cos(wp*t)]; },

    g.text('T = '+nt(2*Math.PI*Math.sqrt(s.p.m/s.p.k))+' s',cx+20,top+24,{size:13,bold:true,c:COL.vel});

    const t0=Math.max(0,t-6), pv=[], pp=[]; for(let u=t0;u<=t+1e-9;u+=.02){ const [a,b]=s.def.pos(s,u); pv.push([u,a]); pp.push([u,b]); }

SIMS.harm=(host)=>Sim(host,{alt:'Onda estacionária numa corda ou dentro de um tubo, com nós e ventres marcados',anim:true,autoplay:true,h:290,
  legend:[['vel','onda agora'],['muted','limites da vibração'],['force','nós (pontos parados)']],
  ctrls:[{k:'tipo',l:'Onde está a onda',opts:[['corda','corda presa'],['aberto','tubo aberto'],['fechado','tubo fechado']],v:'corda',live:true},{k:'n',l:'Modo de vibração',min:1,max:5,step:1,v:1,f:v=>v+'º modo',live:true},{k:'L',l:'Comprimento L',min:.2,max:2,step:.1,v:1,u:'m',live:true},{k:'v',l:'Velocidade da onda v',min:100,max:400,step:10,v:340,u:'m/s',live:true}],
  mode(s){ const L=s.p.L, t=s.p.tipo, h=t==='fechado'?2*s.p.n-1:s.p.n, lam=t==='fechado'?4*L/h:2*L/h, f1=t==='fechado'?s.p.v/(4*L):s.p.v/(2*L);
    const y=t==='corda'?u=>Math.sin(h*Math.PI*u):t==='aberto'?u=>Math.cos(h*Math.PI*u):u=>Math.sin(h*Math.PI*u/2);
    const nodes=[]; for(let j=0;j<=2*h;j++){ const u=t==='corda'?j/h:t==='aberto'?(j+.5)/h:2*j/h; if(u<=1+1e-9) nodes.push(u); }
    return {h,lam,f:s.p.v/lam,f1,y,nodes}; },
  step(){},
  draw(g,s){ const m=s.def.mode(s), x0=34, x1=g.W-34, cy=g.H/2-6, amp=Math.min(62,g.H*.24), X=u=>x0+u*(x1-x0), ph=Math.cos(2*Math.PI*.8*s.t);
    if(s.p.tipo==='corda'){ g.rect(x0-10,cy-40,8,80,COL.muted,COL.ink,2,1); g.rect(x1+2,cy-40,8,80,COL.muted,COL.ink,2,1); }
    else { const th=amp+16; g.line(x0,cy-th,x1,cy-th,COL.ink,3); g.line(x0,cy+th,x1,cy+th,COL.ink,3); if(s.p.tipo==='fechado') g.line(x0,cy-th,x0,cy+th,COL.ink,5);
      g.text(s.p.tipo==='fechado'?'fechado':'aberto',x0,cy+th+18,{size:11.5,c:COL.muted,align:'center'}); g.text('aberto',x1,cy+th+18,{size:11.5,c:COL.muted,align:'center'}); }
    const up=[],dn=[],now=[]; for(let i=0;i<=240;i++){ const u=i/240, y=m.y(u); up.push([X(u),cy-amp*y]); dn.push([X(u),cy+amp*y]); now.push([X(u),cy-amp*y*ph]); }
    g.poly(up,COL.muted,1.2); g.poly(dn,COL.muted,1.2); g.poly(now,COL.vel,3);
    m.nodes.forEach(u=>g.circle(X(u),cy,5,COL.force,COL.card,1.5));
    g.text(`${m.h}º harmônico · λ = ${nt(m.lam)} m · f = ${nt(m.f)} Hz`,g.W/2,26,{size:14,bold:true,align:'center'});
    g.text(s.p.tipo==='corda'?'nas pontas presas: nós':s.p.tipo==='aberto'?'nas pontas abertas: ventres':'ponta fechada: nó · ponta aberta: ventre',g.W/2,g.H-12,{size:12,align:'center',c:COL.muted}); },
  reads:s=>{ const m=s.def.mode(s); return [['Harmônico',m.h+'º'+(s.p.tipo==='fechado'?' (só ímpares)':'')],['Comprimento de onda λ',nt(m.lam)+' m'],['Frequência f = v/λ',nt(m.f)+' Hz'],['Fundamental deste '+(s.p.tipo==='corda'?'fio':'tubo'),nt(m.f1)+' Hz'],['Nós (pontos parados)',String(m.nodes.length)]]; }});

/* espectro eletromagnético */
const BANDS=[[3,-.5,'ondas de rádio','rádio','rádio AM e FM, TV aberta, radioamador','energy'],[-.5,-3,'micro-ondas','micro-ondas','forno de micro-ondas, Wi-Fi, celular, radar','ok'],[-3,Math.log10(700e-9),'infravermelho','infraverm.','calor do Sol e do fogo, controle remoto, câmera térmica','force'],[Math.log10(700e-9),Math.log10(400e-9),'luz visível','visível','a única faixa que nossos olhos enxergam',''],[Math.log10(400e-9),-8,'ultravioleta','UV','bronzeado e queimadura de sol, lâmpada germicida','acc'],[-8,-11,'raios X','raios X','radiografia e tomografia','vel'],[-11,-13,'raios gama','gama','núcleos radioativos, radioterapia','muted']];
function fmtLam(m){ const u=m>=1?[1,'m']:m>=1e-3?[1e-3,'mm']:m>=1e-6?[1e-6,'μm']:m>=1e-9?[1e-9,'nm']:[1e-12,'pm']; return nsig(m/u[0],3)+' '+u[1]; }
function bandOf(x){ return BANDS.find(b=>x<=b[0]&&x>b[1])||(x>3?BANDS[0]:BANDS[BANDS.length-1]); }
SIMS.spectrum=(host)=>{ const setX=(s,v)=>{ s.p.x=v; const inp=$(`#${host.id}-x`); if(inp){ inp.value=v; $(`#${host.id}-x-o`).textContent=fmtLam(10**v); } };
  return Sim(host,{alt:'Régua do espectro eletromagnético, das ondas de rádio aos raios gama, com a onda escolhida desenhada acima',h:w=>w<560?300:270,
  ctrls:[{k:'x',l:'Comprimento de onda λ (escala de potências de 10)',min:-12,max:3,step:.02,v:Math.log10(530e-9),f:v=>fmtLam(10**v),live:true}],
  btns:[{l:'Rádio FM',f:s=>setX(s,Math.log10(3))},{l:'Micro-ondas',f:s=>setX(s,Math.log10(.122))},{l:'Luz verde',f:s=>setX(s,Math.log10(530e-9))},{l:'Ultravioleta',f:s=>setX(s,Math.log10(300e-9))},{l:'Raio X',f:s=>setX(s,Math.log10(.1e-9))}],
  draw(g,s){ const W=g.W, x0=16, x1=W-16, X=v=>x0+(3-v)/15*(x1-x0), by=g.H*.52, bh=34, x=s.p.x, lam=10**x, b=bandOf(x), nm=lam*1e9;
    const wc=nm>=380&&nm<=750?lamColor(nm):COL.ink, vis=clamp(8+(x+12)/15*230,8,238), cy=by-62, A=Math.min(24,g.H*.08);
    const pts=[]; for(let px=x0;px<=x1;px+=1.5) pts.push([px,cy-A*Math.sin(2*Math.PI*(px-x0)/vis)]); g.poly(pts,wc,2.4);
    BANDS.forEach(([a,c,,short,,col])=>{ const xa=X(Math.min(a,3)), xc=X(Math.max(c,-12)); if(!col){ const gr=g.ctx.createLinearGradient(xa,0,xc,0); [[700,0],[620,.25],[580,.42],[530,.58],[470,.78],[400,1]].forEach(([l,o])=>gr.addColorStop(o,lamColor(l))); g.rect(xa,by,xc-xa,bh,gr); }
      else g.rect(xa,by,xc-xa,bh,COL[col]+'40'); });
    g.rect(x0,by,x1-x0,bh,null,COL.line,0,1);
    BANDS.forEach(([a,c,,short],i)=>{ const xm=(X(Math.min(a,3))+X(Math.max(c,-12)))/2; if(short==='visível'){ g.line(xm,by+bh,xm,by+bh+14,COL.muted,1); g.text(short,xm,by+bh+26,{size:11,align:'center',c:COL.muted}); } else g.text(W<500?({'micro-ondas':'micro','infraverm.':'IV','raios X':'X'}[short]||short):short,xm,by+bh/2+4,{size:W<500?10:11.5,align:'center',c:COL.ink,bold:true}); });
    [[3,'1 km'],[0,'1 m'],[-3,'1 mm'],[-6,'1 μm'],[-9,'1 nm'],[-12,'1 pm']].forEach(([v,t])=>{ g.line(X(v),by-4,X(v),by,COL.muted,1); g.text(t,X(v),by-8,{size:10.5,align:v===3?'left':v===-12?'right':'center',c:COL.muted,mono:true}); });
    const mx=X(x); g.line(mx,by-2,mx,by+bh+2,COL.ink,2.5); g.poly([[mx-7,by+bh+12],[mx+7,by+bh+12],[mx,by+bh+3]],null,0,COL.ink,true);
    g.text(b[2],clamp(mx,x0+50,x1-50),by+bh+50,{size:14,bold:true,align:'center'});
    g.text('frequência e energia do fóton aumentam →',x1,g.H-8,{size:11.5,align:'right',c:COL.muted}); },
  reads:s=>{ const lam=10**s.p.x, b=bandOf(s.p.x), E=1240e-9/lam; return [['Faixa',b[2]],['Comprimento de onda λ',fmtLam(lam)],['Frequência f = c/λ',nf(3e8/lam)+' Hz'],['Energia de cada fóton',nf(E)+' eV'+(E>=10?' (ionizante)':'')],['Onde aparece',b[4]]]; }}); };

/* campo magnético de um fio reto: linhas circulares, bússolas e uma sonda */
SIMS.wireB=(host)=>Sim(host,{alt:'Fio com corrente visto de cima, com linhas de campo circulares, bússolas e uma sonda arrastável',h:w=>w<560?Math.round(w*.85+200):350,
  legend:[['force','norte das bússolas'],['energy','sonda: campo naquele ponto'],['acc','B contra a distância']],
  ctrls:[{k:'i',l:'Corrente i',min:1,max:20,step:1,v:10,u:'A',live:true},{k:'dir',l:'Sentido da corrente',opts:[['sai','saindo da tela'],['entra','entrando na tela']],v:'sai',live:true}],
  init(s){ if(!s.pr) s.pr=[6,-4]; },
  geo(s){ const W=s.W, H=s.H, narrow=W<560, rw=narrow?W:Math.min(W*.56,H), rh=narrow?Math.round(W*.85):H, cx=rw/2, cy=rh/2, k=(Math.min(rw,rh)/2-14)/20;
    return {narrow,rw,rh,cx,cy,k,gx:narrow?46:rw+54,gy:narrow?rh+26:34,gw:narrow?W-64:W-rw-72,gh:narrow?H-rh-72:H-90}; },
  B:(i,dcm)=>2e-7*i/(dcm/100),
  drag:{ down(s,x,y){ const q=s.def.geo(s), px=q.cx+s.pr[0]*q.k, py=q.cy+s.pr[1]*q.k; return Math.hypot(px-x,py-y)<22; },
    move(s,x,y){ const q=s.def.geo(s); let dx=(x-q.cx)/q.k, dy=(y-q.cy)/q.k; const d=Math.hypot(dx,dy); if(d<1){ dx=dx/(d||1); dy=d?dy/d:-1; } else if(d>20){ dx*=20/d; dy*=20/d; } s.pr=[dx,dy]; } },
  draw(g,s){ const q=s.def.geo(s), sg=s.p.dir==='sai'?1:-1, tan=(dx,dy)=>{ const r=Math.hypot(dx,dy)||1; return [sg*dy/r,-sg*dx/r]; };
    g.ctx.save(); g.ctx.beginPath(); g.ctx.rect(0,0,q.rw,q.rh); g.ctx.clip();
    [2,4,7,11,16].forEach(r=>{ const R=r*q.k; g.circle(q.cx,q.cy,R,null,COL.acc+'66',1.4); [0,Math.PI].forEach(a0=>{ const a=a0+Math.PI/4, x=q.cx+R*Math.cos(a), y=q.cy+R*Math.sin(a), [tx,ty]=tan(x-q.cx,y-q.cy); g.arrow(x-tx*6,y-ty*6,x+tx*6,y+ty*6,COL.acc,null,1.6); }); });
    const st=Math.max(30,q.rw/10); for(let x=st/2;x<q.rw;x+=st) for(let y=st/2;y<q.rh;y+=st){ const dx=x-q.cx, dy=y-q.cy; if(Math.hypot(dx,dy)<1.6*q.k+10) continue; const [tx,ty]=tan(dx,dy), L=Math.min(9,st*.3);
      g.line(x,y,x+tx*L,y+ty*L,COL.force,3); g.line(x,y,x-tx*L,y-ty*L,COL.muted,3); g.circle(x,y,1.8,COL.ink); }
    g.circle(q.cx,q.cy,13,COL.card,COL.ink,2.2); if(sg>0) g.circle(q.cx,q.cy,4,COL.ink); else { g.line(q.cx-6,q.cy-6,q.cx+6,q.cy+6,COL.ink,2.2); g.line(q.cx-6,q.cy+6,q.cx+6,q.cy-6,COL.ink,2.2); }
    const px=q.cx+s.pr[0]*q.k, py=q.cy+s.pr[1]*q.k, d=Math.hypot(...s.pr), B=s.def.B(s.p.i,d), [tx,ty]=tan(s.pr[0],s.pr[1]), L=clamp(20+18*Math.log10(B/1e-6),14,70);
    g.line(q.cx,q.cy,px,py,COL.muted,1,[3,4]); g.text('d = '+nt(d)+' cm',(q.cx+px)/2+8,(q.cy+py)/2-6,{size:12,mono:true,c:COL.muted});
    g.circle(px,py,8,COL.energy,COL.ink,1.5); g.arrow(px,py,px+tx*L,py+ty*L,COL.energy,'B',3);
    const cap=sg>0?'corrente saindo da tela: campo anti-horário':'corrente entrando na tela: campo horário'; g.font(11.5); g.rect(4,q.rh-24,g.ctx.measureText(cap).width+10,20,COL.paper+'e6',null,5); g.text(cap,9,q.rh-10,{size:11.5,c:COL.muted});
    g.ctx.restore();
    if(q.gw>80&&q.gh>60){ const top=20*s.p.i, pts=[]; for(let x=1;x<=20;x+=.1) pts.push([x,s.def.B(s.p.i,x)*1e6]);
      const r=g.plot(q.gx,q.gy,q.gw,q.gh,{xr:[0,20],yr:[0,top*1.05],series:[{pts,c:COL.acc}],xl:'distância d (cm)',yl:'B (μT)'});
      if(50<top) { g.line(r.X(0),r.Y(50),r.X(20),r.Y(50),COL.muted,1.2,[5,4]); g.text('Terra ≈ 50 μT',r.X(20)-4,r.Y(50)-6,{size:11,align:'right',c:COL.muted}); }
      g.circle(r.X(d),r.Y(B*1e6),6,COL.energy,COL.ink,1.5); } },
  reads:s=>{ const d=Math.hypot(...s.pr), B=s.def.B(s.p.i,d); return [['Distância da sonda d',nt(d)+' cm'],['Campo B = μ₀·i/(2π·d)',nf(B)+' T'],['Em microtesla',nt(B*1e6)+' μT'],['Comparado ao campo da Terra (≈ 50 μT)',nt(B/5e-5)+' vezes']]; }});

/* =====================================================================
   Lições — Ferramentas, Cinemática e Dinâmica
   Geradores de exercício devolvem {q,a,u,sol,traps,hint} (numérico)
   ou {q,o,a:0,why,w} (múltipla escolha; a primeira opção é a correta)
   ===================================================================== */
const NUM=(q,a,u,sol,traps,hint)=>({q,a,u,sol,traps:traps||[],hint});
const MCQ=(q,o,why,w)=>({q,o,a:0,why,w});
const POOL=arr=>()=>MCQ(...pick(arr));
const F=nf;

mod('fer','Ferramentas da física','medir, escrever números e trabalhar com vetores',[
{id:'grandezas',t:'Grandezas e unidades',min:10,
 idea:`<p>A física descreve o mundo com números. Tudo o que dá para medir é uma <b>grandeza</b>: comprimento, tempo, massa, velocidade, temperatura. Uma medida sempre tem duas partes: o <b>número</b> e a <b>unidade</b>. "O carro está a 20" não diz nada; "20 m/s" diz.</p>
 <p>O Brasil usa o <b>Sistema Internacional (SI)</b>. Nele, comprimento é medido em metros (m), massa em quilogramas (kg) e tempo em segundos (s). As outras unidades são combinações dessas: velocidade em m/s, aceleração em m/s², força em newtons (N = kg·m/s²).</p>
 <p>No dia a dia usamos km/h. Para passar para m/s, lembre que 1 km = 1000 m e 1 h = 3600 s. Então 1 km/h = 1000/3600 m/s, ou seja, <b>divida por 3,6</b>. Para voltar, multiplique por 3,6.</p>`,
 pred:{q:'Um carro está a 72 km/h. Quantos metros ele anda em 1 segundo?',o:['20 m','72 m','7,2 m','260 m'],a:0,why:'72 ÷ 3,6 = 20 m/s: a cada segundo, 20 metros. Na estrada isso é quase o comprimento de quatro carros por segundo.'},
 lab:{sim:'conv'},
 tasks:['Coloque 36 km/h. Quantos metros o carro anda por segundo?','Descubra qual velocidade faz o carro percorrer os 100 m em exatamente 5 segundos.','Um velocista olímpico corre a cerca de 10 m/s. Quanto é isso em km/h?'],
 f:[{f:'v<sub class="up">(m/s)</sub> = '+frac('v<sub class="up">(km/h)</sub>','3,6'),s:[['m','metro','comprimento'],['kg','quilograma','massa'],['s','segundo','tempo'],['K','kelvin','temperatura'],['A','ampere','corrente elétrica']],n:'Essas cinco são unidades de base do SI. 1 km = 1000 m · 1 h = 60 min = 3600 s · 1 kg = 1000 g · 1 m = 100 cm.'}],
 ex:{q:'Converta 90 km/h para m/s.',s:['90 km em metros: 90 × 1000 = 90 000 m.','1 hora em segundos: 3600 s.','90 000 m ÷ 3600 s = <b>25 m/s</b>.','Atalho: 90 ÷ 3,6 = 25. Dá o mesmo resultado porque 3600 ÷ 1000 = 3,6.']},
 probs:[
  ()=>{ const v=pick([18,36,54,72,90,108,126,144]); return NUM(`Converta <b>${v} km/h</b> para m/s.`,v/3.6,'m/s',[`${v} ÷ 3,6 = ${F(v/3.6)} m/s`],[[v*3.6,'Você multiplicou por 3,6. De km/h para m/s se <b>divide</b>.'],[v/60,'Você dividiu por 60. Uma hora tem 3600 segundos, e um km tem 1000 metros.']],'1 km/h equivale a 1000 m em 3600 s.'); },
  ()=>{ const v=R(5,40,5); return NUM(`Um guepardo corre a <b>${v} m/s</b>. Quanto é isso em km/h?`,v*3.6,'km/h',[`${v} × 3,6 = ${F(v*3.6)} km/h`],[[v/3.6,'De m/s para km/h se <b>multiplica</b> por 3,6.']],'O número em km/h é sempre maior que em m/s.'); },
  ()=>{ const h=pick([1.5,2,2.5,3,0.5]); return NUM(`Quantos segundos há em <b>${F(h)} h</b>?`,h*3600,'s',[`1 h = 3600 s`,`${F(h)} × 3600 = ${F(h*3600)} s`],[[h*60,'Isso são minutos. Cada minuto ainda tem 60 segundos.']],'Cada hora tem 60 minutos, e cada minuto tem 60 segundos.'); },
  ()=>{ const g=R(50,950,50); return NUM(`Uma fruta tem massa de <b>${g} g</b>. Quanto é em kg?`,g/1000,'kg',[`1 kg = 1000 g`,`${g} ÷ 1000 = ${F(g/1000)} kg`],[[g*1000,'De grama para quilograma o número fica <b>menor</b>: divida por 1000.'],[g/100,'O quilo tem 1000 gramas, não 100.']]); },
  POOL([['Qual destas é a unidade de massa no SI?',['quilograma (kg)','grama (g)','newton (N)','litro (L)'],'O SI usa o quilograma. O newton mede força; o litro, volume.'],['Qual destas é uma grandeza vetorial (precisa de direção e sentido)?',['velocidade','tempo','massa','temperatura'],'Velocidade tem módulo, direção e sentido. Tempo, massa e temperatura só têm valor: são escalares.'],['"A mesa mede 2" está incompleto porque falta:',['a unidade','o sinal','a notação científica','o vetor'],'Sem unidade não dá para saber se são 2 metros, 2 centímetros ou 2 pés.']])],
 traps:['Esquecer a unidade na resposta: 20 não é o mesmo que 20 m/s.','Multiplicar por 3,6 quando deveria dividir. Lembre: m/s é um número menor que km/h.','Somar grandezas diferentes, como 3 m + 2 s. Só se somam grandezas de mesma espécie e mesma unidade.'],
 keep:['Medida = número + unidade.','km/h → m/s: divida por 3,6. m/s → km/h: multiplique por 3,6.','SI: metro, quilograma, segundo.']},

{id:'potencias',t:'Notação científica e ordem de grandeza',min:12,
 idea:`<p>A física trata do muito pequeno (um átomo mede 0,0000000001 m) e do muito grande (a Terra fica a 150 000 000 000 m do Sol). Escrever tantos zeros é fácil de errar, por isso usamos a <b>notação científica</b>: um número entre 1 e 10 multiplicado por uma potência de 10.</p>
 <p>150 000 000 000 = 1,5 × 10<sup>11</sup> (a vírgula andou 11 casas para a esquerda). 0,00045 = 4,5 × 10<sup>−4</sup> (a vírgula andou 4 casas para a direita, então o expoente é negativo).</p>
 <p>Para multiplicar, multiplique os números e <b>some os expoentes</b>; para dividir, divida os números e <b>subtraia os expoentes</b>. A <b>ordem de grandeza</b> é a potência de 10 mais próxima do valor: se o número da frente for 3,16 ou mais (√10), arredonde para a potência seguinte.</p>`,
 pred:{q:'A Terra está a 150 milhões de quilômetros do Sol. Em metros, isso é:',o:['1,5 × 10¹¹ m','1,5 × 10⁸ m','1,5 × 10⁶ m','150 × 10⁶ m'],a:0,why:'150 milhões de km = 1,5 × 10⁸ km. Cada km tem 10³ m, então 1,5 × 10⁸ × 10³ = 1,5 × 10¹¹ m. (150 × 10⁶ não está em notação científica: o número da frente precisa ficar entre 1 e 10.)'},
 lab:{sim:'pow10'},
 tasks:['Ande pela régua do átomo até a galáxia. Quantas potências de 10 separam um átomo de uma pessoa?','Encontre o prefixo "quilo" e o "micro". Quanto vale cada um?','A distância São Paulo–Rio é 3,6 × 10⁵ m. Por que a ordem de grandeza dela é 10⁶, e não 10⁵?'],
 f:[{f:'a × 10<sup>n</sup>, com 1 ≤ a &lt; 10',s:[['n > 0','número grande: a vírgula andou n casas para a esquerda',''],['n < 0','número pequeno: a vírgula andou n casas para a direita','']]},{f:'(a×10<sup>m</sup>)·(b×10<sup>n</sup>) = (a·b)×10<sup>m+n</sup>',n:'Na divisão, subtraia: 10<sup>m</sup> ÷ 10<sup>n</sup> = 10<sup>m−n</sup>. Prefixos: k = 10³, M = 10⁶, G = 10⁹, m = 10⁻³, μ = 10⁻⁶, n = 10⁻⁹.'}],
 ex:{q:'Calcule (3 × 10⁸) × (2 × 10⁻³).',s:['Multiplique os números da frente: 3 × 2 = 6.','Some os expoentes: 8 + (−3) = 5.','Resultado: <b>6 × 10⁵</b>.']},
 probs:[
  ()=>{ const m=pick([1.2,2.5,3.6,4.5,7.2,9.1]), e=pick([-6,-5,-4,-3,3,4,5,6,7,8]); const txt=e>0?(m*10**e).toLocaleString('pt-BR'):(m*10**e).toFixed(-e+1).replace('.',','); return NUM(`Escreva <b>${txt}</b> em notação científica: ${F(m)} × 10<sup>?</sup>. Qual é o expoente?`,e,'',[`A vírgula de ${txt} precisa andar ${Math.abs(e)} casas até ficar ${F(m)}.`,`${e>0?'Número grande: expoente positivo':'Número pequeno: expoente negativo'} → ${e}.`],[[-e,'O sinal está trocado: números menores que 1 têm expoente negativo, e maiores que 10, positivo.'],[e>0?e+1:e-1,'Conte de novo as casas que a vírgula andou.'],[e>0?e-1:e+1,'Conte de novo as casas que a vírgula andou.']],'Conte quantas casas a vírgula anda até sobrar um só algarismo antes dela.'); },
  ()=>{ const a=pick([2,3,4]), b=pick([1.5,2,2]), m=R(2,9), n=R(-6,5); const r=a*b*10**(m+n); return NUM(`Calcule (${a} × 10<sup>${m}</sup>) × (${F(b)} × 10<sup>${n}</sup>).`,r,'',[`${a} × ${F(b)} = ${F(a*b)}`,`${m} + (${n}) = ${m+n}`,`Resultado: ${F(a*b)} × 10<sup>${m+n}</sup>`],[[a*b*10**(m*n),'Na multiplicação os expoentes se <b>somam</b>, não se multiplicam.'],[a*b*10**(m-n),'Na multiplicação os expoentes se somam; subtrair é na divisão.']],'Digite no formato 6e5 ou 6x10^5.'); },
  ()=>{ const a=pick([6,8,9]), b=pick([2,3,4]), m=R(4,12), n=R(1,5); return NUM(`Calcule (${a} × 10<sup>${m}</sup>) ÷ (${b} × 10<sup>${n}</sup>).`,a/b*10**(m-n),'',[`${a} ÷ ${b} = ${F(a/b)}`,`${m} − ${n} = ${m-n}`,`Resultado: ${F(a/b)} × 10<sup>${m-n}</sup>`],[[a/b*10**(m+n),'Na divisão os expoentes se <b>subtraem</b>.']],'Digite no formato 3e5 ou 3x10^5.'); },
  ()=>{ const m=pick([1.5,2.2,2.9,3.5,4.2,6.8,8.5]), e=R(2,9); const og=m>=3.16?e+1:e; return NUM(`Qual é a ordem de grandeza de <b>${F(m)} × 10<sup>${e}</sup></b>? Responda o expoente da potência de 10.`,og,'',[`Compare ${F(m)} com √10 ≈ 3,16.`,m>=3.16?`${F(m)} ≥ 3,16, então arredonde para 10<sup>${e+1}</sup>.`:`${F(m)} &lt; 3,16, então fica 10<sup>${e}</sup>.`],[[m>=3.16?e:e+1,m>=3.16?'Como '+F(m)+' passa de 3,16, a potência mais próxima é a seguinte.':'Como '+F(m)+' é menor que 3,16, a potência mais próxima é a própria.']],'O ponto de virada é √10 ≈ 3,16, não 5.'); },
  POOL([['1 μm (micrômetro) é igual a:',['10⁻⁶ m','10⁻³ m','10⁻⁹ m','10⁶ m'],'O prefixo micro (μ) vale 10⁻⁶.'],['3 km equivalem a:',['3 × 10³ m','3 × 10⁻³ m','3 × 10⁶ m','30 m'],'Quilo vale 10³.'],['Qual número está em notação científica correta?',['4,7 × 10⁵','47 × 10⁴','0,47 × 10⁶','4,7 × 10^5,2'],'O número da frente precisa estar entre 1 e 10, e o expoente é inteiro.']])],
 traps:['Esquecer o sinal negativo do expoente para números menores que 1.','Deixar o número da frente fora do intervalo de 1 a 10 (como 45 × 10³).','Multiplicar os expoentes em vez de somá-los.'],
 keep:['Número grande → expoente positivo; número pequeno → expoente negativo.','Multiplicação soma os expoentes; divisão subtrai.','Ordem de grandeza: compare o número da frente com 3,16.']},

{id:'vetores',t:'Vetores',min:15,
 idea:`<p>Algumas grandezas precisam só de um número: 3 kg, 20 °C. São as <b>escalares</b>. Outras precisam dizer também <b>para onde</b>: andar 5 m para o norte é diferente de 5 m para o sul. São as <b>vetoriais</b>: deslocamento, velocidade, aceleração, força.</p>
 <p>Um vetor tem <b>módulo</b> (tamanho), <b>direção</b> (a reta: horizontal, vertical…) e <b>sentido</b> (para qual lado dessa reta). Desenhamos como uma seta.</p>
 <p>Para somar vetores, coloque a cauda de um na ponta do outro: a <b>resultante</b> vai do começo do primeiro ao fim do último. Se forem perpendiculares, use Pitágoras. Outra forma é decompor cada vetor em <b>componentes</b> x e y e somar as componentes separadamente.</p>`,
 pred:{q:'Você anda 3 m para leste e depois 4 m para norte. A que distância do ponto de partida você está?',o:['5 m','7 m','1 m','12 m'],a:0,why:'Os deslocamentos são perpendiculares, então formam um triângulo retângulo: √(3² + 4²) = √25 = 5 m. Você andou 7 m no total, mas está a 5 m do início.'},
 lab:{sim:'vec'},
 tasks:['Monte A = (3, 0) e B = (0, 4). Confira o módulo de R.','Faça R ficar igual a zero. Como os dois vetores precisam estar?','Troque para A − B e compare com A + B.'],
 f:[{f:'|R| = √(R<sub class="up">x</sub>² + R<sub class="up">y</sub>²)',s:[['Rₓ','componente horizontal (soma das componentes x)',''],['R<sub>y</sub>','componente vertical (soma das componentes y)','']]},{f:'Aₓ = A·cos θ   A<sub class="up">y</sub> = A·sen θ',s:[['θ','ângulo entre o vetor e o eixo x','graus']],n:'Valores úteis: sen 30° = cos 60° = 0,5 · sen 60° = cos 30° ≈ 0,87 · sen 45° = cos 45° ≈ 0,71.'}],
 ex:{q:'Duas forças perpendiculares, de 6 N e 8 N, puxam uma caixa. Qual é a força resultante?',s:['As forças formam os catetos de um triângulo retângulo.','R = √(6² + 8²) = √(36 + 64) = √100.','<b>R = 10 N</b>, e não 14 N: forças perpendiculares não se somam direto.']},
 probs:[
  ()=>{ const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]]); return NUM(`Duas forças perpendiculares de <b>${a} N</b> e <b>${b} N</b> atuam num corpo. Qual é o módulo da resultante?`,c,'N',[`R = √(${a}² + ${b}²)`,`R = √(${a*a} + ${b*b}) = √${c*c} = ${c} N`],[[a+b,'Somar os módulos só vale para forças na mesma direção e sentido. Perpendiculares: use Pitágoras.'],[b-a,'Subtrair vale para forças opostas. Perpendiculares: use Pitágoras.']],'Desenhe: os vetores formam um triângulo retângulo.'); },
  ()=>{ const a=R(8,30), b=R(2,a-2); return NUM(`Numa brincadeira de cabo de guerra, um time puxa com <b>${a*10} N</b> para a direita e o outro com <b>${b*10} N</b> para a esquerda. Qual é o módulo da força resultante?`,(a-b)*10,'N',[`Mesma direção, sentidos opostos: subtraia.`,`${a*10} − ${b*10} = ${(a-b)*10} N, para a direita`],[[(a+b)*10,'As forças são opostas: uma cancela parte da outra.']]); },
  ()=>{ const A=R(10,50,10), th=pick([30,60]); const ax=A*Math.cos(th*Math.PI/180); return NUM(`Um vetor de módulo <b>${A}</b> faz <b>${th}°</b> com o eixo x. Qual é a sua componente x? (cos 30° ≈ 0,87; cos 60° = 0,5)`,ax,'',[`Aₓ = A·cos θ = ${A} × cos ${th}°`,`Aₓ = ${F(ax)}`],[[A*Math.sin(th*Math.PI/180),'Você usou o seno. A componente x (vizinha ao ângulo) usa o cosseno.']],'A componente do lado do ângulo usa cosseno.'); },
  ()=>{ const a=R(2,9), b=R(2,9); return MCQ(`Duas forças de <b>${a} N</b> e <b>${b} N</b> atuam num corpo, em direções quaisquer. Qual valor <b>não</b> pode ser a resultante?`,[`${a+b+2} N`,`${Math.abs(a-b)} N`,`${a+b} N`,`${Math.max(a,b)} N`],`A resultante sempre fica entre ${Math.abs(a-b)} N (forças opostas) e ${a+b} N (mesmo sentido). ${a+b+2} N passa do máximo.`); },
  POOL([['Qual par forma uma grandeza escalar e uma vetorial, nessa ordem?',['massa e força','força e velocidade','tempo e massa','aceleração e peso'],'Massa só tem valor; força tem direção e sentido.'],['Dois vetores têm resultante nula. Então eles têm:',['mesmo módulo e sentidos opostos','mesmo módulo e mesmo sentido','direções perpendiculares','módulos diferentes'],'Só se anulam se forem iguais em tamanho, na mesma direção e com sentidos contrários.']])],
 traps:['Somar módulos de vetores que não estão na mesma direção.','Confundir direção (a reta) com sentido (o lado da reta).','Trocar seno e cosseno: a componente adjacente ao ângulo usa o cosseno.'],
 keep:['Vetor: módulo, direção e sentido.','Perpendiculares: R = √(a² + b²). Mesmo sentido: somam. Opostos: subtraem.','Decompor: Aₓ = A cos θ, A<sub>y</sub> = A sen θ.']}]);

mod('cin','Cinemática','descrever o movimento: posição, velocidade e aceleração',[
{id:'mu',t:'Velocidade e movimento uniforme',min:14,
 idea:`<p><b>Velocidade média</b> é quanto a posição muda por unidade de tempo: v = Δs/Δt. Se um ônibus anda 120 km em 2 h, sua velocidade média é 60 km/h, mesmo que tenha parado em semáforos.</p>
 <p>No <b>movimento uniforme (MU)</b>, a velocidade é constante: o corpo percorre distâncias iguais em tempos iguais. A posição em cada instante segue a <b>função horária</b> s = s₀ + v·t, em que s₀ é a posição no instante zero.</p>
 <p>No gráfico posição × tempo, o MU aparece como uma <b>reta</b>: quanto mais inclinada, maior a velocidade. No gráfico velocidade × tempo, é uma linha horizontal, e a <b>área</b> embaixo dela é o deslocamento. Velocidade negativa significa andar no sentido contrário ao da trajetória orientada.</p>`,
 pred:{q:'No gráfico posição × tempo, uma reta mais inclinada significa:',o:['velocidade maior','aceleração maior','posição inicial maior','movimento mais lento'],a:0,why:'A inclinação é Δs/Δt, que é a própria velocidade. Reta mais em pé: mais metros a cada segundo.'},
 lab:{sim:'mov',cfg:{acc:false}},
 tasks:['Compare v₀ = 4 m/s e v₀ = 12 m/s. O que muda no gráfico s × t?','Coloque v₀ negativo. Para onde vai o carro, e o que acontece com o gráfico?','Ao final, confira: a área sob o gráfico v × t é igual ao deslocamento?'],
 f:[{f:'v = '+frac('Δs','Δt'),s:[['v','velocidade média','m/s'],['Δs','deslocamento (posição final − inicial)','m'],['Δt','intervalo de tempo','s']]},{f:'s = s₀ + v·t',s:[['s','posição no instante t','m'],['s₀','posição inicial (em t = 0)','m'],['t','tempo','s']]}],
 ex:{q:'Um ônibus passa pelo km 20 de uma estrada às 8 h, com velocidade constante de 60 km/h. Em que quilômetro estará às 10 h?',s:['Tempo decorrido: t = 10 − 8 = 2 h.','s = s₀ + v·t = 20 + 60 × 2.','<b>s = 140 km</b> (km 140).']},
 probs:[
  ()=>{ const d=R(100,900,50), t=R(10,100,5); return NUM(`Um ciclista percorre <b>${d} m</b> em <b>${t} s</b>. Qual é a sua velocidade média?`,d/t,'m/s',[`v = Δs/Δt = ${d}/${t}`,`v = ${F(d/t)} m/s`],[[t/d,'Você dividiu o tempo pela distância. Velocidade é distância ÷ tempo.'],[d*t,'Velocidade é distância <b>dividida</b> pelo tempo.']]); },
  ()=>{ const s0=R(-20,50,5), v=pick([-8,-5,-3,2,4,6,10,12]), t=R(2,10); return NUM(`Um carrinho segue a função horária <b>s = ${s0} ${v<0?'−':'+'} ${Math.abs(v)}·t</b> (SI). Qual é a posição em t = ${t} s?`,s0+v*t,'m',[`s = ${s0} ${v<0?'−':'+'} ${Math.abs(v)} × ${t}`,`s = ${s0+v*t} m`],[[v*t,'Faltou somar a posição inicial s₀.'],[s0+v,'Faltou multiplicar a velocidade pelo tempo.'],[s0-v*t,'Confira o sinal da velocidade.']]); },
  ()=>{ const D=R(100,600,50), v1=R(40,90,10), v2=R(40,90,10); return NUM(`Duas cidades ficam a <b>${D} km</b> uma da outra. Um carro sai de cada uma, no mesmo instante, um em direção ao outro, a <b>${v1} km/h</b> e <b>${v2} km/h</b>. Depois de quantas horas eles se encontram?`,D/(v1+v2),'h',[`Indo um em direção ao outro, a distância entre eles diminui ${v1} + ${v2} = ${v1+v2} km a cada hora.`,`t = ${D} ÷ ${v1+v2} = ${F(D/(v1+v2))} h`],v1!==v2?[[D/Math.abs(v1-v2),'Subtrair as velocidades vale quando um persegue o outro. Aqui eles se aproximam: some.']]:[],'Pense em quanto a distância entre eles diminui a cada hora.'); },
  ()=>{ const d=pick([100,200,400,800]), t=pick([10,20,25,40,50,80,100]); const v=d/t; return NUM(`Um atleta corre <b>${d} m</b> em <b>${t} s</b>. Qual é a velocidade média em <b>km/h</b>?`,v*3.6,'km/h',[`Em m/s: ${d}/${t} = ${F(v)} m/s`,`Em km/h: ${F(v)} × 3,6 = ${F(v*3.6)} km/h`],[[v,'Esse valor está em m/s. Multiplique por 3,6.'],[v/3.6,'De m/s para km/h se multiplica por 3,6.']]); },
  POOL([['Num gráfico velocidade × tempo, a área sob a linha representa:',['o deslocamento','a aceleração','a velocidade média','o tempo total'],'Área = velocidade × tempo = deslocamento.'],['Um carro fica parado no semáforo por 30 s. No gráfico s × t, esse trecho é:',['uma linha horizontal','uma reta inclinada para cima','uma reta vertical','uma parábola'],'Parado, a posição não muda com o tempo: linha horizontal.'],['Na função s = 50 − 10t, o carro:',['anda no sentido contrário ao da trajetória, a 10 m/s','está parado na posição 50 m','acelera a 10 m/s²','anda a 50 m/s'],'O sinal negativo da velocidade indica movimento retrógrado.']])],
 traps:['Usar a distância total em vez do deslocamento (posição final − inicial) quando há ida e volta.','Misturar unidades: km com s, ou m/s com h.','Esquecer a posição inicial s₀ na função horária.'],
 keep:['v = Δs/Δt.','MU: s = s₀ + v·t, reta no gráfico s × t.','A área sob v × t é o deslocamento.']},

{id:'muv',t:'Aceleração e MUV',min:18,
 idea:`<p><b>Aceleração</b> é quanto a velocidade muda por unidade de tempo: a = Δv/Δt. Um carro que vai de 0 a 20 m/s em 10 s tem aceleração de 2 m/s²: ganha 2 m/s a cada segundo.</p>
 <p>No <b>movimento uniformemente variado (MUV)</b>, a aceleração é constante. A velocidade cresce (ou diminui) em linha reta, v = v₀ + a·t, e a posição forma uma <b>parábola</b>: s = s₀ + v₀·t + a·t²/2. Como o tempo aparece ao quadrado, dobrar o tempo quadruplica a distância percorrida a partir do repouso.</p>
 <p>Quando o tempo não aparece no problema, use a <b>equação de Torricelli</b>: v² = v₀² + 2·a·Δs. Frear é acelerar no sentido contrário ao movimento (a negativa quando v é positiva).</p>`,
 pred:{q:'Um carro parte do repouso com aceleração constante e anda 1 m no primeiro segundo. Quantos metros terá percorrido ao fim de 2 segundos?',o:['4 m','2 m','3 m','8 m'],a:0,why:'Partindo do repouso, s = a·t²/2. Com o dobro do tempo, a distância fica 2² = 4 vezes maior. Ele é mais rápido no segundo segundo do que no primeiro.'},
 lab:{sim:'mov',cfg:{acc:true}},
 tasks:['Com v₀ = 0 e a = 2 m/s², veja o gráfico s × t virar uma parábola.','Coloque v₀ = 10 m/s e a = −2 m/s². Quando o carro para? O que acontece depois?','A inclinação do gráfico v × t é a aceleração. Confira mudando a.'],
 f:[{f:'a = '+frac('Δv','Δt'),s:[['a','aceleração','m/s²'],['Δv','variação da velocidade','m/s']]},{f:'v = v₀ + a·t      s = s₀ + v₀·t + '+frac('a·t²','2'),s:[['v₀','velocidade inicial','m/s'],['v','velocidade no instante t','m/s']]},{f:'v² = v₀² + 2·a·Δs',n:'Equação de Torricelli: útil quando o problema não fala em tempo.'}],
 ex:{q:'Um carro a 20 m/s freia com aceleração de −5 m/s². Quanto tempo leva para parar e que distância percorre?',s:['Parar significa v = 0. Pela função da velocidade: 0 = 20 − 5·t → t = 4 s.','Distância por Torricelli: 0² = 20² + 2·(−5)·Δs.','0 = 400 − 10·Δs → <b>Δs = 40 m</b>.','Confira: velocidade média (20 + 0)/2 = 10 m/s, durante 4 s → 40 m.']},
 probs:[
  ()=>{ const v0=R(0,10), dv=R(4,30,2), t=pick([2,4,5,8,10]); return NUM(`Uma moto vai de <b>${v0} m/s</b> a <b>${v0+dv} m/s</b> em <b>${t} s</b>. Qual é a aceleração média?`,dv/t,'m/s²',[`a = Δv/Δt = (${v0+dv} − ${v0})/${t}`,`a = ${F(dv/t)} m/s²`],[[(v0+dv)/t,'Use a <b>variação</b> da velocidade: final menos inicial.']]); },
  ()=>{ const a=pick([1,1.5,2,2.5,3,4]), t=R(2,10); return NUM(`Um carro parte do repouso com aceleração de <b>${F(a)} m/s²</b>. Que distância percorre em <b>${t} s</b>?`,a*t*t/2,'m',[`Do repouso: Δs = a·t²/2`,`Δs = ${F(a)} × ${t}² / 2 = ${F(a*t*t/2)} m`],[[a*t*t,'Faltou dividir por 2.'],[a*t,'Isso é a velocidade final (a·t), não a distância.']],'Partindo do repouso, Δs = a·t²/2.'); },
  ()=>{ const v0=R(0,15), a=pick([-3,-2,2,3,4]), t=R(2,6); const v=v0+a*t; if(v<0) return NUM(`Um carrinho tem velocidade inicial de <b>${v0+20} m/s</b> e aceleração de <b>${a} m/s²</b>. Qual é a velocidade após <b>${t} s</b>?`,v0+20+a*t,'m/s',[`v = v₀ + a·t = ${v0+20} + (${a})·${t}`,`v = ${v0+20+a*t} m/s`],[[v0+20-a*t,'Confira o sinal da aceleração.']]); return NUM(`Um carrinho tem velocidade inicial de <b>${v0} m/s</b> e aceleração de <b>${a} m/s²</b>. Qual é a velocidade após <b>${t} s</b>?`,v,'m/s',[`v = v₀ + a·t = ${v0} + (${a})·${t}`,`v = ${v} m/s`],[[v0-a*t,'Confira o sinal da aceleração.'],[a*t,'Faltou somar a velocidade inicial.']]); },
  ()=>{ const v0=pick([10,20,30]), a=pick([2,4,5]); return NUM(`Um carro a <b>${v0} m/s</b> freia com desaceleração constante de <b>${a} m/s²</b> até parar. Qual é a distância de frenagem?`,v0*v0/(2*a),'m',[`Torricelli com v = 0: 0 = ${v0}² − 2·${a}·Δs`,`Δs = ${v0*v0}/(2·${a}) = ${F(v0*v0/(2*a))} m`],[[v0*v0/a,'Faltou o fator 2: Δs = v₀²/(2a).'],[v0/a,'Isso é o tempo de frenagem, não a distância.']],'Sem tempo no enunciado: Torricelli.'); },
  POOL([['No MUV, o que permanece constante?',['a aceleração','a velocidade','a posição','a distância percorrida a cada segundo'],'É a definição do MUV: aceleração constante.'],['O gráfico v × t de um MUV é:',['uma reta inclinada','uma parábola','uma reta horizontal','uma hipérbole'],'v = v₀ + a·t é uma função do 1º grau: reta. A parábola aparece no gráfico s × t.'],['Um carro freando tem, em relação à velocidade, aceleração:',['de sentido oposto','de mesmo sentido','perpendicular','nula'],'Para diminuir a velocidade, a aceleração aponta contra o movimento.']])],
 traps:['Esquecer de dividir por 2 em a·t²/2.','Achar que aceleração negativa sempre significa frear: só freia quando a aceleração é oposta à velocidade.','Usar a velocidade final como se fosse a média.'],
 keep:['a = Δv/Δt.','v = v₀ + at; s = s₀ + v₀t + at²/2.','Sem tempo: v² = v₀² + 2aΔs.']},

{id:'queda',t:'Queda livre',min:14,
 idea:`<p>Solte uma pedra e uma folha de papel: a pedra chega antes. Mas amasse o papel numa bolinha e solte de novo: chegam quase juntas. A diferença vinha da <b>resistência do ar</b>, não do peso. Galileu percebeu isso: sem ar, <b>todos os corpos caem com a mesma aceleração</b>, a gravidade g.</p>
 <p>Na Terra, g ≈ 9,8 m/s². Neste curso usamos <b>g = 10 m/s²</b> para facilitar as contas, como fazem os vestibulares. A queda livre é um MUV que parte do repouso com a = g: a velocidade cresce 10 m/s a cada segundo.</p>
 <p>Um objeto lançado para cima sobe perdendo 10 m/s a cada segundo, para no ponto mais alto e volta. No ponto mais alto a velocidade é zero, mas a aceleração continua sendo g, para baixo.</p>`,
 pred:{q:'No vácuo, uma bola de 10 kg e outra de 0,1 kg são soltas juntas da mesma altura. Qual chega primeiro ao chão?',o:['chegam juntas','a de 10 kg','a de 0,1 kg','depende da altura'],a:0,why:'Sem ar, a aceleração é g para as duas. Em 1971, o astronauta David Scott soltou um martelo e uma pena na Lua, e eles caíram juntos.'},
 lab:{sim:'fall'},
 tasks:['Solte de 45 m na Terra. Quanto tempo leva? E na Lua?','Veja as marcas a cada 0,5 s: por que o espaço entre elas aumenta?','Qual altura faz a queda durar exatamente 2 s na Terra?'],
 f:[{f:'v = g·t      h = '+frac('g·t²','2')+'      v² = 2·g·h',s:[['g','aceleração da gravidade (use 10)','m/s²'],['h','altura de queda','m'],['t','tempo de queda','s']],n:'São as fórmulas do MUV com v₀ = 0 e a = g.'},{f:'h<sub class="up">máx</sub> = '+frac('v₀²','2g')+'      t<sub class="up">subida</sub> = '+frac('v₀','g'),n:'Para um lançamento vertical para cima com velocidade v₀.'}],
 ex:{q:'Uma pedra é solta do alto de um prédio e leva 3 s para chegar ao chão. Qual é a altura do prédio e a velocidade ao tocar o solo?',s:['h = g·t²/2 = 10 × 3² / 2 = 10 × 9 / 2.','<b>h = 45 m</b>.','v = g·t = 10 × 3 = <b>30 m/s</b> (108 km/h).']},
 probs:[
  ()=>{ const t=R(1,6), h=5*t*t; return NUM(`Uma pedra é solta de uma altura de <b>${h} m</b>. Quanto tempo leva para chegar ao chão? (g = 10 m/s²)`,t,'s',[`h = g·t²/2 → ${h} = 5·t²`,`t² = ${h/5} → t = ${t} s`],[[h/10,'A altura não cresce na mesma proporção do tempo: h = g·t²/2, então t = √(2h/g).'],[h/5,'Esse é t². Falta tirar a raiz quadrada.']],'Isole t em h = 5t².'); },
  ()=>{ const t=R(1,6), h=5*t*t; return NUM(`Um objeto cai de <b>${h} m</b> de altura. Com que velocidade chega ao chão? (g = 10 m/s²)`,10*t,'m/s',[`v² = 2·g·h = 2 × 10 × ${h} = ${20*h}`,`v = √${20*h} = ${10*t} m/s`],[[20*h,'Esse é v². Tire a raiz quadrada.'],[10*h,'v = g·t, não g·h.']]); },
  ()=>{ const t=R(1,5); return NUM(`Uma chave cai do alto de um prédio e leva <b>${t} s</b> para atingir a calçada. Qual é a altura? (g = 10 m/s²)`,5*t*t,'m',[`h = g·t²/2 = 10 × ${t}² / 2`,`h = ${5*t*t} m`],[[10*t*t,'Faltou dividir por 2.'],[10*t,'Isso é a velocidade final (g·t), não a altura.']]); },
  ()=>{ const v0=R(10,40,10); return NUM(`Uma bola é lançada verticalmente para cima a <b>${v0} m/s</b>. Qual é a altura máxima? (g = 10 m/s²)`,v0*v0/20,'m',[`No topo v = 0: 0 = ${v0}² − 2·10·h`,`h = ${v0*v0}/20 = ${v0*v0/20} m`],[[v0*v0/10,'Faltou o fator 2: h = v₀²/(2g).'],[v0/10,'Isso é o tempo de subida, não a altura.']]); },
  POOL([['No ponto mais alto de um lançamento vertical, a aceleração da bola é:',['g, para baixo','zero','g, para cima','maior que g'],'A velocidade é zero naquele instante, mas a gravidade continua puxando: se a aceleração fosse zero, a bola ficaria parada no ar.'],['Por que uma folha de papel aberta cai mais devagar que uma pedra?',['por causa da resistência do ar','porque é mais leve','porque a gravidade age menos em corpos leves','porque o papel flutua'],'Sem ar, cairiam juntas. A folha aberta sofre muita resistência do ar em relação ao seu peso.'],['Um corpo em queda livre, a cada segundo:',['ganha cerca de 10 m/s de velocidade','cai sempre 10 m','ganha 10 m/s² de aceleração','perde velocidade'],'a = g = 10 m/s²: a velocidade aumenta 10 m/s por segundo.']])],
 traps:['Achar que corpos mais pesados caem mais rápido (sem ar, não caem).','Dizer que a aceleração é zero no ponto mais alto.','Esquecer de tirar a raiz quadrada ao calcular tempo ou velocidade.'],
 keep:['Sem ar, tudo cai com a mesma aceleração g ≈ 10 m/s².','v = gt; h = gt²/2; v² = 2gh.','No topo de um lançamento: v = 0, mas a = g.']},

{id:'lancamento',t:'Lançamento oblíquo',min:16,
 idea:`<p>Uma bola chutada em ângulo faz uma trajetória curva. O segredo para entender é separar o movimento em dois, que acontecem <b>ao mesmo tempo e de forma independente</b>:</p>
 <ul><li><b>Horizontal</b>: nada acelera a bola para o lado (desprezando o ar), então vₓ = v₀·cos θ fica constante. É um MU.</li><li><b>Vertical</b>: a gravidade age; a bola começa com v<sub>y</sub> = v₀·sen θ, sobe, para e desce. É um MUV com a = −g.</li></ul>
 <p>O tempo de voo vem do movimento vertical; o alcance é vₓ vezes esse tempo. O maior alcance acontece em 45°, e ângulos que somam 90° (como 30° e 60°) têm o <b>mesmo alcance</b>.</p>`,
 pred:{q:'Uma bala é disparada na horizontal e, no mesmo instante, outra idêntica é solta da mesma altura. Qual toca o chão primeiro?',o:['as duas ao mesmo tempo','a disparada','a solta','depende da velocidade do disparo'],a:0,why:'O movimento vertical das duas é igual: ambas começam com v<sub>y</sub> = 0 e caem com g. A velocidade horizontal não interfere na queda.'},
 lab:{sim:'proj'},
 tasks:['Mantendo 20 m/s, compare os alcances em 30°, 45° e 60°.','Na Lua (g = 1,6), quanto aumenta o alcance?','Observe as setas: qual componente da velocidade muda e qual fica constante?'],
 f:[{f:'vₓ = v₀·cos θ      v<sub class="up">y</sub> = v₀·sen θ − g·t',s:[['θ','ângulo de lançamento com a horizontal','°']]},{f:'t<sub class="up">voo</sub> = '+frac('2·v₀·sen θ','g')+'      A = '+frac('v₀²·sen 2θ','g')+'      H = '+frac('(v₀·sen θ)²','2g'),s:[['A','alcance horizontal','m'],['H','altura máxima','m']]},{f:'Lançamento horizontal: t = √(2h/g), A = v·t',n:'Quem cai de uma altura h leva o mesmo tempo, com ou sem velocidade horizontal.'}],
 ex:{q:'Uma bola rola para fora de uma mesa de 1,25 m de altura com velocidade horizontal de 2 m/s. A que distância da mesa ela toca o chão?',s:['Tempo de queda (vertical): 1,25 = 10·t²/2 → t² = 0,25 → t = 0,5 s.','Horizontal é MU: A = v·t = 2 × 0,5.','<b>A = 1 m</b>.']},
 probs:[
  ()=>{ const t=R(1,4), h=5*t*t, v=R(5,30,5); return NUM(`Um pacote é largado de um avião que voa na horizontal a <b>${v} m/s</b>, a <b>${h} m</b> de altura. Que distância horizontal ele percorre até o chão? (g = 10, sem ar)`,v*t,'m',[`Tempo de queda: ${h} = 5t² → t = ${t} s`,`Horizontal: A = v·t = ${v} × ${t} = ${v*t} m`],[[v*h/10,'Calcule primeiro o tempo de queda por h = gt²/2.'],[v*t*t,'O alcance é v·t, com t = '+t+' s.']],'Primeiro o tempo de queda, depois a distância horizontal.'); },
  ()=>{ const v0=pick([10,20,30]), th=pick([15,30,45,60,75]); const A=v0*v0*Math.sin(2*th*Math.PI/180)/10; return NUM(`Um projétil é lançado a <b>${v0} m/s</b> com <b>${th}°</b> em relação ao chão. Qual é o alcance? (g = 10; sen 30° = 0,5; sen 60° ≈ 0,87; sen 90° = 1)`,A,'m',[`A = v₀²·sen(2θ)/g = ${v0}² × sen ${2*th}° / 10`,`A = ${F(A)} m`],[[v0*v0*Math.sin(th*Math.PI/180)/10,'O alcance usa sen(2θ), o seno do <b>dobro</b> do ângulo.']],'Use sen(2θ). Se 2θ passar de 90°, lembre que sen 150° = sen 30°.'); },
  ()=>{ const v0=pick([10,20,30,40]), th=pick([30,90]); const vy=v0*Math.sin(th*Math.PI/180); return NUM(`Uma bola é chutada a <b>${v0} m/s</b> formando <b>${th}°</b> com o chão. Quanto tempo fica no ar? (g = 10; sen 30° = 0,5)`,2*vy/10,'s',[`v<sub>y</sub> inicial = ${v0} × sen ${th}° = ${F(vy)} m/s`,`Sobe até v<sub>y</sub> = 0 em ${F(vy/10)} s e leva o mesmo tempo para descer.`,`t = ${F(2*vy/10)} s`],[[vy/10,'Esse é só o tempo de subida. O voo inclui a descida.']]); },
  POOL([['No ponto mais alto de um lançamento oblíquo, a velocidade da bola é:',['só a componente horizontal','zero','só a componente vertical','máxima'],'A componente vertical zera no topo, mas a horizontal continua a mesma.'],['Qual ângulo dá o maior alcance (sem ar, mesmo nível)?',['45°','30°','60°','90°'],'sen(2θ) é máximo quando 2θ = 90°, ou seja, θ = 45°.'],['Uma bola lançada a 30° e outra a 60°, com a mesma velocidade, terão:',['o mesmo alcance','a mesma altura máxima','o mesmo tempo de voo','alcances que diferem por 2 vezes'],'sen 60° = sen 120°: ângulos complementares dão o mesmo alcance. A de 60° sobe mais e demora mais.']])],
 traps:['Achar que a velocidade é zero no ponto mais alto (só a vertical zera).','Usar sen θ em vez de sen 2θ no alcance.','Achar que um objeto lançado na horizontal cai mais devagar que um solto.'],
 keep:['Horizontal: MU. Vertical: MUV com −g. Os dois são independentes.','A = v₀²·sen 2θ/g; máximo em 45°.','O tempo de queda só depende da altura.']},

{id:'mcu',t:'Movimento circular',min:15,
 idea:`<p>Num carrossel, você pode girar sempre com a mesma rapidez, mas a direção do seu movimento muda o tempo todo. Como velocidade é um vetor, mudar a direção já é mudar a velocidade. Por isso, <b>todo movimento circular tem aceleração</b>, mesmo quando o módulo da velocidade é constante (MCU).</p>
 <p>Essa aceleração aponta para o <b>centro</b> do círculo: é a <b>aceleração centrípeta</b>, a<sub>c</sub> = v²/R.</p>
 <p>O <b>período</b> T é o tempo de uma volta; a <b>frequência</b> f = 1/T é o número de voltas por segundo (hertz, Hz). Em uma volta o corpo percorre a circunferência 2πR, então v = 2πR/T. A velocidade angular, ω = 2π/T, diz quantos radianos o corpo gira por segundo.</p>`,
 pred:{q:'Uma bola gira presa a uma corda com velocidade de módulo constante. Ela tem aceleração?',o:['sim, apontando para o centro','não, porque a velocidade é constante','sim, apontando para fora','sim, no sentido do movimento'],a:0,why:'O módulo não muda, mas a direção muda o tempo todo. Quem faz a direção mudar é a aceleração centrípeta, voltada para o centro.'},
 lab:{sim:'mcu',cfg:{force:false}},
 tasks:['Diminua o período: o que acontece com a velocidade e com a aceleração?','Dobre o raio mantendo o período. A velocidade dobra?','Observe: a seta da velocidade é sempre perpendicular à da aceleração.'],
 f:[{f:'f = '+frac('1','T')+'      v = '+frac('2πR','T')+'      ω = '+frac('2π','T'),s:[['T','período (tempo de uma volta)','s'],['f','frequência (voltas por segundo)','Hz'],['R','raio','m'],['ω','velocidade angular','rad/s']]},{f:'a<sub class="up">c</sub> = '+frac('v²','R')+' = ω²·R',n:'Em polias ligadas por correia, a velocidade na borda (v) é a mesma; em polias no mesmo eixo, a frequência é a mesma.'}],
 ex:{q:'Uma roda-gigante de raio 10 m dá uma volta a cada 60 s. Qual é a velocidade de uma cadeira? (π ≈ 3,14)',s:['Em uma volta, a cadeira percorre 2πR = 2 × 3,14 × 10 = 62,8 m.','Isso leva T = 60 s.','v = 62,8/60 ≈ <b>1,05 m/s</b>.']},
 probs:[
  ()=>{ const T=pick([.2,.25,.5,2,4,5,10]); return NUM(`Um ventilador dá uma volta a cada <b>${F(T)} s</b>. Qual é a frequência?`,1/T,'Hz',[`f = 1/T = 1/${F(T)}`,`f = ${F(1/T)} Hz`],[[T,'Esse é o período. A frequência é o inverso: 1/T.']]); },
  ()=>{ const R0=pick([.5,1,2,5,10]), T=pick([1,2,4,5,10]); return NUM(`Um ponto gira num círculo de raio <b>${F(R0)} m</b> com período de <b>${T} s</b>. Qual é a velocidade? (π ≈ 3,14)`,2*3.14*R0/T,'m/s',[`v = 2πR/T = 2 × 3,14 × ${F(R0)} / ${T}`,`v = ${F(2*3.14*R0/T)} m/s`],[[3.14*R0/T,'A circunferência é 2πR, não πR.'],[2*3.14*R0*T,'Divida pelo período, não multiplique.']]); },
  ()=>{ const v=R(2,20,2), r=pick([1,2,4,5,8,10]); return NUM(`Um carro faz uma curva de raio <b>${r} m</b> a <b>${v} m/s</b>. Qual é a aceleração centrípeta?`,v*v/r,'m/s²',[`a<sub>c</sub> = v²/R = ${v}²/${r}`,`a<sub>c</sub> = ${F(v*v/r)} m/s²`],[[v/r,'Faltou elevar a velocidade ao quadrado.'],[v*v*r,'Divida pelo raio.']]); },
  ()=>{ const rpm=pick([60,120,300,600,900,1200,3000]); return NUM(`O motor de uma máquina gira a <b>${rpm} rpm</b> (rotações por minuto). Qual é a frequência em hertz?`,rpm/60,'Hz',[`1 minuto = 60 s`,`f = ${rpm}/60 = ${F(rpm/60)} Hz`],[[rpm*60,'Divida por 60: são rotações por minuto, e Hz é por segundo.']]); },
  POOL([['Duas polias estão ligadas por uma correia. O que é igual nas duas?',['a velocidade de um ponto da borda','a frequência','o período','a velocidade angular'],'A correia não escorrega: a borda das duas anda junto com ela. A polia menor gira mais vezes.'],['No MCU, a aceleração centrípeta aponta:',['para o centro do círculo','para fora do círculo','no sentido do movimento','contra o movimento'],'Centrípeta quer dizer "que busca o centro".'],['Se a velocidade num círculo dobra (mesmo raio), a aceleração centrípeta:',['quadruplica','dobra','fica igual','cai pela metade'],'a<sub>c</sub> = v²/R: com v dobrado, v² fica 4 vezes maior.']])],
 traps:['Achar que velocidade constante em módulo significa aceleração zero.','Confundir período (segundos por volta) com frequência (voltas por segundo).','Usar πR em vez de 2πR para o comprimento da volta.'],
 keep:['Movimento circular sempre tem aceleração centrípeta: a<sub>c</sub> = v²/R.','v = 2πR/T; f = 1/T.','Correia: mesma v. Mesmo eixo: mesma f.']}]);

mod('din','Dinâmica','forças e as três leis de Newton',[
{id:'newton',t:'Inércia e a segunda lei de Newton',min:16,
 idea:`<p>Por que um ônibus que freia de repente joga os passageiros para a frente? Porque os corpos tendem a <b>manter o estado de movimento</b>: quem estava a 50 km/h "quer" continuar a 50 km/h. Essa tendência é a <b>inércia</b>, e é a <b>1ª lei de Newton</b>: sem força resultante, um corpo parado continua parado, e um corpo em movimento continua em linha reta com velocidade constante.</p>
 <p>A <b>2ª lei</b> diz o que acontece quando existe força resultante: ela produz aceleração, na mesma direção e sentido, e F<sub>R</sub> = m·a. Quanto maior a massa, mais difícil acelerar: a massa é a medida da inércia.</p>
 <p>A unidade de força é o <b>newton</b> (N): 1 N acelera 1 kg a 1 m/s². Atenção: na fórmula entra a força <b>resultante</b>, a soma vetorial de todas as forças.</p>`,
 pred:{q:'Um disco é empurrado e depois desliza num gelo perfeitamente liso, sem atrito nem ar. Depois do empurrão, ele:',o:['continua com a mesma velocidade, em linha reta','vai parando aos poucos','acelera','para logo depois do empurrão'],a:0,why:'Sem força resultante, não há aceleração. Na vida real as coisas param por causa do atrito e do ar; sem eles, o disco seguiria indefinidamente.'},
 lab:{sim:'block',cfg:{fric:false}},
 tasks:['Com 5 kg, dobre a força de 20 N para 40 N. O que acontece com a aceleração?','Mantenha 20 N e dobre a massa. E agora?','Zere a força com o bloco em movimento: ele para?'],
 f:[{f:'F<sub class="up">R</sub> = m·a',s:[['F<sub>R</sub>','força resultante (soma vetorial de todas as forças)','N'],['m','massa','kg'],['a','aceleração','m/s²']],n:'1 N = 1 kg·m/s².'}],
 ex:{q:'Duas pessoas empurram um carrinho de 50 kg: uma com 120 N para a direita e outra com 20 N para a esquerda. Qual é a aceleração?',s:['Resultante: 120 − 20 = 100 N para a direita.','a = F<sub>R</sub>/m = 100/50.','<b>a = 2 m/s²</b>, para a direita.']},
 probs:[
