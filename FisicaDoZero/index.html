<title>Física do Zero</title>
<meta name="description" content="Curso interativo de física do ensino médio: preveja, experimente no laboratório, entenda a fórmula e pratique até dominar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Caderno de laboratório: mapa do curso à esquerda, lição numa coluna de leitura, laboratório numa bancada larga */
:root{
  --paper:#f5f7fa; --card:#ffffff; --sunk:#eef2f7; --ink:#152033; --muted:#566277; --line:#d8dfe9; --grid:rgba(20,80,160,.06);
  --accent:#0b7285; --accent-ink:#ffffff; --accent-soft:#dff1f4;
  --vel:#1c6fd1; --force:#d23a2a; --acc:#7c3aed; --energy:#b7791f; --ok:#2b8a3e; --ok-soft:#e3f4e6; --bad:#c92a2a; --bad-soft:#fbe6e6; --warn:#b7791f;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(21,32,51,.06), 0 6px 20px rgba(21,32,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e131a; --card:#151c26; --sunk:#1b2430; --ink:#e5eaf1; --muted:#99a5b7; --line:#283344; --grid:rgba(120,170,255,.05);
  --accent:#3bc9db; --accent-ink:#082a30; --accent-soft:#12343a;
  --vel:#5aa9ff; --force:#ff6b5b; --acc:#b794ff; --energy:#ffc043; --ok:#51cf66; --ok-soft:#173222; --bad:#ff6b6b; --bad-soft:#3a1d1f; --warn:#ffc043;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e131a; --card:#151c26; --sunk:#1b2430; --ink:#e5eaf1; --muted:#99a5b7; --line:#283344; --grid:rgba(120,170,255,.05);
  --accent:#3bc9db; --accent-ink:#082a30; --accent-soft:#12343a;
  --vel:#5aa9ff; --force:#ff6b5b; --acc:#b794ff; --energy:#ffc043; --ok:#51cf66; --ok-soft:#173222; --bad:#ff6b6b; --bad-soft:#3a1d1f; --warn:#ffc043;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:18px 14px 40px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--display);font-size:12px;color:var(--muted);font-weight:500}
.sidenav{display:grid;gap:4px}
.sidebtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 4px 10px}
.sidebtns .btn{padding:7px 6px;font-size:13.5px}
.cnt{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--warn);color:#fff;font-size:11.5px;font-weight:800}
.sidesearch{margin:0 4px 6px}
.search{width:100%;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--display);font-size:14.5px}
.search:focus{border-color:var(--accent);outline:none}
.search.big{padding:12px 14px;font-size:16.5px;margin:6px 0 18px}
.lk.chal{color:var(--muted);font-size:13.5px}
.lk.chal .star{flex:none;width:14px;text-align:center;color:var(--energy);font-size:13px}
.syncnote{font-family:var(--display);font-size:12.5px;color:var(--muted);margin:16px 8px 0;line-height:1.4}
.syncnote.cloud{color:var(--ok)}
.syncnote.home{font-size:14px;margin:26px 0 0}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mod{margin-top:10px}
.mod>h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;font-weight:700}
.lk{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:14.5px;font-weight:500;line-height:1.25}
.lk:hover{background:var(--sunk)}
.lk.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dot.s1{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,var(--card) 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}
.dot.due{border-color:var(--warn);background:var(--warn)}
.main{min-width:0;padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px)}
.topbar{display:none}
.col{max-width:760px;margin:0 auto}
.wide{max-width:1040px;margin:0 auto}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-family:var(--display);font-weight:700;font-size:15.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- início ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:34px}
.hero h1{font-size:clamp(36px,5.2vw,56px);font-weight:800;letter-spacing:-.025em;line-height:1}
.hero h1 span{color:var(--accent)}
.hero p.lead{font-size:19px;color:var(--muted);margin:14px 0 20px;max-width:34em}
.herolab{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 6px;font-family:var(--display)}
.stats div b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stats div span{font-size:13px;color:var(--muted)}
.method{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:10px 0 40px}
.method div{border-top:3px solid var(--accent);padding-top:10px}
.method h3{font-size:17px;margin-bottom:4px}
.method p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;min-width:0}
.mapcard h3{font-size:17px;margin:2px 0 8px}
.mapcard .lk{padding:5px 4px;font-size:14px}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.sech{font-size:26px;margin:0 0 14px;letter-spacing:-.01em}

/* ---------- lição ---------- */
.lhead{margin-bottom:22px}
.lhead h1{font-size:clamp(30px,4.6vw,44px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--display);font-size:13px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--card)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.due{border-color:var(--warn);color:var(--warn)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:14px 0 0}
.steps button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 5px;font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.steps button:hover{border-color:var(--accent)}
.steps .ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:800;line-height:1}
.steps .done{color:var(--ink);border-color:var(--ok)}
.steps .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
#pred,#lab,.ex,#prac{scroll-margin-top:76px}
.ptitle{font-size:clamp(32px,4.6vw,40px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.lead2{margin:0 0 12px;color:var(--muted);font-size:15.5px}
.fmt{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.fnote{margin:10px 0 0;font-size:15px;color:var(--muted)}
.sec{margin:34px 0}
.sec>h2{font-size:22px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec>h2 .n{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose b{font-weight:600}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.pred{background:var(--card);border:1.5px solid var(--accent);border-radius:var(--r);padding:16px}
.pred .q{font-size:18px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--body);font-size:16px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:15.5px;line-height:1.5}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.info{background:var(--sunk);border-left:4px solid var(--accent)}

/* fórmulas */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.fml{font-family:var(--body);font-style:italic;font-size:26px;text-align:center;padding:10px 0 14px;overflow-x:auto;white-space:nowrap}
.fml .up{font-style:normal}
.fml .gap{display:inline-block;width:1.6em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.9em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.sym{width:100%;border-collapse:collapse;font-size:15px}
.sym td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.sym td:first-child{font-style:italic;font-size:18px;width:64px;text-align:center;white-space:nowrap}
.sym td:last-child{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.tblw{overflow-x:auto}

/* exemplo resolvido */
.ex .st{counter-reset:s}
.ex ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.ex li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.ex li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;margin-top:2px}

/* prática */
.prac{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.prac .q{font-size:17.5px;margin-bottom:12px}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input{width:180px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:17px}
.ans .u{font-family:var(--mono);color:var(--muted)}
.streak{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:14px;color:var(--muted);margin-bottom:12px}
.streak i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.streak i.on{background:var(--ok);border-color:var(--ok)}
.sol{margin-top:10px}
.sol ol{margin:6px 0 0;padding-left:22px}
.hint{font-size:15px}
.mastered{display:flex;gap:14px;align-items:center;background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.mastered b{font-family:var(--display);font-size:18px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}

/* laboratório */
.lab{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.labcv{position:relative;background:var(--paper);border-bottom:1px solid var(--line)}
.labcv canvas{display:block;width:100%;touch-action:none}
.labx{margin-left:auto}
.spd+.labx{margin-left:0}
.lab.big{position:fixed;inset:10px;z-index:60;overflow:auto;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.45)}
body.noscroll{overflow:hidden}
body.noscroll::after{content:'';position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:59}
.lab:focus{outline:none}
.spd{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-family:var(--display);font-size:12.5px;color:var(--muted)}
.spdl{margin-right:2px}
.spd button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font-family:var(--mono);font-size:12.5px;cursor:pointer}
.spd button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.rd.chg b{animation:flash 1s ease-out}
@keyframes flash{0%{background:var(--accent-soft);color:var(--accent)}100%{background:transparent}}
.labui{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0}
.labui.solo{grid-template-columns:minmax(0,1fr)}
.ctrls{padding:14px 16px;display:grid;gap:12px;align-content:start;border-right:1px solid var(--line)}
.ctrl{min-width:0}
.ctrl label{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:10px;font-family:var(--display);font-size:14px;font-weight:600}
.ctrl label output{font-family:var(--mono);font-weight:400;color:var(--accent);white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;font-family:var(--display);font-size:13.5px;cursor:pointer}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.reads{padding:14px 16px;display:grid;gap:6px;align-content:start}
.rd{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px;font-size:15px}
.rd span{color:var(--muted);font-family:var(--display);font-size:14px}
.rd b{font-family:var(--mono);font-weight:600;font-size:14.5px;text-align:right}
.labbar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.tasks{margin-top:12px}
.tasks li{margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--display);font-size:13px;color:var(--muted);padding:8px 16px 0}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* tutor com IA: só aparece quando o Claude está disponível para quem vê */
html:not(.has-ai) .ai{display:none!important}
.aipill{display:inline-grid;place-items:center;padding:1px 7px;border-radius:6px;background:var(--acc);color:#fff;font-family:var(--display);font-size:11.5px;font-weight:800;letter-spacing:.04em;line-height:1.5}
.aiask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-family:var(--display);font-size:14.5px;color:var(--muted)}
.aibox{margin-top:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;padding:12px 14px;font-size:15.5px;line-height:1.55}
.aibox p{margin:0 0 8px}
.aibox ul,.aibox ol{margin:0 0 8px;padding-left:22px}
.aibox code{font-family:var(--mono);font-size:.92em}
.aitxt>:last-child{margin-bottom:0}
.aibar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.aitag{font-family:var(--display);font-size:12.5px;color:var(--muted)}
.aierr{color:var(--bad);font-family:var(--display);font-size:14.5px;margin:0}
.think{color:var(--muted);font-family:var(--display);font-style:italic}
.think::after{content:'…';display:inline-block;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.aigen{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.aiq{margin-top:12px;border-color:var(--acc)}
.aiq .q p{margin:0 0 8px}
.aihint{display:flex;gap:8px;align-items:baseline;font-family:var(--display);font-size:14.5px;color:var(--muted);margin:14px 0 0;max-width:36em}
.chat .msgs{display:grid;gap:10px;margin-bottom:12px}
.msg.me{justify-self:end;max-width:85%;background:var(--accent-soft);border-radius:14px 14px 4px 14px;padding:9px 13px;font-size:15.5px;white-space:pre-wrap}
.msg.bot .aibox{margin-top:0}
.sugg{margin-bottom:10px}
.chatf{display:flex;gap:8px;align-items:flex-end}
.chatf textarea{flex:1;min-width:0;resize:vertical;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--body);font-size:16px;line-height:1.4}
.chatf textarea:focus{border-color:var(--accent);outline:none}

/* desafio do módulo */
.result{display:flex;gap:22px;align-items:center;background:var(--card);border:1.5px solid var(--accent);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.result .score{font-family:var(--display);flex:none;text-align:center}
.result .score b{font-size:64px;font-weight:800;line-height:1;color:var(--accent)}
.result .score span{font-size:24px;color:var(--muted);font-weight:700}
.result h2{font-size:24px;margin-bottom:6px}
.result p{margin:0 0 12px;font-size:16px}

/* formulário */
.fmod{margin:0 0 26px}
.fmod>h2{font-size:21px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.fitem>h3{font-size:16px;margin:14px 0 8px}
.fitem>h3 a{color:var(--ink);text-decoration:none}
.fitem>h3 a:hover{color:var(--accent);text-decoration:underline}
.fitem .fcard{padding:10px 14px;margin-bottom:8px}
.fitem .fml{font-size:22px;padding:6px 0 8px}
.symd summary{cursor:pointer;font-family:var(--display);font-size:13.5px;color:var(--muted);padding:2px 0}
.symd[open] summary{margin-bottom:6px}

/* jornada de descoberta */
.jor{scroll-margin-top:76px}
#jor{scroll-margin-top:76px}
.jbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.jdots{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.jd{width:26px;height:8px;border-radius:5px;border:0;background:var(--line);cursor:pointer;padding:0}
.jd.done{background:var(--ok)}
.jd.on{background:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.jd[disabled]{cursor:default;opacity:.6}
.jcount{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.jcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 20px;min-width:0}
.jcard h3{font-size:22px;margin:0 0 10px}
.jtag{font-family:var(--display);font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.jt-cena{border-top-color:var(--energy)} .jt-cena .jtag{color:var(--energy)}
.jt-lab,.jt-medir{border-top-color:var(--vel)} .jt-lab .jtag,.jt-medir .jtag{color:var(--vel)}
.jt-deduz{border-top-color:var(--acc)} .jt-deduz .jtag{color:var(--acc)}
.jt-mundo{border-top-color:var(--ok)} .jt-mundo .jtag{color:var(--ok)}
.jt-q .jtag,.jt-n .jtag,.jt-ordem .jtag,.jt-aposta .jtag{color:var(--force)} .jt-q,.jt-n,.jt-ordem,.jt-aposta{border-top-color:var(--force)}
.jtext{font-size:18px;line-height:1.55;margin-bottom:14px}
.jtext p{margin:0 0 10px}
.jtext p:last-child{margin-bottom:0}
.jlab{margin:4px -6px 10px}
.jlab .lab{box-shadow:none}
.jgoal{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--muted)}
.jgoal .gi{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line)}
.jgoal.won{color:var(--ok)}
.jgoal.won .gi{background:var(--ok);border-color:var(--ok)}
.jgoal .btn{margin-left:auto}
.jrec{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.jneed{font-family:var(--display);font-size:14px;color:var(--muted)}
.jtab{border-collapse:collapse;margin-top:12px;font-family:var(--mono);font-size:14px;min-width:220px}
.jtab th{font-family:var(--display);font-size:13px;color:var(--muted);text-align:right;padding:5px 12px;border-bottom:2px solid var(--line)}
.jtab td{text-align:right;padding:5px 12px;border-bottom:1px solid var(--line)}
.jplot{margin-top:10px}
.jplot canvas{display:block;width:100%}
.jafter .jtext{margin-top:14px}
.jder{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:d}
.jder li{counter-increment:d;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:start}
.jder li::before{content:counter(d);grid-row:span 3;font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin-top:3px}
.jl{font-size:18px;line-height:1.5}
.blank{display:inline-block;min-width:54px;text-align:center;border-bottom:2.5px dashed var(--acc);color:var(--acc);font-family:var(--display);font-weight:800}
.filled{display:inline-block;background:var(--ok-soft);border-radius:6px;padding:0 6px;font-weight:600}
.jopts{display:flex;flex-wrap:wrap;gap:8px}
.jopts .btn{font-family:var(--body);font-weight:600;font-size:16px}
.jopts .btn.no{border-color:var(--bad);color:var(--bad);opacity:.6}
.jwhy{font-size:15px;color:var(--muted)}
.jwhy .bad{color:var(--bad)}
.jresult{margin-top:16px;border:2px solid var(--acc);border-radius:var(--r);padding:10px 14px;background:var(--card)}
.jresult .jtag{color:var(--acc);margin:0}
.jworld{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.jworld div{background:var(--sunk);border-radius:11px;padding:12px 14px}
.jworld b{font-family:var(--display);font-size:16px}
.jworld p{margin:4px 0 0;font-size:15.5px;line-height:1.45}
.jord{margin:0 0 12px;padding-left:24px;font-size:16.5px}
.jord li{margin:4px 0;color:var(--ok);font-weight:600}
.jpool{display:grid;gap:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.jnav{display:flex;align-items:center;gap:10px;margin-top:12px}
.jnav [data-nav=next]{margin-left:auto}
.jend{text-align:center;border-top-color:var(--ok)}
.jend .jstar{font-size:40px;color:var(--energy);line-height:1}
.jend p{color:var(--muted);margin:6px 0 14px}
.jend .row{justify-content:center}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
details.fold>summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-weight:700;font-size:16px;color:var(--accent)}
details.fold[open]{padding-bottom:16px}
details.fold #lab{margin-top:4px}

/* exemplo animado */
#exa{scroll-margin-top:76px}
.exa{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--energy);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.exq .jtag{color:var(--energy)}
.exq>div{font-size:18px;line-height:1.5;margin-bottom:12px}
.exlab{margin:0 -4px}
.exlab .lab{box-shadow:none}
.locked .ctrls,.locked .labbar{display:none}
.locked .labui{grid-template-columns:minmax(0,1fr)}
.locked .reads{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));column-gap:18px}
.exsteps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;counter-reset:e}
.exsteps li{counter-increment:e;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;font-size:17px;line-height:1.5;opacity:.7}
.exsteps li.on{opacity:1}
.exsteps li::before{content:counter(e);font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--energy);color:#fff;display:grid;place-items:center;margin-top:1px}
.exwait{color:var(--muted);font-style:italic}
.extry{margin-top:12px;border:2px dashed var(--energy);border-radius:12px;padding:12px 14px;font-size:17px}
.extry.done{border:0;padding:0}
.extry .jtag{color:var(--energy);margin-bottom:4px}
.extry form{margin-top:10px}
.exctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.exctl [data-x=next]{margin-left:auto}

/* revisão */
.revlist{display:grid;gap:8px;margin:14px 0}
.empty{color:var(--muted);font-size:16px}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(88vw,330px);z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .brand{padding:0}
  .main{padding-top:18px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .method{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .labui{grid-template-columns:minmax(0,1fr)}
  .ctrls{border-right:0;border-bottom:1px solid var(--line)}
  .method{grid-template-columns:minmax(0,1fr)}
  .fml{font-size:22px}
  .fml .gap{display:block;height:8px}
  .result{flex-direction:column;align-items:flex-start;gap:10px}
  .chatf{flex-direction:column;align-items:stretch}
  .jcard{padding:14px 12px 16px}
  .jtext,.jl{font-size:17px}
  .jlab{margin:4px -4px 10px}
  .jnav .ai{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* =====================================================================
   Física do Zero — núcleo: estado, rotas, lição, prática e laboratório
   ===================================================================== */
const MODS=[]; const LES=[]; const LX={}; const SIMS={};
function mod(id,t,sub,lessons){ const m={id,t,sub,lessons}; MODS.push(m); lessons.forEach(l=>{ l.mod=m; l.idx=LES.length; LES.push(l); LX[l.id]=l; }); }
/* encaixa lições num módulo já criado (depois de `after`, ou no começo) e renumera o curso */
function addLessons(modId,after,lessons){ const m=MODS.find(x=>x.id===modId); const i=after?m.lessons.findIndex(l=>l.id===after)+1:0; m.lessons.splice(i,0,...lessons); lessons.forEach(l=>{ l.mod=m; LX[l.id]=l; }); LES.length=0; MODS.forEach(mm=>mm.lessons.forEach(l=>{ l.idx=LES.length; LES.push(l); })); }

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const R=(a,b,st=1)=>{ const n=Math.round((b-a)/st); return +(a+st*Math.floor(Math.random()*(n+1))).toFixed(6); };
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const NF=new Intl.NumberFormat('pt-BR',{maximumSignificantDigits:3});
function nsig(x,sig){ return new Intl.NumberFormat('pt-BR',{maximumSignificantDigits:sig}).format(x); }
/* número para HTML: 3 algarismos significativos, notação científica quando muito grande ou pequeno */
function nf(x,sig=3){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const a=Math.abs(x);
  if(a>=1e6||a<1e-3){ const e=Math.floor(Math.log10(a)); let m=x/10**e; if(Math.abs(+m.toPrecision(sig))>=10){ m/=10; return nsig(m,sig)+'×10<sup>'+(e+1)+'</sup>'; } return nsig(+m.toPrecision(sig),sig)+'×10<sup>'+e+'</sup>'; }
  return nsig(+x.toPrecision(sig),sig); }
/* o mesmo, em texto puro (para o canvas) */
function nt(x,sig=3){ return nf(x,sig).replace(/<sup>(-?\d+)<\/sup>/,(m,e)=>'^'+e).replace(/\^(-?\d+)/,(m,e)=>[...e].map(c=>SUP[c]).join('')); }
function parseNum(str){ let t=String(str).trim().replace(/\s+/g,'').replace(/[−–]/g,'-');
  if(!t) return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t=t.replace(/\./g,'');
  t=t.replace(',','.').replace(/[x×*·]10\^?\(?(-?\d+)\)?$/i,'e$1').replace(/^10\^\(?(-?\d+)\)?$/,'1e$1');
  return /^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(t)?Number(t):NaN; }
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- progresso: neste navegador e, quando dá, na conta do Claude ---------- */
const KEY='fisica_do_zero_v1', DAY=864e5, BOX=[1,3,7,16,35];
function normP(p){ p=p&&typeof p==='object'?p:{}; p.l=p.l&&typeof p.l==='object'?p.l:{}; p.mod=p.mod&&typeof p.mod==='object'?p.mod:{}; p.days=Array.isArray(p.days)?p.days:[]; return p; }
let P=normP((()=>{ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } })());
const SYNC={doc:null,state:'local',busy:false,again:false,timer:0,sent:''};
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const cloudData=()=>({v:1,l:P.l,mod:P.mod,days:P.days});
function saveLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
function save(){ saveLocal(); if(SYNC.doc){ clearTimeout(SYNC.timer); SYNC.timer=setTimeout(push,1200); } }
/* uma escrita por vez, e só quando os dados mudaram */
async function push(){ if(!SYNC.doc) return; if(SYNC.busy){ SYNC.again=true; return; }
  const data=cloudData(), c=canon(data); if(c===SYNC.sent) return;
  SYNC.busy=true;
  try{ await SYNC.doc.set(JSON.parse(JSON.stringify(data))); SYNC.sent=c; SYNC.state='cloud'; }
  catch(e){ if(e&&['invalid_argument','revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)){ SYNC.doc=null; SYNC.state='local'; } else SYNC.state='erro'; }
  SYNC.busy=false; syncBadge(); if(SYNC.again){ SYNC.again=false; push(); } }
/* junta o progresso local com o da conta: em cada lição vale o mais avançado */
function mergeP(a,b){ const out=normP({...a}); out.l={};
  const rank=x=>[x.s||0,x.box||0,x.n||0];
  new Set([...Object.keys(a.l),...Object.keys(b.l)]).forEach(id=>{ const x=a.l[id], y=b.l[id];
    if(!x||!y){ out.l[id]={...(x||y)}; return; }
    const rx=rank(x), ry=rank(y); let win=x; for(let i=0;i<3;i++){ if(rx[i]!==ry[i]){ win=rx[i]>ry[i]?x:y; break; } }
    const lose=win===x?y:x, w={...win}; ['pr','prr','lab','ex','jd'].forEach(k=>{ if(w[k]==null&&lose[k]!=null) w[k]=lose[k]; }); if(lose.ji>(w.ji||0)) w.ji=lose.ji; out.l[id]=w; });
  out.mod={...b.mod}; Object.keys(a.mod).forEach(k=>{ out.mod[k]=Math.max(+a.mod[k]||0,+out.mod[k]||0); });

  return out; }
async function initSync(){ const cl=window.claude; if(!cl||typeof cl.use!=='function') return;
  try{ const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]); if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const doc=db.doc('data/users/'+id+'/progresso'), snap=await doc.get(), rem=snap.exists?snap.data():null;
    const before=canon(cloudData());
    if(rem&&rem.v===1){ const r=normP({l:rem.l,mod:rem.mod,days:rem.days}); SYNC.sent=canon({v:1,l:r.l,mod:r.mod,days:r.days}); const last=P.last; P=mergeP(P,r); P.last=last; saveLocal(); }

    if(canon(cloudData())!==before) refreshAfterSync();
  }catch(e){ SYNC.doc=null; SYNC.state='local'; syncBadge(); } }
function syncText(){ return SYNC.state==='cloud'?'Progresso salvo na sua conta: continue em qualquer aparelho.':SYNC.state==='erro'?'Não consegui salvar na sua conta agora. O progresso está guardado neste navegador.':'Progresso salvo neste navegador.'; }
function syncBadge(){ $$('.syncnote').forEach(el=>{ el.textContent=syncText(); el.classList.toggle('cloud',SYNC.state==='cloud'); }); }

function ls(id){ return P.l[id]||(P.l[id]={s:0,st:0,n:0,c:0,box:0,due:0}); }
const isDue=id=>{ const x=P.l[id]; return !!x&&x.s===2&&x.due<=Date.now(); };
const dueList=()=>LES.filter(l=>isDue(l.id));
const mastered=()=>LES.filter(l=>(P.l[l.id]||{}).s===2).length;
function statusDot(id){ const x=P.l[id]; return `<span class="dot ${isDue(id)?'due':x&&x.s===2?'s2':x&&x.s===1?'s1':''}" aria-hidden="true"></span>`; }
function statusText(id){ const x=P.l[id]; return isDue(id)?'revisão pendente':x&&x.s===2?'dominada':x&&x.s===1?'em andamento':'não iniciada'; }
function nextLesson(){ return LES.find(l=>(P.l[l.id]||{}).s!==2)||LES[0]; }

/* dias de estudo seguidos */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function markDay(){ const t=ymd(new Date()); if(!P.days.includes(t)){ P.days.push(t); P.days.sort(); if(P.days.length>400) P.days=P.days.slice(-400); } }
function streakDays(){ const set=new Set(P.days), d=new Date(); if(!set.has(ymd(d))){ d.setDate(d.getDate()-1); if(!set.has(ymd(d))) return 0; } let n=0; while(set.has(ymd(d))){ n++; d.setDate(d.getDate()-1); } return n; }
const normTxt=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- cores do tema, lidas dos tokens CSS ---------- */
const COL={};
function readCols(){ const cs=getComputedStyle(document.documentElement);
  ['paper','card','sunk','ink','muted','line','accent','vel','force','acc','energy','ok','bad'].forEach(k=>COL[k]=cs.getPropertyValue('--'+k).trim()); }
readCols();
const LIVE=new Set();
function themeChanged(){ readCols(); LIVE.forEach(s=>s.render()); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged); }catch(e){}
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

/* ---------- desenho ---------- */
function G(ctx,W,H){ const g={ctx,W,H,
  font(sz=13,kind='display',bold=false){ ctx.font=`${bold?'700 ':'500 '}${sz}px ${kind==='mono'?'"JetBrains Mono", ui-monospace, monospace':'"Bricolage Grotesque", system-ui, sans-serif'}`; },

  arrow(x1,y1,x2,y2,c,label,w=3,lpos){ const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy); if(L<2) return; const ux=dx/L,uy=dy/L,hs=Math.min(11+w,L*.45);

    if(label){ const lx=x2+ux*14+(lpos||[0,0])[0], ly=y2+uy*14+(lpos||[0,0])[1]; g.tag(label,lx,ly,c,ux<-.3?'right':ux>.3?'left':'center'); } },
  /* etiqueta legível sobre qualquer fundo */
  tag(t,x,y,c,align='center',size=12.5){ g.font(size,'display',true); const w=ctx.measureText(t).width+10, h=size+7, x0=align==='left'?x-3:align==='right'?x-w+3:x-w/2;

function formulaCard(f,compact){ const sym=f.s?`<div class="tblw"><table class="sym"><tbody>${f.s.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]||''}</td></tr>`).join('')}</tbody></table></div>`:'';

/* HTML da lição → texto simples (para buscar e para mandar ao tutor) */
function plain(h){ const t=String(h).replace(/<span class="frac"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'($1)/($2)').replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<sub[^>]*>(.*?)<\/sub>/g,'_$1').replace(/<li>/g,'\n- ').replace(/<\/p>|<br\s*\/?>/g,'\n');
  return (new DOMParser().parseFromString(t,'text/html').body.textContent||'').replace(/[ \t\u00a0]+/g,' ').replace(/ *\n\s*/g,'\n').trim(); }
/* markdown mínimo e seguro para as respostas do tutor */
function mdInline(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\^\(?(-?[0-9A-Za-z]+)\)?/g,'<sup>$1</sup>'); }
function md(s){ let html='',list=null,para=[]; const close=()=>{ if(list){ html+=`</${list}>`; list=null; } }, flush=()=>{ if(para.length){ html+='<p>'+para.map(mdInline).join('<br>')+'</p>'; para=[]; } };
  for(const raw of String(s).split('\n')){ const l=raw.trim(); let m;
    if(!l){ flush(); close(); continue; }
    if((m=l.match(/^#{1,6}\s+(.*)/))){ flush(); close(); html+='<p><b>'+mdInline(m[1].replace(/\*\*/g,''))+'</b></p>'; continue; }
    if((m=l.match(/^[-•*]\s+(.*)/))){ flush(); if(list!=='ul'){ close(); html+='<ul>'; list='ul'; } html+='<li>'+mdInline(m[1])+'</li>'; continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ flush(); if(list!=='ol'){ close(); html+='<ol>'; list='ol'; } html+='<li>'+mdInline(m[1])+'</li>'; continue; }
    close(); para.push(l); }
  flush(); close(); return html; }

/* ---------- prática ---------- */
function Practice(host,lessons,o={}){

    else curL=lessons[0];

    cur=curL.probs[gi](); tries=0; done=false; ans=[];

      ?`<div class="opts">${q.opts.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCDE'[i]}</span><span>${t}</span></button>`).join('')}</div>`
      :`<form class="ans" autocomplete="off"><label class="sr" for="${id}-in">Sua resposta</label><input id="${id}-in" inputmode="decimal" placeholder="sua resposta"><span class="u">${q.u||''}</span><button class="btn" type="submit">Verificar</button>${q.hint0&&!exam?`<button class="btn ghost sm" type="button" data-act="hint">Dica</button>`:''}</form><p class="fmt">Use vírgula ou ponto para decimais. Notação científica: 3e8 ou 3x10^8.</p>`}<div class="fbx"></div></div>`;

      +(mc?`Alternativas: ${q.opts.map((t,i)=>'ABCDE'[i]+') '+plain(t)).join('  ')}\n`:'')
      +`Resposta(s) do aluno, em ordem: ${ans.join(' ; ')}\nResposta correta: ${right}\n`
      +(q.sol?`Resolução do site: ${q.sol.map(plain).join(' → ')}\n`:'')+(q.why?`Comentário do site: ${plain(q.why)}\n`:'')
      +`\nEm no máximo 130 palavras: diga qual raciocínio provavelmente levou à resposta do aluno, onde exatamente está o erro e um jeito de lembrar para não errar de novo. Não repita a resolução inteira.`; }
  function finish(ok,msg){

    else { const x=ls(curL.id); x.n++; if(ok&&tries===1) x.c++;

    tries++; ans.push(raw.trim()+(cur.u?' '+cur.u:'')); const tol=cur.tol||.02, near=(a,b)=>Math.abs(a-b)<=Math.max(tol*Math.abs(b),1e-9);

    const trap=(cur.traps||[]).find(t=>near(v,t[0]));
    if(tries<maxTries){ fb.innerHTML=`<div class="fb bad"><b>Ainda não.</b> ${trap?trap[1]:(cur.hint||'Confira as unidades e refaça a conta.')} Tente de novo.</div>`; $('input',host).select(); return; }
    finish(false,`<div class="fb bad"><b>A resposta é ${nf(cur.a)} ${cur.u||''}.</b> ${trap?trap[1]:''}</div>`+solHTML()); });
  host.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!host.contains(b)) return;
    if(b.dataset.act==='next') return next();
    if(b.dataset.act==='hint'){ $('.fbx',host).innerHTML=`<div class="fb info hint"><b>Dica:</b> ${cur.hint0}</div>`; return; }
    if(b.dataset.act==='why'){ b.disabled=true; aiAsk($('.aiout',host),whyPrompt()); return; }
    if(b.dataset.i!=null&&!done){ const i=+b.dataset.i; tries++; ans.push('ABCDE'[i]+') '+plain(cur.opts[i])); const ok=i===cur.ai;
      if(ok||tries>=maxTries||cur.opts.length<=2){ $$('.opt',host).forEach((x,j)=>{ if(j===cur.ai) x.classList.add('right'); else if(j===i) x.classList.add('wrong'); });
        return finish(ok,`<div class="fb ${ok?'ok':'bad'}"><b>${ok?(tries===1?'Isso!':'Agora sim.'):'Não é essa.'}</b> ${cur.why||''}</div>`+solHTML()); }
      b.classList.add('wrong'); b.disabled=true; $('.fbx',host).innerHTML=`<div class="fb bad"><b>Ainda não.</b> ${(cur.w&&cur.w[cur.o.indexOf(cur.opts[i])])||'Releia a pergunta e pense no que o laboratório mostrou.'} Tente outra alternativa.</div>`; } });
  next(); return {next}; }

  $('#steps').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(!b) return; const el=$({pred:'#pred',lab:'#lab',ex:'.ex, #exa',prac:'#prac',jor:'#jor'}[b.dataset.go]); if(el) el.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); });
  const pr=$('#pred'); if(pr){
    const reveal=()=>{ $$('.opt',pr).forEach((b,j)=>{ b.disabled=true; if(j===l.pred.a) b.classList.add('right'); else if(j===x().pr) b.classList.add('wrong'); }); $('.pfb',pr).innerHTML=`<div class="fb ${x().pr===l.pred.a?'ok':'info'}"><b>${x().pr===l.pred.a?'Previsão certa.':'A resposta é '+'ABCD'[l.pred.a]+'.'}</b> ${l.pred.why}</div>`; };
    const pend=()=>{ $$('.opt',pr).forEach((b,j)=>{ b.disabled=true; b.classList.toggle('pick',j===x().pr); }); $('.pfb',pr).innerHTML=`<div class="fb info">Previsão anotada. Agora confira no laboratório abaixo e depois veja a resposta.<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-rev="1">Ver a resposta</button></div></div>`; };
    if(x().pr!=null) (x().prr?reveal:pend)();
    pr.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.p!=null&&x().pr==null){ ls(l.id).pr=+b.dataset.p; save(); pend(); upd(); } else if(b.dataset.rev){ ls(l.id).prr=1; save(); reveal(); } }); }
  const ex=$('.ex'); if(ex){ let k=0; const ol=$('ol',ex), bt=$('[data-ex]',ex);
    bt.addEventListener('click',()=>{ if(k<l.ex.s.length){ ol.insertAdjacentHTML('beforeend',`<li><span>${l.ex.s[k]}</span></li>`); k++; } bt.textContent=k<l.ex.s.length?'Próximo passo':'Pronto'; if(k>=l.ex.s.length){ bt.disabled=true; if(!x().ex){ ls(l.id).ex=1; save(); upd(); } } }); }
  if(l.exa&&$('#exa')) ExPlayer($('#exa'),l,upd);
  Practice($('#prac'),[l],{onChange:()=>{ renderSide(); upd(); },focus:false});
  const ai=$('#aiidea'); ai.addEventListener('click',e=>{ const b=e.target.closest('[data-ai]'); if(!b) return; const k=b.dataset.ai;
    aiAsk(ai.nextElementSibling,TUTOR+'\n\n'+lessonCtx(l)+'\n\nPedido do aluno: '+IDEA_ASK[k],{tier:k==='fundo'?'default':'quick'}); });
  const gb=$('#aigen'); gb.addEventListener('click',()=>genQuestion(l,$('#aiq'),gb));
  mountChat(l);
}

const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function route(){

/* =====================================================================
   Jornada de descoberta: a lição vira uma sequência de telas curtas.
   O aluno parte de uma situação do dia a dia, mexe no laboratório até
   cumprir um desafio, mede, percebe o padrão e monta a fórmula sozinho.

   Tipos de passo (l.jor = [...]):
   cena    {p}                         situação do dia a dia
   nota    {h,p}                       explicação curta
   q       {q,o,a:0,why,w}             pergunta de raciocínio (a 1ª opção é a certa)
   n       {q,a,u,tol,why,dica}        conta rápida
   lab     {p,sim,cfg,goal(s),ok,dica} desafio: libera quando goal(s) for verdadeiro
   medir   {p,sim,cfg,rec(s),cols,need,depois:{q...}}  anotar medidas, ver o gráfico
   deduz   {p,linhas:[{txt:'… ___ …',o,why}],fim}      montar a fórmula
   ordem   {q,itens,why}               tocar os itens na ordem certa
   mundo   {h,itens:[[título,texto]]}  onde isso aparece na sua volta
   ===================================================================== */
const JTAG={aposta:'Aposte',cena:'Situação',nota:'Entenda',q:'Pense',n:'Faça a conta',lab:'Desafio no laboratório',medir:'Meça e descubra',deduz:'Construa a fórmula',ordem:'Coloque em ordem',mundo:'Na sua volta'};
let JCLEAN=null, JORCTX=null;
function jPlot(host,rows,cols){
  host.innerHTML='<canvas role="img" aria-label="Gráfico das suas medidas"></canvas>'; const cv=$('canvas',host), w=cv.clientWidth||host.clientWidth||480, h=230, d=Math.min(2,window.devicePixelRatio||1);
  cv.style.height=h+'px'; cv.width=Math.round(w*d); cv.height=Math.round(h*d); const ctx=cv.getContext('2d'); ctx.setTransform(d,0,0,d,0,0); const g=G(ctx,w,h);
  const xs=rows.map(r=>r[0]), ys=rows.map(r=>r[1]), xr=[Math.min(0,...xs),Math.max(...xs,0)*1.12||1], yr=[Math.min(0,...ys),Math.max(...ys,0)*1.15||1];
  const r=g.plot(52,18,w-72,h-66,{xr,yr,series:[],xl:cols[0],yl:cols[1]});
  const srt=rows.slice().sort((a,b)=>a[0]-b[0]); if(srt.length>1) g.poly([[r.X(0),r.Y(0)],...srt.map(p=>[r.X(p[0]),r.Y(p[1])])].slice(srt[0][0]===0?1:0),COL.muted,1.5);
  srt.forEach(p=>g.circle(r.X(p[0]),r.Y(p[1]),6,COL.force,COL.card,1.5)); }

/* cada tipo de passo desenha o corpo e chama done() quando o aluno cumpriu */
const JSTEP={
  cena(b,st,done){ b.innerHTML=`<div class="jtext">${st.p}</div>`; done(); },
  nota(b,st,done){ b.innerHTML=`<div class="jtext">${st.p}</div>`; done(); },
  mundo(b,st,done){ b.innerHTML=`${st.p?`<div class="jtext">${st.p}</div>`:''}<div class="jworld">${st.itens.map(([t,d])=>`<div><b>${t}</b><p>${d}</p></div>`).join('')}</div>`; done(); },
  q(b,st,done){ const order=shuffle(st.o.map((_,i)=>i)); let tries=0, over=false;
    b.innerHTML=`<div class="jtext">${st.q}</div><div class="opts">${order.map((k,j)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${'ABCDE'[j]}</span><span>${st.o[k]}</span></button>`).join('')}</div><div class="jfb" aria-live="polite"></div>`;
    b.addEventListener('click',e=>{ const t=e.target.closest('.opt'); if(!t||over||t.disabled) return; const k=+t.dataset.k; tries++;
      if(k===0){ over=true; t.classList.add('right'); $$('.opt',b).forEach(x=>x.disabled=true); $('.jfb',b).innerHTML=`<div class="fb ok"><b>${tries===1?'Isso!':'Agora sim.'}</b> ${st.why||''}</div>`; done(); return; }
      t.classList.add('wrong'); t.disabled=true;
      if(tries>=2){ over=true; $$('.opt',b).forEach(x=>{ x.disabled=true; if(+x.dataset.k===0) x.classList.add('right'); }); $('.jfb',b).innerHTML=`<div class="fb info"><b>A certa é a destacada em verde.</b> ${st.why||''}</div>`; done(); }
      else $('.jfb',b).innerHTML=`<div class="fb bad"><b>Ainda não.</b> ${(st.w&&st.w[k-1])||'Pense de novo no que você viu até aqui.'}</div>`; }); },
  aposta(b,st,done){ b.innerHTML=`<div class="jtext">${st.q}</div><div class="opts">${st.o.map((t,j)=>`<button class="opt" type="button" data-k="${j}"><span class="k">${'ABCDE'[j]}</span><span>${t}</span></button>`).join('')}</div><div class="jfb" aria-live="polite"></div>`;
    b.addEventListener('click',e=>{ const t=e.target.closest('.opt'); if(!t||t.disabled) return; $$('.opt',b).forEach(x=>{ x.disabled=true; x.classList.toggle('pick',x===t); }); $('.jfb',b).innerHTML=`<div class="fb info"><b>Aposta anotada.</b> ${st.depois||'Continue para conferir no laboratório.'}</div>`; done(); }); },
  n(b,st,done){ let tries=0, over=false;
    b.innerHTML=`<div class="jtext">${st.q}</div><form class="ans" autocomplete="off"><input inputmode="decimal" placeholder="sua resposta" aria-label="Sua resposta"><span class="u">${st.u||''}</span><button class="btn" type="submit">Verificar</button></form><div class="jfb" aria-live="polite"></div>`;
    $('form',b).addEventListener('submit',e=>{ e.preventDefault(); if(over) return; const v=parseNum($('input',b).value); if(isNaN(v)){ $('.jfb',b).innerHTML='<div class="fb info">Digite só o número. Exemplo: 12,5</div>'; return; }
      tries++; const tol=st.tol||.02, ok=Math.abs(v-st.a)<=Math.max(tol*Math.abs(st.a),1e-9);
      if(ok||tries>=2){ over=true; $$('input,button',b).forEach(x=>x.disabled=true); $('.jfb',b).innerHTML=`<div class="fb ${ok?'ok':'info'}"><b>${ok?'Isso!':'A resposta é '+nf(st.a)+' '+(st.u||'')+'.'}</b> ${st.why||''}</div>`; done(); }
      else $('.jfb',b).innerHTML=`<div class="fb bad"><b>Ainda não.</b> ${st.dica||'Refaça a conta com calma.'}</div>`; }); },
  lab(b,st,done,ctx){ b.innerHTML=`<div class="jtext">${st.p}</div><div class="jlab" id="jl${ctx.i}"></div><div class="jgoal"><span class="gi" aria-hidden="true"></span><span class="gt">Desafio em aberto</span><button class="btn sm ghost" type="button" data-hint>Preciso de uma dica</button></div><div class="jfb" aria-live="polite"></div>`;
    const s=SIMS[st.sim]($(`#jl${ctx.i}`),st.cfg||{}); ctx.sims.push(s); let hints=0;
    const win=()=>{ clearInterval(ctx.timer); const gl=$('.jgoal',b); gl.classList.add('won'); $('.gt',gl).textContent='Desafio cumprido'; $('[data-hint]',gl)?.remove(); $('.jfb',b).innerHTML=`<div class="fb ok"><b>Conseguiu!</b> ${st.ok||''}</div>`; done(); };
    ctx.timer=setInterval(()=>{ try{ if(st.goal(s)) win(); }catch(e){} },250);
    $('[data-hint]',b).addEventListener('click',e=>{ hints++; if(hints===1){ $('.jfb',b).innerHTML=`<div class="fb info hint"><b>Dica:</b> ${st.dica||'Mexa nos controles e observe o que muda.'}</div>`; e.target.textContent='Pular este desafio'; } else { $('.jfb',b).innerHTML=`<div class="fb info">${st.ok||''}</div>`; clearInterval(ctx.timer); done(); } }); },
  medir(b,st,done,ctx){ const rows=[]; b.innerHTML=`<div class="jtext">${st.p}</div><div class="jlab" id="jl${ctx.i}"></div><div class="jrec"><button class="btn" type="button" data-rec>Anotar medida</button><span class="jneed">0 de ${st.need} medidas</span></div><div class="jfb" aria-live="polite"></div>
    <div class="tblw"><table class="jtab"><thead><tr>${st.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody></tbody></table></div><div class="jplot"></div><div class="jafter"></div>`;
    const s=SIMS[st.sim]($(`#jl${ctx.i}`),st.cfg||{}); ctx.sims.push(s);
    $('[data-rec]',b).addEventListener('click',()=>{ const fb=$('.jfb',b); let r=null; try{ r=st.rec(s); }catch(e){}
      if(!r){ fb.innerHTML=`<div class="fb info">${st.recMsg||'Ainda não dá para anotar: faça o experimento primeiro.'}</div>`; return; }
      r=r.map(v=>+(+v).toFixed(st.dec??2)); if(rows.some(x=>x.every((v,j)=>v===r[j]))){ fb.innerHTML='<div class="fb info">Essa medida você já anotou. Mude alguma coisa e anote outra.</div>'; return; }
      fb.innerHTML=''; rows.push(r); $('tbody',b).insertAdjacentHTML('beforeend',`<tr>${r.map(v=>`<td>${nsig(v,4)}</td>`).join('')}</tr>`); $('.jneed',b).textContent=`${rows.length} de ${st.need} medidas`;
      if(rows.length===st.need){ $('[data-rec]',b).disabled=true; if(st.plot!==false) jPlot($('.jplot',b),rows.map(r=>[r[st.px||0],r[st.py??1]]),[st.cols[st.px||0],st.cols[st.py??1]]);
        const a=document.createElement('div'); $('.jafter',b).append(a); JSTEP.q(a,st.depois,done); } }); },
  deduz(b,st,done){ let k=0; b.innerHTML=`${st.p?`<div class="jtext">${st.p}</div>`:''}<ol class="jder"></ol><div class="jfim"></div>`; const ol=$('.jder',b);
    const line=()=>{ const L=st.linhas[k], order=shuffle(L.o.map((_,i)=>i));
      ol.insertAdjacentHTML('beforeend',`<li><div class="jl">${L.txt.replace('___','<span class="blank">?</span>')}</div><div class="jopts">${order.map(i=>`<button class="btn sm ghost" type="button" data-i="${i}">${L.o[i]}</button>`).join('')}</div><div class="jwhy"></div></li>`);
      const li=ol.lastElementChild;
      li.addEventListener('click',e=>{ const t=e.target.closest('[data-i]'); if(!t||t.disabled) return;
        if(+t.dataset.i===0){ $('.blank',li).outerHTML=`<span class="filled">${L.o[0]}</span>`; $('.jopts',li).remove(); $('.jwhy',li).innerHTML=L.why?`<span>${L.why}</span>`:''; k++;
          if(k<st.linhas.length) line(); else { if(st.fim) $('.jfim',b).innerHTML=`<div class="jresult"><p class="jtag">Você chegou em</p><div class="fml">${st.fim.replace(/ {3,}/g,'<span class="gap"></span>')}</div></div>`; done(); } }
        else { t.classList.add('no'); t.disabled=true; $('.jwhy',li).innerHTML=`<span class="bad">${(L.w&&L.w[+t.dataset.i-1])||'Não encaixa. Tente outra.'}</span>`; } }); };
    line(); },
  ordem(b,st,done){ let k=0; const order=shuffle(st.itens.map((_,i)=>i));
    b.innerHTML=`<div class="jtext">${st.q}</div><ol class="jord"></ol><div class="jpool">${order.map(i=>`<button class="opt" type="button" data-i="${i}"><span>${st.itens[i]}</span></button>`).join('')}</div><div class="jfb" aria-live="polite"></div>`;
    b.addEventListener('click',e=>{ const t=e.target.closest('.jpool .opt'); if(!t) return; const i=+t.dataset.i;
      if(i===k){ $('.jord',b).insertAdjacentHTML('beforeend',`<li>${st.itens[i]}</li>`); t.remove(); k++; $('.jfb',b).innerHTML='';
        if(k===st.itens.length){ $('.jfb',b).innerHTML=`<div class="fb ok"><b>Isso!</b> ${st.why||''}</div>`; done(); } }
      else { t.classList.add('shake'); setTimeout(()=>t.classList.remove('shake'),400); $('.jfb',b).innerHTML='<div class="fb bad">Esse não vem agora. Qual acontece antes?</div>'; } }); }
};

function Jornada(host,l,onDone){
  const J=l.jor, st0=P.l[l.id]||{}; let reached=st0.jd?J.length:Math.min(st0.ji||0,J.length-1), i=st0.jd?0:reached, ctx=null;
  function clean(){ if(!ctx) return; clearInterval(ctx.timer); ctx.sims.forEach(s=>s.dispose()); ctx=null; }
  JCLEAN=clean;
  function render(scroll){ clean(); const st=J[i]; ctx={i,sims:[],timer:0}; JORCTX=ctx;
    host.innerHTML=`<div class="jor"><div class="jbar"><div class="jdots">${J.map((s,k)=>`<button type="button" class="jd${k<reached?' done':''}${k===i?' on':''}" data-go="${k}" ${k>reached?'disabled':''} aria-label="Passo ${k+1}: ${JTAG[s.t]}"></button>`).join('')}</div><span class="jcount">${i+1} de ${J.length}</span></div>
      <div class="jcard jt-${st.t}"><p class="jtag">${JTAG[st.t]}</p>${st.h?`<h3>${st.h}</h3>`:''}<div class="jbody"></div></div>
      <div class="jnav"><button class="btn ghost" type="button" data-nav="back" ${i?'':'disabled'}>← Voltar</button><button class="btn sm ghost ai" type="button" data-nav="ai">${AIPILL} Não entendi</button><button class="btn" type="button" data-nav="next" disabled>${i===J.length-1?'Concluir':'Continuar'} →</button></div><div class="aiout"></div></div>`;
    JSTEP[st.t]($('.jbody',host),st,()=>{ const nb=$('[data-nav=next]',host); if(nb) nb.disabled=false; },ctx);
    if(i<reached) $('[data-nav=next]',host).disabled=false;
    if(scroll) host.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); }
  function finish(scroll){ clean(); const x=ls(l.id); const first=!x.jd; if(first){ x.jd=1; x.ji=J.length; save(); } onDone&&onDone(first);
    host.innerHTML=`<div class="jor"><div class="jcard jend"><div class="jstar" aria-hidden="true">★</div><h3>Você descobriu a física desta lição.</h3><p>Agora confira o resumo, veja um exemplo resolvido e pratique até dominar.</p><div class="row"><button class="btn" type="button" data-to="prac">Praticar agora</button><button class="btn ghost" type="button" data-to="resumo">Ver o resumo</button><button class="btn ghost" type="button" data-again>Refazer a jornada</button></div></div></div>`;
    if(scroll) host.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); }
  host.addEventListener('click',e=>{ const t=e.target.closest('button'); if(!t||!host.contains(t)) return;
    if(t.dataset.go!=null&&!t.disabled){ i=+t.dataset.go; render(true); }
    else if(t.dataset.nav==='back'&&i>0){ i--; render(true); }
    else if(t.dataset.nav==='next'){ if(i+1>reached&&i<J.length-1){ reached=i+1; const x=ls(l.id); x.ji=Math.max(x.ji||0,reached); save(); } if(i===J.length-1) finish(true); else { i++; render(true); } }
    else if(t.dataset.nav==='ai'){ t.disabled=true; const st=J[i]; aiAsk($('.aiout',host),TUTOR+'\n\n'+lessonCtx(l)+`\n\nO aluno está num passo da atividade guiada desta lição e não entendeu. Conteúdo do passo:\n${plain([st.h,st.p,st.q,(st.linhas||[]).map(x=>x.txt).join(' / ')].filter(Boolean).join('\n'))}\n\nExplique esse passo de outro jeito, com um exemplo do dia a dia, em no máximo 120 palavras. Se houver uma pergunta ou desafio, dê uma pista, mas não entregue a resposta.`); }
    else if(t.dataset.to){ const el=$(t.dataset.to==='prac'?'#prac':'#resumo'); if(el){ if(el.tagName==='DETAILS') el.open=true; el.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); } }
    else if(t.dataset.again!=null){ i=0; render(true); } });
  if(st0.jd) finish(false); else render(false); }

/* =====================================================================
   Exemplo animado: o problema acontece no laboratório, passo a passo.
   l.exa = {q, sim, cfg, set:{...}, fn(s), passos:[{txt, ate, set, fn(s), tags:[[texto,cor]], ask:{q,a,u,tol}}]}
   - set / fn: mudam o laboratório antes do passo (parâmetros ou estado)
   - ate: anima até esse instante (s)
   - tags: etiquetas que aparecem no desenho durante o passo
   - ask: "tente antes": o aluno prevê o número; o texto e a animação vêm depois
   ===================================================================== */
function ExPlayer(host,l,onDone){
  const E=l.exa; let k=-1, s=null, answered={}, tick=0;
  host.innerHTML=`<div class="exa"><div class="exq"><p class="jtag">Problema</p><div>${E.q}</div></div><div class="exlab locked" id="exlab"></div>
    <div class="expanel"><ol class="exsteps"></ol><div class="exask" aria-live="polite"></div>
    <div class="exctl"><button class="btn ghost" type="button" data-x="prev" disabled>← Voltar</button><button class="btn ghost" type="button" data-x="replay" disabled>↺ Ver de novo</button><button class="btn" type="button" data-x="next">Começar ▶</button></div></div></div>`;
  s=SIMS[E.sim]($('#exlab',host),E.cfg||{}); SIMNOW.push(s);
  /* mantém as etiquetas desenhadas mesmo com a animação parada */
  tick=setInterval(()=>{ if(!s.playing&&host.isConnected) s.render(); },120); SIMNOW.push({dispose(){ clearInterval(tick); }});
  const applySets=upto=>{ Object.assign(s.p,E.set||{}); if(E.fn) E.fn(s); for(let i=0;i<=upto;i++){ const P=E.passos[i]; if(P&&P.set) Object.assign(s.p,P.set); } };
  const lastAte=upto=>{ for(let i=upto;i>=0;i--) if(E.passos[i].ate!=null) return E.passos[i].ate; return 0; };
  function ff(t){ s.reset(); const n=s.def.sub||1; let guard=0; while(s.t<t-1e-9&&guard++<5000){ const d=Math.min(.01,t-s.t); for(let i=0;i<n;i++) s.def.step(s,d/n); s.t+=d; } s.playing=false; s.render(); }
  function overlay(i){ const P=E.passos[i]; s.overlay=P&&(P.tags||P.ov)?(g,st)=>{ (P.tags||[]).forEach(([t,c],j)=>g.tag(t,g.W*(E.tx??.5),(E.ty??22)+j*26,COL[c]||c||COL.ink,'center',13.5)); P.ov&&P.ov(g,st); }:null; }
  /* monta o laboratório no estado do passo i (sem animar) */
  function settle(i){ applySets(i); ff(i>=0?lastAte(i):0); for(let j=0;j<=i;j++) if(E.passos[j].fn) E.passos[j].fn(s); overlay(i); s.render(); }
  function list(){ const ol=$('.exsteps',host); ol.innerHTML=E.passos.slice(0,k+1).map((P,i)=>{ const hidden=P.ask&&!answered[i]; return `<li class="${i===k?'on':''}"><span>${hidden?'<span class="exwait">Tente prever antes de ver.</span>':P.txt}</span></li>`; }).join(''); }
  function show(animate){ const P=E.passos[k]; list(); $('.exask',host).innerHTML='';
    $('[data-x=prev]',host).disabled=k<=0; $('[data-x=replay]',host).disabled=k<0;
    const nb=$('[data-x=next]',host); nb.textContent=k>=E.passos.length-1?'Concluído ✓':'Próximo passo ▶'; nb.disabled=k>=E.passos.length-1;
    if(P.ask&&!answered[k]){ nb.disabled=true; ask(P); return; }
    run(P,animate); if(k===E.passos.length-1){ const x=ls(l.id); if(!x.ex){ x.ex=1; save(); onDone&&onDone(); } } }
  function run(P,animate){ applySets(k); if(P.fn) P.fn(s); overlay(k);
    if(P.ate!=null&&animate){ s.runTo(P.ate); } else if(P.ate!=null){ settle(k); } else s.render(); }
  function ask(P){ const box=$('.exask',host); let tries=0;
    box.innerHTML=`<div class="extry"><p class="jtag">Tente antes</p><div>${P.ask.q}</div><form class="ans" autocomplete="off"><input inputmode="decimal" placeholder="sua previsão" aria-label="Sua previsão"><span class="u">${P.ask.u||''}</span><button class="btn sm" type="submit">Conferir</button><button class="btn sm ghost" type="button" data-show>Mostrar</button></form><div class="jfb"></div></div>`;
    const finish=(msg)=>{ answered[k]=true; box.innerHTML=msg?`<div class="extry done">${msg}</div>`:''; list(); const nb=$('[data-x=next]',host); nb.disabled=k>=E.passos.length-1; run(P,true); if(k===E.passos.length-1){ const x=ls(l.id); if(!x.ex){ x.ex=1; save(); onDone&&onDone(); } } };
    $('form',box).addEventListener('submit',e=>{ e.preventDefault(); const v=parseNum($('input',box).value); if(isNaN(v)) return; tries++; const tol=P.ask.tol||.02, ok=Math.abs(v-P.ask.a)<=Math.max(tol*Math.abs(P.ask.a),1e-9);
      if(ok) finish(`<div class="fb ok"><b>Acertou a previsão!</b> Veja acontecer.</div>`); else if(tries>=2) finish(`<div class="fb info"><b>Era ${nf(P.ask.a)} ${P.ask.u||''}.</b> Veja como chegar lá.</div>`); else $('.jfb',box).innerHTML='<div class="fb bad">Quase. Pense no passo anterior e tente de novo.</div>'; });
    $('[data-show]',box).addEventListener('click',()=>finish('')); $('input',box).focus({preventScroll:true}); }
  host.addEventListener('click',e=>{ const b=e.target.closest('[data-x]'); if(!b||b.disabled) return; const a=b.dataset.x;
    if(a==='next'&&k<E.passos.length-1){ k++; if(k===0) settle(-1); show(true); }
    else if(a==='prev'&&k>0){ k--; settle(k); show(false); }
    else if(a==='replay'){ settle(-1); applySets(k); for(let j=0;j<=k;j++) if(E.passos[j].fn) E.passos[j].fn(s); overlay(k); const t=lastAte(k); if(t>0) s.runTo(t); } });
  settle(-1); }

/* =====================================================================
   Kit de cenas: céu, estrada, carro, bola, caixa, pessoa, prédio,
   cronômetro, velocímetro e cotas. Tudo a partir dos tokens do tema,
   então funciona no claro e no escuro.
   ===================================================================== */
function hexRGB(c){ c=String(c).trim(); if(c.startsWith('rgb')) return c.match(/[\d.]+/g).slice(0,3).map(Number); if(c[0]==='#'){ c=c.slice(1); if(c.length===3) c=[...c].map(x=>x+x).join(''); return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16)); } return [128,128,128]; }
function mix(a,b,t){ const A=hexRGB(a), B=hexRGB(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }
function alpha(c,a){ const A=hexRGB(c); return `rgba(${A.join(',')},${a})`; }
const isDark=()=>{ const [r,g,b]=hexRGB(COL.paper); return r+g+b<300; };

const SK={
  /* céu com nuvens; off desloca as nuvens (paralaxe) */
  sky(g,y,off=0){ const c=g.ctx, gr=c.createLinearGradient(0,0,0,y), d=isDark();
    gr.addColorStop(0,d?mix(COL.paper,'#1b2a4a',.8):mix('#7fb6f2',COL.paper,.35)); gr.addColorStop(1,d?mix(COL.paper,'#24365c',.5):mix('#cfe5fb',COL.paper,.25));
    c.fillStyle=gr; c.fillRect(0,0,g.W,y);
    if(d){ c.fillStyle='rgba(255,255,255,.55)'; for(let i=0;i<26;i++){ const x=((i*137.5+off*.05)%g.W+g.W)%g.W, yy=(i*53)%Math.max(10,y-10); c.fillRect(x,yy,1.4,1.4); } }
    else { c.fillStyle='rgba(255,255,255,.75)'; [[.15,.25,1],[.55,.15,1.3],[.85,.32,.9]].forEach(([fx,fy,sc])=>{ const x=((fx*g.W-off*.15)%(g.W+120)+g.W+120)%(g.W+120)-60, yy=fy*y; [[0,0,22],[18,-6,17],[36,2,19],[-16,4,14]].forEach(([dx,dy,r])=>{ c.beginPath(); c.arc(x+dx*sc,yy+dy*sc,r*sc,0,7); c.fill(); }); }); } },
  hills(g,y,off=0){ const c=g.ctx; c.fillStyle=isDark()?mix(COL.paper,COL.ok,.18):mix(COL.ok,COL.paper,.62); c.beginPath(); c.moveTo(0,y); for(let x=0;x<=g.W+20;x+=20){ c.lineTo(x,y-14-10*Math.sin((x+off*.3)/70)-6*Math.sin((x+off*.3)/23)); } c.lineTo(g.W,y); c.closePath(); c.fill(); },
  grass(g,y,h){ const c=g.ctx, gr=c.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,isDark()?mix(COL.paper,COL.ok,.28):mix(COL.ok,COL.paper,.45)); gr.addColorStop(1,isDark()?mix(COL.paper,COL.ok,.14):mix(COL.ok,COL.paper,.62)); c.fillStyle=gr; c.fillRect(0,y,g.W,h); },
  /* estrada com faixas que andam conforme off (em pixels) */
  road(g,y,h,off=0){ const c=g.ctx; c.fillStyle=isDark()?mix(COL.paper,'#000',.25):mix('#3d4552',COL.paper,.15); c.fillRect(0,y,g.W,h);
    c.fillStyle=isDark()?'#d9dee6':'#f4f6f8'; c.fillRect(0,y,g.W,2); c.fillRect(0,y+h-2,g.W,2);
    c.fillStyle='#f2c94c'; const per=40, o=((off%per)+per)%per; for(let x=-per+o*-1;x<g.W+per;x+=per) c.fillRect(x,y+h/2-1.5,22,3); },
  shadow(g,x,y,w,a=.25){ const c=g.ctx; c.save(); c.fillStyle=`rgba(0,0,0,${a})`; c.beginPath(); c.ellipse(x,y,w/2,Math.max(2,w*.09),0,0,7); c.fill(); c.restore(); },
  /* carro: x = centro, y = chão; rot = ângulo das rodas (rad) */
  car(g,x,y,w,col,rot=0){ const c=g.ctx, h=w*.28, r=w*.12, wy=y-r;
    SK.shadow(g,x,y+1,w*.95,.22);
    c.save(); c.fillStyle=col; c.strokeStyle=mix(col,'#000',.35); c.lineWidth=1.5;
    c.beginPath(); c.moveTo(x-w/2,wy-2); c.lineTo(x-w/2,wy-h*.75); c.quadraticCurveTo(x-w/2,wy-h,x-w*.42,wy-h); c.lineTo(x-w*.27,wy-h); c.lineTo(x-w*.14,wy-h*1.75); c.lineTo(x+w*.17,wy-h*1.75); c.lineTo(x+w*.31,wy-h); c.lineTo(x+w*.44,wy-h*.92); c.quadraticCurveTo(x+w/2,wy-h*.8,x+w/2,wy-h*.45); c.lineTo(x+w/2,wy-2); c.closePath(); c.fill(); c.stroke();
    c.fillStyle=isDark()?'#9fc3ea':'#d7ecff'; c.beginPath(); c.moveTo(x-w*.23,wy-h*1.02); c.lineTo(x-w*.12,wy-h*1.62); c.lineTo(x-w*.0,wy-h*1.62); c.lineTo(x-w*.0,wy-h*1.02); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x+w*.03,wy-h*1.02); c.lineTo(x+w*.03,wy-h*1.62); c.lineTo(x+w*.15,wy-h*1.62); c.lineTo(x+w*.26,wy-h*1.02); c.closePath(); c.fill();
    c.fillStyle='#ffd866'; c.beginPath(); c.ellipse(x+w*.47,wy-h*.62,w*.025,h*.12,0,0,7); c.fill(); c.fillStyle='#e5484d'; c.fillRect(x-w/2,wy-h*.7,w*.03,h*.22);
    [[x-w*.3],[x+w*.3]].forEach(([wx])=>{ c.fillStyle='#1c1f24'; c.beginPath(); c.arc(wx,wy,r,0,7); c.fill(); c.fillStyle='#9aa3ad'; c.beginPath(); c.arc(wx,wy,r*.5,0,7); c.fill(); c.strokeStyle='#1c1f24'; c.lineWidth=1.6; for(let k=0;k<4;k++){ const a=rot+k*Math.PI/2; c.beginPath(); c.moveTo(wx,wy); c.lineTo(wx+Math.cos(a)*r*.5,wy+Math.sin(a)*r*.5); c.stroke(); } });
    c.restore(); },
  /* bola com brilho; spin desenha uma costura girando */
  ball(g,x,y,r,col,spin){ const c=g.ctx, gr=c.createRadialGradient(x-r*.35,y-r*.4,r*.15,x,y,r); gr.addColorStop(0,mix(col,'#ffffff',.55)); gr.addColorStop(.6,col); gr.addColorStop(1,mix(col,'#000',.35));
    c.save(); c.fillStyle=gr; c.beginPath(); c.arc(x,y,r,0,7); c.fill();
    if(spin!=null){ c.strokeStyle=alpha('#ffffff',.55); c.lineWidth=Math.max(1,r*.12); c.beginPath(); c.arc(x,y,r*.62,spin,spin+2.2); c.stroke(); }
    c.restore(); },
  /* caixa de madeira */
  crate(g,x,y,w,h,label){ const c=g.ctx, wood=isDark()?'#a0703f':'#c98d4f', dark=mix(wood,'#000',.35);
    SK.shadow(g,x+w/2,y+h,w*1.05,.2);
    c.save(); c.fillStyle=wood; c.strokeStyle=dark; c.lineWidth=2; g.rect(x,y,w,h,wood,dark,4,2);
    c.strokeStyle=alpha(dark,.55); c.lineWidth=1; for(let k=1;k<4;k++){ c.beginPath(); c.moveTo(x+3,y+h*k/4); c.lineTo(x+w-3,y+h*k/4); c.stroke(); }
    c.strokeStyle=dark; c.lineWidth=3; c.beginPath(); c.moveTo(x+4,y+4); c.lineTo(x+w-4,y+h-4); c.stroke(); c.lineWidth=2; c.strokeRect(x+3,y+3,w-6,h-6); c.restore();
    if(label) g.tag(label,x+w/2,y+h/2,'#3b2a14'); },
  /* pessoa estilizada; pose: 'stand' | 'push' */
  person(g,x,y,h,col,pose='stand'){ const c=g.ctx, hd=h*.13; c.save(); c.lineCap='round'; c.strokeStyle=col; c.fillStyle=col;
    const lean=pose==='push'?h*.18:0, hipX=x, hipY=y-h*.45, shX=x+lean, shY=y-h*.8;
    c.lineWidth=h*.085; c.beginPath(); c.moveTo(hipX,hipY); c.lineTo(shX,shY); c.stroke();
    c.beginPath(); c.arc(shX+lean*.25,shY-hd*1.15,hd,0,7); c.fill();
    c.lineWidth=h*.07; c.beginPath(); c.moveTo(hipX,hipY); c.lineTo(hipX-(pose==='push'?h*.22:h*.08),y); c.moveTo(hipX,hipY); c.lineTo(hipX+h*.08,y); c.stroke();
    c.lineWidth=h*.06; c.beginPath(); if(pose==='push'){ c.moveTo(shX,shY+h*.04); c.lineTo(shX+h*.28,shY+h*.1); } else { c.moveTo(shX,shY+h*.04); c.lineTo(shX-h*.12,shY+h*.32); c.moveTo(shX,shY+h*.04); c.lineTo(shX+h*.12,shY+h*.32); } c.stroke(); c.restore(); },
  building(g,x,y,w,h){ const c=g.ctx, wall=isDark()?mix(COL.paper,'#8892a3',.3):mix('#b8c1cc',COL.paper,.25); g.rect(x,y,w,h,wall,mix(wall,'#000',.3),3,1.5);
    const cols=Math.max(2,Math.floor(w/22)), rows=Math.max(2,Math.floor(h/26)); for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){ const wx=x+6+i*(w-12)/cols, wy=y+8+j*(h-12)/rows; c.fillStyle=(i*7+j*3)%5===0?'#ffe08a':(isDark()?'#2c3a52':'#e8f2fc'); c.fillRect(wx,wy,(w-12)/cols-6,(h-12)/rows-9); } },
  tree(g,x,y,s){ const c=g.ctx; c.fillStyle=isDark()?'#5b4630':'#8a6a45'; c.fillRect(x-s*.06,y-s*.45,s*.12,s*.45); c.fillStyle=isDark()?mix(COL.paper,COL.ok,.45):mix(COL.ok,'#000',.05); [[0,-.62,.3],[-.17,-.5,.22],[.17,-.5,.22]].forEach(([dx,dy,r])=>{ c.beginPath(); c.arc(x+dx*s,y+dy*s,r*s,0,7); c.fill(); }); },
  /* cronômetro analógico + digital */
  watch(g,x,y,r,t){ const c=g.ctx; g.circle(x,y,r+3,COL.card,COL.ink,2); g.rect(x-4,y-r-9,8,6,COL.ink,null,2);
    for(let k=0;k<12;k++){ const a=k/12*Math.PI*2; g.line(x+Math.sin(a)*r*.78,y-Math.cos(a)*r*.78,x+Math.sin(a)*r*.92,y-Math.cos(a)*r*.92,COL.muted,k%3?1:2); }
    const a=(t%1)*Math.PI*2; g.line(x,y,x+Math.sin(a)*r*.75,y-Math.cos(a)*r*.75,COL.force,2); g.circle(x,y,2.5,COL.ink);
    g.text(nsig(Math.floor(t*100)/100,4).replace(/^(\d+)$/,'$1,00')+' s',x,y+r+18,{size:13,bold:true,mono:true,align:'center'}); },
  /* velocímetro em arco */
  gauge(g,x,y,r,v,vmax,unit,col=COL.accent){ const c=g.ctx, a0=Math.PI*.8, a1=Math.PI*2.2, f=clamp(Math.abs(v)/vmax,0,1);
    c.save(); c.lineCap='round'; c.lineWidth=r*.16; c.strokeStyle=COL.line; c.beginPath(); c.arc(x,y,r,a0,a1); c.stroke();
    c.strokeStyle=col; c.beginPath(); c.arc(x,y,r,a0,a0+(a1-a0)*f); c.stroke(); c.restore();
    const an=a0+(a1-a0)*f; g.line(x,y,x+Math.cos(an)*r*.8,y+Math.sin(an)*r*.8,COL.ink,2.5); g.circle(x,y,4,COL.ink);
    g.text(nsig(Math.round(v*10)/10,3),x,y+r*.55,{size:Math.max(12,r*.42),bold:true,mono:true,align:'center'}); g.text(unit,x,y+r*.55+13,{size:10.5,c:COL.muted,align:'center'}); },
  /* cota entre dois pontos, com etiqueta */
  dim(g,x1,y1,x2,y2,label,col=COL.muted){ const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, nx=-dy/L*6, ny=dx/L*6;
    g.line(x1,y1,x2,y2,col,1.4); g.line(x1-nx,y1-ny,x1+nx,y1+ny,col,1.4); g.line(x2-nx,y2-ny,x2+nx,y2+ny,col,1.4); if(label) g.tag(label,(x1+x2)/2,(y1+y2)/2,col); },
  /* destaque pulsante para chamar atenção num ponto (exemplos) */
  pulse(g,x,y,r,col=COL.energy){ const k=(performance.now()/900)%1; g.ctx.save(); g.ctx.globalAlpha=1-k; g.circle(x,y,r*(1+k*.8),null,col,3); g.ctx.restore(); }
};

/* =====================================================================
   Laboratórios de fundamentos e mecânica (g = 10 m/s² em todo o curso)
   ===================================================================== */
const GRAV=10;

/* potências de 10: régua logarítmica do átomo à galáxia */
const SCALE=[[-10,'átomo','1×10⁻¹⁰ m'],[-7,'vírus','1×10⁻⁷ m'],[-5,'célula humana','1×10⁻⁵ m'],[-4,'espessura de um fio de cabelo','1×10⁻⁴ m'],[-3,'grão de areia','1×10⁻³ m'],[-2,'largura de um dedo','1×10⁻² m'],[0,'uma criança','1 m'],[2,'campo de futebol','1×10² m'],[5,'São Paulo–Rio (360 km)','3,6×10⁵ m'],[7,'diâmetro da Terra','1,3×10⁷ m'],[8,'distância Terra–Lua','3,8×10⁸ m'],[9,'diâmetro do Sol','1,4×10⁹ m'],[11,'distância Terra–Sol','1,5×10¹¹ m'],[16,'um ano-luz','9,5×10¹⁵ m'],[21,'diâmetro da Via Láctea','1×10²¹ m']];
const PREF={'-9':'nano (n)','-6':'micro (μ)','-3':'mili (m)','-2':'centi (c)','3':'quilo (k)','6':'mega (M)','9':'giga (G)','12':'tera (T)'};
SIMS.pow10=(host)=>Sim(host,{alt:'Régua de potências de 10 com objetos do átomo à galáxia',h:230,

    const sp=Math.hypot(s.u[0],s.u[1]); g.arrow(X(s.r[0]),Y(s.r[1]),X(s.r[0])+s.u[0]/sp*clamp(sp*30,12,60),Y(s.r[1])-s.u[1]/sp*clamp(sp*30,12,60),COL.vel,null,2.5); },

/* km/h ↔ m/s: carro na estrada de 100 m */

/* MU e MUV: carro na estrada com rastro a cada segundo e gráficos */
SIMS.mov=(host,cfg)=>Sim(host,{alt:'Carro numa estrada com uma imagem a cada segundo, e os gráficos de posição e velocidade',anim:true,h:w=>w<560?480:420,
  legend:[['vel','posição s(t)'],['acc','velocidade v(t): a área sob a curva é o deslocamento']],
  ctrls:[{k:'s0',l:'Posição inicial s₀',min:-20,max:40,step:5,v:0,u:'m'},{k:'v0',l:'Velocidade inicial v₀',min:-10,max:20,step:1,v:cfg.acc?2:8,u:'m/s'}].concat(cfg.acc?[{k:'a',l:'Aceleração a',min:-4,max:4,step:.5,v:1.5,u:'m/s²'}]:[]),
  init(s){ s.pos=[]; s.vel=[]; s.gh=[]; const a=s.p.a||0, f=t=>s.p.s0+s.p.v0*t+a*t*t/2; let lo=Infinity,hi=-Infinity; for(let t=0;t<=10;t+=.1){ lo=Math.min(lo,f(t)); hi=Math.max(hi,f(t)); } s.lo=Math.min(lo,0); s.hi=Math.max(hi,10); s.x=s.p.s0; s.v=s.p.v0; s.pos.push([0,s.x]); s.vel.push([0,s.v]); s.gh.push(s.x); },
  step(s,dt){ const a=s.p.a||0, t=Math.min(10,s.t+dt); if(Math.floor(t+1e-9)>Math.floor(s.t+1e-9)) s.gh.push(s.p.s0+s.p.v0*Math.floor(t+1e-9)+a*Math.floor(t+1e-9)**2/2); s.x=s.p.s0+s.p.v0*t+a*t*t/2; s.v=s.p.v0+a*t; s.pos.push([t,s.x]); s.vel.push([t,s.v]); if(t>=10) s.play(false); },
  done:s=>s.t>=10,
  draw(g,s){ const L=40,Rr=g.W-40,span=s.hi-s.lo,X=m=>L+(m-s.lo)/span*(Rr-L), ry=78, rh=34, cw=Math.min(50,g.W*.11);
    SK.sky(g,ry); SK.hills(g,ry); SK.road(g,ry,rh,0); g.rect(0,ry+rh,g.W,26,isDark()?mix(COL.paper,COL.ok,.2):mix(COL.ok,COL.paper,.55));
    const st=span>200?50:span>80?20:10; for(let m=Math.ceil(s.lo/st)*st;m<=s.hi;m+=st){ g.line(X(m),ry+rh,X(m),ry+rh+5,COL.ink,1.2); g.text(m+' m',X(m),ry+rh+18,{size:10.5,c:COL.ink,align:'center',mono:true}); }
    s.gh.forEach((x,i)=>{ if(i===s.gh.length-1&&Math.abs(x-s.x)<.01) return; g.ctx.save(); g.ctx.globalAlpha=.28; SK.car(g,X(x),ry+rh*.66,cw,COL.vel,0); g.ctx.restore(); g.tag(i+' s',X(x),ry-34,COL.vel,'center',11); });
    const dir=s.v<0?-1:1; g.ctx.save(); if(dir<0){ g.ctx.translate(2*X(s.x),0); g.ctx.scale(-1,1); } SK.car(g,X(s.x),ry+rh*.66,cw,COL.vel,s.x/.3*dir); g.ctx.restore();
    if(Math.abs(s.v)>.05) g.arrow(X(s.x),ry-12,X(s.x)+clamp(s.v*5,-90,90),ry-12,COL.acc,'v = '+nt(s.v)+' m/s',3);
    SK.watch(g,g.W-30,26,13,Math.min(s.t,10));
    const top=ry+rh+56, gh=g.H-top-44, narrow=g.W<560, gw=narrow?g.W-70:(g.W-110)/2;
    const vr=[Math.min(0,s.p.v0,s.p.v0+(s.p.a||0)*10)-1,Math.max(0,s.p.v0,s.p.v0+(s.p.a||0)*10)+1];
    if(narrow){ const h2=(gh-40)/2; g.plot(50,top,gw,h2,{xr:[0,10],yr:[s.lo,s.hi],series:[{pts:s.pos,c:COL.vel,dot:true}],yl:'s (m)'}); g.plot(50,top+h2+40,gw,h2,{xr:[0,10],yr:vr,series:[{pts:s.vel,c:COL.acc,dot:true,fill:alpha(COL.acc,.2)}],xl:'t (s)',yl:'v (m/s)'}); }
    else { g.plot(50,top,gw,gh,{xr:[0,10],yr:[s.lo,s.hi],series:[{pts:s.pos,c:COL.vel,dot:true}],xl:'t (s)',yl:'posição s (m)'}); g.plot(100+gw,top,gw,gh,{xr:[0,10],yr:vr,series:[{pts:s.vel,c:COL.acc,dot:true,fill:alpha(COL.acc,.2)}],xl:'t (s)',yl:'velocidade v (m/s)'}); } },
  reads:s=>[['Tempo t',nt(Math.min(s.t,10))+' s'],['Posição s',nt(s.x)+' m'],['Velocidade v',nt(s.v)+' m/s'],['Deslocamento Δs = s − s₀',nt(s.x-s.p.s0)+' m']]});

/* queda livre: prédio, duas bolas e fotos a cada 0,5 s */
const GS=[[9.8,'Terra'],[1.6,'Lua'],[3.7,'Marte'],[24.8,'Júpiter']];
SIMS.fall=(host)=>Sim(host,{alt:'Duas bolas de massas diferentes caindo juntas ao lado de um prédio, com uma foto a cada meio segundo',anim:true,h:w=>w<560?400:380,
  ctrls:[{k:'h',l:'Altura de queda',min:5,max:100,step:5,v:45,u:'m'},{k:'g',l:'Onde?',opts:GS.map(x=>[x[0],x[1]]),v:9.8}],
  init(s){ s.y=0; s.v=0; s.tr=[[0,0]]; s.T=Math.sqrt(2*s.p.h/s.p.g); },
  step(s,dt){ const t=Math.min(s.T,s.t+dt); s.y=s.p.g*t*t/2; s.v=s.p.g*t; s.tr.push([t,s.v]); if(t>=s.T) s.play(false); },
  done:s=>s.t>=s.T,
  draw(g,s){ const top=34,bot=g.H-34,cw=Math.min(230,g.W*.44),k=(bot-top)/s.p.h, moon=s.p.g<2;
    if(moon){ g.rect(0,0,g.W,bot,isDark()?'#0b0f1a':'#1d2333'); for(let i=0;i<40;i++) g.rect((i*97)%g.W,(i*61)%bot,1.5,1.5,'#fff'); g.rect(0,bot,g.W,g.H-bot,'#9aa0a8'); }
    else { SK.sky(g,bot); SK.grass(g,bot,g.H-bot); }
