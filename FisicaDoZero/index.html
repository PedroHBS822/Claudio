addLessons('ter','calorimetria',[
{id:'propagacao',t:'Propagação do calor',min:13,
 idea:`<p>O calor sempre passa do corpo mais quente para o mais frio, e pode fazer isso de três jeitos.</p>
 <p><b>Condução</b>: a agitação passa de partícula em partícula, por contato, sem que a matéria saia do lugar. Metais conduzem muito bem; ar, madeira, isopor e lã conduzem mal e são chamados de <b>isolantes</b>. Por isso, numa manhã fria, a maçaneta de metal parece mais gelada que a porta de madeira, mesmo estando as duas à mesma temperatura: o metal tira calor da sua mão mais depressa.</p>
 <p><b>Convecção</b>: em líquidos e gases, a parte aquecida fica menos densa e sobe, e a parte fria desce, formando correntes. É por isso que o ar-condicionado fica no alto da parede, que a água da panela circula quando esquenta e que surgem as brisas do litoral.</p>
 <p><b>Radiação</b>: todo corpo emite ondas eletromagnéticas (principalmente infravermelho), que viajam até no vácuo. É assim que o calor do Sol chega à Terra. Superfícies escuras absorvem e emitem mais; claras e espelhadas refletem. A garrafa térmica combate os três: vácuo entre as paredes (sem condução nem convecção) e paredes espelhadas (que refletem a radiação).</p>
 <p>Na condução, o calor que atravessa uma placa por segundo segue a <b>lei de Fourier</b>: cresce com a área e com a diferença de temperatura, e diminui com a espessura.</p>`,
 pred:{q:'De manhã, você toca uma maçaneta de metal e a porta de madeira, que estão no mesmo cômodo há horas. O metal parece mais frio porque:',o:['conduz calor melhor e tira calor da sua mão mais depressa','está a uma temperatura mais baixa que a madeira','guarda mais "frio" que a madeira','é mais denso e, por isso, mais gelado'],a:0,why:'Os dois estão à temperatura do cômodo. A sensação de frio é o calor saindo da sua mão, e o metal, bom condutor, leva esse calor muito mais rápido que a madeira.'},
 lab:{sim:'conduc'},
 tasks:['Troque o aço pelo isopor. Quantas vezes o fluxo de calor diminui?','Dobre a espessura da placa. O que acontece com o fluxo?','Descubra dois jeitos de reduzir o calor que atravessa à metade sem trocar o material.'],
 f:[{f:'Φ = '+frac('Q','Δt')+' = '+frac('k·A·ΔT','L'),s:[['Φ','fluxo de calor (energia por segundo)','W'],['k','condutividade térmica do material','W/(m·K)'],['A','área da placa','m²'],['ΔT','diferença de temperatura entre as faces','°C ou K'],['L','espessura da placa','m']],n:'Cobre: k ≈ 400 · aço: 50 · vidro: 0,8 · madeira: 0,15 · isopor: 0,03 W/(m·K).'}],
 ex:{q:'Uma janela de vidro (k = 0,8 W/m·K) tem 2 m² e 4 mm de espessura. Dentro faz 25 °C e fora, 15 °C. Quanto calor atravessa o vidro por segundo?',s:['Espessura em metros: L = 4 mm = 0,004 m.','Φ = k·A·ΔT/L = 0,8 × 2 × 10 / 0,004.','<b>Φ = 4000 W</b>. Por isso janelas de vidro duplo, com ar entre os vidros, economizam tanto ar-condicionado.']},
 probs:[
  ()=>{ const [k,m]=pick([[.8,'vidro'],[50,'aço'],[.15,'madeira'],[400,'cobre']]), A=pick([.5,1,2]), dT=R(10,50,10), L=pick([1,2,4,5,10]); const a=k*A*dT/(L/100);
    return NUM(`Uma placa de <b>${m}</b> (k = ${F(k)} W/m·K) tem <b>${F(A)} m²</b> de área e <b>${L} cm</b> de espessura. Uma face está <b>${dT} °C</b> mais quente que a outra. Qual é o fluxo de calor através dela?`,a,'W',[`L = ${L} cm = ${F(L/100)} m`,`Φ = k·A·ΔT/L = ${F(k)} × ${F(A)} × ${dT} / ${F(L/100)}`,`Φ = ${F(a)} W`],[[k*A*dT/L,'Converta a espessura para metros antes de dividir.'],[k*A*dT*L/100,'A espessura <b>divide</b>: placa mais grossa deixa passar menos calor.']],'Φ = k·A·ΔT/L, com L em metros.'); },
  ()=>{ const P0=pick([100,200,300,600]), Lk=pick([2,3,4]), Ak=pick([1,2,3].filter(x=>x!==Lk)); const a=P0*Ak/Lk;
    return NUM(`Uma parede deixa passar <b>${P0} W</b> de calor. Outra parede do mesmo material, com a mesma diferença de temperatura, tem <b>${Ak===1?'a mesma área':Ak+' vezes a área'}</b> e <b>${Lk} vezes a espessura</b>. Quanto calor passa por ela?`,a,'W',[`Φ é proporcional a A e inversamente proporcional a L`,`Φ = ${P0} × ${Ak}/${Lk} = ${F(a)} W`],[[P0*Ak*Lk,'Espessura maior <b>reduz</b> o fluxo: divida pelo fator da espessura.'],[P0*Lk/Ak,'Área maior <b>aumenta</b> o fluxo.']]); },
  ()=>{ const A=pick([1.5,2]), L=pick([2,3,5]), dT=R(5,20,5); const phi=.15*A*dT/(L/100), a=phi*3600/1000;
    return NUM(`Uma porta de madeira (k = 0,15 W/m·K) tem <b>${F(A)} m²</b> e <b>${L} cm</b> de espessura. De um lado faz ${dT} °C a mais que do outro. Quanta energia atravessa a porta em <b>1 hora</b>, em quilojoules?`,a,'kJ',[`Φ = 0,15 × ${F(A)} × ${dT} / ${F(L/100)} = ${F(phi)} W`,`Em 1 h = 3600 s: Q = ${F(phi)} × 3600 = ${F(phi*3600)} J`,`Q = ${F(a)} kJ`],[[phi,'Esse é o fluxo em watts (joules por segundo). Multiplique por 3600 s.'],[phi*3600,'Resposta em joules; divida por 1000 para ter kJ.']]); },
  ()=>{ const [k1,k2,m1,m2]=pick([[400,.8,'cobre','vidro'],[50,.15,'aço','madeira'],[.8,.04,'vidro','lã'],[400,50,'cobre','aço'],[.15,.03,'madeira','isopor']]);
    return NUM(`Duas placas de mesmas medidas, uma de <b>${m1}</b> (k = ${F(k1)} W/m·K) e outra de <b>${m2}</b> (k = ${F(k2)} W/m·K), separam os mesmos ambientes. Quantas vezes mais calor passa pela de ${m1}?`,k1/k2,'vezes',[`Mesmas A, L e ΔT: Φ é proporcional a k`,`${F(k1)} / ${F(k2)} = ${F(k1/k2)}`],[[k2/k1,'Inverteu: o material de maior k deixa passar mais calor.']]); },
  POOL([['Como o calor do Sol chega até a Terra?',['por radiação','por condução','por convecção','pelo ar que existe no espaço'],'Entre o Sol e a Terra há vácuo: só a radiação (ondas eletromagnéticas) atravessa.'],
   ['O aparelho de ar-condicionado fica no alto da parede porque:',['o ar frio é mais denso, desce e cria correntes de convecção','o ar frio sobe','assim ele junta menos poeira','perto do chão faz mais calor'],'O ar resfriado desce e o ar quente sobe até o aparelho: o ar da sala inteira circula.'],
   ['Numa garrafa térmica, o vácuo entre as paredes serve para impedir:',['a condução e a convecção','só a radiação','a entrada de luz','o vazamento pela tampa'],'Sem matéria entre as paredes não há condução nem convecção; as paredes espelhadas cuidam da radiação.'],
   ['Um cobertor deixa você aquecido porque:',['é isolante e dificulta a saída do calor do seu corpo','produz calor','impede a entrada do frio','absorve o calor do ar do quarto'],'O cobertor não gera calor: ele segura o calor que o seu corpo produz, graças ao ar preso entre as fibras.'],
   ['A brisa que sopra do mar para a terra durante o dia é um exemplo de:',['convecção','condução','radiação','dilatação'],'A terra esquenta mais rápido que o mar; o ar sobre ela sobe e o ar do mar vem ocupar o lugar.']])],
 traps:['Achar que o metal está mais frio que a madeira no mesmo ambiente: ele só conduz melhor.','Dizer que o cobertor "produz calor" ou "barra o frio": ele isola o calor do corpo.','Esquecer de passar a espessura para metros na lei de Fourier.'],
 keep:['Condução: por contato, sem transporte de matéria. Metais conduzem bem; ar e isopor, mal.','Convecção: correntes em líquidos e gases; o quente sobe e o frio desce.','Radiação: ondas eletromagnéticas, funciona até no vácuo.','Φ = k·A·ΔT/L.']}]);

addLessons('ond',null,[
{id:'mhs',t:'Oscilações: mola e pêndulo',min:15,
 idea:`<p>Muita coisa na natureza vai e volta sempre no mesmo ritmo: um balanço, a corda de um violão, o pêndulo de um relógio. Quando a força que puxa de volta é proporcional ao afastamento, o movimento se chama <b>movimento harmônico simples</b> (MHS).</p>
 <p>No sistema <b>massa-mola</b>, a mola puxa com F = −k·x (lei de Hooke): quanto mais você estica, mais forte ela puxa de volta. O tempo de uma ida e volta completa, o <b>período</b>, é <b>T = 2π·√(m/k)</b>. Massa maior oscila mais devagar; mola mais dura, mais depressa.</p>
 <p>No <b>pêndulo simples</b>, para ângulos pequenos, <b>T = 2π·√(L/g)</b>. Repare no que falta: a massa! Uma bola de ferro e uma de isopor, penduradas em fios do mesmo comprimento, balançam no mesmo ritmo. Nos dois sistemas o período também não depende da amplitude, e foi por isso que o pêndulo serviu para marcar o tempo nos relógios.</p>
 <p>Durante a oscilação a energia troca de forma: nos extremos ela é toda potencial (na mola, E = k·A²/2) e no centro é toda cinética.</p>`,
 pred:{q:'Dois pêndulos têm o mesmo comprimento. Um tem uma bola de 1 kg e o outro, uma de 4 kg. Qual oscila mais rápido?',o:['os dois no mesmo ritmo','o de 4 kg','o de 1 kg','depende de qual foi solto primeiro'],a:0,why:'O período do pêndulo é T = 2π·√(L/g): só o comprimento e a gravidade importam. A massa se cancela, como na queda livre.'},
 lab:{sim:'mhs'},
 tasks:['Aumente a massa. Qual dos dois sistemas muda de ritmo?','Leve o pêndulo de 0,5 m para 2 m (4 vezes mais comprido). O período dobra?','Mude a amplitude. Algum dos períodos muda?'],
 f:[{f:'T<sub class="up">mola</sub> = 2π·√(m/k)      T<sub class="up">pêndulo</sub> = 2π·√(L/g)',s:[['T','período: tempo de uma ida e volta','s'],['m','massa presa à mola','kg'],['k','constante elástica da mola','N/m'],['L','comprimento do pêndulo','m'],['g','aceleração da gravidade (10)','m/s²']],n:'Frequência: f = 1/T. A fórmula do pêndulo vale para ângulos pequenos (até uns 15°).'},
  {f:'F = −k·x      E = '+frac('k·A²','2'),s:[['x','afastamento da posição de equilíbrio','m'],['A','amplitude (afastamento máximo)','m'],['E','energia da oscilação','J']],n:'O sinal de menos diz que a força aponta sempre de volta para o centro.'}],
 ex:{q:'Um bloco de 0,4 kg preso a uma mola de k = 40 N/m oscila. Qual é o período? (π ≈ 3,14)',s:['T = 2π·√(m/k) = 2π·√(0,4/40).','0,4/40 = 0,01, e √0,01 = 0,1.','T = 2 × 3,14 × 0,1 ≈ <b>0,63 s</b>: cerca de 1,6 oscilação por segundo.']},
 probs:[
  ()=>{ const [m,k]=pick([[.1,10],[.4,10],[.9,10],[.2,20],[1,25],[.5,50],[2,50],[.25,100]]), r=Math.sqrt(m/k), a=2*Math.PI*r;
    return NUM(`Um bloco de <b>${F(m)} kg</b> preso a uma mola de constante <b>${k} N/m</b> oscila. Qual é o período? (π ≈ 3,14)`,a,'s',[`T = 2π·√(m/k) = 2π·√(${F(m)}/${k})`,`√${F(m/k)} = ${F(r)}`,`T = 2 × 3,14 × ${F(r)} ≈ ${F(a)} s`],[[2*Math.PI*Math.sqrt(k/m),'Você inverteu: é √(m/k), com a massa em cima.'],[2*Math.PI*m/k,'Faltou tirar a raiz quadrada.']],'T = 2π·√(m/k).'); },
  ()=>{ const L=pick([.1,.4,.9,1.6,2.5,3.6]), M=pick([.2,1,5]), r=Math.sqrt(L/10), a=2*Math.PI*r;
    return NUM(`Um pêndulo simples tem fio de <b>${F(L)} m</b> e uma bola de <b>${F(M)} kg</b>. Qual é o período das pequenas oscilações? (g = 10 m/s²; π ≈ 3,14)`,a,'s',[`A massa não entra: T = 2π·√(L/g)`,`√(${F(L)}/10) = √${F(L/10)} = ${F(r)}`,`T = 2 × 3,14 × ${F(r)} ≈ ${F(a)} s`],[[2*Math.PI*Math.sqrt(10/L),'É √(L/g), com o comprimento em cima.'],[2*Math.PI*L/10,'Faltou tirar a raiz quadrada.']],'A massa da bola não aparece na fórmula.'); },
  ()=>{ const K=pick([4,9,16]), [what,a,tr]=pick([['o comprimento de um pêndulo',Math.sqrt(K),[[K,'O período depende da <b>raiz</b> do comprimento.']]],['a massa presa a uma mola',Math.sqrt(K),[[K,'O período depende da <b>raiz</b> da massa.']]],['a constante de uma mola (mola mais dura)',1/Math.sqrt(K),[[Math.sqrt(K),'Mola mais dura oscila <b>mais rápido</b>: o período diminui.'],[1/K,'Lembre da raiz: T depende de 1/√k.']]]]);
    return NUM(`Se ${what} for multiplicado(a) por <b>${K}</b>, o período fica multiplicado por quanto? (Responda o fator; por exemplo, 0,5 para a metade.)`,a,'',[`T é proporcional a √${what.includes('constante')?'(1/k)':what.includes('massa')?'m':'L'}`,`Fator = ${what.includes('constante')?'1/√'+K:'√'+K} = ${F(a)}`],tr); },
  ()=>{ const N=pick([10,20,30,60]), t=pick([5,15,40,120]);
    return NUM(`Um pêndulo completa <b>${N} oscilações</b> em <b>${t} s</b>. Qual é a frequência?`,N/t,'Hz',[`f = oscilações ÷ tempo = ${N}/${t} = ${F(N/t)} Hz`,`(O período é T = 1/f = ${F(t/N)} s.)`],[[t/N,'Esse é o período (tempo de uma oscilação). A frequência é o inverso.']]); },
  ()=>{ const k=pick([100,200,400,800]), A=pick([5,10,20]), a=k*(A/100)**2/2;
    return NUM(`Uma mola de constante <b>${k} N/m</b> é esticada <b>${A} cm</b> e solta. Qual é a energia da oscilação?`,a,'J',[`A = ${A} cm = ${F(A/100)} m`,`E = k·A²/2 = ${k} × ${F(A/100)}² / 2 = ${F(a)} J`],[[k*(A/100)**2,'Faltou dividir por 2.'],[k*A*A/2,'Converta a amplitude para metros.']]); },
  POOL([['O período de um pêndulo simples (ângulos pequenos) NÃO depende:',['da massa nem da amplitude','do comprimento do fio','da gravidade do lugar','de nada: é sempre 1 s'],'T = 2π·√(L/g): só comprimento e gravidade.'],
   ['Levado para a Lua (g ≈ 1,6 m/s²), um relógio de pêndulo:',['atrasa, porque o pêndulo oscila mais devagar','adianta','marca a hora certa','para de oscilar'],'g menor deixa o período maior: cada "tique" demora mais.'],
   ['No ponto de maior afastamento de um MHS, a velocidade do corpo é:',['zero, e a energia é toda potencial','máxima','igual à que ele tem no centro','impossível de saber'],'Nos extremos o corpo para por um instante e volta.'],
   ['Na posição de equilíbrio (centro) de um sistema massa-mola, a força da mola é:',['zero, e a velocidade é máxima','máxima','igual ao peso do bloco sempre','máxima e a velocidade é zero'],'F = −k·x com x = 0; é ali que o bloco passa mais rápido.']])],
 traps:['Achar que a massa muda o período do pêndulo.','Esquecer a raiz quadrada: quadruplicar o comprimento só dobra o período.','Confundir período (tempo de uma oscilação) com frequência (oscilações por segundo).'],
 keep:['Mola: T = 2π·√(m/k). Pêndulo: T = 2π·√(L/g).','O período não depende da amplitude; o do pêndulo também não depende da massa.','Nos extremos, v = 0 e a energia é potencial; no centro, v é máxima.']}]);

addLessons('ond','som',[
{id:'estacionarias',t:'Ondas estacionárias: cordas e tubos',min:15,
 idea:`<p>Quando uma onda bate numa extremidade e volta, ela se soma à que está chegando. Em certas frequências as duas formam um padrão que não anda: a <b>onda estacionária</b>. Alguns pontos ficam sempre parados, os <b>nós</b>; outros vibram com a amplitude máxima, os <b>ventres</b>. De um nó ao seguinte há meio comprimento de onda.</p>
 <p>Numa <b>corda presa nas duas pontas</b> (violão, piano) as pontas são nós, então cabem na corda 1, 2, 3… meias ondas: λ = 2L/n e <b>f = n·v/(2L)</b>. O modo n = 1 é o som <b>fundamental</b>; os outros são os <b>harmônicos</b>, e a mistura deles dá o timbre de cada instrumento. Apertar a corda num traste do violão encurta L e deixa a nota mais aguda.</p>
 <p>Nos instrumentos de sopro vibra o ar dentro de um <b>tubo</b>. No <b>tubo aberto</b> as duas pontas são ventres e vale a mesma fórmula da corda. No <b>tubo fechado</b> numa ponta, ela é nó e a outra é ventre: cabem 1, 3, 5… quartos de onda, e só existem <b>harmônicos ímpares</b>, f = n·v/(4L).</p>
 <p>Todo objeto tem frequências naturais como essas. Se for empurrado exatamente numa delas, a amplitude cresce muito: é a <b>ressonância</b>. É ela que faz uma taça estourar com a voz de um cantor, e é por causa dela que engenheiros calculam as frequências de pontes e prédios.</p>`,
 pred:{q:'Você aperta a corda do violão bem no meio e toca. A frequência da nota:',o:['dobra (a nota sobe uma oitava)','cai pela metade','continua igual','quadruplica'],a:0,why:'A corda é a mesma, então a velocidade v da onda nela não muda. Com f = v/(2L), metade do comprimento dá o dobro da frequência: uma oitava acima.'},
 lab:{sim:'harm'},
 tasks:['Na corda, passe do 1º para o 3º modo. Conte os nós e compare as frequências.','Compare o tubo aberto com o fechado de mesmo comprimento: o que acontece com a frequência do 1º modo?','Diminua L. O som fica mais agudo ou mais grave?'],
 f:[{f:'Corda e tubo aberto: f<sub class="up">n</sub> = n·'+frac('v','2L')+'   (n = 1, 2, 3…)',s:[['f<sub>n</sub>','frequência do n-ésimo harmônico','Hz'],['n','número do harmônico',''],['v','velocidade da onda (no tubo, a do som)','m/s'],['L','comprimento da corda ou do tubo','m']],n:'De um nó ao seguinte há meio comprimento de onda.'},
  {f:'Tubo fechado: f<sub class="up">n</sub> = n·'+frac('v','4L')+'   (n = 1, 3, 5…)',n:'Só harmônicos ímpares. O fundamental tem a metade da frequência do de um tubo aberto de mesmo comprimento.'}],
 ex:{q:'Uma corda de violão de 0,65 m vibra no modo fundamental, e as ondas nela viajam a 286 m/s. Qual é a frequência da nota?',s:['No fundamental (n = 1) cabe meia onda na corda: λ = 2L = 1,3 m.','f = v/λ = 286/1,3.','<b>f = 220 Hz</b>: a nota lá, uma oitava abaixo do lá de 440 Hz.']},
 probs:[
  ()=>{ const L=pick([.5,.6,.8,1,1.2]), v=pick([120,240,300,360,480]), n=pick([1,2,3]), a=n*v/(2*L), tr=[[n*v/L,'Na corda presa, o fundamental é meia onda: λ = 2L.']]; if(n>1) tr.push([v/(2*L),'Esse é o fundamental. Multiplique pelo número do harmônico.']);
    return NUM(`Uma corda de <b>${F(L)} m</b>, presa nas duas pontas, vibra no <b>${n}º harmônico</b>. As ondas nela viajam a <b>${v} m/s</b>. Qual é a frequência?`,a,'Hz',[`f<sub>n</sub> = n·v/(2L) = ${n} × ${v} / (2 × ${F(L)})`,`f = ${F(a)} Hz`],tr); },
  ()=>{ const L=pick([.34,.5,.85,1.7]), a=340/(2*L);
    return NUM(`Qual é a frequência fundamental de um tubo <b>aberto nas duas pontas</b> com <b>${F(L)} m</b> de comprimento? (som: 340 m/s)`,a,'Hz',[`Tubo aberto, fundamental: λ = 2L = ${F(2*L)} m`,`f = v/λ = 340/${F(2*L)} = ${F(a)} Hz`],[[340/(4*L),'Esse seria o tubo fechado. No aberto, λ = 2L.'],[340/L,'No fundamental cabe meia onda no tubo: λ = 2L.']]); },
  ()=>{ const L=pick([.17,.25,.34,.5,.85]), n=pick([1,3,5]), a=n*340/(4*L), tr=[[n*340/(2*L),'No tubo fechado, o fundamental tem λ = 4L: use f = n·v/(4L).']]; if(n>1) tr.push([340/(4*L),'Esse é o fundamental. Multiplique pelo número do harmônico.']);
    return NUM(`Um tubo de <b>${F(L)} m</b>, fechado numa ponta, emite o <b>${n}º harmônico</b>. Qual é a frequência? (som: 340 m/s)`,a,'Hz',[`Tubo fechado: f<sub>n</sub> = n·v/(4L) = ${n} × 340 / (4 × ${F(L)})`,`f = ${F(a)} Hz`],tr); },
  ()=>{ const n=pick([2,3,4,6]), L=pick([.6,1.2,1.8,2.4]), a=2*L/n;
    return NUM(`Uma corda de <b>${F(L)} m</b>, presa nas pontas, vibra formando <b>${n} fusos</b> (${n} ventres). Qual é o comprimento de onda?`,a,'m',[`Cada fuso é meia onda: ${n} × λ/2 = ${F(L)}`,`λ = 2 × ${F(L)} / ${n} = ${F(a)} m`],[[L/n,'Cada fuso é <b>meia</b> onda, e não uma onda inteira: λ = 2L/n.']]); },
  POOL([['Um tubo fechado numa ponta pode emitir quais harmônicos?',['só os ímpares (1º, 3º, 5º…)','só os pares','todos','só o fundamental'],'A ponta fechada é nó e a aberta é ventre: cabem 1, 3, 5… quartos de onda.'],
   ['Uma cantora estoura uma taça de cristal com a voz. O fenômeno é:',['ressonância','refração','efeito Doppler','difração'],'A voz tem a frequência natural da taça: a amplitude cresce até o vidro quebrar.'],
   ['Ao apertar a corda do violão num traste que deixa a parte que vibra mais curta, o som fica:',['mais agudo','mais grave','mais forte, com a mesma nota','igual'],'f = v/(2L): L menor, f maior.'],
   ['Numa onda estacionária, a distância entre dois nós vizinhos é:',['meio comprimento de onda','um comprimento de onda','um quarto de comprimento de onda','dois comprimentos de onda'],'Cada fuso, de nó a nó, é meia onda.'],
   ['Uma flauta e um violino tocam a mesma nota. O que faz os sons serem diferentes?',['a mistura de harmônicos, o timbre','a frequência fundamental','a velocidade do som no ar','o comprimento de onda da nota'],'A fundamental é a mesma; o que muda é quanto de cada harmônico aparece.']])],
 traps:['Usar λ = L na corda: no fundamental cabe meia onda, λ = 2L.','Esquecer que o tubo fechado só tem harmônicos ímpares.','Confundir nó (ponto parado) com ventre (vibração máxima).'],
 keep:['Corda e tubo aberto: f = n·v/(2L), n = 1, 2, 3…','Tubo fechado: f = n·v/(4L), só n ímpar.','Ressonância: um corpo excitado na sua frequência natural vibra cada vez mais.']}]);

addLessons('opt',null,[
{id:'espectro',t:'Luz e espectro eletromagnético',min:13,
 idea:`<p>A luz é uma <b>onda eletromagnética</b>: um campo elétrico e um campo magnético que oscilam juntos e se sustentam, sem precisar de meio material. No vácuo, todas as ondas eletromagnéticas viajam à mesma velocidade, <b>c = 3×10⁸ m/s</b>, e por isso vale <b>c = λ·f</b>: comprimento de onda menor significa frequência maior.</p>
 <p>O que muda de uma para outra é só a frequência, e essa família inteira forma o <b>espectro eletromagnético</b>: ondas de rádio, micro-ondas, infravermelho, luz visível, ultravioleta, raios X e raios gama. Nossos olhos percebem uma faixa estreitíssima, de cerca de 400 nm (violeta) a 700 nm (vermelho).</p>
 <p>A energia chega em pacotes, os fótons, e cada fóton tem energia proporcional à frequência (você verá E = h·f em Física moderna). Por isso ultravioleta, raios X e raios gama, de frequência alta, conseguem danificar moléculas das células, enquanto ondas de rádio e micro-ondas, por mais intensas, apenas aquecem.</p>`,
 pred:{q:'Qual destas ondas viaja mais rápido no vácuo?',o:['todas viajam à mesma velocidade','os raios X','as ondas de rádio','a luz visível'],a:0,why:'No vácuo, toda onda eletromagnética viaja a c = 3×10⁸ m/s. O que muda de uma para outra é a frequência, e com ela o comprimento de onda.'},
 lab:{sim:'spectrum'},
 tasks:['Vá das ondas de rádio aos raios gama. O que acontece com o comprimento de onda e com a energia de cada fóton?','Encontre a luz visível. Que pedaço da régua ela ocupa?','Qual é o comprimento de onda de um forno de micro-ondas? Compare com o tamanho do forno.'],
 f:[{f:'c = λ·f',s:[['c','velocidade da luz no vácuo: 3×10<sup>8</sup>','m/s'],['λ','comprimento de onda','m'],['f','frequência','Hz']],n:'Em ordem de frequência crescente: rádio, micro-ondas, infravermelho, visível (do vermelho ao violeta), ultravioleta, raios X e gama. Prefixos: n = 10⁻⁹, M = 10⁶, G = 10⁹.'}],
 ex:{q:'Um forno de micro-ondas funciona em 2,45 GHz. Qual é o comprimento dessas ondas?',s:['f = 2,45 GHz = 2,45×10⁹ Hz.','λ = c/f = 3×10⁸ / 2,45×10⁹.','<b>λ ≈ 0,12 m = 12 cm</b>.']},
 probs:[
  ()=>{ const [who,num,mul,un]=pick([['uma rádio FM',100,1e6,'MHz'],['uma rádio AM',1,1e6,'MHz'],['um roteador Wi-Fi',5,1e9,'GHz'],['um celular',1.5,1e9,'GHz'],['uma rádio FM',90,1e6,'MHz'],['um radar',10,1e9,'GHz']]), f=num*mul, a=3e8/f;
    return NUM(`${who[0].toUpperCase()+who.slice(1)} transmite em <b>${F(num)} ${un}</b>. Qual é o comprimento de onda? (c = 3×10⁸ m/s)`,a,'m',[`f = ${F(num)} ${un} = ${F(f)} Hz`,`λ = c/f = 3×10⁸ / ${F(f)} = ${F(a)} m`],[[3e8/num,`Converta ${un} para hertz: ${un[0]} = 10<sup>${mul===1e6?6:9}</sup>.`],[f/3e8,'λ = c/f: a velocidade vai em cima.']]); },
  ()=>{ const nm=pick([400,480,500,600,625]), a=3e8/(nm*1e-9);
    return NUM(`Uma luz visível tem comprimento de onda de <b>${nm} nm</b>. Qual é a frequência dela? (c = 3×10⁸ m/s)`,a,'Hz',[`λ = ${nm} nm = ${nm}×10⁻⁹ m`,`f = c/λ = 3×10⁸ / ${nm}×10⁻⁹ = ${F(a)} Hz`],[[3e8/nm,'Converta nanômetros para metros (× 10⁻⁹).']],'Digite em notação científica, como 5e14.'); },
  ()=>{ const [what,d]=pick([['do Sol até a Terra',1.5e11],['da Lua até a Terra',3.84e8],['de um satélite geoestacionário até a Terra',3.6e7],['de Marte até a Terra, no ponto mais próximo',5.4e10]]), a=d/3e8;
    return NUM(`Quanto tempo a luz leva para ir <b>${what}</b>, uma distância de ${F(d)} m? (c = 3×10⁸ m/s)`,a,'s',[`t = d/c = ${F(d)} / 3×10⁸`,`t = ${F(a)} s`],[[d*3e8,'Tempo = distância ÷ velocidade.']]); },
  POOL([['Em ordem crescente de frequência:',['rádio, micro-ondas, luz visível, raios X','raios X, luz visível, micro-ondas, rádio','luz visível, rádio, raios X, micro-ondas','micro-ondas, rádio, raios X, luz visível'],'A frequência cresce do rádio para o gama; o comprimento de onda faz o contrário.'],
   ['Por que o protetor solar precisa barrar o ultravioleta, mas ninguém usa protetor contra o sinal do celular?',['cada fóton de UV tem energia suficiente para danificar células; os de micro-ondas não','o UV é mais rápido que as micro-ondas','o sinal do celular não é onda eletromagnética','o UV tem comprimento de onda maior'],'A energia de cada fóton cresce com a frequência, e o UV tem frequência muito maior.'],
   ['Qual cor visível tem o maior comprimento de onda?',['vermelho','violeta','verde','azul'],'Vermelho fica perto de 700 nm; violeta, perto de 400 nm.'],
   ['O calor que você sente no rosto perto de uma fogueira, sem tocar nela, chega principalmente como:',['radiação infravermelha','ultravioleta','ondas de rádio','raios X'],'Corpos quentes emitem sobretudo infravermelho.'],
   ['A luz, ao contrário do som:',['propaga-se no vácuo','precisa de um meio material','é uma onda longitudinal','viaja a 340 m/s'],'Ondas eletromagnéticas não precisam de meio: é assim que a luz das estrelas chega até nós.']])],
 traps:['Achar que raios X ou gama viajam mais rápido que a luz: no vácuo, todas as ondas eletromagnéticas viajam a c.','Esquecer de converter nm, MHz ou GHz para o SI.','Achar que toda radiação é perigosa: rádio e micro-ondas não danificam as células como o UV e os raios X.'],
 keep:['c = λ·f = 3×10⁸ m/s para toda onda eletromagnética no vácuo.','Rádio → micro-ondas → infravermelho → visível → UV → raios X → gama: frequência e energia crescem.','Visível: de 400 nm (violeta) a 700 nm (vermelho).']}]);

addLessons('mag','magnetismo',[
{id:'campofio',t:'Campo magnético de correntes',min:14,
 idea:`<p>Oersted viu que um fio com corrente desvia a agulha de uma bússola. O campo magnético de um <b>fio reto e longo</b> forma circunferências em volta dele, e o sentido é dado pela <b>regra da mão direita</b>: com o polegar no sentido da corrente, os outros dedos se curvam no sentido do campo.</p>
 <p>A intensidade diminui com a distância: <b>B = μ₀·i/(2π·d)</b>, em que μ₀ = 4π×10⁻⁷ T·m/A é a permeabilidade magnética do vácuo. Dobrar a corrente dobra o campo; dobrar a distância reduz o campo à metade.</p>
 <p>Enrolando o fio, os campos de cada volta se somam. No centro de uma <b>espira</b> circular de raio R, B = μ₀·i/(2R). Dentro de um <b>solenoide</b> (uma bobina comprida) com N espiras num comprimento ℓ, o campo é quase uniforme: B = μ₀·N·i/ℓ. Com um núcleo de ferro dentro, o campo fica centenas de vezes mais forte: é o <b>eletroímã</b> dos guindastes de ferro-velho, das campainhas, dos motores e dos aparelhos de ressonância magnética.</p>`,
 pred:{q:'Uma bússola está perto de um fio com corrente. Você a afasta para o dobro da distância. O campo magnético do fio nesse ponto fica:',o:['com a metade da intensidade','com um quarto da intensidade','com o dobro da intensidade','igual'],a:0,why:'B = μ₀·i/(2π·d): o campo de um fio longo cai com 1/d, e não com 1/d². Dobro da distância, metade do campo.'},
 lab:{sim:'wireB'},
 tasks:['Arraste a sonda para o dobro da distância. O que acontece com B?','Inverta o sentido da corrente. O que muda nas bússolas?','A que distância de um fio com 10 A o campo fica igual ao da Terra (≈ 50 μT)?'],
 f:[{f:'B = '+frac('μ₀·i','2π·d'),s:[['B','campo magnético','T (tesla)'],['μ₀','permeabilidade do vácuo: 4π×10<sup>−7</sup>','T·m/A'],['i','corrente elétrica','A'],['d','distância até o fio','m']],n:'Fio reto e longo. Atalho: μ₀/(2π) = 2×10⁻⁷, então B = 2×10⁻⁷·i/d.'},
  {f:'Espira: B = '+frac('μ₀·i','2R')+'      Solenoide: B = '+frac('μ₀·N·i','ℓ'),n:'R: raio da espira. N: número de espiras do solenoide; ℓ: comprimento dele.'}],
 ex:{q:'Um fio longo conduz 20 A. Qual é o campo magnético a 10 cm dele?',s:['d = 10 cm = 0,1 m.','B = 2×10⁻⁷ × 20 / 0,1.','<b>B = 4×10⁻⁵ T = 40 μT</b>, quase o valor do campo magnético da Terra: por isso uma bússola perto do fio desvia.']},
 probs:[
  ()=>{ const i=pick([2,5,10,20,50]), d=pick([1,2,4,5,10,20]), a=20*i/d;
    return NUM(`Um fio reto e longo conduz <b>${i} A</b>. Qual é o campo magnético a <b>${d} cm</b> dele, em microtesla (μT)?`,a,'μT',[`d = ${d} cm = ${F(d/100)} m`,`B = 2×10⁻⁷ × ${i} / ${F(d/100)} = ${F(a*1e-6)} T`,`B = ${F(a)} μT`],[[.2*i/d,'Converta a distância para metros antes de dividir.'],[2e-7*i*(d/100)*1e6,'A distância <b>divide</b>: mais longe, campo menor.']],'B = 2×10⁻⁷·i/d, com d em metros. 1 μT = 10⁻⁶ T.'); },
  ()=>{ const B0=pick([10,20,40,60]), K=pick([2,3,4]), M=pick([1,2,3]), a=B0*M/K;
    return NUM(`A uma certa distância de um fio, o campo magnético vale <b>${B0} μT</b>. Qual será o campo a uma distância <b>${K} vezes maior</b>${M>1?`, com a corrente <b>${M} vezes maior</b>`:', com a mesma corrente'}?`,a,'μT',[`B é proporcional a i/d`,`B = ${B0} × ${M}/${K} = ${F(a)} μT`],[[B0*M/(K*K),'O campo de um fio cai com 1/d, e não com 1/d².'],[B0*M*K,'Mais longe, o campo <b>diminui</b>.']]); },
  ()=>{ const N=pick([200,500,1000]), l=pick([.1,.2,.5]), i=pick([1,2,5]), a=4*Math.PI*1e-7*N*i/l*1000;
    return NUM(`Um solenoide de <b>${F(l*100)} cm</b> de comprimento tem <b>${N} espiras</b> e conduz <b>${i} A</b>. Qual é o campo magnético dentro dele, em militesla (mT)? (μ₀ = 4π×10⁻⁷ T·m/A; π ≈ 3,14)`,a,'mT',[`B = μ₀·N·i/ℓ = 4π×10⁻⁷ × ${N} × ${i} / ${F(l)}`,`B = ${F(a/1000)} T = ${F(a)} mT`],[[4*Math.PI*1e-4*N*i,'Divida pelo comprimento do solenoide, em metros.']]); },
  ()=>{ const R=pick([2,5,10]), i=pick([1,2,5,10]), a=4*Math.PI*1e-7*i/(2*R/100)*1e6;
    return NUM(`Uma espira circular de raio <b>${R} cm</b> conduz <b>${i} A</b>. Qual é o campo no centro dela, em μT? (μ₀ = 4π×10⁻⁷ T·m/A; π ≈ 3,14)`,a,'μT',[`R = ${F(R/100)} m`,`B = μ₀·i/(2R) = 4π×10⁻⁷ × ${i} / (2 × ${F(R/100)})`,`B = ${F(a)} μT`],[[2*a,'No centro da espira, B = μ₀·i/(2R): faltou o 2 do denominador.'],[a/Math.PI,'Essa é a fórmula do fio reto. Na espira, B = μ₀·i/(2R).']]); },
  POOL([['As linhas do campo magnético de um fio reto e longo com corrente são:',['circunferências em volta do fio','retas que saem do fio','retas paralelas ao fio','espirais que se afastam do fio'],'O campo "abraça" o fio, no sentido dado pela regra da mão direita.'],
   ['Para deixar um eletroímã mais forte, podemos:',['aumentar a corrente ou o número de espiras, ou pôr um núcleo de ferro','diminuir a corrente','desenrolar a bobina','trocar o fio de cobre por um de plástico'],'B = μ₀·N·i/ℓ, e o ferro multiplica o campo.'],
   ['Num fio vertical, a corrente sobe. Olhando de frente, num ponto à direita do fio, o campo magnético aponta:',['para dentro da tela','para fora da tela','para cima','para a direita'],'Polegar para cima: os dedos entram na tela do lado direito do fio e saem do lado esquerdo.'],
   ['Dois fios paralelos com correntes no mesmo sentido:',['se atraem','se repelem','não interagem','giram um em volta do outro'],'Cada fio está no campo do outro e sofre força magnética: correntes de mesmo sentido se atraem.']])],
 traps:['Achar que o campo do fio cai com 1/d², como na gravitação e na lei de Coulomb: cai com 1/d.','Esquecer de passar centímetros para metros.','Confundir as fórmulas do fio (2π·d), da espira (2R) e do solenoide (N/ℓ).'],
 keep:['Fio reto: B = μ₀·i/(2π·d), linhas circulares, regra da mão direita.','Espira: B = μ₀·i/(2R). Solenoide: B = μ₀·N·i/ℓ.','μ₀ = 4π×10⁻⁷ T·m/A, e μ₀/(2π) = 2×10⁻⁷.']}]);

 {t:'mundo',h:'Vetores na sua volta',itens:[['GPS','"Em linha reta" é o módulo da resultante; o trajeto pelas ruas é a soma dos caminhos.'],['Avião com vento lateral','O piloto aponta o nariz um pouco contra o vento para que a resultante siga a rota.'],['Cabo de guerra','Forças opostas se subtraem: ganha quem puxa mais.']]}];

LX.mu.jor=[
 {t:'cena',h:'O carro no piloto automático',p:`<p>Na estrada, o carro ao lado anda no <b>piloto automático</b>: o velocímetro não muda. Onde ele estará daqui a 1 minuto? E daqui a um tempo qualquer?</p><p>Vamos medir e descobrir a regra.</p>`},
 {t:'medir',sim:'mov',cfg:{acc:false},p:'Deixe <b>s₀ = 0</b> e <b>v₀ = 8 m/s</b>. Dê play, <b>pause</b> em momentos diferentes e anote o tempo e a posição. Depois continue e anote de novo.',rec:s=>s.t>.2&&s.p.s0===0&&s.p.v0===8?[s.t,s.x]:null,recMsg:'Use s₀ = 0 e v₀ = 8 m/s, dê play e pause em algum momento.',cols:['tempo (s)','posição (m)'],need:4,dec:1,
  depois:{q:'Olhe a tabela e o gráfico. O que acontece a cada segundo?',o:['o carro anda sempre os mesmos 8 metros','o carro anda cada vez mais','o carro anda cada vez menos'],why:'Os pontos formam uma <b>reta</b>: distâncias iguais em tempos iguais. Esse é o <b>movimento uniforme</b>.'}},
 {t:'deduz',p:'Transforme o que você mediu numa regra.',linhas:[
   {txt:'A cada 1 s, o carro anda v metros. Em 2 s, anda ___',o:['2·v','v²','v/2']},
   {txt:'Em t segundos, anda ___',o:['v·t','v/t','v + t']},
   {txt:'Se ele partiu da posição s₀, depois de t segundos está em s = ___',o:['s₀ + v·t','v·t − s₀','s₀·v·t']}],fim:'s = s₀ + v·t      v = '+frac('Δs','Δt')},
 {t:'lab',sim:'mov',cfg:{acc:false},p:'<b>Desafio:</b> escolha s₀ e v₀ para o carro terminar <b>exatamente em 50 m</b> depois de 10 segundos. Dê play e deixe chegar ao fim.',goal:s=>s.t>=10&&eq(s.p.s0+s.p.v0*10,50),ok:'Qualquer escolha em que s₀ + 10·v = 50 funciona: 0 e 5 m/s, 20 e 3 m/s, −10 e 6 m/s… A fórmula prevê onde o carro vai estar.',dica:'Use a fórmula ao contrário. Com s₀ = 0, qual v faz v·10 = 50?'},
 {t:'q',q:'No gráfico posição × tempo, o que a inclinação da reta mostra?',o:['a velocidade','a posição inicial','o tempo total'],why:'Reta mais inclinada = mais metros por segundo = mais velocidade. Reta deitada = carro parado.'},
 {t:'n',q:'O carro do piloto automático anda a 20 m/s. Quantos metros ele percorre em 1 minuto?',a:1200,u:'m',why:'1 min = 60 s; Δs = v·t = 20 × 60 = 1200 m.',dica:'Passe o minuto para segundos antes.'},
 {t:'mundo',h:'Movimento uniforme na sua volta',itens:[['Esteira do aeroporto','Anda sempre na mesma velocidade: você pode calcular quando chega ao fim.'],['Luz do Sol','Viaja a velocidade constante e leva cerca de 8 minutos para chegar até você.'],['Escada rolante','Velocidade constante. Se você andar em cima dela, as velocidades se somam.']]}];

LX.muv.jor=[
 {t:'cena',h:'O semáforo abriu',p:`<p>O semáforo abre e o carro arranca: o velocímetro vai subindo, <b>0, 7, 14, 21 km/h…</b> a cada segundo.</p><p>Agora a velocidade <b>muda</b>. Como prever onde o carro vai estar?</p>`},
 {t:'medir',sim:'mov',cfg:{acc:true},p:'Coloque <b>v₀ = 0</b> e <b>a = 2 m/s²</b>. Dê play, pause em momentos diferentes e anote o tempo e a <b>velocidade</b>.',rec:s=>s.t>.2&&s.p.v0===0&&s.p.a===2?[s.t,s.v]:null,recMsg:'Use v₀ = 0 e a = 2 m/s², dê play e pause em algum momento.',cols:['tempo (s)','velocidade (m/s)'],need:4,dec:1,
  depois:{q:'O que acontece com a velocidade a cada segundo?',o:['aumenta sempre os mesmos 2 m/s','dobra a cada segundo','fica constante'],why:'A velocidade cresce em linha reta: ganha 2 m/s por segundo. Esse "ganho por segundo" é a <b>aceleração</b>.'}},
 {t:'deduz',p:'Primeiro, a velocidade.',linhas:[
   {txt:'Em cada segundo o carro ganha a. Em t segundos, ganhou ___',o:['a·t','a/t','a + t']},
   {txt:'Se já tinha v₀ no começo: v = ___',o:['v₀ + a·t','a·t − v₀','v₀·a·t']}],fim:'v = v₀ + a·t'},
 {t:'nota',h:'E a distância?',p:`<p>Com velocidade constante, a distância era v·t: a <b>área de um retângulo</b> no gráfico velocidade × tempo (altura v, base t).</p><p>Essa ideia continua valendo: a distância percorrida é sempre a <b>área embaixo da linha</b> do gráfico v × t. Só que agora a linha é inclinada.</p>`},
 {t:'deduz',p:'Partindo do repouso, a linha v × t forma um triângulo de base t e altura a·t.',linhas:[
   {txt:'A área de um triângulo é base × altura ÷ 2 = ___',o:['a·t²/2','a·t','a·t²']},
   {txt:'Se o carro já tinha v₀, soma-se um retângulo de área v₀·t. Então Δs = ___',o:['v₀·t + a·t²/2','v₀ + a·t','a·t²/2 − v₀']}],fim:'s = s₀ + v₀·t + '+frac('a·t²','2')},
 {t:'q',q:'Partindo do repouso, se o tempo dobra, a distância percorrida…',o:['quadruplica','dobra','fica igual','triplica'],why:'O tempo aparece ao quadrado: (2t)² = 4t². Por isso, na freada, o dobro da velocidade exige muito mais espaço.'},
 {t:'lab',sim:'mov',cfg:{acc:true},p:'<b>Desafio:</b> o carro começa a <b>10 m/s</b> e freia. Escolha a aceleração para ele <b>parar exatamente em t = 5 s</b>. Dê play e deixe passar dos 5 s.',goal:s=>s.p.v0===10&&s.p.a===-2&&s.t>=5,ok:'a = −2 m/s²: perde 2 m/s por segundo e zera em 5 s. Frear é acelerar no sentido contrário ao movimento. (Depois dos 5 s ele começaria a andar de ré, porque a aceleração continua.)',dica:'Use v = v₀ + a·t com v = 0: 0 = 10 + a·5.'},
 {t:'n',q:'Um carro a 30 m/s freia com aceleração de −5 m/s². Em quantos segundos ele para?',a:6,u:'s',why:'0 = 30 − 5·t → t = 6 s.',dica:'Parar é v = 0. Use v = v₀ + a·t.'},
 {t:'mundo',h:'Aceleração na sua volta',itens:[['Arrancada no semáforo','Um carro comum chega a 100 km/h em uns 10 s: a ≈ 2,8 m/s².'],['Freada de emergência','Com o dobro da velocidade, o carro precisa de quatro vezes mais distância para parar.'],['Decolagem','O avião acelera na pista até atingir a velocidade de voo.']]}];

LX.queda.jor=[
 {t:'cena',h:'O livro e a folha',p:`<p>Solte um livro e uma folha de papel da mesma altura: o livro chega bem antes. Agora <b>amasse a folha</b> numa bolinha e repita. Chegam quase juntos!</p><p>O que atrapalhava a folha era o <b>ar</b>. E sem ar nenhum?</p>`},
 {t:'lab',sim:'fall',p:'Aqui as bolas caem no <b>vácuo</b>. Uma tem 10 kg e a outra, 0,1 kg: cem vezes menos. <b>Desafio:</b> solte as duas na Terra e veja quem chega primeiro.',goal:s=>s.t>=s.T,ok:'Chegaram <b>juntas</b>. Sem o ar, a massa não muda a queda. Galileu percebeu isso há 400 anos.',dica:'Aperte "Iniciar" e espere as bolas chegarem ao chão.'},
 {t:'medir',sim:'fall',p:'Solte de novo e <b>pause</b> durante a queda, algumas vezes, anotando o tempo e a velocidade.',rec:s=>s.t>.1&&s.t<s.T&&s.p.g===9.8?[s.t,s.v]:null,recMsg:'Na Terra, dê play e pause durante a queda (antes de chegar ao chão).',cols:['tempo (s)','velocidade (m/s)'],need:3,dec:2,
  depois:{q:'Quanto a velocidade aumenta a cada segundo?',o:['cerca de 10 m/s','cerca de 1 m/s','depende do tamanho da bola'],why:'Aumenta 9,8 m/s por segundo, que arredondamos para 10: é a <b>aceleração da gravidade g</b>. A velocidade cresce em linha reta, como no carro que arranca.'}},
 {t:'q',q:'Então a queda livre é qual movimento que você já conhece?',o:['movimento uniformemente variado, com a = g','movimento uniforme','movimento circular'],why:'É um MUV que parte do repouso, com aceleração g. Todas as fórmulas do MUV valem, trocando a por g.'},
 {t:'deduz',p:'Adapte as fórmulas do MUV para uma queda que parte do repouso.',linhas:[
   {txt:'v = v₀ + a·t, com v₀ = 0 e a = g: v = ___',o:['g·t','g/t','g + t']},
   {txt:'Δs = v₀·t + a·t²/2 vira a altura caída: h = ___',o:['g·t²/2','g·t','g·t²']}],fim:'v = g·t      h = '+frac('g·t²','2')},
 {t:'lab',sim:'fall',p:'<b>Desafio:</b> leve a experiência para a <b>Lua</b> e solte da mesma altura.',goal:s=>s.p.g===1.6&&s.t>=s.T,ok:'Na Lua, g = 1,6 m/s², seis vezes menor: a queda demora bem mais. Em 1971 um astronauta soltou um martelo e uma pena lá, e eles chegaram juntos.',dica:'Em "Onde?", escolha Lua e aperte "Iniciar".'},
 {t:'n',q:'Uma pedra cai de um prédio e leva 3 s para chegar ao chão. Qual é a altura do prédio? (g = 10 m/s²)',a:45,u:'m',why:'h = g·t²/2 = 10 × 9 / 2 = 45 m, mais ou menos um prédio de 15 andares.',dica:'h = g·t²/2. Lembre de elevar o tempo ao quadrado.'},
 {t:'mundo',h:'Queda na sua volta',itens:[['Paraquedas','Aumenta muito a resistência do ar, e a queda deixa de ser livre.'],['Gota de chuva','Se caísse no vácuo, chegaria a mais de 300 km/h. O ar a freia para uns 30 km/h.'],['Salto na piscina','De uma plataforma de 10 m você chega à água a uns 14 m/s, cerca de 50 km/h.']]}];

LX.lancamento.jor=[
 {t:'cena',h:'O chute do goleiro',p:`<p>O goleiro chuta a bola para o meio de campo. Se chutar muito baixo, ela bate logo no chão. Muito alto, sobe e cai perto.</p><p>Existe um <b>ângulo ideal</b> para ir mais longe?</p>`},
 {t:'lab',sim:'proj',cfg:{th:30},p:'<b>Desafio:</b> com 20 m/s, encontre o ângulo que faz a bola ir <b>mais longe</b>. Teste vários ângulos e lance cada um até o fim.',goal:s=>s.p.th===45&&s.p.g===10&&s.tr.length>2&&s.y<=0,ok:'<b>45°</b> dá o maior alcance: 40 m. Menos que isso a bola fica pouco tempo no ar; mais que isso ela sobe demais e anda pouco para a frente.',dica:'Compare o alcance nos números à direita. Experimente valores entre 30° e 60°.'},
 {t:'q',q:'Observe as setas durante o voo. O que acontece com a seta vₓ (horizontal)?',o:['não muda: nada empurra a bola para o lado','diminui até zerar no topo','aumenta na descida'],why:'Sem resistência do ar, nenhuma força age na horizontal. Então, na horizontal, a bola faz <b>movimento uniforme</b>. Só a vertical sente a gravidade.'},
 {t:'nota',h:'Dois movimentos ao mesmo tempo',p:'<p>O truque do lançamento é separar a velocidade em duas partes que não se atrapalham: na <b>horizontal</b>, movimento uniforme; na <b>vertical</b>, a mesma queda livre da lição anterior, só que começando para cima.</p>'},
 {t:'deduz',p:'Monte as regras de cada direção.',linhas:[
   {txt:'Horizontal, velocidade constante: x = ___',o:['vₓ·t','vₓ·t²/2','g·t']},
   {txt:'Vertical, a gravidade freia a subida: v<sub>y</sub> = ___',o:['v₀<sub>y</sub> − g·t','v₀<sub>y</sub> + g·t','g·t']},
   {txt:'No ponto mais alto, v<sub>y</sub> = 0. O tempo de subida é t = ___',o:['v₀<sub>y</sub>/g','g/v₀<sub>y</sub>','v₀<sub>y</sub>·g']},
   {txt:'A descida demora o mesmo que a subida. Tempo total no ar = ___',o:['2·v₀<sub>y</sub>/g','v₀<sub>y</sub>/g','v₀<sub>y</sub>/(2g)']}],fim:'x = vₓ·t      t<sub class="up">voo</sub> = '+frac('2·v₀<sub class="up">y</sub>','g')},
 {t:'q',q:'Com a mesma velocidade de lançamento, 30° e 60° dão alcances…',o:['iguais','30° vai mais longe','60° vai mais longe'],why:'Ângulos que somam 90° dão o mesmo alcance: um fica menos tempo no ar mas corre mais na horizontal, o outro o contrário. Confira no laboratório livre.'},
 {t:'n',q:'Uma bola sai com vₓ = 15 m/s e v₀<sub>y</sub> = 20 m/s. A que distância ela cai? (g = 10 m/s²)',a:60,u:'m',why:'Tempo no ar = 2 × 20/10 = 4 s. Alcance = 15 × 4 = 60 m.',dica:'Primeiro o tempo de voo (2·v₀<sub>y</sub>/g), depois x = vₓ·t.'},
 {t:'mundo',h:'Lançamentos na sua volta',itens:[['Arremesso de basquete','Os bons arremessadores lançam num ângulo alto, perto de 50°, para a bola cair "por cima" do aro.'],['Chafariz','Cada jato de água desenha uma parábola.'],['Salto em distância','Os atletas saem a uns 20°: correr rápido rende mais que subir muito.']]}];

LX.mcu.jor=[
 {t:'cena',h:'Acelerando sem acelerar?',p:`<p>Na roda-gigante você gira com velocidade sempre do mesmo tamanho. Mesmo assim, a física diz que você está <b>acelerando</b> o tempo todo.</p><p>Como pode?</p>`},
 {t:'lab',sim:'mcu',cfg:{force:false},p:'Observe a seta azul, a velocidade. <b>Desafio:</b> faça a bola dar <b>uma volta por segundo</b> (período T = 1 s) e dê play.',goal:s=>eq(s.p.T,1)&&s.playing,ok:'Veja a seta azul: ela tem sempre o mesmo tamanho, mas <b>muda de direção</b> a cada instante.',dica:'Arraste "Período T" até 1 s e aperte "Iniciar".'},
 {t:'q',q:'Velocidade é um vetor. Se a direção dela muda o tempo todo, então…',o:['existe aceleração, mesmo com a velocidade do mesmo tamanho','não existe aceleração, porque o velocímetro não muda','a bola está freando'],why:'Aceleração é qualquer mudança da velocidade, no tamanho <b>ou na direção</b>. No círculo, essa aceleração aponta para o centro: é a <b>aceleração centrípeta</b> (seta roxa).'},
 {t:'deduz',p:'Quanto vale a velocidade na volta?',linhas:[
   {txt:'Numa volta, a bola percorre o comprimento da circunferência: ___',o:['2πR','πR²','R']},
   {txt:'Ela gasta um período T nessa volta. Então v = ___',o:['2πR/T','T/(2πR)','2πR·T']}],fim:'v = '+frac('2πR','T')+'      f = '+frac('1','T')},
 {t:'lab',sim:'mcu',cfg:{force:false},p:'Anote a aceleração centrípeta com R = 1,5 m e T = 2 s. <b>Desafio:</b> depois, mantenha o raio e faça a bola girar com o <b>dobro da velocidade</b>.',goal:s=>eq(s.p.R,1.5)&&eq(s.p.T,1),ok:'Com o dobro da velocidade (T de 2 s para 1 s), a aceleração ficou <b>4 vezes maior</b>: cerca de 59 contra 15 m/s².',dica:'Dobrar a velocidade é dar a volta na metade do tempo.'},
 {t:'q',q:'Dobrar a velocidade quadruplicou a aceleração. Então a aceleração depende de…',o:['v² (a velocidade ao quadrado)','v','da massa da bola'],why:'Com geometria dá para mostrar que a = v²/R. Curva mais fechada (R menor) ou mais rápida pede mais aceleração.'},
 {t:'n',q:'Uma roda-gigante de raio 20 m dá uma volta em 2 minutos (120 s). Qual é a velocidade de quem está nela? (π ≈ 3,14)',a:2*Math.PI*20/120,u:'m/s',why:'v = 2πR/T = 2 × 3,14 × 20 / 120 ≈ 1,05 m/s, um passo lento.',dica:'v = 2πR/T, com T em segundos.'},
 {t:'mundo',h:'Círculos na sua volta',itens:[['Máquina de lavar','Na centrifugação o tambor gira muito rápido; a roupa fica, a água escapa pelos furos.'],['Curva de carro','Numa curva fechada em alta velocidade, a aceleração exigida cresce com v².'],['Relógio de ponteiros','O ponteiro dos segundos tem período de 60 s.']]}];

LX.newton.jor=[
 {t:'cena',h:'O ônibus freou',p:`<p>O ônibus freia de repente e seu corpo vai <b>para a frente</b>. Ninguém empurrou você.</p><p>O que aconteceu?</p>`},
 {t:'q',q:'Por que seu corpo foi para a frente?',o:['ele tendia a continuar andando, e o ônibus parou','o ônibus empurrou você para a frente','o motorista acelerou para trás'],why:'É a <b>inércia</b>: sem força, um corpo mantém o movimento que tinha. O ônibus parou, mas você continuou. Quem faz você parar é o cinto ou a barra onde você se segura.'},
 {t:'medir',sim:'block',cfg:{fric:false},p:'Um bloco sem atrito. Deixe a <b>massa em 5 kg</b>, escolha uma força, dê play e anote. Repita com <b>outras forças</b>.',rec:s=>s.t>.3&&s.p.m===5?[s.p.F,s.p.F/5]:null,recMsg:'Use massa de 5 kg e dê play.',cols:['força (N)','aceleração (m/s²)'],need:3,dec:2,
  depois:{q:'Com a massa fixa, se você dobra a força, a aceleração…',o:['dobra','cai pela metade','não muda'],why:'Os pontos formam uma reta que passa pela origem: aceleração <b>proporcional</b> à força.'}},
 {t:'medir',sim:'block',cfg:{fric:false},p:'Agora deixe a <b>força em 40 N</b> e mude a <b>massa</b>. Dê play e anote a cada massa.',rec:s=>s.t>.3&&s.p.F===40?[s.p.m,40/s.p.m]:null,recMsg:'Use força de 40 N e dê play.',cols:['massa (kg)','aceleração (m/s²)'],need:3,dec:2,
  depois:{q:'Com a força fixa, se você dobra a massa, a aceleração…',o:['cai pela metade','dobra','não muda'],why:'Mais massa, mais difícil de acelerar: a aceleração é <b>inversamente proporcional</b> à massa. Massa mede a inércia.'}},
 {t:'deduz',p:'Junte as duas descobertas.',linhas:[
   {txt:'a cresce com F e diminui com m. Então a = ___',o:['F/m','F·m','m/F']},
   {txt:'Multiplicando os dois lados por m: F = ___',o:['m·a','a/m','m + a']},
   {txt:'Com m em kg e a em m/s², a força sai em newtons: 1 N = 1 kg·___',o:['m/s²','m/s','m']}],fim:'F<sub class="up">R</sub> = m·a'},
 {t:'lab',sim:'block',cfg:{fric:false},p:'<b>Desafio:</b> faça um bloco de <b>10 kg</b> ter aceleração de <b>3 m/s²</b> e dê play.',goal:s=>s.p.m===10&&s.p.F===30&&s.t>.3,ok:'F = m·a = 10 × 3 = 30 N. A fórmula que você montou funciona.',dica:'Use F = m·a para descobrir a força.'},
 {t:'n',q:'Você empurra um carrinho de supermercado de 20 kg com 30 N, sem atrito. Qual é a aceleração?',a:1.5,u:'m/s²',why:'a = F/m = 30/20 = 1,5 m/s².'},
 {t:'mundo',h:'Newton na sua volta',itens:[['Cinto de segurança','Numa batida o carro para, mas você continua: o cinto aplica a força que te freia.'],['Toalha puxada da mesa','Puxando rápido, os pratos quase não se mexem: a inércia os mantém no lugar.'],['Carro cheio x vazio','Com a mesma força do motor, o carro lotado acelera menos: mais massa.']]}];

LX.forcas.jor=[
 {t:'cena',h:'Mais pesado no elevador?',p:`<p>Quando o elevador começa a subir, você sente as pernas mais "pesadas". Quando começa a descer, sente um frio na barriga, como se ficasse mais leve.</p><p>Seu peso mudou mesmo?</p>`},
 {t:'lab',sim:'elev',p:'A pessoa de 60 kg está numa balança dentro do elevador. <b>Desafio:</b> coloque a aceleração em <b>zero</b> (elevador parado ou em velocidade constante).',goal:s=>s.p.a===0,ok:'Com aceleração zero, a balança marca <b>60 kg</b>. A balança mede a força com que empurra você, a <b>normal N</b>, que aqui é igual ao peso.',dica:'Arraste o controle de aceleração até 0.'},
 {t:'lab',sim:'elev',cfg:{a:0},p:'<b>Desafio:</b> faça a balança marcar <b>mais</b> que 60 kg.',goal:s=>s.p.a>0&&s.p.m===60,ok:'Acelerando para cima, a balança empurra você com mais força que o peso. O peso (a Terra puxando) continua o mesmo; o que muda é a normal.',dica:'Tente uma aceleração positiva (para cima).'},
 {t:'q',q:'Quando a balança marca mais que o peso, a força resultante na pessoa aponta…',o:['para cima, porque N é maior que P','para baixo','para lugar nenhum: é zero'],why:'N − P é a resultante. Se N > P, ela aponta para cima, e é isso que acelera a pessoa para cima.'},
 {t:'lab',sim:'elev',cfg:{a:0},p:'<b>Desafio:</b> faça a balança marcar <b>zero</b>.',goal:s=>s.p.a<=-10,ok:'Com aceleração de −10 m/s² o elevador está em <b>queda livre</b>: você e a balança caem juntos e ela não empurra nada. Os astronautas em órbita "flutuam" pelo mesmo motivo.',dica:'Qual aceleração tem um corpo em queda livre?'},
 {t:'deduz',p:'Monte a fórmula da balança.',linhas:[
   {txt:'Na pessoa agem N (para cima) e P (para baixo). A resultante é ___',o:['N − P','N + P','P']},
   {txt:'Pela 2ª lei: N − P = ___',o:['m·a','0','m·g']},
   {txt:'Como P = m·g: N = ___',o:['m·(g + a)','m·g − a','m·a']}],fim:'N = m·(g + a)'},
 {t:'q',q:'A Terra puxa você com 600 N. Pela 3ª lei (ação e reação), você puxa a Terra com…',o:['600 N, para cima','0 N','bem menos que 600 N, porque a Terra é enorme'],why:'Ação e reação têm sempre o <b>mesmo tamanho</b> e sentidos opostos, e agem em corpos diferentes. A Terra quase não se mexe porque a massa dela é gigantesca, não porque a força seja menor.'},
 {t:'n',q:'Uma pessoa de 50 kg está num elevador que acelera para cima a 2 m/s². Quanto a balança marca, em kg? (g = 10 m/s²)',a:60,u:'kg',why:'N = m·(g + a) = 50 × 12 = 600 N. A balança divide por 10 e mostra 60 kg.',dica:'Calcule N = m·(g + a) e divida por g.'},
 {t:'mundo',h:'Ação e reação na sua volta',itens:[['Andar','Seu pé empurra o chão para trás; o chão empurra você para a frente.'],['Foguete','Empurra os gases para baixo; os gases empurram o foguete para cima.'],['Montanha-russa','O "frio na barriga" na descida é a normal diminuindo.']]}];

LX.atrito.jor=[
 {t:'cena',h:'O armário pesado',p:`<p>Você empurra um armário e ele <b>não se mexe</b>. Empurra mais forte, mais forte… e de repente ele "desgruda". Depois disso, fica mais fácil mantê-lo andando.</p><p>Quem estava segurando o armário?</p>`},
 {t:'lab',sim:'block',cfg:{fric:true},p:'<b>Desafio:</b> com a massa de 5 kg e μₑ = 0,5, aumente a força <b>aos poucos</b> até o bloco começar a andar. Deixe o play ligado.',goal:s=>s.p.m===5&&eq(s.p.ue,.5)&&s.v>.01,ok:'Ele só andou quando a força passou de <b>25 N</b>. Antes disso, o atrito cresceu junto com a sua força e o segurou.',dica:'Dê play e vá subindo a força devagar, olhando a seta do atrito.'},
 {t:'q',q:'Com o bloco parado e uma força de 10 N empurrando, quanto vale o atrito?',o:['10 N, igual à força','25 N, o máximo','0 N, porque nada se mexe'],why:'O atrito estático é "esperto": vale exatamente o necessário para impedir o movimento, até um limite máximo. Passou do limite, o bloco escorrega.'},
 {t:'deduz',p:'De que depende esse limite?',linhas:[
   {txt:'Superfícies mais apertadas uma contra a outra "grudam" mais. O atrito máximo cresce com a ___',o:['normal N','velocidade','área de contato']},
   {txt:'Cada par de superfícies tem seu coeficiente μ. O atrito máximo parado é ___',o:['μₑ·N','N/μₑ','μₑ + N']},
   {txt:'Andando, o atrito é o cinético: Fat = ___',o:['μ<sub>c</sub>·N','μₑ·N','zero']}],fim:'Fat<sub class="up">máx</sub> = μₑ·N      Fat<sub class="up">c</sub> = μ<sub class="up">c</sub>·N'},
 {t:'q',q:'Por que é mais fácil manter o armário andando do que tirá-lo do lugar?',o:['porque μ cinético é menor que μ estático','porque a normal diminui','porque a massa diminui'],why:'Parado, as superfícies se "encaixam" melhor. Em movimento, o atrito cai para μ<sub>c</sub>·N, que é menor.'},
 {t:'n',q:'Uma caixa de 40 kg está num piso com μₑ = 0,5. Qual é a menor força horizontal que a coloca em movimento? (g = 10 m/s²)',a:200,u:'N',why:'N = P = 400 N; Fat máx = 0,5 × 400 = 200 N. Qualquer força acima disso a tira do lugar.',dica:'Primeiro a normal (igual ao peso aqui), depois μₑ·N.'},
 {t:'mundo',h:'Atrito na sua volta',itens:[['Freio ABS','Evita que a roda trave: rolando, o pneu usa o atrito estático, que é maior.'],['Tênis de basquete','A sola de borracha tem μ alto, para não escorregar nas mudanças de direção.'],['Andar no gelo','μ muito baixo: não há atrito suficiente para empurrar o chão para trás.']]}];

LX.plano.jor=[
 {t:'cena',h:'A ladeira',p:`<p>Numa rua muito íngreme, uma caixa solta escorrega; numa rampa suave, ela fica parada.</p><p>O que muda quando a rampa fica mais inclinada?</p>`},
 {t:'q',q:'Aumentando a inclinação, a parte do peso que puxa a caixa ladeira abaixo…',o:['aumenta','diminui','não muda'],why:'Numa rampa deitada, o peso só aperta a caixa contra o chão. Numa parede vertical, o peso inteiro puxa para baixo. Entre os dois, a parte "ladeira abaixo" vai crescendo.'},
 {t:'lab',sim:'incl',p:'<b>Desafio:</b> com μ = 0,5, encontre o <b>menor ângulo</b> em que o bloco escorrega.',goal:s=>eq(s.p.mu,.5)&&s.p.th===27&&s.def.phys(s).slides,ok:'Começa a escorregar em 27°. Nesse ângulo, a parte do peso ladeira abaixo passa a ser maior que o atrito máximo.',dica:'Coloque μ em 0,5 e vá aumentando o ângulo de grau em grau, olhando a mensagem no canto do desenho.'},
 {t:'deduz',p:'O peso se divide em duas partes, como um vetor com componentes.',linhas:[
   {txt:'Ao longo da rampa: P·sen θ. Contra a rampa: ___',o:['P·cos θ','P·tg θ','P']},
   {txt:'A rampa empurra de volta a parte que a aperta: N = ___',o:['P·cos θ','P','P·sen θ']},
   {txt:'Sem atrito, a força que acelera é m·g·sen θ. Então a = ___',o:['g·sen θ','g','g·cos θ']}],fim:'a = g·sen θ   (sem atrito)      N = P·cos θ'},
 {t:'q',q:'Sem atrito, um bloco de 2 kg e um de 10 kg descem a mesma rampa. Qual acelera mais?',o:['os dois igual','o de 10 kg','o de 2 kg'],why:'a = g·sen θ não tem massa. É o mesmo motivo pelo qual a queda livre não depende da massa: a rampa é uma "queda livre diluída".'},
 {t:'n',q:'Uma rampa de 30° não tem atrito. Qual é a aceleração de um bloco que desce por ela? (sen 30° = 0,5; g = 10 m/s²)',a:5,u:'m/s²',why:'a = g·sen θ = 10 × 0,5 = 5 m/s², metade da queda livre.'},
 {t:'mundo',h:'Rampas na sua volta',itens:[['Rampa de acessibilidade','A norma limita a inclinação a cerca de 5° para a cadeira de rodas subir e descer com segurança.'],['Estrada de serra','O zigue-zague diminui a inclinação: a subida fica mais longa, mas exige menos força.'],['Escorregador','Mais inclinado, mais rápido: a = g·(sen θ − μ·cos θ).']]}];

LX.centripeta.jor=[
 {t:'cena',h:'A corda arrebentou',p:`<p>Você gira uma bolinha presa num barbante, em círculo. De repente o barbante arrebenta.</p><p>Para onde a bolinha vai?</p>`},
 {t:'aposta',q:'Faça sua aposta: a bolinha sai…',o:['em linha reta, na direção em que estava indo (tangente ao círculo)','em linha reta para fora, afastando-se do centro','continuando a curva por um tempo']},
 {t:'lab',sim:'mcu',cfg:{force:true},p:'<b>Desafio:</b> dê play e <b>corte a corda</b>.',goal:s=>s.free,ok:'A bolinha sai pela <b>tangente</b>, em linha reta: inércia. Sem a corda, nada muda a direção dela.',dica:'Aperte "Iniciar" e depois o botão "Cortar a corda".'},
 {t:'q',q:'Então, enquanto girava, quem mudava a direção da bolinha o tempo todo?',o:['a corda, puxando para o centro','uma força para fora, a "centrífuga"','a própria velocidade'],why:'Só existe uma força horizontal: a tração da corda, apontando para o <b>centro</b>. É ela a <b>força centrípeta</b>. A sensação de ser jogado para fora é só a sua inércia.'},
 {t:'deduz',p:'Use a 2ª lei com a aceleração do círculo.',linhas:[
   {txt:'Da lição anterior, a aceleração no círculo é a = ___',o:['v²/R','v·R','R/v²']},
   {txt:'Pela 2ª lei, F = m·a. Então a força centrípeta é F = ___',o:['m·v²/R','m·v·R','m·R/v']}],fim:'F<sub class="up">c</sub> = '+frac('m·v²','R')},
 {t:'q',q:'Numa curva, o carro dobra a velocidade. A força de atrito que os pneus precisam fazer…',o:['quadruplica','dobra','fica igual'],why:'F cresce com v². É por isso que curvas fechadas têm placa de velocidade máxima.'},
 {t:'n',q:'Um carro de 1000 kg faz uma curva de raio 50 m a 10 m/s. Qual força centrípeta os pneus fazem?',a:2000,u:'N',why:'F = m·v²/R = 1000 × 100 / 50 = 2000 N, feita pelo atrito entre os pneus e o asfalto.'},
 {t:'mundo',h:'Força centrípeta na sua volta',itens:[['Curva de carro','Quem segura o carro na curva é o atrito dos pneus. Na pista molhada ele diminui, e o carro "sai pela tangente".'],['Satélites e a Lua','A gravidade da Terra é a força centrípeta que os mantém em órbita.'],['Globo da morte','A moto fica "grudada" na parede porque a parede faz a força centrípeta.']]}];

/* =====================================================================
   Exemplos animados — Ferramentas, Cinemática e Dinâmica

LX.grandezas.exa={q:'Um carro anda a <b>90 km/h</b>. Quanto é isso em m/s?',sim:'conv',set:{v:90},ty:58,passos:[
 {txt:'Em 1 hora o carro anda 90 km. Em metros: 90 × 1000 = <b>90 000 m</b>.',tags:[['90 km = 90 000 m','ink']]},
 {txt:'1 hora tem 60 × 60 = <b>3600 s</b>.',tags:[['1 h = 3600 s','ink']]},
 {txt:'90 000 m em 3600 s: em cada segundo, 90 000 ÷ 3600 = <b>25 m</b>. Veja a bandeira do 1º segundo cair nos 25 m.',ask:{q:'Quantos metros o carro anda em 1 segundo?',a:25,u:'m'},ate:1,tags:[['em 1 s: 25 m','vel']]},
 {txt:'Atalho: 90 ÷ 3,6 = <b>25 m/s</b>. Dá o mesmo porque 3600 ÷ 1000 = 3,6. Em 4 s o carro cruza os 100 m.',ate:4,tags:[['90 km/h = 25 m/s','force']]}]};

LX.potencias.exa={q:'Calcule <b>(3 × 10⁸) × (2 × 10⁻³)</b>. Por exemplo: a luz anda 3×10⁸ m por segundo; quanto ela anda em 2 milissegundos?',sim:'pow10',set:{e:8},ty:176,passos:[
 {txt:'3 × 10⁸ m é a distância que a luz percorre em 1 segundo: quase a distância até a Lua (10⁸ na régua).',set:{e:8},tags:[['10⁸ m','vel']]},
 {txt:'2 × 10⁻³ s são 2 milissegundos, um piscar muito rápido.',set:{e:-3},tags:[['10⁻³','force']]},
 {txt:'Multiplique os números da frente: 3 × 2 = <b>6</b>.',ask:{q:'Quanto é 3 × 2?',a:6}},
 {txt:'Some os expoentes: 8 + (−3) = <b>5</b>. Resultado: <b>6 × 10⁵ m</b>, 600 km, mais ou menos de São Paulo ao Rio.',ask:{q:'Qual é o expoente final? (8 + (−3))',a:5},set:{e:5},tags:[['6 × 10⁵ m ≈ São Paulo–Rio','ok']]}]};

LX.vetores.exa={q:'Duas cordas puxam uma caixa com forças <b>perpendiculares</b> de 6 N e 8 N. Qual é a força resultante? (cada quadrinho do desenho vale 2 N)',sim:'vec',set:{m:'s'},fn:s=>{ s.A=[3,0]; s.B=[0,4]; },tx:.68,ty:24,passos:[
 {txt:'A seta A (6 N) aponta para a direita: 3 quadrinhos. A seta B (8 N) aponta para cima: 4 quadrinhos.',tags:[['A = 6 N, B = 8 N','ink']]},
 {txt:'Encaixando B na ponta de A, as duas formam os catetos de um triângulo retângulo. A resultante R é a hipotenusa.'},
 {txt:'R = √(6² + 8²) = √(36 + 64) = √100 = <b>10 N</b>.',ask:{q:'Qual é o módulo da resultante?',a:10,u:'N'},tags:[['R = 10 N (5 quadrinhos)','acc']]},
 {txt:'Repare: <b>não</b> é 6 + 8 = 14 N. Só dá 14 se as cordas puxarem para o mesmo lado. Agora com as duas para a direita:',fn:s=>{ s.A=[3,0]; s.B=[4,0]; },tags:[['mesma direção: R = 14 N','force']]}]};

LX.mu.exa={q:'Um ciclista passa pelo marco <b>20 m</b> da ciclovia andando a <b>6 m/s</b>, sem mudar a velocidade. Onde ele estará 5 s depois?',sim:'mov',cfg:{acc:false},set:{s0:20,v0:6},ty:150,passos:[
 {txt:'Dados: s₀ = 20 m e v = 6 m/s. Velocidade constante: movimento uniforme. Repare no rastro: um carro por segundo, sempre igualmente espaçados.',ate:2,tags:[['s₀ = 20 m · v = 6 m/s','ink']]},
 {txt:'Em 5 s ele anda Δs = v·t = 6 × 5 = <b>30 m</b>.',ask:{q:'Quantos metros ele anda em 5 s?',a:30,u:'m'},ate:5,tags:[['em 5 s andou 30 m','vel']]},
 {txt:'Posição: s = s₀ + v·t = 20 + 30 = <b>50 m</b>.',ask:{q:'Em que marco ele está?',a:50,u:'m'},tags:[['s = 50 m','acc']]},
 {txt:'A mesma regra prevê qualquer instante: em 10 s, s = 20 + 60 = 80 m. No gráfico s × t, uma reta.',ate:10,tags:[['t = 10 s → s = 80 m','acc']]}]};

LX.muv.exa={q:'Um carro a <b>20 m/s</b> (72 km/h) freia com aceleração de <b>−5 m/s²</b>. Quanto tempo leva para parar e quanto anda até parar?',sim:'mov',cfg:{acc:true},set:{s0:0,v0:20,a:-5},ty:150,passos:[
 {txt:'Frear = perder velocidade: a cada segundo, 5 m/s a menos. Veja 1 s de freada: a velocidade caiu de 20 para 15 m/s.',ate:1,tags:[['t = 1 s: v = 15 m/s','acc']]},
 {txt:'Parar é v = 0. Pela função da velocidade: 0 = 20 − 5·t → <b>t = 4 s</b>.',ask:{q:'Em quantos segundos o carro para?',a:4,u:'s'},ate:4,tags:[['parou em t = 4 s','force']]},
 {txt:'A distância é a área do triângulo no gráfico v × t: base 4 s, altura 20 m/s → 4 × 20 / 2 = <b>40 m</b>.',ask:{q:'Quantos metros ele andou freando?',a:40,u:'m'},tags:[['Δs = 40 m','vel']]},
 {txt:'Confira com Torricelli: 0² = 20² + 2·(−5)·Δs → 0 = 400 − 10·Δs → Δs = 40 m. Com o dobro da velocidade, seriam 160 m!'}]};

LX.queda.exa={q:'Uma pedra é solta do alto de um prédio e leva <b>3 s</b> para chegar ao chão. Qual a altura do prédio e a velocidade ao tocar o solo? (g = 10 m/s²)',sim:'fall',set:{h:45,g:10},tx:.72,ty:22,passos:[
 {txt:'Solta do repouso: a cada segundo, a velocidade aumenta 10 m/s. Depois de 1 s: v = 10 m/s e caiu h = 10 × 1²/2 = 5 m.',ate:1,tags:[['t = 1 s: caiu 5 m, v = 10 m/s','acc']]},
 {txt:'Depois de 2 s: v = 20 m/s e h = 10 × 2²/2 = 20 m. A distância cresce com o quadrado do tempo.',ate:2,tags:[['t = 2 s: caiu 20 m, v = 20 m/s','acc']]},
 {txt:'Em 3 s: h = g·t²/2 = 10 × 9 / 2 = <b>45 m</b>, um prédio de uns 15 andares.',ask:{q:'Qual é a altura do prédio?',a:45,u:'m'},ate:3,tags:[['h = 45 m','force']]},
 {txt:'Velocidade ao chegar: v = g·t = 10 × 3 = <b>30 m/s</b>, ou 108 km/h.',ask:{q:'Com que velocidade a pedra chega ao chão?',a:30,u:'m/s'},tags:[['v = 30 m/s = 108 km/h','vel']]}]};

LX.lancamento.exa={q:'Um chute sai a <b>25 m/s</b> fazendo 37° com o chão (cos 37° = 0,8; sen 37° = 0,6). Quanto tempo a bola fica no ar e a que distância cai?',sim:'proj',cfg:{th:35},set:{v0:25,th:36.87,g:10},ty:22,passos:[
 {txt:'Separe a velocidade: vₓ = 25 × 0,8 = <b>20 m/s</b> (horizontal) e v₀<sub>y</sub> = 25 × 0,6 = <b>15 m/s</b> (vertical).',tags:[['vₓ = 20 m/s · v₀y = 15 m/s','ink']]},
 {txt:'Na vertical a gravidade tira 10 m/s por segundo: v<sub>y</sub> zera em 15/10 = <b>1,5 s</b>. É o topo do voo.',ask:{q:'Em quantos segundos a bola chega ao ponto mais alto?',a:1.5,u:'s'},ate:1.5,tags:[['topo em t = 1,5 s','acc']]},
 {txt:'A descida demora o mesmo que a subida: tempo total no ar = <b>3 s</b>.',ask:{q:'Quanto tempo a bola fica no ar?',a:3,u:'s'},ate:3,tags:[['no ar por 3 s','acc']]},
 {txt:'Na horizontal ela andou o tempo todo a 20 m/s: alcance = 20 × 3 = <b>60 m</b>.',ask:{q:'A que distância a bola cai?',a:60,u:'m'},tags:[['alcance = 60 m','vel']]}]};

LX.mcu.exa={q:'Um carrossel de raio <b>3 m</b> dá uma volta a cada <b>6 s</b>. Qual é a velocidade de quem está na borda, e a aceleração centrípeta? (π ≈ 3,14)',sim:'mcu',cfg:{force:false},set:{R:3,T:6},ty:22,passos:[
 {txt:'Numa volta a cadeira percorre o comprimento do círculo: 2πR = 2 × 3,14 × 3 = <b>18,84 m</b>.',ask:{q:'Quantos metros a cadeira anda numa volta?',a:18.84,u:'m'},tags:[['uma volta = 18,84 m','vel']]},
 {txt:'Essa volta leva 6 s. Veja uma volta completa.',ate:6,tags:[['T = 6 s','ink']]},
 {txt:'v = 2πR/T = 18,84/6 ≈ <b>3,14 m/s</b>.',ask:{q:'Qual é a velocidade?',a:3.14,u:'m/s'},tags:[['v ≈ 3,14 m/s','vel']]},
 {txt:'Aceleração para o centro: a = v²/R = 3,14²/3 ≈ <b>3,3 m/s²</b>. É ela que muda a direção da velocidade o tempo todo.',ask:{q:'Qual é a aceleração centrípeta?',a:3.29,u:'m/s²',tol:.03},ate:9,tags:[['a ≈ 3,3 m/s² (para o centro)','acc']]}]};

LX.newton.exa={q:'Duas crianças brincam com um carrinho de <b>20 kg</b>: uma empurra com <b>70 N</b> para a frente e a outra segura com <b>30 N</b> para trás. Qual é a aceleração? (sem atrito)',sim:'block',cfg:{fric:false},set:{m:20,F:40},tx:.36,ty:24,passos:[
 {txt:'As duas forças estão na mesma direção, em sentidos opostos: a resultante é 70 − 30 = <b>40 N</b> para a frente.',ask:{q:'Qual é a força resultante?',a:40,u:'N'},tags:[['70 N − 30 N = 40 N','force']]},
 {txt:'Pela 2ª lei: a = F<sub>R</sub>/m = 40/20 = <b>2 m/s²</b>.',ask:{q:'Qual é a aceleração?',a:2,u:'m/s²'},ate:1,tags:[['a = 2 m/s²','acc']]},
 {txt:'Com 2 m/s², a cada segundo ele ganha 2 m/s. Depois de 3 s, v = <b>6 m/s</b>. Veja no gráfico, em cima, a reta subindo.',ask:{q:'Qual a velocidade depois de 3 s?',a:6,u:'m/s'},ate:3,tags:[['t = 3 s: v = 6 m/s','acc']]}]};

LX.forcas.exa={q:'Uma pessoa de <b>50 kg</b> está numa balança dentro de um elevador que acelera <b>para baixo a 2 m/s²</b> (por exemplo, começando a descer). Quanto a balança marca?',sim:'elev',set:{m:50,a:-2},tx:.34,ty:22,passos:[
 {txt:'Na pessoa agem o peso P = 50 × 10 = <b>500 N</b> (para baixo) e a normal N da balança (para cima).',ask:{q:'Qual é o peso da pessoa?',a:500,u:'N'},tags:[['P = 500 N','force']]},
 {txt:'Ela acelera para baixo, então N é <b>menor</b> que P. Pela 2ª lei: N − P = m·a → N = 50 × (10 − 2) = <b>400 N</b>.',ask:{q:'Quanto vale a normal N?',a:400,u:'N'},ate:1,tags:[['N = 400 N','vel']]},
 {txt:'A balança divide por g e mostra 400 ÷ 10 = <b>40 kg</b>. É aquele "frio na barriga" de ficar mais leve.',ask:{q:'Quanto a balança marca?',a:40,u:'kg'},tags:[['a balança marca 40 kg','ok']]}]};

LX.atrito.exa={q:'Uma caixa de <b>20 kg</b> está no chão (μₑ = 0,4; μ<sub>c</sub> = 0,3). Você empurra com <b>100 N</b>. Ela se move? Com que aceleração?',sim:'block',cfg:{fric:true},set:{m:20,F:100,ue:.4,uc:.3},tx:.36,ty:24,passos:[
 {txt:'No chão plano, a normal é igual ao peso: N = 20 × 10 = <b>200 N</b>.',ask:{q:'Quanto vale a normal?',a:200,u:'N'},tags:[['N = 200 N','vel']]},
 {txt:'O atrito estático aguenta no máximo μₑ·N = 0,4 × 200 = <b>80 N</b>.',ask:{q:'Qual é o atrito estático máximo?',a:80,u:'N'},tags:[['atrito máximo = 80 N','force']]},
 {txt:'100 N é mais que 80 N: a caixa <b>desgruda e escorrega</b>. Andando, o atrito passa a ser o cinético: 0,3 × 200 = <b>60 N</b>.',ate:.6,tags:[['100 N > 80 N: escorrega!','force'],['atrito cinético = 60 N','force']]},
 {txt:'Resultante: 100 − 60 = 40 N. Aceleração: a = 40/20 = <b>2 m/s²</b>.',ask:{q:'Qual é a aceleração da caixa?',a:2,u:'m/s²'},ate:3,tags:[['a = 2 m/s²','acc']]}]};

LX.plano.exa={q:'Uma caixa de <b>2 kg</b> desce uma rampa de 37° com atrito μ = 0,25. Qual é a aceleração? (sen 37° = 0,6; cos 37° = 0,8)',sim:'incl',set:{th:36.87,m:2,mu:.25},tx:.36,ty:24,passos:[
 {txt:'Peso: P = 2 × 10 = 20 N. A parte que puxa ladeira abaixo é P·sen θ = 20 × 0,6 = <b>12 N</b>.',ask:{q:'Quanto vale P·sen θ?',a:12,u:'N'},tags:[['P·sen θ = 12 N','vel']]},
 {txt:'A parte que aperta a rampa é P·cos θ = 20 × 0,8 = 16 N, e a normal equilibra: N = <b>16 N</b>.',tags:[['N = 16 N','acc']]},
 {txt:'Atrito: μ·N = 0,25 × 16 = <b>4 N</b>, contra o movimento.',ask:{q:'Quanto vale o atrito?',a:4,u:'N'},tags:[['atrito = 4 N','force']]},
