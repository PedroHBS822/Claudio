<title>Física do Zero</title>
<meta name="description" content="Curso interativo de física do ensino médio: preveja, experimente no laboratório, entenda a fórmula e pratique até dominar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Caderno de laboratório: mapa do curso à esquerda, lição numa coluna de leitura, laboratório numa bancada larga */
:root{
  --paper:#f5f7fa; --card:#ffffff; --sunk:#eef2f7; --ink:#152033; --muted:#566277; --line:#d8dfe9; --grid:rgba(20,80,160,.06);
  --accent:#0b7285; --accent-ink:#ffffff; --accent-soft:#dff1f4;
  --vel:#1c6fd1; --force:#d23a2a; --acc:#7c3aed; --energy:#b7791f; --ok:#2b8a3e; --ok-soft:#e3f4e6; --bad:#c92a2a; --bad-soft:#fbe6e6; --warn:#b7791f;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(21,32,51,.06), 0 6px 20px rgba(21,32,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e131a; --card:#151c26; --sunk:#1b2430; --ink:#e5eaf1; --muted:#99a5b7; --line:#283344; --grid:rgba(120,170,255,.05);
  --accent:#3bc9db; --accent-ink:#082a30; --accent-soft:#12343a;
  --vel:#5aa9ff; --force:#ff6b5b; --acc:#b794ff; --energy:#ffc043; --ok:#51cf66; --ok-soft:#173222; --bad:#ff6b6b; --bad-soft:#3a1d1f; --warn:#ffc043;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e131a; --card:#151c26; --sunk:#1b2430; --ink:#e5eaf1; --muted:#99a5b7; --line:#283344; --grid:rgba(120,170,255,.05);
  --accent:#3bc9db; --accent-ink:#082a30; --accent-soft:#12343a;
  --vel:#5aa9ff; --force:#ff6b5b; --acc:#b794ff; --energy:#ffc043; --ok:#51cf66; --ok-soft:#173222; --bad:#ff6b6b; --bad-soft:#3a1d1f; --warn:#ffc043;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:18px 14px 40px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--display);font-size:12px;color:var(--muted);font-weight:500}
.sidenav{display:grid;gap:4px}
.sidebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 4px 14px}
.mod{margin-top:10px}
.mod>h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;font-weight:700}
.lk{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:14.5px;font-weight:500;line-height:1.25}
.lk:hover{background:var(--sunk)}
.lk.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dot.s1{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,var(--card) 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}
.dot.due{border-color:var(--warn);background:var(--warn)}
.main{min-width:0;padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px)}
.topbar{display:none}
.col{max-width:760px;margin:0 auto}
.wide{max-width:1040px;margin:0 auto}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-family:var(--display);font-weight:700;font-size:15.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- início ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:34px}
.hero h1{font-size:clamp(36px,5.2vw,56px);font-weight:800;letter-spacing:-.025em;line-height:1}
.hero h1 span{color:var(--accent)}
.hero p.lead{font-size:19px;color:var(--muted);margin:14px 0 20px;max-width:34em}
.herolab{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 6px;font-family:var(--display)}
.stats div b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stats div span{font-size:13px;color:var(--muted)}
.method{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:10px 0 40px}
.method div{border-top:3px solid var(--accent);padding-top:10px}
.method h3{font-size:17px;margin-bottom:4px}
.method p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;min-width:0}
.mapcard h3{font-size:17px;margin:2px 0 8px}
.mapcard .lk{padding:5px 4px;font-size:14px}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.sech{font-size:26px;margin:0 0 14px;letter-spacing:-.01em}

/* ---------- lição ---------- */
.lhead{margin-bottom:22px}
.lhead h1{font-size:clamp(30px,4.6vw,44px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--display);font-size:13px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--card)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.due{border-color:var(--warn);color:var(--warn)}
.sec{margin:34px 0}
.sec>h2{font-size:22px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec>h2 .n{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose b{font-weight:600}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.pred{background:var(--card);border:1.5px solid var(--accent);border-radius:var(--r);padding:16px}
.pred .q{font-size:18px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--body);font-size:16px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:15.5px;line-height:1.5}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.info{background:var(--sunk);border-left:4px solid var(--accent)}

/* fórmulas */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.fml{font-family:var(--body);font-style:italic;font-size:26px;text-align:center;padding:10px 0 14px;overflow-x:auto;white-space:nowrap}
.fml .up{font-style:normal}
.fml .gap{display:inline-block;width:1.6em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.9em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.sym{width:100%;border-collapse:collapse;font-size:15px}
.sym td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.sym td:first-child{font-style:italic;font-size:18px;width:64px;text-align:center;white-space:nowrap}
.sym td:last-child{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.tblw{overflow-x:auto}

/* exemplo resolvido */
.ex .st{counter-reset:s}
.ex ol{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.ex li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.ex li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;margin-top:2px}

/* prática */
.prac{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.prac .q{font-size:17.5px;margin-bottom:12px}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input{width:180px;max-width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:17px}
.ans .u{font-family:var(--mono);color:var(--muted)}
.streak{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:14px;color:var(--muted);margin-bottom:12px}
.streak i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.streak i.on{background:var(--ok);border-color:var(--ok)}
.sol{margin-top:10px}
.sol ol{margin:6px 0 0;padding-left:22px}
.hint{font-size:15px}
.mastered{display:flex;gap:14px;align-items:center;background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.mastered b{font-family:var(--display);font-size:18px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}

/* laboratório */
.lab{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.labcv{position:relative;background:var(--paper);border-bottom:1px solid var(--line)}
.labcv canvas{display:block;width:100%;touch-action:none}
.labui{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0}
.labui.solo{grid-template-columns:minmax(0,1fr)}
.ctrls{padding:14px 16px;display:grid;gap:12px;align-content:start;border-right:1px solid var(--line)}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-size:14px;font-weight:600}
.ctrl label output{font-family:var(--mono);font-weight:400;color:var(--accent);white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;font-family:var(--display);font-size:13.5px;cursor:pointer}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.reads{padding:14px 16px;display:grid;gap:6px;align-content:start}
.rd{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px;font-size:15px}
.rd span{color:var(--muted);font-family:var(--display);font-size:14px}
.rd b{font-family:var(--mono);font-weight:600;font-size:14.5px;text-align:right}
.labbar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.tasks{margin-top:12px}
.tasks li{margin:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--display);font-size:13px;color:var(--muted);padding:8px 16px 0}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* revisão */
.revlist{display:grid;gap:8px;margin:14px 0}
.empty{color:var(--muted);font-size:16px}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(88vw,330px);z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .brand{padding:0}
  .main{padding-top:18px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .method{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .labui{grid-template-columns:minmax(0,1fr)}
  .ctrls{border-right:0;border-bottom:1px solid var(--line)}
  .method{grid-template-columns:minmax(0,1fr)}
  .fml{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* =====================================================================
   Física do Zero — núcleo: estado, rotas, lição, prática e laboratório
   ===================================================================== */
const MODS=[]; const LES=[]; const LX={}; const SIMS={};
function mod(id,t,sub,lessons){ const m={id,t,sub,lessons}; MODS.push(m); lessons.forEach(l=>{ l.mod=m; l.idx=LES.length; LES.push(l); LX[l.id]=l; }); }

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const R=(a,b,st=1)=>{ const n=Math.round((b-a)/st); return +(a+st*Math.floor(Math.random()*(n+1))).toFixed(6); };
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const NF=new Intl.NumberFormat('pt-BR',{maximumSignificantDigits:3});
function nsig(x,sig){ return new Intl.NumberFormat('pt-BR',{maximumSignificantDigits:sig}).format(x); }
/* número para HTML: 3 algarismos significativos, notação científica quando muito grande ou pequeno */
function nf(x,sig=3){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const a=Math.abs(x);
  if(a>=1e6||a<1e-3){ const e=Math.floor(Math.log10(a)); let m=x/10**e; if(Math.abs(+m.toPrecision(sig))>=10){ m/=10; return nsig(m,sig)+'×10<sup>'+(e+1)+'</sup>'; } return nsig(+m.toPrecision(sig),sig)+'×10<sup>'+e+'</sup>'; }
  return nsig(+x.toPrecision(sig),sig); }
/* o mesmo, em texto puro (para o canvas) */
function nt(x,sig=3){ return nf(x,sig).replace(/<sup>(-?\d+)<\/sup>/,(m,e)=>'^'+e).replace(/\^(-?\d+)/,(m,e)=>[...e].map(c=>SUP[c]).join('')); }
function parseNum(str){ let t=String(str).trim().replace(/\s+/g,'').replace(/[−–]/g,'-');
  if(!t) return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t=t.replace(/\./g,'');
  t=t.replace(',','.').replace(/[x×*·]10\^?\(?(-?\d+)\)?$/i,'e$1').replace(/^10\^\(?(-?\d+)\)?$/,'1e$1');
  return /^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(t)?Number(t):NaN; }
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- progresso (neste navegador) ---------- */
const KEY='fisica_do_zero_v1', DAY=864e5, BOX=[1,3,7,16,35];
let P=(()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
P.l=P.l||{};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
function ls(id){ return P.l[id]||(P.l[id]={s:0,st:0,n:0,c:0,box:0,due:0}); }
const isDue=id=>{ const x=P.l[id]; return !!x&&x.s===2&&x.due<=Date.now(); };
const dueList=()=>LES.filter(l=>isDue(l.id));
const mastered=()=>LES.filter(l=>(P.l[l.id]||{}).s===2).length;
function statusDot(id){ const x=P.l[id]; return `<span class="dot ${isDue(id)?'due':x&&x.s===2?'s2':x&&x.s===1?'s1':''}" aria-hidden="true"></span>`; }
function statusText(id){ const x=P.l[id]; return isDue(id)?'revisão pendente':x&&x.s===2?'dominada':x&&x.s===1?'em andamento':'não iniciada'; }
function nextLesson(){ return LES.find(l=>(P.l[l.id]||{}).s!==2)||LES[0]; }

/* ---------- cores do tema, lidas dos tokens CSS ---------- */
const COL={};
function readCols(){ const cs=getComputedStyle(document.documentElement);
  ['paper','card','sunk','ink','muted','line','accent','vel','force','acc','energy','ok','bad'].forEach(k=>COL[k]=cs.getPropertyValue('--'+k).trim()); }
readCols();
const LIVE=new Set();
function themeChanged(){ readCols(); LIVE.forEach(s=>s.render()); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged); }catch(e){}
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});

/* ---------- desenho ---------- */
function G(ctx,W,H){ const g={ctx,W,H,
  font(sz=13,kind='display',bold=false){ ctx.font=`${bold?'700 ':'500 '}${sz}px ${kind==='mono'?'"JetBrains Mono", ui-monospace, monospace':'"Bricolage Grotesque", system-ui, sans-serif'}`; },
  text(t,x,y,o={}){ g.font(o.size||13,o.mono?'mono':'display',o.bold); ctx.fillStyle=o.c||COL.ink; ctx.textAlign=o.align||'left'; ctx.textBaseline=o.base||'alphabetic'; ctx.fillText(t,x,y); },
  line(x1,y1,x2,y2,c=COL.ink,w=2,dash){ ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=w; if(dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); },
  poly(pts,c=COL.ink,w=2,fill,close){ if(pts.length<2) return; ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); if(close) ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(c){ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.stroke(); } ctx.restore(); },
  circle(x,y,r,fill,stroke,w=2){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=w; ctx.stroke(); } },
  rect(x,y,w,h,fill,stroke,r=0,lw=2){ ctx.beginPath(); if(ctx.roundRect&&r) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); } },
  arrow(x1,y1,x2,y2,c,label,w=3,lpos){ const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy); if(L<2) return; const ux=dx/L,uy=dy/L,hs=Math.min(11,L*.45);
    ctx.save(); ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-ux*hs*.8,y2-uy*hs*.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-ux*hs-uy*hs*.55,y2-uy*hs+ux*hs*.55); ctx.lineTo(x2-ux*hs+uy*hs*.55,y2-uy*hs-ux*hs*.55); ctx.closePath(); ctx.fill(); ctx.restore();
    if(label){ const lx=x2+ux*12+(lpos||[0,0])[0], ly=y2+uy*12+(lpos||[0,0])[1]; g.text(label,lx,ly,{c,size:13,bold:true,align:ux<-.3?'right':ux>.3?'left':'center',base:'middle'}); } },
  /* gráfico: caixa (x,y,w,h), faixas xr/yr, séries [{pts:[[x,y]...],c}] */
  plot(x,y,w,h,o){ const xr=o.xr,yr=o.yr; const X=v=>x+(v-xr[0])/(xr[1]-xr[0])*w, Y=v=>y+h-(v-yr[0])/(yr[1]-yr[0])*h;
    g.rect(x,y,w,h,COL.card,COL.line,0,1);
    const tk=(a,b)=>{ const span=b-a, raw=span/4, p=10**Math.floor(Math.log10(raw)), m=raw/p, st=(m<1.5?1:m<3?2:m<7?5:10)*p; const out=[]; for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st) out.push(+v.toFixed(10)); return out; };
    tk(xr[0],xr[1]).forEach(v=>{ g.line(X(v),y,X(v),y+h,COL.line,1); g.text(nt(v),X(v),y+h+14,{c:COL.muted,size:11,align:'center',mono:true}); });
    tk(yr[0],yr[1]).forEach(v=>{ g.line(x,Y(v),x+w,Y(v),COL.line,1); g.text(nt(v),x-5,Y(v)+4,{c:COL.muted,size:11,align:'right',mono:true}); });
    if(yr[0]<0&&yr[1]>0) g.line(x,Y(0),x+w,Y(0),COL.muted,1.2);
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    (o.series||[]).forEach(se=>{ if(se.fill){ const pts=se.pts.map(p=>[X(p[0]),Y(p[1])]); if(pts.length>1){ pts.push([pts[pts.length-1][0],Y(0)],[pts[0][0],Y(0)]); g.poly(pts,null,0,se.fill,true); } }
      g.poly(se.pts.map(p=>[X(p[0]),Y(p[1])]),se.c,se.w||2.5); if(se.dot&&se.pts.length){ const p=se.pts[se.pts.length-1]; g.circle(X(p[0]),Y(p[1]),4.5,se.c); } });
    ctx.restore();
    if(o.xl) g.text(o.xl,x+w,y+h+28,{c:COL.muted,size:12,align:'right'});
    if(o.yl) g.text(o.yl,x+4,y-7,{c:COL.muted,size:12});
    return {X,Y}; },
  ground(y){ g.line(0,y,W,y,COL.muted,2); ctx.save(); ctx.strokeStyle=COL.line; ctx.lineWidth=1; for(let i=-20;i<W;i+=12){ ctx.beginPath(); ctx.moveTo(i,y+10); ctx.lineTo(i+10,y); ctx.stroke(); } ctx.restore(); }
 }; return g; }

/* ---------- laboratório genérico ---------- */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function Sim(host,def){
  const s={p:{},t:0,playing:false,def}; (def.ctrls||[]).forEach(c=>s.p[c.k]=c.v);
  const ctrlHTML=(def.ctrls||[]).map(c=>c.opts
    ?`<div class="ctrl"><label>${c.l}</label><div class="seg" role="group" aria-label="${c.l}">${c.opts.map(o=>`<button type="button" data-k="${c.k}" data-v="${o[0]}" class="${o[0]===c.v?'on':''}">${o[1]}</button>`).join('')}</div></div>`
    :`<div class="ctrl"><label for="${host.id}-${c.k}"><span>${c.l}</span><output id="${host.id}-${c.k}-o">${fmtC(c,c.v)}</output></label><input type="range" id="${host.id}-${c.k}" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.v}"></div>`).join('');
  host.innerHTML=`<div class="lab"><div class="labcv"><canvas aria-label="${esc(def.alt||'Simulação')}" role="img"></canvas></div>${def.legend?`<div class="legend">${def.legend.map(([c,t])=>`<span><i style="background:var(--${c})"></i>${t}</span>`).join('')}</div>`:''}<div class="labui${ctrlHTML||def.drag?'':' solo'}">${ctrlHTML||def.drag?`<div class="ctrls">${ctrlHTML||'<p class="eyebrow" style="margin:0">Arraste os elementos no desenho</p>'}</div>`:''}<div class="reads" aria-live="polite"></div></div>${def.anim?`<div class="labbar"><button class="btn sm" type="button" data-act="play">▶ Iniciar</button><button class="btn sm ghost" type="button" data-act="reset">↺ Reiniciar</button>${(def.btns||[]).map((b,i)=>`<button class="btn sm ghost" type="button" data-act="x${i}">${b.l}</button>`).join('')}</div>`:(def.btns?`<div class="labbar">${def.btns.map((b,i)=>`<button class="btn sm ghost" type="button" data-act="x${i}">${b.l}</button>`).join('')}</div>`:'')}</div>`;
  const cv=$('canvas',host), ctx=cv.getContext('2d'), rdEl=$('.reads',host); let lastR='';
  function fmtC(c,v){ return c.f?c.f(v):(nsig(v,4)+(c.u?' '+c.u:'')); }
  function size(){ const w=cv.clientWidth||600; const h=typeof def.h==='function'?def.h(w):(def.h||300); cv.style.height=h+'px'; const d=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(w*d); cv.height=Math.round(h*d); ctx.setTransform(d,0,0,d,0,0); s.W=w; s.H=h; }
  s.render=()=>{ if(!s.W) return; ctx.clearRect(0,0,s.W,s.H); def.draw(G(ctx,s.W,s.H),s); if(def.reads){ const r=def.reads(s).map(([a,b])=>`<div class="rd"><span>${a}</span><b>${b}</b></div>`).join(''); if(r!==lastR){ rdEl.innerHTML=r; lastR=r; } } };
  s.reset=()=>{ s.t=0; s.playing=false; setPlay(); def.init&&def.init(s); s.render(); };
  let raf=0,last=0;
  function frame(now){ raf=0; const dt=Math.min(.05,(now-last)/1000||0); last=now; if(s.playing){ const k=def.speed||1, n=def.sub||1; for(let i=0;i<n;i++){ def.step(s,dt*k/n); s.t+=dt*k/n; } } s.render(); if(s.playing) raf=requestAnimationFrame(frame); }
  s.play=on=>{ s.playing=on; setPlay(); if(on&&!raf){ last=performance.now(); raf=requestAnimationFrame(frame); } };
  function setPlay(){ const b=$('[data-act=play]',host); if(b) b.textContent=s.playing?'❚❚ Pausar':(s.t>0?'▶ Continuar':'▶ Iniciar'); }
  host.addEventListener('input',e=>{ const k=e.target.dataset.k; if(!k) return; const c=def.ctrls.find(x=>x.k===k); s.p[k]=+e.target.value; $(`#${host.id}-${k}-o`).textContent=fmtC(c,s.p[k]); if(c.live){ def.onParam&&def.onParam(s,k); s.render(); } else s.reset(); });
  host.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!host.contains(b)) return;
    if(b.dataset.k){ const k=b.dataset.k,c=def.ctrls.find(x=>x.k===k); const raw=b.dataset.v; s.p[k]=isNaN(+raw)?raw:+raw; $$(`button[data-k="${k}"]`,host).forEach(x=>x.classList.toggle('on',x===b)); if(c.live){ def.onParam&&def.onParam(s,k); s.render(); } else s.reset(); return; }
    const a=b.dataset.act; if(a==='play'){ if(!s.playing&&def.done&&def.done(s)) s.reset(); s.play(!s.playing); } else if(a==='reset') s.reset(); else if(a&&a[0]==='x'){ def.btns[+a.slice(1)].f(s); s.render(); } });
  if(def.drag){ const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }; let dragging=false;
    cv.addEventListener('pointerdown',e=>{ const [x,y]=pos(e); if(def.drag.down(s,x,y)){ dragging=true; cv.setPointerCapture(e.pointerId); s.render(); e.preventDefault(); } });
    cv.addEventListener('pointermove',e=>{ if(!dragging) return; const [x,y]=pos(e); def.drag.move(s,x,y); s.render(); });
    const up=()=>{ if(dragging){ dragging=false; def.drag.up&&def.drag.up(s); s.render(); } }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.style.cursor='grab'; }
  new ResizeObserver(()=>{ size(); if(def.onResize) def.onResize(s); s.render(); }).observe(cv);
  size(); def.init&&def.init(s); LIVE.add(s); s.render();
  if(def.anim&&def.autoplay&&!REDUCED) s.play(true);
  s.dispose=()=>{ s.playing=false; LIVE.delete(s); };
  return s; }

function formulaCard(f){ return `<div class="fcard"><div class="fml">${f.f.replace(/ {3,}/g,'<span class="gap"></span>')}</div>${f.s?`<div class="tblw"><table class="sym"><tbody>${f.s.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]||''}</td></tr>`).join('')}</tbody></table></div>`:''}${f.n?`<p style="margin:10px 0 0;font-size:15px;color:var(--muted)">${f.n}</p>`:''}</div>`; }

/* ---------- prática ---------- */
function Practice(host,lessons,o={}){
  let cur=null,curL=null,tries=0,lastGen=-1,done=false;
  const needed=3;
  function streakHTML(){ if(o.review) return `<div class="streak">Revisão · ${esc(curL.t)}</div>`; const st=ls(curL.id).st; return `<div class="streak"><span>Acertos seguidos:</span>${[0,1,2].map(i=>`<i class="${i<Math.min(st,needed)?'on':''}"></i>`).join('')}<span>${ls(curL.id).s===2?'lição dominada':'3 seguidos para dominar'}</span></div>`; }
  function next(){
    if(o.queue){ if(!o.queue.length){ host.innerHTML=o.onEmpty?o.onEmpty():''; return; } curL=o.queue.shift(); }
    else curL=lessons[0];
    let gi; do{ gi=Math.floor(Math.random()*curL.probs.length); }while(curL.probs.length>1&&gi===lastGen); lastGen=gi;
    cur=curL.probs[gi](); tries=0; done=false;
    if(cur.o){ const order=shuffle(cur.o.map((_,i)=>i)); cur.opts=order.map(i=>cur.o[i]); cur.ai=order.indexOf(cur.a||0); }
    draw(); }
  function draw(){
    const q=cur, id=host.id;
    host.innerHTML=`<div class="prac">${streakHTML()}<div class="q">${q.q}</div>${q.o
      ?`<div class="opts">${q.opts.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCDE'[i]}</span><span>${t}</span></button>`).join('')}</div>`
      :`<form class="ans" autocomplete="off"><label class="sr" for="${id}-in" style="position:absolute;left:-9999px">Sua resposta</label><input id="${id}-in" inputmode="decimal" placeholder="sua resposta" aria-label="Sua resposta"><span class="u">${q.u||''}</span><button class="btn" type="submit">Verificar</button>${q.hint?`<button class="btn ghost sm" type="button" data-act="hint">Dica</button>`:''}</form><p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)">Use vírgula ou ponto para decimais. Notação científica: 3e8 ou 3x10^8.</p>`}<div class="fbx"></div></div>`;
    const inp=$('input',host); if(inp&&o.focus!==false) inp.focus({preventScroll:true});
  }
  function solHTML(){ return cur.sol?`<div class="sol"><b>Resolução</b><ol>${cur.sol.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:''; }
  function finish(ok,msg){
    done=true; const x=ls(curL.id); x.n++; if(ok&&tries===1) x.c++;
    if(o.review){ if(ok&&tries===1){ x.box=Math.min(BOX.length-1,x.box+1); x.due=Date.now()+BOX[x.box]*DAY; } else { x.box=0; x.due=Date.now()+DAY; } }
    else { if(x.s===0) x.s=1; x.st=ok&&tries===1?x.st+1:0; if(x.st>=needed&&x.s!==2){ x.s=2; x.box=0; x.due=Date.now()+BOX[0]*DAY; msg+=`<div class="mastered"><div style="font-size:30px" aria-hidden="true">★</div><div><b>Lição dominada!</b><br><span style="font-size:15px">Ela volta na revisão amanhã, depois em 3, 7, 16 e 35 dias. É assim que o conteúdo passa para a memória de longo prazo.</span></div></div>`; } }
    save(); o.onChange&&o.onChange();
    $('.fbx',host).innerHTML=msg+`<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="next">${o.queue&&!o.queue.length?'Concluir':'Próxima questão'} →</button></div>`;
    $$('.opt',host).forEach(b=>b.disabled=true); const f=$('form',host); if(f) $$('input,button',f).forEach(b=>b.disabled=true);
    const s=$('.streak',host); if(s) s.outerHTML=streakHTML(); $('[data-act=next]',host).focus({preventScroll:true});
  }
  host.addEventListener('submit',e=>{ e.preventDefault(); if(done) return; const v=parseNum($('input',host).value); const fb=$('.fbx',host);
    if(isNaN(v)){ fb.innerHTML=`<div class="fb info">Digite só o número (a unidade já está indicada ao lado). Exemplo: 12,5</div>`; return; }
    tries++; const tol=cur.tol||.02, near=(a,b)=>Math.abs(a-b)<=Math.max(tol*Math.abs(b),1e-9);
    if(near(v,cur.a)) return finish(true,`<div class="fb ok"><b>${tries===1?'Isso!':'Agora sim.'}</b> ${nf(cur.a)} ${cur.u||''}.${tries>1?' Como precisou de uma segunda tentativa, a sequência recomeça.':''}</div>`+solHTML());
    const trap=(cur.traps||[]).find(t=>near(v,t[0]));
    if(tries===1){ fb.innerHTML=`<div class="fb bad"><b>Ainda não.</b> ${trap?trap[1]:(cur.hint||'Confira as unidades e refaça a conta.')} Tente de novo.</div>`; $('input',host).select(); return; }
    finish(false,`<div class="fb bad"><b>A resposta é ${nf(cur.a)} ${cur.u||''}.</b> ${trap?trap[1]:''}</div>`+solHTML()); });
  host.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.act==='next') return next();
    if(b.dataset.act==='hint'){ $('.fbx',host).innerHTML=`<div class="fb info hint"><b>Dica:</b> ${cur.hint}</div>`; return; }
    if(b.dataset.i!=null&&!done){ const i=+b.dataset.i; tries++; const ok=i===cur.ai;
      if(ok||tries>=2||cur.opts.length<=2){ $$('.opt',host).forEach((x,j)=>{ if(j===cur.ai) x.classList.add('right'); else if(j===i) x.classList.add('wrong'); });
        return finish(ok,`<div class="fb ${ok?'ok':'bad'}"><b>${ok?(tries===1?'Isso!':'Agora sim.'):'Não é essa.'}</b> ${cur.why||''}</div>`+solHTML()); }
      b.classList.add('wrong'); b.disabled=true; $('.fbx',host).innerHTML=`<div class="fb bad"><b>Ainda não.</b> ${(cur.w&&cur.w[cur.o.indexOf(cur.opts[i])])||'Releia a pergunta e pense no que o laboratório mostrou.'} Tente outra alternativa.</div>`; } });
  next(); return {next}; }

  ${l.traps?`<section class="sec prose">${H('Erros comuns')}<ul>${l.traps.map(t=>`<li>${t}</li>`).join('')}</ul></section>`:''}
  ${l.keep?`<section class="sec prose">${H('Para lembrar')}<div class="note"><ul style="margin:0">${l.keep.map(t=>`<li>${t}</li>`).join('')}</ul></div></section>`:''}
  <nav class="navrow" aria-label="Navegação entre lições">${prev?`<a class="btn ghost" href="#${prev.id}">← ${esc(prev.t)}</a>`:'<span></span>'}${next?`<a class="btn" href="#${next.id}">${esc(next.t)} →</a>`:`<a class="btn" href="#">Voltar ao início</a>`}</nav></article>`; }

function mountLesson(l){
  SIMNOW.push(SIMS[l.lab.sim]($('#lab'),l.lab.cfg||{}));
  const pr=$('#pred'); if(pr){ const x=ls(l.id);
    const reveal=()=>{ $$('.opt',pr).forEach((b,j)=>{ b.disabled=true; if(j===l.pred.a) b.classList.add('right'); else if(j===x.pr) b.classList.add('wrong'); }); $('.pfb',pr).innerHTML=`<div class="fb ${x.pr===l.pred.a?'ok':'info'}"><b>${x.pr===l.pred.a?'Previsão certa.':'A resposta é '+'ABCD'[l.pred.a]+'.'}</b> ${l.pred.why}</div>`; };
    const pend=()=>{ $$('.opt',pr).forEach((b,j)=>{ b.disabled=true; b.classList.toggle('pick',j===x.pr); }); $('.pfb',pr).innerHTML=`<div class="fb info">Previsão anotada. Agora confira no laboratório abaixo e depois veja a resposta.<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-rev="1">Ver a resposta</button></div></div>`; };
    if(x.pr!=null) (x.prr?reveal:pend)();
    pr.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.p!=null&&x.pr==null){ x.pr=+b.dataset.p; save(); pend(); } else if(b.dataset.rev){ x.prr=1; save(); reveal(); } }); }
  const ex=$('.ex'); if(ex){ let k=0; const ol=$('ol',ex), bt=$('[data-ex]',ex);
    bt.addEventListener('click',()=>{ if(k<l.ex.s.length){ ol.insertAdjacentHTML('beforeend',`<li><span>${l.ex.s[k]}</span></li>`); k++; } bt.textContent=k<l.ex.s.length?'Próximo passo':'Pronto'; if(k>=l.ex.s.length) bt.disabled=true; }); }
  Practice($('#prac'),[l],{onChange:renderSide,focus:false});
}

function viewReview(){ const d=dueList();
  return `<div class="col"><p class="eyebrow">Revisão espaçada</p><h1 style="font-size:40px;margin:6px 0 10px">Revisão de hoje</h1>
  <p style="color:var(--muted)">Uma questão de cada lição que está na hora de relembrar, misturadas. Acertar de primeira empurra a próxima revisão para mais longe; errar traz a lição de volta amanhã.</p>
  ${d.length?`<div class="revlist">${d.map(l=>`<a class="lk" href="#${l.id}">${statusDot(l.id)}<span>${l.t}</span></a>`).join('')}</div><div id="rev"></div>`
   :`<div class="note"><p class="empty" style="margin:0">Nenhuma revisão pendente. ${mastered()?'As lições dominadas voltam aqui quando chegar a hora.':'Domine uma lição (3 acertos seguidos) e ela aparece aqui no dia seguinte.'}</p><div class="row" style="margin-top:12px"><a class="btn" href="#${nextLesson().id}">Ir para: ${esc(nextLesson().t)}</a></div></div>`}</div>`; }

function route(){
  disposeSims(); const h=location.hash.slice(1), main=$('#main');
  if(h==='revisao'){ main.innerHTML=viewReview(); const d=dueList(); if(d.length) Practice($('#rev'),d,{review:true,queue:shuffle(d),onChange:renderSide,onEmpty:()=>`<div class="mastered"><div style="font-size:30px" aria-hidden="true">★</div><div><b>Revisão concluída.</b><br><span style="font-size:15px">Volte amanhã para a próxima rodada.</span></div></div>`}); }
  else if(LX[h]){ const l=LX[h]; main.innerHTML=viewLesson(l); mountLesson(l); P.last=h; save(); }
  else { main.innerHTML=viewHome(); SIMNOW.push(SIMS.proj($('#herolab'),{hero:true})); }
  renderSide(); closeSide(); window.scrollTo(0,0); document.title=LX[h]?`${LX[h].t} · Física do Zero`:'Física do Zero'; }
function closeSide(){ $('#side').classList.remove('open'); const sc=$('.scrim'); if(sc) sc.remove(); }
function boot(){
  document.body.insertAdjacentHTML('afterbegin',`<div class="app"><aside class="side" id="side" aria-label="Mapa do curso"></aside><div style="min-width:0"><div class="topbar"><a class="brand" href="#"><b>Física do Zero</b></a><button class="btn sm ghost" type="button" id="menu" aria-controls="side">Lições</button></div><main class="main" id="main"></main></div></div>`);
  $('#menu').addEventListener('click',()=>{ $('#side').classList.add('open'); document.body.insertAdjacentHTML('beforeend','<div class="scrim"></div>'); $('.scrim').addEventListener('click',closeSide); });
  addEventListener('hashchange',route); route(); }

/* =====================================================================

const GRAV=10;

/* km/h ↔ m/s: o carro anda o que a velocidade diz, segundo a segundo */
SIMS.conv=(host)=>Sim(host,{alt:'Carro percorrendo uma pista de 100 metros com marcas a cada segundo',anim:true,h:210,
  ctrls:[{k:'v',l:'Velocidade',min:0,max:180,step:1,v:72,u:'km/h'}],
  init(s){ s.x=0; s.marks=[]; },
  step(s,dt){ const ms=s.p.v/3.6; const before=Math.floor(s.t); s.x+=ms*dt; if(Math.floor(s.t+dt)>before) s.marks.push(s.x); if(s.x>=100){ s.x=100; s.play(false); } },
  done:s=>s.x>=100,
  draw(g,s){ const L=24,Rr=g.W-24,y=130,k=(Rr-L)/100,X=m=>L+m*k;
    g.text(`${nt(s.p.v)} km/h  =  ${nt(s.p.v/3.6)} m/s`,g.W/2,34,{size:20,bold:true,align:'center'});
    g.text('dividir por 3,6 transforma km/h em m/s',g.W/2,56,{size:13,c:COL.muted,align:'center'});
    g.ground(y+16); for(let m=0;m<=100;m+=10){ g.line(X(m),y+16,X(m),y+24,COL.muted,1.5); g.text(m+' m',X(m),y+40,{size:11,c:COL.muted,align:'center',mono:true}); }
    s.marks.forEach((m,i)=>{ g.line(X(m),y-24,X(m),y+14,COL.vel,1.5,[3,3]); g.text((i+1)+' s',X(m),y-30,{size:11,c:COL.vel,align:'center',mono:true}); });
    const cx=X(s.x); g.rect(cx-30,y-14,34,20,COL.vel,null,5); g.rect(cx-22,y-24,20,12,COL.vel,null,4); g.circle(cx-22,y+8,5,COL.ink); g.circle(cx-3,y+8,5,COL.ink); },
  reads:s=>[['Em km/h',nt(s.p.v)+' km/h'],['Em m/s',nt(s.p.v/3.6)+' m/s'],['A cada segundo anda',nt(s.p.v/3.6)+' m'],['Tempo para 100 m',s.p.v?nt(100/(s.p.v/3.6))+' s':'—']]});

/* potências de 10: régua logarítmica do átomo à galáxia */
const SCALE=[[-10,'átomo','1×10⁻¹⁰ m'],[-7,'vírus','1×10⁻⁷ m'],[-5,'célula humana','1×10⁻⁵ m'],[-4,'espessura de um fio de cabelo','1×10⁻⁴ m'],[-3,'grão de areia','1×10⁻³ m'],[-2,'largura de um dedo','1×10⁻² m'],[0,'uma criança','1 m'],[2,'campo de futebol','1×10² m'],[5,'São Paulo–Rio (360 km)','3,6×10⁵ m'],[7,'diâmetro da Terra','1,3×10⁷ m'],[8,'distância Terra–Lua','3,8×10⁸ m'],[9,'diâmetro do Sol','1,4×10⁹ m'],[11,'distância Terra–Sol','1,5×10¹¹ m'],[16,'um ano-luz','9,5×10¹⁵ m'],[21,'diâmetro da Via Láctea','1×10²¹ m']];
const PREF={'-9':'nano (n)','-6':'micro (μ)','-3':'mili (m)','-2':'centi (c)','3':'quilo (k)','6':'mega (M)','9':'giga (G)','12':'tera (T)'};
SIMS.pow10=(host)=>Sim(host,{alt:'Régua de potências de 10 com objetos do átomo à galáxia',h:230,
  ctrls:[{k:'e',l:'Expoente (10ⁿ metros)',min:-10,max:21,step:1,v:0,f:v=>'10'+[...String(v)].map(c=>SUP[c]).join('')+' m',live:true}],
  draw(g,s){ const L=20,Rr=g.W-20,y=120,X=e=>L+(e+10)/31*(Rr-L), e=s.p.e;
    g.line(L,y,Rr,y,COL.muted,2); for(let k=-10;k<=21;k++){ g.line(X(k),y-(k%5?5:9),X(k),y+(k%5?5:9),COL.muted,1.2); if(k%5===0) g.text('10'+[...String(k)].map(c=>SUP[c]).join(''),X(k),y+26,{size:12,c:COL.muted,align:'center',mono:true}); }
    SCALE.forEach(o=>g.circle(X(o[0]),y,4,o[0]===e?COL.force:COL.card,COL.ink,1.5));
    g.circle(X(e),y,9,null,COL.accent,3);
    const near=SCALE.reduce((a,b)=>Math.abs(b[0]-e)<Math.abs(a[0]-e)?b:a);
    g.text('10'+[...String(e)].map(c=>SUP[c]).join('')+' m',g.W/2,40,{size:24,bold:true,align:'center',mono:true});
    g.text(`objeto mais próximo dessa ordem: ${near[1]} (${near[2]})`,g.W/2,64,{size:13.5,c:COL.muted,align:'center'});
    g.text('cada tracinho = 10 vezes maior que o anterior',g.W/2,g.H-18,{size:12,c:COL.muted,align:'center'}); },
  reads:s=>{ const e=s.p.e; const dec=e>=0?(e<=9?(10**e).toLocaleString('pt-BR')+' m':'1 seguido de '+e+' zeros'):(e>=-6?'0,'+'0'.repeat(-e-1)+'1 m':'0,000…1 ('+(-e)+' casas)'); return [['Notação científica','1×10<sup>'+e+'</sup> m'],['Escrito por extenso',dec],['Prefixo do SI',PREF[e]||'—'],['Objeto dessa ordem',SCALE.reduce((a,b)=>Math.abs(b[0]-e)<Math.abs(a[0]-e)?b:a)[1]]]; }});

/* vetores: arraste as pontas */
SIMS.vec=(host)=>Sim(host,{alt:'Dois vetores arrastáveis e a resultante',h:w=>Math.min(360,Math.max(280,w*.55)),
  legend:[['vel','vetor A'],['force','vetor B'],['acc','resultante R']],
  ctrls:[{k:'m',l:'Operação',opts:[['s','R = A + B'],['d','R = A − B']],v:'s',live:true}],
  init(s){ if(!s.A){ s.A=[4,1]; s.B=[1,3]; } },
  geo(s){ const u=Math.min(34,s.W/16), O=[s.W*.22,s.H*.78]; return {u,O,P:v=>[O[0]+v[0]*u,O[1]-v[1]*u]}; },
  drag:{ down(s,x,y){ const {P}=s.def.geo(s); const A=s.A, Bt=s.p.m==='s'?[A[0]+s.B[0],A[1]+s.B[1]]:[A[0]-s.B[0],A[1]-s.B[1]]; const pa=P(A),pb=P(Bt);
      s.dr=Math.hypot(x-pb[0],y-pb[1])<22?'B':Math.hypot(x-pa[0],y-pa[1])<22?'A':null; return !!s.dr; },
    move(s,x,y){ const {u,O}=s.def.geo(s); const v=[Math.round((x-O[0])/u*2)/2,Math.round((O[1]-y)/u*2)/2];
      if(s.dr==='A') s.A=v; else { s.B=s.p.m==='s'?[v[0]-s.A[0],v[1]-s.A[1]]:[s.A[0]-v[0],s.A[1]-v[1]]; } } },
  draw(g,s){ const {u,O,P}=s.def.geo(s); const A=s.A,B=s.p.m==='s'?s.B:[-s.B[0],-s.B[1]],Rv=[A[0]+B[0],A[1]+B[1]];
    for(let x=O[0]%u;x<g.W;x+=u) g.line(x,0,x,g.H,COL.line,.6); for(let y=O[1]%u;y<g.H;y+=u) g.line(0,y,g.W,y,COL.line,.6);
    g.line(0,O[1],g.W,O[1],COL.muted,1.2); g.line(O[0],0,O[0],g.H,COL.muted,1.2); g.text('x',g.W-12,O[1]-6,{c:COL.muted}); g.text('y',O[0]+6,12,{c:COL.muted});
    const pr=P(Rv); g.line(pr[0],pr[1],pr[0],O[1],COL.acc,1.2,[4,4]); g.line(pr[0],pr[1],O[0],pr[1],COL.acc,1.2,[4,4]);
    g.arrow(O[0],O[1],pr[0],pr[1],COL.acc,'R',3.5);
    const pa=P(A); g.arrow(O[0],O[1],pa[0],pa[1],COL.vel,'A',3.5);
    const pb=P([A[0]+B[0],A[1]+B[1]]); g.arrow(pa[0],pa[1],pb[0],pb[1],COL.force,s.p.m==='s'?'B':'−B',3.5);
    g.circle(pa[0],pa[1],7,null,COL.vel,2); g.circle(pb[0],pb[1],7,null,COL.force,2);
    g.text('arraste as bolinhas nas pontas',10,20,{c:COL.muted,size:12.5}); },
  reads:s=>{ const B=s.p.m==='s'?s.B:[-s.B[0],-s.B[1]], Rv=[s.A[0]+B[0],s.A[1]+B[1]], m=v=>nt(Math.hypot(v[0],v[1])), ang=v=>nt(Math.atan2(v[1],v[0])*180/Math.PI,3)+'°';
    return [['A = (Aₓ, A<sub>y</sub>)',`(${nt(s.A[0])}, ${nt(s.A[1])}) · módulo ${m(s.A)}`],['B',`(${nt(s.B[0])}, ${nt(s.B[1])}) · módulo ${m(s.B)}`],['R (componentes somadas)',`(${nt(Rv[0])}, ${nt(Rv[1])})`],['Módulo de R',m(Rv)],['Ângulo de R com o eixo x',ang(Rv)]]; }});

/* MU e MUV: carro na pista com gráficos s×t e v×t */
SIMS.mov=(host,cfg)=>Sim(host,{alt:'Carro em movimento com gráficos de posição e velocidade',anim:true,h:w=>w<560?420:360,
  legend:[['vel','posição s(t)'],['acc','velocidade v(t) — a área sob a curva é o deslocamento']],
  ctrls:[{k:'s0',l:'Posição inicial s₀',min:-20,max:40,step:5,v:0,u:'m'},{k:'v0',l:'Velocidade inicial v₀',min:-10,max:20,step:1,v:cfg.acc?2:8,u:'m/s'}].concat(cfg.acc?[{k:'a',l:'Aceleração a',min:-4,max:4,step:.5,v:1.5,u:'m/s²'}]:[]),
  init(s){ s.pos=[]; s.vel=[]; const a=s.p.a||0, f=t=>s.p.s0+s.p.v0*t+a*t*t/2; let lo=Infinity,hi=-Infinity; for(let t=0;t<=10;t+=.1){ lo=Math.min(lo,f(t)); hi=Math.max(hi,f(t)); } s.lo=Math.min(lo,0); s.hi=Math.max(hi,10); s.x=s.p.s0; s.v=s.p.v0; s.pos.push([0,s.x]); s.vel.push([0,s.v]); },
  step(s,dt){ const a=s.p.a||0, t=Math.min(10,s.t+dt); s.x=s.p.s0+s.p.v0*t+a*t*t/2; s.v=s.p.v0+a*t; s.pos.push([t,s.x]); s.vel.push([t,s.v]); if(t>=10) s.play(false); },
  done:s=>s.t>=10,
  draw(g,s){ const L=40,Rr=g.W-24,y=56,span=s.hi-s.lo,X=m=>L+(m-s.lo)/span*(Rr-L);
    g.ground(y+14); const st=span>200?50:span>80?20:10; for(let m=Math.ceil(s.lo/st)*st;m<=s.hi;m+=st){ g.line(X(m),y+14,X(m),y+20,COL.muted,1.2); g.text(m+' m',X(m),y+34,{size:10.5,c:COL.muted,align:'center',mono:true}); }
    s.pos.forEach(([t,x],i)=>{ if(i%10===0&&i>0) g.circle(X(x),y+3,2.5,COL.vel); });
    const cx=X(s.x); g.rect(cx-16,y-8,32,18,COL.vel,null,5); g.circle(cx-9,y+11,4,COL.ink); g.circle(cx+9,y+11,4,COL.ink);
    if(Math.abs(s.v)>.05) g.arrow(cx,y-16,cx+clamp(s.v*5,-80,80),y-16,COL.acc,'v',2.5);
    const top=y+62, gh=g.H-top-44, narrow=g.W<560, gw=narrow?g.W-70:(g.W-110)/2;
    const vr=[Math.min(0,s.p.v0,s.p.v0+(s.p.a||0)*10)-1,Math.max(0,s.p.v0,s.p.v0+(s.p.a||0)*10)+1];
    if(narrow){ const h2=(gh-40)/2; g.plot(50,top,gw,h2,{xr:[0,10],yr:[s.lo,s.hi],series:[{pts:s.pos,c:COL.vel,dot:true}],yl:'s (m)'}); g.plot(50,top+h2+40,gw,h2,{xr:[0,10],yr:vr,series:[{pts:s.vel,c:COL.acc,dot:true,fill:COL.acc+'33'}],xl:'t (s)',yl:'v (m/s)'}); }
    else { g.plot(50,top,gw,gh,{xr:[0,10],yr:[s.lo,s.hi],series:[{pts:s.pos,c:COL.vel,dot:true}],xl:'t (s)',yl:'posição s (m)'}); g.plot(100+gw,top,gw,gh,{xr:[0,10],yr:vr,series:[{pts:s.vel,c:COL.acc,dot:true,fill:COL.acc+'33'}],xl:'t (s)',yl:'velocidade v (m/s)'}); } },
  reads:s=>[['Tempo t',nt(Math.min(s.t,10))+' s'],['Posição s',nt(s.x)+' m'],['Velocidade v',nt(s.v)+' m/s'],['Deslocamento Δs = s − s₀',nt(s.x-s.p.s0)+' m']]});

/* queda livre */
const GS=[[9.8,'Terra'],[1.6,'Lua'],[3.7,'Marte'],[24.8,'Júpiter']];
SIMS.fall=(host)=>Sim(host,{alt:'Duas bolas de massas diferentes caindo juntas no vácuo',anim:true,h:360,
  ctrls:[{k:'h',l:'Altura de queda',min:5,max:100,step:5,v:45,u:'m'},{k:'g',l:'Onde?',opts:GS.map(x=>[x[0],x[1]]),v:9.8}],
  init(s){ s.y=0; s.v=0; s.tr=[[0,0]]; s.T=Math.sqrt(2*s.p.h/s.p.g); },
  step(s,dt){ const t=Math.min(s.T,s.t+dt); s.y=s.p.g*t*t/2; s.v=s.p.g*t; s.tr.push([t,s.v]); if(t>=s.T) s.play(false); },
  done:s=>s.t>=s.T,
  draw(g,s){ const top=30,bot=g.H-40,cw=Math.min(210,g.W*.38),k=(bot-top)/s.p.h;
    g.ground(bot+10); for(let m=0;m<=s.p.h;m+=s.p.h>50?20:10){ g.line(cw-12,top+m*k,cw-4,top+m*k,COL.muted,1.2); g.text(nt(s.p.h-m)+' m',cw-16,top+m*k+4,{size:10.5,c:COL.muted,align:'right',mono:true}); }
    const n=Math.floor(Math.min(s.t,s.T)/.5); for(let i=1;i<=n;i++){ const yy=top+s.p.g*(i*.5)**2/2*k; g.circle(cw*.35,yy,5,COL.line); g.circle(cw*.7,yy,3,COL.line); }
    const yy=top+s.y*k; g.circle(cw*.35,yy,11,COL.force); g.circle(cw*.7,yy,6,COL.vel);
    g.text('10 kg',cw*.35,yy-16,{size:10.5,c:COL.muted,align:'center'}); g.text('0,1 kg',cw*.7,yy-12,{size:10.5,c:COL.muted,align:'center'});
    g.text('marcas a cada 0,5 s',8,g.H-12,{size:11,c:COL.muted});
    const vmax=s.p.g*s.T; g.plot(cw+50,top,g.W-cw-70,bot-top-10,{xr:[0,Math.max(1,s.T)],yr:[0,vmax*1.05],series:[{pts:s.tr,c:COL.acc,dot:true}],xl:'t (s)',yl:'velocidade (m/s)'}); },
  reads:s=>[['Tempo',nt(Math.min(s.t,s.T))+' s'],['Distância caída',nt(s.y)+' m'],['Velocidade',nt(s.v)+' m/s'],['Tempo total de queda',nt(s.T)+' s'],['Velocidade ao chegar',nt(s.p.g*s.T)+' m/s']]});

/* lançamento oblíquo (também é o experimento da página inicial) */
SIMS.proj=(host,cfg)=>{ const hero=!!cfg.hero; const angs=[30,45,60];
  return Sim(host,{alt:'Projéteis lançados em ângulos diferentes; 30° e 60° caem no mesmo lugar',anim:true,autoplay:hero,h:hero?250:320,speed:hero?1.4:1,
  legend:hero?[['force','30°'],['vel','45°'],['acc','60°']]:[['vel','vₓ (constante)'],['acc','v_y (muda por causa da gravidade)']],
  ctrls:hero?[]:[{k:'v0',l:'Velocidade de lançamento',min:5,max:30,step:1,v:20,u:'m/s'},{k:'th',l:'Ângulo',min:10,max:80,step:5,v:45,u:'°'},{k:'g',l:'Onde?',opts:[[10,'Terra (g=10)'],[1.6,'Lua']],v:10}],

  reads:s=>{ const y=s.def.yx(s,s.x), Ep=s.p.m*GRAV*y, Ec=.5*s.p.m*s.v*s.v; return [['Altura',nt(y)+' m'],['Velocidade',nt(Math.abs(s.v))+' m/s'],['Energia cinética ½mv²',nt(Ec)+' J'],['Energia potencial mgh',nt(Ep)+' J'],['Energia mecânica Ec + Ep',nt(Ec+Ep)+' J'].concat([])].concat(cfg.fric?[['Energia virou calor',nt(Math.max(0,s.E0-Ec-Ep))+' J']]:[]); }});

/* impulso: a área do gráfico F×t muda a quantidade de movimento */
SIMS.impulse=(host)=>Sim(host,{alt:'Chute numa bola: gráfico da força no tempo e a velocidade final',anim:true,h:300,
  legend:[['force','força durante o contato'],['energy','área = impulso']],
  ctrls:[{k:'F',l:'Força máxima',min:100,max:2000,step:50,v:800,u:'N'},{k:'dt',l:'Tempo de contato',min:.005,max:.05,step:.005,v:.02,u:'s',f:v=>nsig(v*1000,3)+' ms'},{k:'m',l:'Massa da bola',min:.2,max:1,step:.05,v:.45,u:'kg'}],
  init(s){ s.x=0; s.ph=0; },
  step(s,dt){ s.ph+=dt; if(s.ph>1) s.x+=s.def.vf(s)*dt*.12; if(s.x>60) s.play(false); },
  vf:s=>.5*s.p.F*s.p.dt/s.p.m, done:s=>s.x>60,
  draw(g,s){ const w=Math.min(g.W*.52,380), x=46, y=24, h=g.H-80, I=.5*s.p.F*s.p.dt, frac=clamp(s.ph,0,1);
    const tri=[[0,0],[s.p.dt/2,s.p.F],[s.p.dt,0]].map(p=>p), pts=[]; for(let i=0;i<=40*frac;i++){ const t=i/40*s.p.dt; pts.push([t*1000,t<=s.p.dt/2?2*s.p.F*t/s.p.dt:2*s.p.F*(1-t/s.p.dt)]); }
    g.plot(x,y,w,h,{xr:[0,50],yr:[0,2000],series:[{pts,c:COL.force,fill:COL.energy+'55',dot:frac<1}],xl:'t (ms)',yl:'força (N)'});
    const bx=x+w+30+Math.min(s.x*4,g.W-x-w-60), by=g.H-60; g.ground(by+14); g.circle(bx,by,14,COL.card,COL.ink,2.5);
    if(frac>=1) g.arrow(bx+16,by-26,bx+16+clamp(s.def.vf(s)*2,10,90),by-26,COL.vel,'v',3);
    g.text('I = área = '+nt(I)+' N·s',x+w/2,y+20,{size:14,bold:true,align:'center'}); },
  reads:s=>{ const I=.5*s.p.F*s.p.dt; return [['Impulso I = área do gráfico',nt(I)+' N·s'],['Força média (metade da máxima)',nt(s.p.F/2)+' N'],['Quantidade de movimento final Q = I',nt(I)+' kg·m/s'],['Velocidade final v = Q/m',nt(I/s.p.m)+' m/s'],['Em km/h',nt(I/s.p.m*3.6)+' km/h']]; }});

/* colisões em uma dimensão */
SIMS.coll=(host)=>Sim(host,{alt:'Dois carrinhos que colidem, com barras de quantidade de movimento e energia',anim:true,h:300,
  legend:[['vel','carrinho 1'],['force','carrinho 2'],['acc','total']],
  ctrls:[{k:'m1',l:'Massa 1',min:1,max:5,step:.5,v:2,u:'kg'},{k:'v1',l:'Velocidade 1',min:-4,max:8,step:1,v:5,u:'m/s'},{k:'m2',l:'Massa 2',min:1,max:5,step:.5,v:2,u:'kg'},{k:'v2',l:'Velocidade 2',min:-6,max:4,step:1,v:0,u:'m/s'},{k:'e',l:'Coeficiente de restituição e',min:0,max:1,step:.1,v:1,f:v=>nsig(v,2)+(v===1?' (elástica)':v===0?' (grudam)':'')}],
  init(s){ s.x1=-5; s.x2=1.5; s.u1=s.p.v1; s.u2=s.p.v2; s.hit=false; },
  step(s,dt){ s.x1+=s.u1*dt; s.x2+=s.u2*dt; const w1=.5+s.p.m1*.12, w2=.5+s.p.m2*.12;
    if(!s.hit&&s.x1+w1/2>=s.x2-w2/2&&s.u1>s.u2){ s.hit=true; const {m1,m2,e}=s.p, Q=m1*s.u1+m2*s.u2, d=s.u1-s.u2; s.u1=(Q-m2*e*d)/(m1+m2); s.u2=(Q+m1*e*d)/(m1+m2); }
    if(s.t>6||Math.abs(s.x1)>14&&Math.abs(s.x2)>14) s.play(false); },
  done:s=>s.t>6,
  draw(g,s){ const y=90, k=g.W/24, X=x=>g.W/2+x*k, w1=(.5+s.p.m1*.12)*k, w2=(.5+s.p.m2*.12)*k; g.ground(y+16);
    g.rect(X(s.x1)-w1/2,y-26,w1,30,COL.vel,null,6); g.text(nt(s.p.m1)+' kg',X(s.x1),y-6,{size:12,bold:true,align:'center',c:COL.card});
    g.rect(X(s.x2)-w2/2,y-26,w2,30,COL.force,null,6); g.text(nt(s.p.m2)+' kg',X(s.x2),y-6,{size:12,bold:true,align:'center',c:COL.card});
    [[s.x1,s.u1,COL.vel],[s.x2,s.u2,COL.force]].forEach(([x,u,c])=>{ if(Math.abs(u)>.05) g.arrow(X(x),y-36,X(x)+u*9,y-36,c,null,2.5); });
    const Q0=[s.p.m1*s.p.v1,s.p.m2*s.p.v2], Q=[s.p.m1*s.u1,s.p.m2*s.u2], E0=.5*s.p.m1*s.p.v1**2+.5*s.p.m2*s.p.v2**2, E=.5*s.p.m1*s.u1**2+.5*s.p.m2*s.u2**2, top=150, mid=g.W/2, qs=Math.max(1,Math.abs(Q0[0])+Math.abs(Q0[1]),Math.abs(Q[0])+Math.abs(Q[1]));
    g.text('quantidade de movimento Q = m·v',16,top,{size:12.5,c:COL.muted}); g.line(mid*.5,top+10,mid*.5,top+86,COL.line,1);
    [[Q[0],COL.vel],[Q[1],COL.force],[Q[0]+Q[1],COL.acc]].forEach(([q,c],i)=>{ const yy=top+18+i*24, ww=q/qs*mid*.45; g.rect(Math.min(mid*.5,mid*.5+ww),yy,Math.abs(ww),16,c,null,3); });
    g.text('energia cinética',mid+16,top,{size:12.5,c:COL.muted}); const es=Math.max(E0,1); g.rect(mid+16,top+18,(g.W-mid-40)*E0/es,16,COL.line,null,3); g.rect(mid+16,top+42,(g.W-mid-40)*E/es,16,COL.energy,null,3); g.text('antes',mid+20,top+30,{size:11}); g.text('agora',mid+20,top+54,{size:11}); },
  reads:s=>{ const Q0=s.p.m1*s.p.v1+s.p.m2*s.p.v2, Q=s.p.m1*s.u1+s.p.m2*s.u2, E0=.5*s.p.m1*s.p.v1**2+.5*s.p.m2*s.p.v2**2, E=.5*s.p.m1*s.u1**2+.5*s.p.m2*s.u2**2;
    return [['Q total antes',nt(Q0)+' kg·m/s'],['Q total agora',nt(Q)+' kg·m/s'],['Energia cinética antes → agora',nt(E0)+' → '+nt(E)+' J'],['Velocidades agora',nt(s.u1)+' e '+nt(s.u2)+' m/s'],['Colisão',s.p.v1<=s.p.v2?'não acontece (o 1 não alcança o 2)':s.p.e===1?'elástica: conserva a energia':s.p.e===0?'perfeitamente inelástica: saem juntos':'parcialmente elástica']]; }});

/* órbitas: leis de Kepler */
SIMS.orbit=(host)=>Sim(host,{alt:'Planeta orbitando uma estrela; áreas varridas em tempos iguais',anim:true,autoplay:false,h:340,sub:20,speed:1.6,
  legend:[['energy','estrela'],['vel','planeta'],['acc','áreas varridas em intervalos iguais de tempo']],
  ctrls:[{k:'v',l:'Velocidade inicial (1 = órbita circular)',min:.6,max:1.5,step:.05,v:.8,f:v=>nsig(v,3)+' × v<sub>circ</sub>'.replace(/<[^>]+>/g,'')},{k:'ar',l:'Mostrar áreas',opts:[[1,'sim'],[0,'não']],v:1,live:true}],
  init(s){ s.r=[1,0]; s.u=[0,s.p.v]; s.tr=[[1,0]]; s.marks=[[1,0]]; s.acc=0; const v=s.p.v; s.esc=v*v>=2; if(!s.esc){ s.a=1/(2-v*v); s.other=2*s.a-1; s.Tp=2*Math.PI*s.a**1.5; s.dtM=s.Tp/12; } else { s.dtM=.6; } },
  step(s,dt){ const r=Math.hypot(s.r[0],s.r[1]), a=[-s.r[0]/r**3,-s.r[1]/r**3]; s.u[0]+=a[0]*dt; s.u[1]+=a[1]*dt; s.r[0]+=s.u[0]*dt; s.r[1]+=s.u[1]*dt;
    s.tr.push(s.r.slice()); if(s.tr.length>4000) s.tr.shift(); s.acc+=dt; if(s.acc>=s.dtM){ s.acc-=s.dtM; s.marks.push(s.r.slice()); if(s.marks.length>13) s.marks.shift(); } if(s.esc&&r>8) s.play(false); },
  draw(g,s){ const xmin=s.esc?-2:-s.other, xmax=s.esc?6:1, b=s.esc?3:s.a*Math.sqrt(1-((s.a-1)/s.a)**2), cx0=(xmin+xmax)/2, k=Math.min((g.W-40)/(xmax-xmin),(g.H-40)/(2*Math.max(b,.3))), X=x=>g.W/2+(x-cx0)*k, Y=y=>g.H/2-y*k;
    if(s.p.ar){ for(let i=0;i+1<s.marks.length;i++){ const a=s.marks[i],bb=s.marks[i+1]; g.poly([[X(0),Y(0)],[X(a[0]),Y(a[1])],[X(bb[0]),Y(bb[1])]],null,0,i%2?COL.acc+'40':COL.acc+'22',true); } }
    g.poly(s.tr.map(p=>[X(p[0]),Y(p[1])]),COL.line,1.5); g.circle(X(0),Y(0),12,COL.energy); g.circle(X(s.r[0]),Y(s.r[1]),6,COL.vel);
    const sp=Math.hypot(s.u[0],s.u[1]); g.arrow(X(s.r[0]),Y(s.r[1]),X(s.r[0])+s.u[0]/sp*clamp(sp*30,12,60),Y(s.r[1])-s.u[1]/sp*clamp(sp*30,12,60),COL.vel,null,2.5); },
  reads:s=>{ const r=Math.hypot(s.r[0],s.r[1]), sp=Math.hypot(s.u[0],s.u[1]); return [['Distância à estrela',nt(r)+' (raio inicial = 1)'],['Velocidade',nt(sp)+' × v<sub>circ</sub>'],['Órbita',s.esc?'aberta: o planeta escapa':Math.abs(s.p.v-1)<.01?'circular':'elíptica (a estrela fica num foco)'],['Mais perto → mais rápido',s.esc?'—':`no periélio: ${nt(Math.max(s.p.v,1/s.p.v*(2-s.p.v*s.p.v>0?1:1)))}`]].slice(0,3).concat(s.esc?[]:[['Período (cresce com a órbita)',nt(s.Tp/(2*Math.PI))+' × o da órbita circular']]); }});

/* gangorra: torque (momento) */
SIMS.lever=(host)=>Sim(host,{alt:'Gangorra com duas massas em distâncias ajustáveis',h:280,
  legend:[['vel','lado esquerdo'],['force','lado direito']],
  ctrls:[{k:'m1',l:'Massa esquerda',min:1,max:10,step:.5,v:4,u:'kg'},{k:'d1',l:'Distância esquerda',min:.5,max:3,step:.25,v:1.5,u:'m'},{k:'m2',l:'Massa direita',min:1,max:10,step:.5,v:2,u:'kg'},{k:'d2',l:'Distância direita',min:.5,max:3,step:.25,v:3,u:'m'}],
  draw(g,s){ const M1=s.p.m1*GRAV*s.p.d1, M2=s.p.m2*GRAV*s.p.d2, diff=M1-M2, ang=clamp(diff/40,-1,1)*.2, cx=g.W/2, cy=g.H-80, k=Math.min(70,(g.W-60)/6.4);
    g.poly([[cx,cy],[cx-22,cy+46],[cx+22,cy+46]],COL.ink,2,COL.sunk,true); g.ground(cy+46);
    const c=g.ctx; c.save(); c.translate(cx,cy); c.rotate(ang); g.rect(-3.2*k,-6,6.4*k,10,COL.energy,COL.ink,3,1.5);
    for(let d=-3;d<=3;d++){ g.line(d*k,-6,d*k,4,COL.ink,1); }
    const b=(d,m,col,sgn)=>{ const sz=16+m*2.6; g.rect(sgn*d*k-sz/2,-6-sz,sz,sz,col,COL.ink,4,1.5); g.text(nt(m)+' kg',sgn*d*k,-6-sz-6,{size:11.5,align:'center',bold:true}); };
    b(s.p.d1,s.p.m1,COL.vel,-1); b(s.p.d2,s.p.m2,COL.force,1); c.restore();
    g.text(Math.abs(diff)<1e-9?'equilíbrio: os momentos se anulam':diff>0?'gira para a esquerda':'gira para a direita',cx,24,{size:15,bold:true,align:'center',c:Math.abs(diff)<1e-9?COL.ok:COL.ink});
    const bw=Math.min(160,g.W*.3); [[M1,COL.vel,20],[M2,COL.force,g.W-20-bw]].forEach(([M,col,x])=>{ g.rect(x,40,bw,12,COL.sunk,null,3); g.rect(x,40,bw*clamp(M/300,0,1),12,col,null,3); g.text('M = '+nt(M)+' N·m',x,68,{size:12,mono:true}); }); },
  reads:s=>{ const M1=s.p.m1*GRAV*s.p.d1, M2=s.p.m2*GRAV*s.p.d2; return [['Momento esquerdo m₁·g·d₁',nt(M1)+' N·m'],['Momento direito m₂·g·d₂',nt(M2)+' N·m'],['Para equilibrar, a massa direita deveria ser',nt(s.p.m1*s.p.d1/s.p.d2)+' kg'],['Força no apoio',nt((s.p.m1+s.p.m2)*GRAV)+' N']]; }});

/* pressão hidrostática: Stevin */

SIMS.press=(host)=>Sim(host,{alt:'Tanque com um sensor de pressão que desce na água',h:320,
  ctrls:[{k:'rho',l:'Líquido',opts:LIQ.map(x=>[x[0],x[1]]),v:1000},{k:'h',l:'Profundidade do sensor',min:0,max:10,step:.5,v:4,u:'m',live:true},{k:'atm',l:'Somar a pressão do ar?',opts:[[1,'sim'],[0,'não']],v:1,live:true}],
  draw(g,s){ const tw=Math.min(200,g.W*.36), x0=24, y0=30, th=g.H-60, k=th/10, ph=v=>s.p.rho*GRAV*v+(s.p.atm?1e5:0);
    const lc=s.p.rho>5000?COL.muted:COL.vel; g.rect(x0,y0,tw,th,lc+'33',COL.ink,4); g.line(x0,y0,x0+tw,y0,lc,3);
    for(let m=0;m<=10;m+=2){ g.line(x0+tw,y0+m*k,x0+tw+6,y0+m*k,COL.muted,1.2); g.text(m+' m',x0+tw+10,y0+m*k+4,{size:11,c:COL.muted,mono:true}); }
    const sy=y0+s.p.h*k; g.line(x0+tw/2,y0-16,x0+tw/2,sy,COL.ink,1.5); g.circle(x0+tw/2,sy,9,COL.energy,COL.ink,2);
    for(let a=0;a<8;a++){ const an=a/8*Math.PI*2, L=6+ph(s.p.h)/2e4; g.arrow(x0+tw/2+Math.cos(an)*(L+14),sy+Math.sin(an)*(L+14),x0+tw/2+Math.cos(an)*12,sy+Math.sin(an)*12,COL.force,null,1.5); }
    const px=x0+tw+60, pw=g.W-px-20, pmax=ph(10)*1.05; const pts=[]; for(let v=0;v<=10;v+=.5) pts.push([v,ph(v)/1e5]);
    const r=g.plot(px,y0,pw,th,{xr:[0,10],yr:[0,pmax/1e5],series:[{pts,c:COL.force}],xl:'profundidade (m)',yl:'pressão (×10⁵ Pa ≈ atm)'}); g.circle(r.X(s.p.h),r.Y(ph(s.p.h)/1e5),6,COL.energy,COL.ink,1.5); },
  reads:s=>{ const ph=s.p.rho*GRAV*s.p.h, pt=ph+(s.p.atm?1e5:0); return [['Pressão da coluna ρ·g·h',nf(ph)+' Pa'],['Pressão do ar na superfície',s.p.atm?'1,0×10<sup>5</sup> Pa':'não somada'],['Pressão total no sensor',nf(pt)+' Pa'],['Em atmosferas',nt(pt/1e5)+' atm'],['Cada 10 m de água somam','1 atm']]; }});

/* empuxo: Arquimedes */
SIMS.buoy=(host)=>Sim(host,{alt:'Bloco colocado num líquido: flutua ou afunda',anim:true,h:310,
  legend:[['force','peso'],['vel','empuxo']],
  ctrls:[{k:'rb',l:'Densidade do bloco',min:200,max:3000,step:50,v:600,u:'kg/m³'},{k:'V',l:'Volume do bloco',min:1,max:20,step:1,v:8,u:'L'},{k:'rf',l:'Líquido',opts:[[1000,'água'],[1030,'água do mar'],[800,'álcool']],v:1000}],
  init(s){ s.y=-1.4; s.v=0; },
  eq:s=>s.p.rb<s.p.rf?s.p.rb/s.p.rf:1.2,
  step(s,dt){ const V=s.p.V/1000, side=Math.cbrt(V), sub=clamp(s.y,0,1), P=s.p.rb*V*GRAV, E=s.p.rf*V*sub*GRAV, m=s.p.rb*V; let a=(P-E)/m-2.2*s.v; if(s.y>=2.2&&a>0){ a=0; s.v=0; } s.v+=a*dt; s.y=Math.min(2.2,s.y+s.v*dt/(side*4)); if(s.t>12) s.play(false); },
  done:s=>s.t>12,
  draw(g,s){ const V=s.p.V/1000, side=Math.cbrt(V), bs=40+side*150, tx=40, tw=Math.min(g.W*.55,340), wl=110, bot=g.H-20;
    g.rect(tx,wl,tw,bot-wl,COL.vel+'2a',null,0); g.line(tx,wl,tx+tw,wl,COL.vel,2.5); g.poly([[tx,40],[tx,bot],[tx+tw,bot],[tx+tw,40]],COL.ink,2);
    const top=wl-bs+s.y*bs, cx=tx+tw/2; const yb=Math.min(top,bot-bs); g.rect(cx-bs/2,yb,bs,bs,COL.energy+'dd',COL.ink,6);
    const sub=clamp((yb+bs-wl)/bs,0,1), P=s.p.rb*V*GRAV, E=s.p.rf*V*sub*GRAV, sc=v=>clamp(v*.9,0,120);
    g.arrow(cx+10,yb+bs/2,cx+10,yb+bs/2+sc(P),COL.force,'P',3); if(E>0) g.arrow(cx-10,yb+bs/2,cx-10,yb+bs/2-sc(E),COL.vel,'E',3);
    g.text(s.p.rb<s.p.rf?'flutua: menos denso que o líquido':s.p.rb===s.p.rf?'fica parado em qualquer altura':'afunda: mais denso que o líquido',tx+tw+20,60,{size:14,bold:true});
    g.text('parte submersa: '+nt(sub*100,3)+'%',tx+tw+20,86,{size:13,c:COL.muted}); },
  reads:s=>{ const V=s.p.V/1000, P=s.p.rb*V*GRAV, fr=Math.min(1,s.p.rb/s.p.rf), E=s.p.rf*V*fr*GRAV; return [['Peso P = ρ<sub>bloco</sub>·V·g',nt(P)+' N'],['Empuxo máximo (todo submerso) ρ<sub>líq</sub>·V·g',nt(s.p.rf*V*GRAV)+' N'],['No equilíbrio',s.p.rb<=s.p.rf?`flutua com ${nt(fr*100,3)}% submerso (E = P = ${nt(E)} N)`:`afunda; peso aparente ${nt(P-s.p.rf*V*GRAV)} N`]]; }});

/* termômetros: Celsius, Fahrenheit e Kelvin */
SIMS.temp=(host)=>Sim(host,{alt:'Três termômetros nas escalas Celsius, Fahrenheit e Kelvin',h:320,
  ctrls:[{k:'C',l:'Temperatura',min:-273,max:200,step:1,v:37,u:'°C',live:true}],
  draw(g,s){ const C=s.p.C, sc=[['Celsius','°C',C,-273.15,200],['Fahrenheit','°F',C*1.8+32,-459.67,392],['Kelvin','K',C+273.15,0,473.15]], top=40, bot=g.H-50, w=g.W/3;
    const marks=[[-273.15,'zero absoluto'],[0,'gelo derrete'],[37,'corpo humano'],[100,'água ferve']];

/* curva de aquecimento da água (−20 °C a 120 °C) */

  segs(m){ return [[m*.5*20,'aquecendo o gelo'],[m*80,'derretendo (0 °C)'],[m*1*100,'aquecendo a água'],[m*540,'fervendo (100 °C)'],[m*.5*20,'aquecendo o vapor']]; },
  TofQ(s,Q){ const S=s.def.segs(s.p.m); let q=Q; const T0=[-20,0,0,100,100], k=[.5*s.p.m,0,s.p.m,0,.5*s.p.m];
    for(let i=0;i<5;i++){ if(q<=S[i][0]||i===4) return {T:k[i]?T0[i]+Math.min(q,S[i][0])/k[i]:T0[i],phase:S[i][1],i,frac:q/S[i][0]}; q-=S[i][0]; } },
  init(s){ s.Q=0; s.tot=s.def.segs(s.p.m).reduce((a,b)=>a+b[0],0); s.pts=[[0,-20]]; },
  step(s,dt){ s.Q=Math.min(s.tot,s.Q+s.tot/24*s.p.P*dt); s.pts.push([s.Q/1000,s.def.TofQ(s,s.Q).T]); if(s.Q>=s.tot) s.play(false); },
  done:s=>s.Q>=s.tot,
  draw(g,s){ const st=s.def.TofQ(s,s.Q), pw=g.W*.64, r=g.plot(50,26,pw,g.H-74,{xr:[0,s.tot/1000],yr:[-30,130],series:[{pts:s.pts,c:COL.force,dot:true}],xl:'calor recebido (kcal)',yl:'temperatura (°C)'});
    let acc=0; s.def.segs(s.p.m).forEach((sg,i)=>{ acc+=sg[0]; if(i<4) g.line(r.X(acc/1000),26,r.X(acc/1000),g.H-48,COL.line,1,[3,3]); });
    const bx=pw+80, bw=g.W-bx-20, cy=g.H/2-10; g.text(st.phase,bx+bw/2,40,{size:13.5,bold:true,align:'center'}); g.text(nt(st.T,3)+' °C',bx+bw/2,66,{size:22,bold:true,align:'center',mono:true});

  reads:s=>{ const S=s.def.segs(s.p.m), st=s.def.TofQ(s,s.Q); return [['Calor recebido até agora',nt(s.Q)+' cal'],['Fase',st.phase],['Derreter todo o gelo: m·L<sub>f</sub>',nt(S[1][0])+' cal'],['Ferver toda a água: m·L<sub>v</sub>',nt(S[3][0])+' cal']]; }});

/* diagrama de raios para espelhos esféricos e lentes (aproximação de raios paraxiais) */
function rayDiagram(g,s,kind){
  const mirror=kind==='mirror', conv=s.p.t==='c', f=(conv?1:-1)*s.p.f, p=s.p.p, inf=Math.abs(1/f-1/p)<1e-9, pi=inf?Infinity:1/(1/f-1/p), A=inf?Infinity:-pi/p;
  const xm=mirror?g.W*.66:g.W*.5, cy=g.H*.55, span=Math.max(p,Math.min(Math.abs(pi),60),2*s.p.f)*1.08, k=(mirror?xm-20:xm-20)/span, ho=Math.min(46,g.H*.2);
  const side=mirror?-1:1, xo=xm-p*k, ix=inf?null:(mirror?xm-pi*k:xm+pi*k), hi=inf?0:A*ho;
  g.line(0,cy,g.W,cy,COL.muted,1.2);
  if(mirror){ const bulge=conv?14:-14; g.ctx.save(); g.ctx.strokeStyle=COL.ink; g.ctx.lineWidth=3; g.ctx.beginPath(); g.ctx.moveTo(xm-bulge,cy-g.H*.42); g.ctx.quadraticCurveTo(xm+bulge,cy,xm-bulge,cy+g.H*.42); g.ctx.stroke(); g.ctx.restore(); g.text(conv?'lado refletor ←':'lado refletor ←',xm-4,cy-g.H*.42-6,{size:11,c:COL.muted,align:'right'}); }
  else { g.line(xm,cy-g.H*.42,xm,cy+g.H*.42,COL.ink,2.5); const tip=(y,d)=>{ g.line(xm,y,xm-8,y+d*8*(conv?1:-1),COL.ink,2.5); g.line(xm,y,xm+8,y+d*8*(conv?1:-1),COL.ink,2.5); }; tip(cy-g.H*.42,1); tip(cy+g.H*.42,-1); }
  const fx=xm+side*f*k, lab=(x,t)=>{ g.line(x,cy-5,x,cy+5,COL.ink,2); g.text(t,x,cy+20,{size:12,align:'center',c:COL.muted,bold:true}); };

    g.circle(cx,cy,rp,null,COL.muted,1,); const t=[-Math.sin(s.ang)*s.p.q,-Math.cos(s.ang)*s.p.q]; g.circle(x,y,9,s.p.q>0?COL.force:COL.vel,COL.ink,1.5);
    g.arrow(x,y,x+t[0]*50,y+t[1]*50,COL.vel,'v',3); g.arrow(x,y,x+(cx-x)/rp*40,y+(cy-y)/rp*40,COL.force,'F',3);
    g.text('B entra na tela (⊗)',10,g.H-10,{size:12,c:COL.muted}); },
  reads:s=>{ const v=s.p.v*1e5, F=1.6e-19*v*s.p.B, R=s.def.R(s); return [['Força F = |q|·v·B',nf(F)+' N'],['Raio da trajetória R = m·v/(|q|·B)',nt(R*100)+' cm'],['Período T = 2πm/(|q|·B)',nf(2*Math.PI*1.67e-27/(1.6e-19*s.p.B))+' s'],['Trabalho da força magnética','zero: ela só muda a direção']]; }});

const METAIS=[[2.28,'sódio'],[4.3,'zinco'],[4.7,'cobre']];
function lamColor(l){ if(l<380) return '#9b7bff'; const t=[[380,[120,0,200]],[440,[0,40,255]],[490,[0,200,255]],[510,[0,220,80]],[580,[255,230,0]],[645,[255,40,0]],[700,[200,0,0]]]; let i=0; while(i<t.length-2&&l>t[i+1][0]) i++; const [a,ca]=t[i],[b,cb]=t[i+1], f=clamp((l-a)/(b-a),0,1); return `rgb(${ca.map((c,j)=>Math.round(c+(cb[j]-c)*f)).join(',')})`; }
SIMS.photo=(host)=>Sim(host,{alt:'Luz batendo numa placa metálica e arrancando elétrons',anim:true,autoplay:true,h:280,
  ctrls:[{k:'l',l:'Comprimento de onda da luz λ',min:200,max:700,step:10,v:450,u:'nm',live:true},{k:'I',l:'Intensidade (fótons por segundo)',min:1,max:10,step:1,v:5,live:true},{k:'W',l:'Metal',opts:METAIS.map(x=>[x[0],x[1]]),v:2.28,live:true}],
  init(s){ s.ph=[]; s.el=[]; s.acc=0; },
  step(s,dt){ const E=1240/s.p.l, K=E-s.p.W; s.acc+=dt*s.p.I*4; while(s.acc>=1){ s.acc--; s.ph.push({x:0,y:Math.random()}); }
    s.ph.forEach(p=>p.x+=dt*1.4); s.ph=s.ph.filter(p=>{ if(p.x>=1){ if(K>0) s.el.push({x:0,y:p.y,v:.3+Math.sqrt(K)*.5}); return false; } return true; });
    s.el.forEach(e=>e.x+=e.v*dt); s.el=s.el.filter(e=>e.x<1); },
  draw(g,s){ const E=1240/s.p.l, K=E-s.p.W, px=g.W*.55, c=lamColor(s.p.l);
    g.rect(14,g.H/2-40,40,80,c,COL.ink,8); g.text(s.p.l<380?'UV':'luz',34,g.H/2+5,{size:12,bold:true,align:'center',c:'#fff'});
    g.rect(px,30,14,g.H-60,COL.muted,COL.ink,2); g.text(METAIS.find(m=>m[0]===s.p.W)[1],px+7,22,{size:12,align:'center',bold:true});
    s.ph.forEach(p=>{ const x=60+p.x*(px-70), y=40+p.y*(g.H-80); g.poly([[x-10,y],[x-6,y-4],[x-2,y],[x+2,y+4],[x+6,y]],c,2.2); });
    s.el.forEach(e=>{ const x=px+18+e.x*(g.W-px-30), y=40+e.y*(g.H-80); g.circle(x,y,4.5,COL.vel); });
    g.text(K>0?'elétrons arrancados':'nenhum elétron: cada fóton tem pouca energia',g.W-12,g.H-12,{size:12.5,bold:true,align:'right',c:K>0?COL.ok:COL.force}); },
  reads:s=>{ const E=1240/s.p.l, K=E-s.p.W; return [['Energia de cada fóton E = h·f',nt(E)+' eV'],['Frequência f = c/λ',nf(3e8/(s.p.l*1e-9))+' Hz'],['Função trabalho do metal',nt(s.p.W)+' eV'],['Energia cinética máxima E − φ',K>0?nt(K)+' eV':'não há emissão'],['Maior λ que ainda arranca elétrons',nt(1240/s.p.W)+' nm']]; }});

SIMS.decay=(host)=>Sim(host,{alt:'Grade de 400 núcleos decaindo, com o gráfico da quantidade restante',anim:true,h:300,
  legend:[['vel','núcleos que restam (simulação)'],['force','previsão N₀/2ⁿ']],
  ctrls:[{k:'T',l:'Meia-vida',min:1,max:8,step:1,v:3,u:'s'}],
  init(s){ s.a=new Array(400).fill(1); s.N=400; s.h=[[0,400]]; },
  step(s,dt){ const p=1-Math.exp(-Math.LN2/s.p.T*dt); for(let i=0;i<400;i++) if(s.a[i]&&Math.random()<p){ s.a[i]=0; s.N--; } s.h.push([s.t+dt,s.N]); if(s.t>5*s.p.T) s.play(false); },
  done:s=>s.t>5*s.p.T,
  draw(g,s){ const gs=Math.min((g.H-40)/20,(g.W*.42)/20), x0=16, y0=20; for(let i=0;i<400;i++){ const x=x0+(i%20)*gs, y=y0+Math.floor(i/20)*gs; g.circle(x+gs/2,y+gs/2,gs*.36,s.a[i]?COL.vel:COL.line); }
    const px=x0+20*gs+50, th=[]; for(let t=0;t<=5*s.p.T;t+=s.p.T/10) th.push([t,400/2**(t/s.p.T)]);
    const r=g.plot(px,y0,g.W-px-20,g.H-60,{xr:[0,5*s.p.T],yr:[0,400],series:[{pts:th,c:COL.force,w:1.5},{pts:s.h,c:COL.vel,dot:true}],xl:'tempo (s)',yl:'núcleos restantes'});
    for(let n=1;n<=4;n++) g.line(r.X(n*s.p.T),r.Y(0),r.X(n*s.p.T),r.Y(400/2**n),COL.line,1,[3,3]); },
  reads:s=>[['Tempo',nt(s.t)+' s'],['Meias-vidas passadas',nt(s.t/s.p.T)],['Núcleos restantes',s.N+' de 400'],['Previsão N₀/2ⁿ',nt(400/2**(s.t/s.p.T))],['Cada núcleo','decai ao acaso; o conjunto segue a regra']]});

SIMS.rel=(host)=>Sim(host,{alt:'Dois relógios de luz: um parado e um em movimento, que marca o tempo mais devagar',anim:true,autoplay:true,h:300,
  ctrls:[{k:'b',l:'Velocidade do relógio (fração de c)',min:0,max:.99,step:.01,v:.8,f:v=>nsig(v*100,3)+'% de c'}],
  init(s){ s.x=0; s.t0=0; s.t1=0; s.ph0=0; s.ph1=0; },
  step(s,dt){ const b=s.p.b, c=1.2; s.ph0+=dt*c; s.ph1+=dt*c*Math.sqrt(1-b*b); s.x+=dt*b*c; const fl=v=>Math.floor(v/2); s.t0=fl(s.ph0); s.t1=fl(s.ph1); },
  draw(g,s){ const H=g.H-90, top=40, w=g.W*.26, tri=p=>{ const q=p%2; return q<1?q:2-q; };
    const clock=(x,ph,lab,n)=>{ g.line(x-22,top,x+22,top,COL.ink,3); g.line(x-22,top+H,x+22,top+H,COL.ink,3); const y=top+H-tri(ph)*H; g.circle(x,y,6,COL.energy); g.text(lab,x,top+H+22,{size:12.5,align:'center',bold:true}); g.text(n+' tiques',x,top+H+40,{size:12,align:'center',mono:true,c:COL.muted}); };
    clock(w/2+10,s.ph0,'relógio parado',s.t0);
    const span=g.W-w-60, xx=w+40+((s.x*span/2.4)%span); clock(xx,s.ph1,'relógio em movimento',s.t1);
    g.text('γ = '+nt(1/Math.sqrt(1-s.p.b**2)),g.W-12,24,{size:16,bold:true,align:'right',mono:true}); },
  reads:s=>{ const gm=1/Math.sqrt(1-s.p.b**2); return [['Fator de Lorentz γ = 1/√(1 − v²/c²)',nt(gm)],['1 s no relógio que se move dura, para quem está parado',nt(gm)+' s'],['Uma régua de 1 m em movimento mede',nt(1/gm)+' m'],['A velocidade da luz','é a mesma para os dois observadores']]; }});

   Lições — Ferramentas, Cinemática e Dinâmica
   Geradores de exercício devolvem {q,a,u,sol,traps,hint} (numérico)

const NUM=(q,a,u,sol,traps,hint)=>({q,a,u,sol,traps:traps||[],hint});
const MCQ=(q,o,why,w)=>({q,o,a:0,why,w});
const POOL=arr=>()=>MCQ(...pick(arr));
const F=nf;

mod('fer','Ferramentas da física','medir, escrever números e trabalhar com vetores',[
{id:'grandezas',t:'Grandezas e unidades',min:10,
 idea:`<p>A física descreve o mundo com números. Tudo o que dá para medir é uma <b>grandeza</b>: comprimento, tempo, massa, velocidade, temperatura. Uma medida sempre tem duas partes: o <b>número</b> e a <b>unidade</b>. "O carro está a 20" não diz nada; "20 m/s" diz.</p>
 <p>O Brasil usa o <b>Sistema Internacional (SI)</b>. Nele, comprimento é medido em metros (m), massa em quilogramas (kg) e tempo em segundos (s). As outras unidades são combinações dessas: velocidade em m/s, aceleração em m/s², força em newtons (N = kg·m/s²).</p>
 <p>No dia a dia usamos km/h. Para passar para m/s, lembre que 1 km = 1000 m e 1 h = 3600 s. Então 1 km/h = 1000/3600 m/s, ou seja, <b>divida por 3,6</b>. Para voltar, multiplique por 3,6.</p>`,
 pred:{q:'Um carro está a 72 km/h. Quantos metros ele anda em 1 segundo?',o:['20 m','72 m','7,2 m','260 m'],a:0,why:'72 ÷ 3,6 = 20 m/s: a cada segundo, 20 metros. Na estrada isso é quase o comprimento de quatro carros por segundo.'},
 lab:{sim:'conv'},
 tasks:['Coloque 36 km/h. Quantos metros o carro anda por segundo?','Descubra qual velocidade faz o carro percorrer os 100 m em exatamente 5 segundos.','Um velocista olímpico corre a cerca de 10 m/s. Quanto é isso em km/h?'],
 f:[{f:'v<sub class="up">(m/s)</sub> = '+frac('v<sub class="up">(km/h)</sub>','3,6'),s:[['m','metro','comprimento'],['kg','quilograma','massa'],['s','segundo','tempo'],['K','kelvin','temperatura'],['A','ampere','corrente elétrica']],n:'Essas cinco são unidades de base do SI. 1 km = 1000 m · 1 h = 60 min = 3600 s · 1 kg = 1000 g · 1 m = 100 cm.'}],
 ex:{q:'Converta 90 km/h para m/s.',s:['90 km em metros: 90 × 1000 = 90 000 m.','1 hora em segundos: 3600 s.','90 000 m ÷ 3600 s = <b>25 m/s</b>.','Atalho: 90 ÷ 3,6 = 25. Dá o mesmo resultado porque 3600 ÷ 1000 = 3,6.']},
 probs:[
  ()=>{ const v=pick([18,36,54,72,90,108,126,144]); return NUM(`Converta <b>${v} km/h</b> para m/s.`,v/3.6,'m/s',[`${v} ÷ 3,6 = ${F(v/3.6)} m/s`],[[v*3.6,'Você multiplicou por 3,6. De km/h para m/s se <b>divide</b>.'],[v/60,'Você dividiu por 60. Uma hora tem 3600 segundos, e um km tem 1000 metros.']],'1 km/h equivale a 1000 m em 3600 s.'); },
  ()=>{ const v=R(5,40,5); return NUM(`Um guepardo corre a <b>${v} m/s</b>. Quanto é isso em km/h?`,v*3.6,'km/h',[`${v} × 3,6 = ${F(v*3.6)} km/h`],[[v/3.6,'De m/s para km/h se <b>multiplica</b> por 3,6.']],'O número em km/h é sempre maior que em m/s.'); },
  ()=>{ const h=pick([1.5,2,2.5,3,0.5]); return NUM(`Quantos segundos há em <b>${F(h)} h</b>?`,h*3600,'s',[`1 h = 3600 s`,`${F(h)} × 3600 = ${F(h*3600)} s`],[[h*60,'Isso são minutos. Cada minuto ainda tem 60 segundos.']],'Cada hora tem 60 minutos, e cada minuto tem 60 segundos.'); },
  ()=>{ const g=R(50,950,50); return NUM(`Uma fruta tem massa de <b>${g} g</b>. Quanto é em kg?`,g/1000,'kg',[`1 kg = 1000 g`,`${g} ÷ 1000 = ${F(g/1000)} kg`],[[g*1000,'De grama para quilograma o número fica <b>menor</b>: divida por 1000.'],[g/100,'O quilo tem 1000 gramas, não 100.']]); },
  POOL([['Qual destas é a unidade de massa no SI?',['quilograma (kg)','grama (g)','newton (N)','litro (L)'],'O SI usa o quilograma. O newton mede força; o litro, volume.'],['Qual destas é uma grandeza vetorial (precisa de direção e sentido)?',['velocidade','tempo','massa','temperatura'],'Velocidade tem módulo, direção e sentido. Tempo, massa e temperatura só têm valor: são escalares.'],['"A mesa mede 2" está incompleto porque falta:',['a unidade','o sinal','a notação científica','o vetor'],'Sem unidade não dá para saber se são 2 metros, 2 centímetros ou 2 pés.']])],
 traps:['Esquecer a unidade na resposta: 20 não é o mesmo que 20 m/s.','Multiplicar por 3,6 quando deveria dividir. Lembre: m/s é um número menor que km/h.','Somar grandezas diferentes, como 3 m + 2 s. Só se somam grandezas de mesma espécie e mesma unidade.'],
 keep:['Medida = número + unidade.','km/h → m/s: divida por 3,6. m/s → km/h: multiplique por 3,6.','SI: metro, quilograma, segundo.']},

{id:'potencias',t:'Notação científica e ordem de grandeza',min:12,
 idea:`<p>A física trata do muito pequeno (um átomo mede 0,0000000001 m) e do muito grande (a Terra fica a 150 000 000 000 m do Sol). Escrever tantos zeros é fácil de errar, por isso usamos a <b>notação científica</b>: um número entre 1 e 10 multiplicado por uma potência de 10.</p>
 <p>150 000 000 000 = 1,5 × 10<sup>11</sup> (a vírgula andou 11 casas para a esquerda). 0,00045 = 4,5 × 10<sup>−4</sup> (a vírgula andou 4 casas para a direita, então o expoente é negativo).</p>
 <p>Para multiplicar, multiplique os números e <b>some os expoentes</b>; para dividir, divida os números e <b>subtraia os expoentes</b>. A <b>ordem de grandeza</b> é a potência de 10 mais próxima do valor: se o número da frente for 3,16 ou mais (√10), arredonde para a potência seguinte.</p>`,
 pred:{q:'A Terra está a 150 milhões de quilômetros do Sol. Em metros, isso é:',o:['1,5 × 10¹¹ m','1,5 × 10⁸ m','1,5 × 10⁶ m','150 × 10⁶ m'],a:0,why:'150 milhões de km = 1,5 × 10⁸ km. Cada km tem 10³ m, então 1,5 × 10⁸ × 10³ = 1,5 × 10¹¹ m. (150 × 10⁶ não está em notação científica: o número da frente precisa ficar entre 1 e 10.)'},
 lab:{sim:'pow10'},
 tasks:['Ande pela régua do átomo até a galáxia. Quantas potências de 10 separam um átomo de uma pessoa?','Encontre o prefixo "quilo" e o "micro". Quanto vale cada um?','A distância São Paulo–Rio é 3,6 × 10⁵ m. Por que a ordem de grandeza dela é 10⁶, e não 10⁵?'],
 f:[{f:'a × 10<sup>n</sup>, com 1 ≤ a &lt; 10',s:[['n > 0','número grande: a vírgula andou n casas para a esquerda',''],['n < 0','número pequeno: a vírgula andou n casas para a direita','']]},{f:'(a×10<sup>m</sup>)·(b×10<sup>n</sup>) = (a·b)×10<sup>m+n</sup>',n:'Na divisão, subtraia: 10<sup>m</sup> ÷ 10<sup>n</sup> = 10<sup>m−n</sup>. Prefixos: k = 10³, M = 10⁶, G = 10⁹, m = 10⁻³, μ = 10⁻⁶, n = 10⁻⁹.'}],
 ex:{q:'Calcule (3 × 10⁸) × (2 × 10⁻³).',s:['Multiplique os números da frente: 3 × 2 = 6.','Some os expoentes: 8 + (−3) = 5.','Resultado: <b>6 × 10⁵</b>.']},
 probs:[
  ()=>{ const m=pick([1.2,2.5,3.6,4.5,7.2,9.1]), e=pick([-6,-5,-4,-3,3,4,5,6,7,8]); const txt=e>0?(m*10**e).toLocaleString('pt-BR'):(m*10**e).toFixed(-e+1).replace('.',','); return NUM(`Escreva <b>${txt}</b> em notação científica: ${F(m)} × 10<sup>?</sup>. Qual é o expoente?`,e,'',[`A vírgula de ${txt} precisa andar ${Math.abs(e)} casas até ficar ${F(m)}.`,`${e>0?'Número grande: expoente positivo':'Número pequeno: expoente negativo'} → ${e}.`],[[-e,'O sinal está trocado: números menores que 1 têm expoente negativo, e maiores que 10, positivo.'],[e>0?e+1:e-1,'Conte de novo as casas que a vírgula andou.'],[e>0?e-1:e+1,'Conte de novo as casas que a vírgula andou.']],'Conte quantas casas a vírgula anda até sobrar um só algarismo antes dela.'); },
  ()=>{ const a=pick([2,3,4]), b=pick([1.5,2,2]), m=R(2,9), n=R(-6,5); const r=a*b*10**(m+n); return NUM(`Calcule (${a} × 10<sup>${m}</sup>) × (${F(b)} × 10<sup>${n}</sup>).`,r,'',[`${a} × ${F(b)} = ${F(a*b)}`,`${m} + (${n}) = ${m+n}`,`Resultado: ${F(a*b)} × 10<sup>${m+n}</sup>`],[[a*b*10**(m*n),'Na multiplicação os expoentes se <b>somam</b>, não se multiplicam.'],[a*b*10**(m-n),'Na multiplicação os expoentes se somam; subtrair é na divisão.']],'Digite no formato 6e5 ou 6x10^5.'); },
  ()=>{ const a=pick([6,8,9]), b=pick([2,3,4]), m=R(4,12), n=R(1,5); return NUM(`Calcule (${a} × 10<sup>${m}</sup>) ÷ (${b} × 10<sup>${n}</sup>).`,a/b*10**(m-n),'',[`${a} ÷ ${b} = ${F(a/b)}`,`${m} − ${n} = ${m-n}`,`Resultado: ${F(a/b)} × 10<sup>${m-n}</sup>`],[[a/b*10**(m+n),'Na divisão os expoentes se <b>subtraem</b>.']],'Digite no formato 3e5 ou 3x10^5.'); },
  ()=>{ const m=pick([1.5,2.2,2.9,3.5,4.2,6.8,8.5]), e=R(2,9); const og=m>=3.16?e+1:e; return NUM(`Qual é a ordem de grandeza de <b>${F(m)} × 10<sup>${e}</sup></b>? Responda o expoente da potência de 10.`,og,'',[`Compare ${F(m)} com √10 ≈ 3,16.`,m>=3.16?`${F(m)} ≥ 3,16, então arredonde para 10<sup>${e+1}</sup>.`:`${F(m)} &lt; 3,16, então fica 10<sup>${e}</sup>.`],[[m>=3.16?e:e+1,m>=3.16?'Como '+F(m)+' passa de 3,16, a potência mais próxima é a seguinte.':'Como '+F(m)+' é menor que 3,16, a potência mais próxima é a própria.']],'O ponto de virada é √10 ≈ 3,16, não 5.'); },
  POOL([['1 μm (micrômetro) é igual a:',['10⁻⁶ m','10⁻³ m','10⁻⁹ m','10⁶ m'],'O prefixo micro (μ) vale 10⁻⁶.'],['3 km equivalem a:',['3 × 10³ m','3 × 10⁻³ m','3 × 10⁶ m','30 m'],'Quilo vale 10³.'],['Qual número está em notação científica correta?',['4,7 × 10⁵','47 × 10⁴','0,47 × 10⁶','4,7 × 10^5,2'],'O número da frente precisa estar entre 1 e 10, e o expoente é inteiro.']])],
 traps:['Esquecer o sinal negativo do expoente para números menores que 1.','Deixar o número da frente fora do intervalo de 1 a 10 (como 45 × 10³).','Multiplicar os expoentes em vez de somá-los.'],
 keep:['Número grande → expoente positivo; número pequeno → expoente negativo.','Multiplicação soma os expoentes; divisão subtrai.','Ordem de grandeza: compare o número da frente com 3,16.']},

{id:'vetores',t:'Vetores',min:15,
 idea:`<p>Algumas grandezas precisam só de um número: 3 kg, 20 °C. São as <b>escalares</b>. Outras precisam dizer também <b>para onde</b>: andar 5 m para o norte é diferente de 5 m para o sul. São as <b>vetoriais</b>: deslocamento, velocidade, aceleração, força.</p>
 <p>Um vetor tem <b>módulo</b> (tamanho), <b>direção</b> (a reta: horizontal, vertical…) e <b>sentido</b> (para qual lado dessa reta). Desenhamos como uma seta.</p>
 <p>Para somar vetores, coloque a cauda de um na ponta do outro: a <b>resultante</b> vai do começo do primeiro ao fim do último. Se forem perpendiculares, use Pitágoras. Outra forma é decompor cada vetor em <b>componentes</b> x e y e somar as componentes separadamente.</p>`,
