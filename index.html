<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header { margin-bottom: 2rem; text-align: center; }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    header h1 span { color: #ff0000; }

    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 720px;
      margin-bottom: 2rem;
    }

    #url-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 2px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #url-input:focus { border-color: #ff0000; }
    #url-input::placeholder { color: #555; }

    #play-btn {
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    #play-btn:hover { background: #cc0000; }
    #play-btn:active { transform: scale(0.97); }

    #error-msg {
      display: none;
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-top: -1.4rem;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 720px;
    }

    #player-section {
      display: none;
      width: 100%;
      max-width: 960px;
      flex-direction: column;
      gap: 0.6rem;
    }

    #player-section.visible { display: flex; }

    #player-wrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }

    .aspect-ratio {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    #player-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #player-container iframe,
    #player-container > div {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Status bar abaixo do player */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1rem;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 0.85rem;
      gap: 1rem;
    }

    #status-text { color: #777; }
    #status-text.alt { color: #f0a500; }

    #status-bar a {
      color: #ff4444;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      transition: color 0.2s;
    }

    #status-bar a:hover { color: #ff0000; }

    /* Spinner de carregamento */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #111;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }

    #loading-overlay.show { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4rem 2rem;
      color: #444;
      text-align: center;
    }

    #placeholder svg { width: 64px; height: 64px; opacity: 0.4; }
    #placeholder p { font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1>You<span>Tube</span> Player</h1>
  </header>

  <div class="input-row">
    <input
      id="url-input"
      type="text"
      placeholder="Cole o link do YouTube aqui..."
      autocomplete="off"
      spellcheck="false"
    />
    <button id="play-btn">Reproduzir</button>
  </div>

  <p id="error-msg">Link inválido. Cole um link do YouTube válido.</p>

  <div id="player-section">
    <div id="player-wrapper">
      <div class="aspect-ratio">
        <div id="player-container"></div>
        <div id="loading-overlay"><div class="spinner"></div></div>
      </div>
    </div>
    <div id="status-bar">
      <span id="status-text">Reproduzindo via YouTube</span>
      <a id="yt-direct" href="#" target="_blank" rel="noopener">Abrir no YouTube ↗</a>
    </div>
  </div>

  <div id="placeholder">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.8 5 12 5 12 5s-4.8 0-7 .1c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.5c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.8.8 1.8.8 2.2.8C6.6 19 12 19 12 19s4.8 0 7-.2c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.4 2.8-5.4 2.7z"/>
    </svg>
    <p>Cole um link do YouTube acima para começar.</p>
  </div>

  <!-- Servidores alternativos Invidious/Piped (em ordem de preferência) -->
  <script>
    const ALT_SERVERS = [
      id => `https://piped.video/embed/${id}`,
      id => `https://inv.nadeko.net/embed/${id}`,
      id => `https://invidious.fdn.fr/embed/${id}`,
    ];

    const input       = document.getElementById('url-input');
    const btn         = document.getElementById('play-btn');
    const section     = document.getElementById('player-section');
    const container   = document.getElementById('player-container');
    const placeholder = document.getElementById('placeholder');
    const errorMsg    = document.getElementById('error-msg');
    const directLink  = document.getElementById('yt-direct');
    const statusText  = document.getElementById('status-text');
    const loading     = document.getElementById('loading-overlay');

    let currentId = null;
    let ytPlayer  = null;
    let apiReady  = false;

    // Carrega a IFrame API do YouTube para detectar erros automaticamente
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
    };

    function extractVideoId(url) {
      try {
        const u = new URL(url.trim());
        if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
        const s = u.pathname.match(/\/shorts\/([^/?&]+)/);
        if (s) return s[1];
        const e = u.pathname.match(/\/embed\/([^/?&]+)/);
        if (e) return e[1];
        if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
      } catch (_) {}
      return null;
    }

    function setStatus(msg, isAlt = false) {
      statusText.textContent = msg;
      statusText.className = isAlt ? 'alt' : '';
    }

    function showLoading() { loading.classList.add('show'); }
    function hideLoading() { loading.classList.remove('show'); }

    function loadAltServer(id, index = 0) {
      if (index >= ALT_SERVERS.length) {
        setStatus('Não foi possível reproduzir. Tente abrir no YouTube →', true);
        hideLoading();
        return;
      }
      const url = ALT_SERVERS[index](id) + '?autoplay=1';
      container.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.allow = 'autoplay; fullscreen; picture-in-picture';
      iframe.allowFullscreen = true;
      // Se o iframe falhar, tenta o próximo servidor
      iframe.onerror = () => loadAltServer(id, index + 1);
      container.appendChild(iframe);
      setStatus(`Servidor alternativo${index > 0 ? ' ' + (index + 1) : ''} (Piped/Invidious)`, true);
      hideLoading();
    }

    function loadYouTube(id) {
      container.innerHTML = '<div id="yt-target"></div>';
      showLoading();

      if (!apiReady) {
        // API ainda não carregou: usa iframe direto e mostra alternativa manual
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        container.innerHTML = '';
        container.appendChild(iframe);
        setStatus('Reproduzindo via YouTube');
        hideLoading();
        return;
      }

      if (ytPlayer) { try { ytPlayer.destroy(); } catch (_) {} ytPlayer = null; }

      ytPlayer = new YT.Player('yt-target', {
        videoId: id,
        playerVars: { autoplay: 1, rel: 0 },
        events: {
          onReady: () => hideLoading(),
          onError: (e) => {
            // 101, 150, 153 = incorporação bloqueada
            if ([101, 150, 153].includes(e.data)) {
              setStatus('YouTube bloqueou. Tentando servidor alternativo…', true);
              showLoading();
              loadAltServer(id);
            } else {
              hideLoading();
            }
          }
        }
      });

      setStatus('Reproduzindo via YouTube');
    }

    function play() {
      const raw = input.value.trim();
      const id = raw ? extractVideoId(raw) : null;

      if (!id) {
        errorMsg.style.display = 'block';
        section.classList.remove('visible');
        placeholder.style.display = 'flex';
        return;
      }

      errorMsg.style.display = 'none';
      currentId = id;
      directLink.href = `https://www.youtube.com/watch?v=${id}`;
      section.classList.add('visible');
      placeholder.style.display = 'none';
      loadYouTube(id);
    }

    btn.addEventListener('click', play);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') play(); });
  </script>
</body>
</html>
