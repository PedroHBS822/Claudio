name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Injetar chaves de API
        working-directory: SkyTracker
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          OW_KEY="${OPENWEATHER_KEY:-PLACEHOLDER_OW}"
          MP_KEY="${MAPS_KEY:-PLACEHOLDER_MAPS}"
          sed -i "s/YOUR_OPENWEATHERMAP_API_KEY/$OW_KEY/g" app/build.gradle.kts
          sed -i "s/YOUR_GOOGLE_MAPS_API_KEY/$MP_KEY/g"    app/build.gradle.kts

      - name: Build APK Debug
        working-directory: SkyTracker
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyTracker-debug
          path: SkyTracker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
