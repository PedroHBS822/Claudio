<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1cb0f6">
<title>FisLingo</title>
<style>
:root{
  --green:#58cc02;--green-d:#58a700;--green-l:#d7ffb8;--green-t:#58a700;
  --blue:#1cb0f6;--blue-d:#1899d6;--blue-l:#ddf4ff;
  --red:#ff4b4b;--red-d:#ea2b2b;--red-l:#ffdfe0;--red-t:#ea2b2b;
  --gold:#ffc800;--gold-d:#e5a500;--orange:#ff9600;--purple:#ce82ff;
  --bg:#ffffff;--bg2:#f7f7f7;--text:#3c3c3c;--muted:#777777;--border:#e5e5e5;--border-d:#d0d0d0;
  --locked:#e5e5e5;--locked-d:#c9c9c9;--card:#ffffff;--shadow:0 2px 0 var(--border);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24;--bg2:#1a2a31;--text:#f1f7fb;--muted:#9fb0ba;--border:#37464f;--border-d:#52656f;
    --locked:#37464f;--locked-d:#26343b;--card:#131f24;--green-l:#1f3a14;--blue-l:#12334a;--red-l:#3f1e22;
    --green-t:#79d634;--red-t:#ff7a7a;
  }
}
:root[data-theme="dark"]{
  --bg:#131f24;--bg2:#1a2a31;--text:#f1f7fb;--muted:#9fb0ba;--border:#37464f;--border-d:#52656f;
  --locked:#37464f;--locked-d:#26343b;--card:#131f24;--green-l:#1f3a14;--blue-l:#12334a;--red-l:#3f1e22;
  --green-t:#79d634;--red-t:#ff7a7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Nunito","Segoe UI Rounded","SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}
sup{font-size:.7em}
sub{font-size:.7em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.92em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.mx{display:inline-flex;vertical-align:middle;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:6px;padding:2px 6px;margin:0 4px}
.mx table{border-collapse:collapse}.mx td{padding:2px 9px;text-align:center;font-weight:700}
.sys{display:inline-block;border-left:3px solid currentColor;border-radius:10px 0 0 10px;padding:2px 12px;text-align:left;margin:6px 0;font-weight:700}
.nowrap{white-space:nowrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r);padding:13px 22px;font-weight:800;font-size:15px;letter-spacing:.6px;text-transform:uppercase;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:filter .15s,transform .05s;user-select:none}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn[disabled]{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-d);cursor:not-allowed;filter:none}
.btn[disabled]:active{transform:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#6b4a00}
.btn.ghost{background:var(--bg);color:var(--blue);border:2px solid var(--border);box-shadow:0 4px 0 var(--border)}
.btn.ghost.dark{color:var(--muted)}
.btn.white{background:#fff;color:var(--green-d);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px}
.link{background:none;border:none;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.5px;font-size:14px;padding:6px}

/* ---------- App layout ---------- */
#app{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:84px}
.rightpanel{display:none}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;color:var(--green);letter-spacing:-.5px}
.logo svg{width:34px;height:34px}
.stats{display:flex;gap:4px;align-items:center}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:6px 8px;border-radius:12px;background:none;border:none}
.stat:hover{background:var(--bg2)}
.stat .ic{font-size:19px;line-height:1}
.stat.fire{color:var(--orange)}.stat.gem{color:var(--blue)}.stat.heart{color:var(--red)}.stat.lvl{color:var(--gold-d)}
.stat.off{filter:grayscale(1);opacity:.6}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid transparent;background:none;border-radius:14px;padding:5px 2px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.navbtn .ic{font-size:24px;line-height:1.1}
.navbtn.active{border-color:#84d8ff;background:var(--blue-l);color:var(--blue)}
.navbtn .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 5px}
.view{flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px 14px}
@media (max-width:430px){.topbar .logo span{display:none}.stat{padding:6px 5px;font-size:14px}.stat .ic{font-size:17px}.topbar{padding:10px 8px}}
@media (min-width:760px){
  .bottomnav{display:none}
  .main{padding-bottom:0;margin-left:92px}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:fixed;top:0;bottom:0;left:0;width:92px;border-right:2px solid var(--border);padding:18px 10px;background:var(--bg);z-index:40}
  .sidebar .logo{justify-content:center;margin-bottom:16px}
  .sidebar .logo span{display:none}
  .sidebar .navbtn{flex:none;flex-direction:column;padding:10px 4px;font-size:10px}
  .topbar .logo{visibility:hidden}
}
@media (min-width:1150px){
  .main{margin-left:250px;margin-right:380px}
  .sidebar{width:250px;padding:24px 16px}
  .sidebar .logo{justify-content:flex-start;padding-left:12px}
  .sidebar .logo span{display:inline}
  .sidebar .navbtn{flex-direction:row;gap:16px;font-size:15px;padding:10px 16px;justify-content:flex-start;letter-spacing:.8px}
  .sidebar .navbtn .ic{font-size:28px}
  .rightpanel{display:flex;flex-direction:column;gap:18px;position:fixed;right:0;top:0;bottom:0;width:380px;padding:18px 24px;overflow-y:auto;border-left:2px solid var(--border);background:var(--bg)}
  .topbar .stats{display:none}
  .topbar{border-bottom:none;position:static;padding:4px}
  .mobile-only{display:none!important}
}

/* ---------- Cards ---------- */
.card{border:2px solid var(--border);border-radius:var(--r);padding:16px;background:var(--card)}
.card h3{font-size:18px;font-weight:900;margin-bottom:6px}
.card .muted,.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.pbar{height:16px;background:var(--border);border-radius:999px;overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .5s cubic-bezier(.3,1.3,.6,1);position:relative}
.pbar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.pbar.gold>i{background:var(--gold)}
.pbar.blue>i{background:var(--blue)}
.pbar.orange>i{background:var(--orange)}
.section-title{font-size:22px;font-weight:900;margin:8px 0 12px}
.goalstrip{display:flex;align-items:center;gap:12px;margin-bottom:14px}

/* ---------- Learning path ---------- */
.unit{margin-bottom:34px}
.unit-head{border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit-head h2{font-size:20px;font-weight:900;line-height:1.2}
.unit-head p{font-size:14px;opacity:.95;margin-top:3px}
.unit-head .guide{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:14px;padding:9px 12px;font-weight:800;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.unit-head .guide:hover{background:rgba(255,255,255,.28)}
.unit.locked .unit-head{filter:grayscale(.55) brightness(.95)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:28px 0 6px}
.prow{position:relative;width:100%;display:flex;justify-content:center;height:96px}
.nodewrap{position:relative;transition:transform .2s}
.node{position:relative;width:72px;height:72px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--c);box-shadow:0 8px 0 var(--cd);transition:transform .08s,filter .15s}
.node:hover{filter:brightness(1.06)}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.node.locked{--c:var(--locked);--cd:var(--locked-d);color:var(--muted)}
.node.locked .nic{filter:grayscale(1);opacity:.55}
.node.gold{--c:var(--gold);--cd:var(--gold-d)}
.node .nic{font-size:30px;line-height:1;color:#fff;font-weight:900}
.ring{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--border) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));pointer-events:none}
.crown{position:absolute;right:-8px;bottom:-6px;background:var(--gold);color:#6b4a00;font-size:12px;font-weight:900;border-radius:10px;padding:1px 6px;border:2px solid var(--bg);z-index:2}
.duebadge{position:absolute;left:-8px;top:-6px;background:var(--orange);color:#fff;font-size:13px;font-weight:900;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);z-index:2}
.startlbl{position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:var(--bg);border:2px solid var(--border);color:var(--c);font-weight:900;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:3;letter-spacing:.5px}
.startlbl::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--bg);border-right:2px solid var(--border);border-bottom:2px solid var(--border);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.trophy{font-size:44px;filter:grayscale(1);opacity:.5}
.trophy.won{filter:none;opacity:1;animation:bob2 2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{position:absolute;top:94px;left:50%;width:min(320px,calc(100vw - 32px));transform:translateX(-50%);background:var(--c);color:#fff;border-radius:var(--r);padding:16px;z-index:20;box-shadow:0 6px 0 var(--cd),0 10px 30px rgba(0,0,0,.18);animation:popin .18s ease-out}
.pop.locked{background:var(--bg2);color:var(--muted);box-shadow:0 0 0 2px var(--border)}
.pop .arrow{position:absolute;top:-8px;width:18px;height:18px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop h4{font-size:19px;font-weight:900;margin-bottom:2px}
.pop p{font-size:14px;opacity:.95;margin-bottom:10px}
.pop .btns{display:flex;flex-direction:column;gap:10px}
.pop .btn.white{color:var(--cd)}
.pop .btn.clear{background:rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(0,0,0,.12);color:#fff}
.strength{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.strength i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.strength i.on{background:#fff}
@keyframes popin{from{opacity:0;transform:translateX(-50%) scale(.92)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.mascot-deco{position:absolute;width:110px;opacity:.95;pointer-events:none}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;border:2px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--card)}
.item .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;color:#fff;font-weight:900}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item small{color:var(--muted);font-size:13px}
.minibar{height:8px;border-radius:8px;background:var(--border);overflow:hidden;margin-top:6px}
.minibar i{display:block;height:100%;background:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statbox{border:2px solid var(--border);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:center}
.statbox .big{font-size:20px;font-weight:900;line-height:1.1}
.statbox small{color:var(--muted);font-size:13px}
.statbox .ic{font-size:26px}
.practice-card{display:flex;gap:14px;align-items:center;border:2px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;background:var(--card)}
.practice-card .pic{font-size:40px;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.practice-card h3{font-size:18px;font-weight:900}
.practice-card p{color:var(--muted);font-size:14px;margin:2px 0 10px}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.week span{display:flex;margin:4px auto 0;width:34px;height:34px;border-radius:50%;background:var(--border);align-items:center;justify-content:center;font-size:17px}
.week span.on{background:var(--orange)}
.week span.today{outline:3px solid var(--orange);outline-offset:2px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ach div{border:2px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
.ach div .e{font-size:34px}
.ach div b{display:block;font-size:14px}
.ach div small{font-size:12px;color:var(--muted)}
.ach div.off{opacity:.45;filter:grayscale(1)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--border);border-bottom-width:4px;background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:800}
.seg button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.switch{position:relative;width:52px;height:30px;border-radius:30px;background:var(--border);border:none;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--green)}.switch.on::after{left:25px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--border)}
.setting:last-child{border-bottom:none}
.namein{font-size:22px;font-weight:900;border:2px solid transparent;border-radius:12px;padding:4px 8px;background:none;color:var(--text);width:100%}
.namein:focus{outline:none;border-color:var(--blue)}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;border:4px solid var(--bg);box-shadow:0 0 0 3px var(--border)}

/* ---------- Lesson ---------- */
.lesson{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:1000px;width:100%;margin:0 auto}
.ltop .x{background:none;border:none;font-size:26px;color:var(--muted);width:36px;height:36px;border-radius:10px;line-height:1}
.ltop .x:hover{background:var(--bg2)}
.ltop .pbar{flex:1}
.lhearts{font-weight:900;color:var(--red);font-size:18px;display:flex;align-items:center;gap:4px;min-width:52px;justify-content:flex-end}
.ltimer{font-weight:900;color:var(--blue);font-size:18px;min-width:60px;text-align:right}
.lbody{flex:1;overflow-y:auto;padding:8px 16px 24px}
.lin{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.combo{color:var(--orange);font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase;height:20px;margin-bottom:4px}
.rev-tag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;color:var(--purple);font-weight:900;font-size:13px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.new-tag{display:inline-flex;align-self:flex-start;color:var(--blue);font-weight:900;font-size:13px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.qtitle{font-size:22px;font-weight:900;margin-bottom:16px;line-height:1.25}
@media (min-width:760px){.qtitle{font-size:28px}}
.qwrap{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}
.qwrap .ms{width:84px;flex:none}
.bubble{position:relative;border:2px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:19px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:var(--bg);border-left:2px solid var(--border);border-bottom:2px solid var(--border);transform:rotate(45deg)}
.bubble b{font-weight:900}
.visual{display:flex;justify-content:center;margin:0 0 16px}
.visual svg{max-width:100%;height:auto}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:520px){.opts.g2{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--border);border-bottom-width:4px;border-radius:var(--r);background:var(--bg);padding:14px 16px;font-size:19px;font-weight:700;text-align:left;min-height:62px;transition:background .1s,border-color .1s}
.opt:hover{background:var(--bg2)}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);font-weight:800}
.opt.sel{border-color:#84d8ff;background:var(--blue-l);color:var(--blue)}
.opt.sel .k{border-color:#84d8ff;color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-t)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-t)}
.opts.done .opt{pointer-events:none}
.tf{grid-template-columns:1fr 1fr!important}
.tf .opt{justify-content:center;font-size:20px;min-height:84px;flex-direction:column;gap:4px}
.tf .opt .e{font-size:30px}
.ansin{width:100%;font-size:24px;font-weight:800;border:2px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);padding:16px 18px;outline:none}
.ansin:focus{border-color:var(--blue);background:var(--bg)}
.ansin.ok{border-color:var(--green);color:var(--green-t)}
.ansin.bad{border-color:var(--red);color:var(--red-t)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keys button{border:2px solid var(--border);border-bottom-width:4px;border-radius:12px;background:var(--bg);font-size:18px;font-weight:800;min-width:48px;height:44px;padding:0 10px}
.keys button:active{transform:translateY(2px);border-bottom-width:2px}
.unit-note{color:var(--muted);font-weight:700;margin-top:8px;font-size:14px}
.sentence{font-size:24px;font-weight:800;line-height:2.1;border:2px solid var(--border);border-radius:var(--r);padding:18px;text-align:center;overflow-wrap:anywhere}
.blank{width:96px;font-size:22px;font-weight:900;text-align:center;border:none;border-bottom:3px solid var(--blue);background:var(--blue-l);color:var(--text);border-radius:8px 8px 0 0;padding:2px 4px;outline:none;vertical-align:middle;line-height:1.3}
sup .blank,.fr .blank{width:64px;font-size:18px}
.blank.ok{border-color:var(--green);background:var(--green-l)}
.blank.bad{border-color:var(--red);background:var(--red-l)}
.slot{display:inline-flex;min-width:90px;min-height:46px;vertical-align:middle;border-bottom:3px solid var(--border-d);margin:0 6px;justify-content:center;align-items:center}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.tile{border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;background:var(--bg);padding:9px 16px;font-size:20px;font-weight:800;min-width:56px;min-height:48px}

.tile.used{background:var(--border);color:transparent;border-color:var(--border);pointer-events:none}
.slot .tile{margin:2px 0}
.lfoot{border-top:2px solid var(--border);padding:16px;background:var(--bg);transition:background .2s}
.lfoot .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lfoot .tools{display:flex;gap:8px}
.lfoot .fbtxt{display:none;flex:1;min-width:0}
.lfoot.ok{background:var(--green-l);border-top-color:transparent}
.lfoot.bad{background:var(--red-l);border-top-color:transparent}
.lfoot.ok .fbtxt,.lfoot.bad .fbtxt{display:flex;gap:14px;align-items:flex-start}
.lfoot.ok .tools,.lfoot.bad .tools{display:none}
.fbicon{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.lfoot.ok .fbicon{color:var(--green)}.lfoot.bad .fbicon{color:var(--red)}
.fbtitle{font-size:22px;font-weight:900}
.lfoot.ok .fbtitle,.lfoot.ok .fbdetail{color:var(--green-t)}
.lfoot.bad .fbtitle,.lfoot.bad .fbdetail{color:var(--red-t)}
.fbdetail{font-size:15px;font-weight:600;max-height:30vh;overflow-y:auto}
.fbdetail .ans{font-weight:900;font-size:17px}
.fbdetail .why{margin-top:4px}
.fbactions{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none}
.lfoot .btn{min-width:150px}
.toolbtn{border:2px solid var(--border);border-bottom-width:4px;background:var(--bg);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;text-transform:uppercase;letter-spacing:.4px}
.toolbtn:active{transform:translateY(2px);border-bottom-width:2px}
@media (max-width:600px){
  .lfoot .in{flex-direction:column;align-items:stretch}
  .lfoot .btn{width:100%}
  .lfoot .tools{justify-content:space-between}
  .toolbtn .t{display:none}
  .toolbtn{padding:10px 16px;font-size:18px}
  .lfoot.ok .fbtxt,.lfoot.bad .fbtxt{width:100%}
  .fbicon{width:40px;height:40px;font-size:22px}
  .fbtitle{font-size:19px}
  .fbactions{flex-direction:column-reverse}
  .footrow{display:flex;gap:10px;align-items:center}
  .footrow .tools{flex:none}
  .footrow .btn{flex:1}
  .qwrap .ms{width:64px}
  .bubble{font-size:17px}
  .sentence{font-size:20px;padding:14px 10px}
}
.footrow{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pulse{animation:pulse .45s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

/* results */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:10px 0}
.result h1{font-size:30px;font-weight:900;color:var(--gold-d)}
.result h1.fail{color:var(--red)}

.rstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}

.rstat .h{background:var(--c);color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;padding:4px;letter-spacing:.6px}
.rstat .v{font-size:22px;font-weight:900;padding:10px 6px;color:var(--c)}
.mistakes{width:100%;text-align:left}

.mistakes summary{font-weight:800;cursor:pointer}
.mistakes .mq{margin-top:10px;padding-top:10px;border-top:2px solid var(--border);font-size:15px}

/* ---------- Modal / sheet ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:350;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg);border-radius:20px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal .close{position:absolute;right:12px;top:12px;background:none;border:none;font-size:24px;color:var(--muted);width:36px;height:36px;border-radius:10px}

.modal .center{text-align:center}

.theory h3{font-size:18px;font-weight:900;margin:18px 0 6px;color:var(--blue)}

.theory ul{padding-left:20px}
.theory .ex{background:var(--bg2);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.theory .formula{background:var(--blue-l);border-radius:12px;padding:10px 14px;margin:10px 0;text-align:center;font-weight:800;font-size:17px}
.theory table{border-collapse:collapse;margin:8px 0;width:100%;font-size:15px}
.theory td,.theory th{border:2px solid var(--border);padding:6px 8px;text-align:center}
.theory th{background:var(--bg2)}

/* ---------- Chat ---------- */
.chat{position:fixed;z-index:300;right:0;bottom:0;top:0;width:min(420px,100%);background:var(--bg);border-left:2px solid var(--border);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.chat.open{transform:none}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.chip{border:2px solid var(--border);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--blue)}
.chip:hover{background:var(--blue-l)}
.chat-f{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}

.fab{position:fixed;right:16px;bottom:92px;z-index:45;width:60px;height:60px;border-radius:50%;border:none;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);font-size:28px;color:#fff}
.fab:active{transform:translateY(4px);box-shadow:none}
@media (min-width:760px){.fab{bottom:24px}}
@media (min-width:1150px){.fab{right:404px}}

/* ---------- Toast / confetti ---------- */
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:500;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .25s ease-out;max-width:calc(100vw - 32px);text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:400;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.float-xp{position:fixed;z-index:450;font-weight:900;color:var(--gold-d);font-size:22px;pointer-events:none;animation:floatup 1s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.empty{text-align:center;color:var(--muted);padding:20px}

/* ---------- v2: trilha, memória, cartões ---------- */

.trophybtn{width:86px;height:80px;border-radius:24px;border:none;font-size:46px;background:var(--locked);box-shadow:0 7px 0 var(--locked-d);filter:grayscale(1);opacity:.7}

.trophybtn~.nlabel{top:96px}
.endcard{display:flex;align-items:center;gap:12px;border:2px dashed var(--border);border-radius:var(--r);padding:14px;margin:0 0 40px;color:var(--muted);font-size:14px}

.plan h3{margin-bottom:8px}
.planrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:2px solid var(--border);padding:10px 2px;text-align:left}

.planrow .pt{flex:1;min-width:0;display:flex;flex-direction:column}.planrow .pt b{font-size:15px}.planrow .pt small{color:var(--muted);font-size:12.5px}

.memtile .mb{width:100%;height:7px;border-radius:7px;background:var(--border);overflow:hidden}.memtile .mb i{display:block;height:100%;background:var(--m)}

.how{margin-top:18px}.how summary{cursor:pointer}.how ul{padding-left:20px;margin-top:10px;font-size:14.5px;color:var(--muted)}.how li{margin:6px 0}
.intro-ex{border:2px solid var(--border);border-left:6px solid var(--green);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:16px}

.icard,.cardlist>div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--border);font-size:15px}
.icard span,.cardlist span{color:var(--muted)}.icard b,.cardlist b{text-align:right}
.cardlist{border:2px solid var(--border);border-radius:12px;padding:4px 12px}
.cardlist>div:first-child{border-top:none}
.savednote{margin-top:6px;font-size:13px;opacity:.85}
.pbar.purple>i{background:var(--purple)}
.flash{perspective:1200px;position:relative;height:250px;max-width:520px;width:100%;margin:6px auto 0}
.fface{position:absolute;inset:0;border:2px solid var(--border);border-bottom-width:6px;border-radius:22px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,1.2,.5,1)}

.r1{background:#ff4b4b;box-shadow:0 4px 0 #ea2b2b}.r2{background:#ff9600;box-shadow:0 4px 0 #e07b00}.r3{background:#58cc02;box-shadow:0 4px 0 #58a700}.r4{background:#1cb0f6;box-shadow:0 4px 0 #1899d6}
.memres{width:100%;text-align:left}.memres>b{display:block;margin-bottom:6px}

.topicrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--border);flex-wrap:wrap}

<script>
"use strict";
/* =====================================================================
   MatLingo — utilitários
   ===================================================================== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const RNZ=(a,b)=>{let v=0;while(v===0)v=R(a,b);return v;};
const fact=n=>n<=1?1:n*fact(n-1);
const nCr=(n,r)=>{let v=1;for(let i=1;i<=r;i++)v=v*(n-r+i)/i;return Math.round(v);};
const round=(n,d=6)=>Math.round(n*10**d)/10**d;
/* número -> texto pt-BR (vírgula decimal, sinal de menos tipográfico) */
function fmt(n){ if(typeof n==='string')return n; const r=round(n,4); let s=String(Math.abs(r)); if(s.includes('e')) s=Math.abs(r).toFixed(8).replace(/0+$/,''); s=s.replace('.',','); return (r<0?'−':'')+s; }
/* milhares com ponto */
function nf(n){ const neg=n<0; n=Math.abs(n); const [i,d]=String(round(n,4)).split('.'); const ii=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return (neg?'−':'')+ii+(d?','+d:''); }
const money=v=>'R$ '+nf(round(v,2)).replace(/,(\d)$/,',$10').replace(/^([^,]*)$/,'$1,00');
const par=n=>n<0?`(${fmt(n)})`:fmt(n);
const sgn=(n,first)=>first?fmt(n):(n<0?` − ${fmt(-n)}`:` + ${fmt(n)}`);
/* frações */
function F(n,d){ if(typeof n==='number'&&typeof d==='number'&&d<0){n=-n;d=-d;} const neg=typeof n==='number'&&n<0; return `${neg?'−':''}<span class="fr"><span>${neg?-n:n}</span><span>${d}</span></span>`; }
function simp(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); return [n/g,d/g]; }
function Fs(n,d){ [n,d]=simp(n,d); return d===1?fmt(n):F(n,d); }
function fkey(n,d){ [n,d]=simp(n,d); return d===1?String(n):`${n}/${d}`; }
const X2='x<sup>2</sup>';
function mono(c,v,first){ /* coeficiente*variável com sinal */ if(c===0)return ''; const a=Math.abs(c); const body=(a===1&&v?'':fmt(a))+v; if(first) return (c<0?'−':'')+body; return c<0?` − ${body}`:` + ${body}`; }
function poly(cs,vars){ let s='',first=true; cs.forEach((c,i)=>{ if(c===0)return; s+=mono(c,vars[i],first); first=false; }); return s||'0'; }
const lin=(a,b,v='x')=>poly([a,b],[v,'']);
const quad=(a,b,c)=>poly([a,b,c],[X2,'x','']);
function stripHtml(h){ return String(h).replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'$1/$2').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(); }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/−|–/g,'-').replace(/[×·*]/g,'').replace(/\s+/g,'').replace(/^[a-z]\s*=/,''); }
function parseNum(s){
  s=String(s).trim().toLowerCase().replace(/−|–/g,'-').replace(/\s+/g,'').replace(/^r\$/,'').replace(/reais|graus|°|%/g,'');
  s=s.replace(/^[a-z]=/,'');
  let sm=s.match(/^(-?\d+(?:[.,]\d+)?)(?:\*|x|×|·)10\^?\(?(-?\d+)\)?$/)||s.match(/^(-?\d+(?:[.,]\d+)?)e(-?\d+)$/); if(sm) return parseFloat(sm[1].replace(',','.'))*10**parseInt(sm[2]);
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'');
  s=s.replace(',','.');
  let m;
  if((m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/))){ const d=parseFloat(m[2]); return d===0?NaN:parseFloat(m[1])/d; }
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  return NaN;
}
function numEq(u,v,tol){ const p=parseNum(u); if(isNaN(p))return false; return Math.abs(p-v)<=(tol||1e-6*Math.max(1,Math.abs(v))); }

/* =====================================================================
   Construtores de questões
   ===================================================================== */
const DEFHINT='Leia o enunciado com calma e, se precisar, abra a aula desta habilidade.';
function MC(prompt,correct,wrongs,exp,hint,o={}){
  hint=hint||DEFHINT;
  correct=String(correct); const n=o.n||4; const opts=[correct];
  for(const w of wrongs){ const s=String(w); if(!opts.includes(s)&&stripHtml(s)!==stripHtml(correct)&&opts.length<n) opts.push(s); }
  const sc=stripHtml(correct); const c=/^[−-]?[\d.,]+$/.test(sc)?parseNum(sc.replace(/\./g,'')):NaN;
  if(opts.length<n&&!isNaN(c)){ for(let k=1;opts.length<n&&k<60;k++){ const v=fmt(c+(k%2?Math.ceil(k/2):-Math.ceil(k/2))*(o.step||1)); if(!opts.includes(v))opts.push(v);} }
  if(o.keep){ const ord=wrongs.map(String); opts.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)); }
  return {type:'mc',prompt,options:o.keep?opts:shuffle(opts),correct,answer:correct,exp,hint,visual:o.visual};
}
function TF(statement,truth,exp,hint,o={}){
  hint=hint||DEFHINT;
  return {type:'tf',prompt:statement,options:['Verdadeiro','Falso'],correct:truth?'Verdadeiro':'Falso',answer:truth?'Verdadeiro':'Falso',exp,hint,visual:o.visual};
}
function NUM(prompt,value,exp,hint,o={}){
  hint=hint||DEFHINT;
  return {type:'input',numeric:true,prompt,value,key:o.key||String(round(value,4)).replace('.',','),answer:o.answer||nf(value),
    check:u=>numEq(u,value,o.tol)||(o.accept||[]).some(a=>norm(a)===norm(u)),exp,hint,unit:o.unit,visual:o.visual,keys:o.keys};
}
function FRAC(prompt,n,d,exp,hint,o={}){ /* resposta fracionária (aceita qualquer forma equivalente) */
  return NUM(prompt,n/d,exp,hint,Object.assign({key:fkey(n,d),answer:Fs(n,d),keys:['/','−']},o));
}
function TXT(prompt,accepts,exp,hint,o={}){
  hint=hint||DEFHINT;
  return {type:'input',numeric:false,prompt,key:accepts[0],answer:o.answer||accepts[0],check:u=>accepts.some(a=>norm(a)===norm(u)),exp,hint,visual:o.visual,keys:o.keys};
}
function FILL(prompt,sentence,value,exp,hint,o={}){
  const q=NUM(prompt,value,exp,hint,o); q.type='fill'; q.sentence=sentence; return q;
}
function BANK(prompt,sentence,correct,wrongs,exp,hint,o={}){
  const q=MC(prompt,correct,wrongs,exp,hint,o); q.type='bank'; q.sentence=sentence; return q;
}

/* =====================================================================
   Ilustrações SVG
   ===================================================================== */
const SV=(w,h,body)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="inherit" font-weight="800">${body}</svg>`;
function pieSVG(n,k,color='#1cb0f6'){
  const cx=80,cy=80,r=70; let p='';
  if(n===1) return SV(160,160,`<circle cx="80" cy="80" r="70" fill="${color}" stroke="#3c3c3c" stroke-width="3"/>`);
  for(let i=0;i<n;i++){ const a1=-Math.PI/2+i*2*Math.PI/n,a2=a1+2*Math.PI/n;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    p+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${i<k?color:'#fff'}" stroke="#3c3c3c" stroke-width="3" stroke-linejoin="round"/>`; }
  return SV(160,160,p);
}
function barSVG(n,k,color='#58cc02'){ const w=Math.min(40,260/n); let p=''; for(let i=0;i<n;i++) p+=`<rect x="${4+i*w}" y="4" width="${w}" height="50" rx="4" fill="${i<k?color:'#fff'}" stroke="#3c3c3c" stroke-width="3"/>`; return SV(n*w+8,58,p); }
function rectSVG(wl,hl,wr=1.6,fill='#ddf4ff'){ const W=200,H=Math.max(60,Math.min(150,200/wr)); return SV(W+90,H+60,`<rect x="45" y="15" width="${W}" height="${H}" rx="4" fill="${fill}" stroke="#1899d6" stroke-width="4"/><text x="${45+W/2}" y="${H+48}" text-anchor="middle" fill="#1899d6" font-size="20">${wl}</text><text x="${W+55}" y="${15+H/2+7}" fill="#1899d6" font-size="20">${hl}</text>`); }
function squareSVG(l){ return SV(200,180,`<rect x="40" y="15" width="130" height="130" rx="4" fill="#d7ffb8" stroke="#58a700" stroke-width="4"/><text x="105" y="172" text-anchor="middle" fill="#58a700" font-size="20">${l}</text>`); }
/* triângulo retângulo: rótulos a (vertical), b (horizontal), c (hipotenusa), theta opcional no vértice inferior direito */
function rtSVG(a,b,c,theta){ const body=`<polygon points="40,20 40,170 250,170" fill="#fff4d6" stroke="#ff9600" stroke-width="4" stroke-linejoin="round"/><polyline points="40,150 60,150 60,170" fill="none" stroke="#ff9600" stroke-width="3"/>
 <text x="30" y="100" text-anchor="end" fill="#e07b00" font-size="20">${a}</text><text x="145" y="196" text-anchor="middle" fill="#e07b00" font-size="20">${b}</text><text x="158" y="85" fill="#e07b00" font-size="20">${c}</text>${theta?`<path d="M215,170 A35,35 0 0 0 222,150" fill="none" stroke="#ce82ff" stroke-width="3"/><text x="196" y="160" fill="#a568cc" font-size="18">${theta}</text>`:''}`; return SV(290,205,body); }
function triSVG(A,B,C){ return SV(280,190,`<polygon points="30,165 250,165 110,25" fill="#f3e3ff" stroke="#ce82ff" stroke-width="4" stroke-linejoin="round"/><text x="58" y="155" fill="#a568cc" font-size="18">${A}</text><text x="222" y="155" text-anchor="end" fill="#a568cc" font-size="18">${B}</text><text x="110" y="62" text-anchor="middle" fill="#a568cc" font-size="18">${C}</text>`); }
function circleSVG(lbl,diam){ return SV(200,180,`<circle cx="100" cy="90" r="75" fill="#ddf4ff" stroke="#1899d6" stroke-width="4"/><circle cx="100" cy="90" r="4" fill="#1899d6"/><line x1="${diam?25:100}" y1="90" x2="175" y2="90" stroke="#1899d6" stroke-width="3" stroke-dasharray="6 4"/><text x="${diam?100:138}" y="80" text-anchor="middle" fill="#1899d6" font-size="18">${lbl}</text>`); }
function angleSVG(deg){ const r=110,a=deg*Math.PI/180,x=40+r*Math.cos(a),y=160-r*Math.sin(a); const ax=40+40*Math.cos(a/2),ay=160-40*Math.sin(a/2);
  return SV(270,190,`<line x1="40" y1="160" x2="${40+r+40}" y2="160" stroke="#3c3c3c" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="160" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#3c3c3c" stroke-width="4" stroke-linecap="round"/><path d="M${40+30},160 A30,30 0 ${deg>180?1:0} 0 ${(40+30*Math.cos(a)).toFixed(1)},${(160-30*Math.sin(a)).toFixed(1)}" fill="none" stroke="#ff4b4b" stroke-width="3"/><text x="${(ax+14).toFixed(0)}" y="${(ay-4).toFixed(0)}" fill="#ea2b2b" font-size="16">?</text>`); }
function trapSVG(B,b,h){ return SV(300,180,`<polygon points="30,150 270,150 200,30 90,30" fill="#fff4d6" stroke="#ff9600" stroke-width="4" stroke-linejoin="round"/><line x1="145" y1="30" x2="145" y2="150" stroke="#ff9600" stroke-width="2" stroke-dasharray="6 4"/><text x="150" y="174" text-anchor="middle" fill="#e07b00" font-size="18">${B}</text><text x="145" y="22" text-anchor="middle" fill="#e07b00" font-size="18">${b}</text><text x="152" y="98" fill="#e07b00" font-size="18">${h}</text>`); }
function boxSVG(a,b,c){ return SV(260,190,`<polygon points="30,70 170,70 170,170 30,170" fill="#ddf4ff" stroke="#1899d6" stroke-width="3"/><polygon points="30,70 80,30 220,30 170,70" fill="#b8e6ff" stroke="#1899d6" stroke-width="3"/><polygon points="170,70 220,30 220,130 170,170" fill="#8fd5ff" stroke="#1899d6" stroke-width="3"/><text x="100" y="188" text-anchor="middle" fill="#1899d6" font-size="16">${a}</text><text x="236" y="104" fill="#1899d6" font-size="16">${c}</text><text x="206" y="162" fill="#1899d6" font-size="16">${b}</text>`); }
function cylSVG(r,h){ return SV(200,200,`<ellipse cx="100" cy="160" rx="60" ry="18" fill="#d7ffb8" stroke="#58a700" stroke-width="3"/><rect x="40" y="40" width="120" height="120" fill="#d7ffb8"/><line x1="40" y1="40" x2="40" y2="160" stroke="#58a700" stroke-width="3"/><line x1="160" y1="40" x2="160" y2="160" stroke="#58a700" stroke-width="3"/><ellipse cx="100" cy="40" rx="60" ry="18" fill="#b5f08a" stroke="#58a700" stroke-width="3"/><line x1="100" y1="40" x2="160" y2="40" stroke="#58a700" stroke-width="2" stroke-dasharray="5 4"/><text x="130" y="34" text-anchor="middle" fill="#58a700" font-size="15">${r}</text><text x="170" y="105" fill="#58a700" font-size="15">${h}</text>`); }
function gridPtSVG(pts){ /* plano cartesiano com pontos [x,y,label] em -6..6 */ const s=14,o=100; let g=''; for(let i=-6;i<=6;i++){ g+=`<line x1="${o+i*s}" y1="${o-6*s}" x2="${o+i*s}" y2="${o+6*s}" stroke="#e5e5e5"/><line x1="${o-6*s}" y1="${o+i*s}" x2="${o+6*s}" y2="${o+i*s}" stroke="#e5e5e5"/>`; }
  g+=`<line x1="${o-6*s}" y1="${o}" x2="${o+6*s}" y2="${o}" stroke="#777" stroke-width="2"/><line x1="${o}" y1="${o-6*s}" x2="${o}" y2="${o+6*s}" stroke="#777" stroke-width="2"/>`;
  pts.forEach(([x,y,l])=>{ g+=`<circle cx="${o+x*s}" cy="${o-y*s}" r="5" fill="#ff4b4b"/><text x="${o+x*s+7}" y="${o-y*s-7}" fill="#ea2b2b" font-size="14">${l}</text>`; }); return SV(200,200,g); }
const MX=M=>`<span class="mx"><table>${M.map(r=>'<tr>'+r.map(v=>`<td>${fmt(v)}</td>`).join('')+'</tr>').join('')}</table></span>`;
const SYS=(...l)=>`<span class="sys">${l.join('<br>')}</span>`;

/* =====================================================================
   CONTEÚDO — Unidades, habilidades, teoria e geradores
   ===================================================================== */
/* insere uma habilidade numa unidade, logo após outra */
function insertSkill(uid,afterId,skill){ const u=UNITS.find(x=>x.id===uid); const i=u.skills.findIndex(s=>s.id===afterId); u.skills.splice(i<0?u.skills.length:i+1,0,skill); }
/* gráfico de barras com grade (leitura de gráficos) */
function chartSVG(cats,vals,step,color){ const W=300,H=200,ox=40,oy=165,mx=Math.ceil(Math.max(...vals)/step)*step,sy=140/mx,bw=Math.min(46,220/cats.length-14); let g='';
  for(let v=0;v<=mx;v+=step){ const y=oy-v*sy; g+=`<line x1="${ox}" y1="${y}" x2="${W-6}" y2="${y}" stroke="#e5e5e5"/><text x="${ox-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#777">${v}</text>`; }
  cats.forEach((c,i)=>{ const x=ox+14+i*(bw+14)+ (220-cats.length*(bw+14))/2; g+=`<rect x="${x}" y="${oy-vals[i]*sy}" width="${bw}" height="${vals[i]*sy}" rx="4" fill="${color||'#1cb0f6'}"/><text x="${x+bw/2}" y="${oy+16}" text-anchor="middle" font-size="12" fill="#777">${c}</text>`; });
  g+=`<line x1="${ox}" y1="${oy}" x2="${W-6}" y2="${oy}" stroke="#777" stroke-width="2"/>`; return SV(W,H,g); }
function lineSVG(cats,vals,step){ const W=300,H=200,ox=44,oy=165,mx=Math.ceil(Math.max(...vals)/step)*step,sy=140/mx,dx=230/(cats.length-1); let g='';

UNITS.push({id:'f3',title:'Dinâmica e Energia',sub:'1º ano EM · Newton, atrito, plano inclinado, trabalho, energia, impulso, gravitação',color:'#ff9600',dark:'#e07b00',skills:[
{id:'newton',name:'Leis de Newton',icon:'🍏',tip:'1ª lei: inércia. 2ª lei: F_R = m·a. 3ª lei: ação e reação têm mesmo módulo, sentidos opostos e atuam em corpos diferentes.',
theory:`<h3>1ª Lei — Inércia</h3><p>Um corpo tende a manter seu estado de repouso ou de movimento retilíneo uniforme se a força resultante for nula.</p>
<h3>2ª Lei — Princípio fundamental</h3><div class="formula">F<sub>R</sub> = m · a</div><p>1 N = 1 kg · m/s². A aceleração tem o sentido da força resultante.</p><div class="ex">F = 20 N num bloco de 4 kg → a = 5 m/s²</div>

gens:[

 lv=>{const m=R(1,20),a=R(1,10);return NUM(`Uma força resultante de <b>${m*a} N</b> age num corpo de <b>${m} kg</b>. Qual a aceleração?`,a,`a = F/m = ${m*a}/${m} = <b>${a} m/s²</b>.`,'a = F/m.',{unit:'m/s²'});},
 lv=>{const m=R(1,20),a=R(1,10);return NUM(`Uma força de <b>${m*a} N</b> produz aceleração de <b>${a} m/s²</b>. Qual a massa do corpo?`,m,`m = F/a = ${m*a}/${a} = <b>${m} kg</b>.`,'m = F/a.',{unit:'kg'});},
 lv=>{const m=R(2,10),a=R(1,6),F2=R(2,30),F1=F2+m*a;return NUM(`Um bloco de <b>${m} kg</b> recebe <b>${F1} N</b> para a direita e <b>${F2} N</b> para a esquerda. Qual sua aceleração?`,a,`F<sub>R</sub> = ${F1} − ${F2} = ${F1-F2} N; a = ${F1-F2}/${m} = <b>${a} m/s²</b>.`,'Ache a força resultante primeiro.',{unit:'m/s²',visual:blockSVG(F1+' N',F2+' N',m+' kg')});},
 lv=>{const q=pick([['Um passageiro é jogado para frente quando o ônibus freia bruscamente.','1ª lei (Inércia)'],['Quanto maior a força aplicada num carrinho, maior sua aceleração.','2ª lei (F = m·a)'],['Ao nadar, empurramos a água para trás e ela nos empurra para frente.','3ª lei (Ação e reação)'],['Um foguete sobe expelindo gases para baixo.','3ª lei (Ação e reação)'],['Uma toalha é puxada rapidamente e a louça permanece na mesa.','1ª lei (Inércia)'],['Um caminhão carregado precisa de mais força que um vazio para ter a mesma aceleração.','2ª lei (F = m·a)'],['O uso do cinto de segurança é necessário numa batida.','1ª lei (Inércia)']]);return MC(`Qual lei de Newton explica melhor: <b>${q[0]}</b>`,q[1],['1ª lei (Inércia)','2ª lei (F = m·a)','3ª lei (Ação e reação)'],`${q[1]}.`,'Inércia: tendência de manter o estado. F = m·a: força e aceleração. Ação e reação: pares de forças entre dois corpos.',{keep:true});},
 lv=>{const s=pick([['As forças de ação e reação atuam em corpos diferentes.',true],['As forças de ação e reação se anulam.',false],['Se a força resultante é nula, o corpo pode estar em movimento retilíneo uniforme.',true],['Todo corpo em movimento precisa de uma força resultante para continuar se movendo.',false],['A aceleração tem sempre o mesmo sentido da força resultante.',true]]);return TF(s[0],s[1],'Ação e reação atuam em corpos diferentes (não se anulam). Com F_R = 0 o corpo fica em repouso ou em MRU (inércia). A aceleração acompanha a força resultante.','Lembre das três leis de Newton.');},
]},
{id:'peso',name:'Peso, normal e tração',icon:'⚖️',tip:'P = m·g (g = 10 m/s²). Massa não muda de lugar para lugar; peso muda. Em elevador acelerando para cima: N = m(g + a).',
theory:`<div class="formula">P = m · g</div><p><b>Massa</b> (kg) é a quantidade de matéria e não muda. <b>Peso</b> (N) é a força gravitacional e depende de g (Terra ≈ 10 m/s², Lua ≈ 1,6 m/s²).</p>

<h3>Blocos ligados por fio</h3><p>Puxando o conjunto com F: a = F/(m<sub>1</sub> + m<sub>2</sub>); a tração no fio que puxa o bloco de trás é T = m<sub>trás</sub> · a.</p>`,
gens:[

 lv=>{const m=R(10,100);return NUM(`Um astronauta de <b>${m} kg</b> está na Lua (g = 1,6 m/s²). Qual é o seu peso lá?`,1.6*m,`P = ${m} · 1,6 = <b>${fmt(1.6*m)} N</b>. (A massa continua ${m} kg.)`,'Use o g da Lua.',{unit:'N',keys:[',']});},
 lv=>{const m=R(5,9)*10,a=pick([1,2,3]),up=Math.random()<.5;return NUM(`Uma pessoa de <b>${m} kg</b> está numa balança dentro de um elevador que acelera <b>${up?'para cima':'para baixo'}</b> a <b>${a} m/s²</b>. Qual a força normal (leitura em N)?`,m*(10+(up?a:-a)),`N = m(g ${up?'+':'−'} a) = ${m} · (10 ${up?'+':'−'} ${a}) = <b>${m*(10+(up?a:-a))} N</b>.`,'Acelerar para cima "aumenta" o peso aparente; para baixo, diminui.',{unit:'N'});},
 lv=>{const m1=R(1,6),m2=R(1,6),a=R(1,5),F=(m1+m2)*a,ask=Math.random()<.5;return NUM(`Dois blocos A (<b>${m1} kg</b>) e B (<b>${m2} kg</b>), ligados por um fio, são puxados por uma força de <b>${F} N</b> aplicada em B, sobre uma mesa sem atrito. Qual ${ask?'a aceleração do conjunto':'a tração no fio'}?`,ask?a:m1*a,`a = ${F}/(${m1} + ${m2}) = ${a} m/s².${ask?'':` O fio puxa só o bloco A: T = ${m1} · ${a} = <b>${m1*a} N</b>.`}${ask?` → <b>${a} m/s²</b>`:''}`,'Primeiro trate os blocos como um só corpo.',{unit:ask?'m/s²':'N'});},
 lv=>{const q=pick([['Um astronauta vai da Terra para a Lua. O que acontece?','A massa é a mesma e o peso diminui'],['Qual é a unidade de peso no SI?','newton (N)'],['Um livro em repouso sobre uma mesa horizontal: a normal é','igual ao peso']]);return MC(q[0],q[1],{'A massa é a mesma e o peso diminui':['A massa e o peso diminuem','A massa diminui e o peso é o mesmo','Nada muda'],'newton (N)':['quilograma (kg)','joule (J)','watt (W)'],'igual ao peso':['maior que o peso','menor que o peso','nula']}[q[1]],`${q[0]} → <b>${q[1]}</b>.`,'Massa é quantidade de matéria; peso é força.');},
]},
{id:'atrito',name:'Atrito',icon:'🧱',tip:'F_at = μ·N. Num plano horizontal N = m·g. O atrito estático impede o início do movimento; o cinético atua durante o deslizamento.',

 lv=>{const mu=pick([0.2,0.4,0.5]),v0=pick([4,8,10,20]);return NUM(`Um disco desliza a <b>${v0} m/s</b> e para só pelo atrito (μ = <b>${fmt(mu)}</b>). Qual a distância percorrida? (g = 10 m/s²)`,v0*v0/(2*mu*10),`a = μg = ${fmt(mu*10)} m/s². d = ${F(v0+'²','2·'+fmt(mu*10))} = <b>${fmt(v0*v0/(20*mu))} m</b>.`,'O atrito é a única força horizontal: a = μ·g.',{unit:'m',keys:[',']});},

 lv=>{const q=pick([['Com um bloco parado sobre uma rampa, o atrito que o mantém em repouso é:','estático',['cinético','nulo','magnético']],['Em geral, o coeficiente de atrito estático é ___ que o cinético.','maior',['menor','igual','sempre o dobro']],['O atrito entre o pneu e o chão, quando o carro anda sem derrapar, é:','estático',['cinético','nulo','sempre prejudicial']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Estático: sem deslizamento. Cinético: com deslizamento.');},

{id:'trab',name:'Trabalho e potência',icon:'🏋️',tip:'τ = F·d·cos θ (θ entre força e deslocamento; 90° → trabalho nulo). Potência P = τ/Δt = F·v. Rendimento η = P_útil/P_total.',

{id:'momento',name:'Impulso e quantidade de movimento',icon:'💥',tip:'Q = m·v; I = F·Δt = ΔQ. Em sistemas isolados (colisões, explosões), a quantidade de movimento total se conserva.',

 lv=>{const s=pick([['Numa colisão em sistema isolado, a quantidade de movimento total se conserva.',true],['Em toda colisão a energia cinética se conserva.',false],['Airbags aumentam o tempo de impacto e, assim, diminuem a força média.',true],['Quantidade de movimento é uma grandeza escalar.',false]]);return TF(s[0],s[1],'Q se conserva em sistemas isolados; energia cinética só em colisões elásticas. Como I = F·Δt, aumentar Δt diminui F. Q é vetorial.','Revise impulso e conservação.');},
]},

theory:`<h3>Calor sensível (muda a temperatura)</h3><div class="formula">Q = m · c · ΔT</div><p>c = calor específico (água: 1 cal/g·°C). Capacidade térmica: C = m·c.</p>

<h3>Equilíbrio térmico</h3><p>Q<sub>cedido</sub> + Q<sub>recebido</sub> = 0. Misturando massas iguais de água, a temperatura final é a média.</p>
<h3>Mudanças de estado</h3><p>Fusão (s→l), solidificação (l→s), vaporização (l→g), condensação (g→l), sublimação (s→g).</p>`,
gens:[
 lv=>{const m=R(1,50)*10,dT=R(5,80);return NUM(`Quanto calor é necessário para aquecer <b>${m} g</b> de água em <b>${dT} °C</b>? (c = 1 cal/g·°C)`,m*dT,`Q = m·c·ΔT = ${m}·1·${dT} = <b>${nf(m*dT)} cal</b>.`,'Q = m·c·ΔT.',{unit:'cal'});},
 lv=>{const m=R(1,20)*10,dT=R(2,40),c=pick([0.1,0.2,0.5]);return NUM(`Um corpo de <b>${m} g</b> (c = ${fmt(c)} cal/g·°C) recebe <b>${fmt(m*c*dT)} cal</b>. Qual a variação de temperatura?`,dT,`ΔT = ${F('Q','m·c')} = ${F(fmt(m*c*dT),`${m}·${fmt(c)}`)} = <b>${dT} °C</b>.`,'Isole ΔT em Q = m·c·ΔT.',{unit:'°C'});},
 lv=>{const m=R(1,20)*10,t=Math.random()<.5;return NUM(`Quanto calor é necessário para ${t?'derreter':'vaporizar'} <b>${m} g</b> de ${t?'gelo a 0 °C':'água a 100 °C'}? (L = ${t?80:540} cal/g)`,m*(t?80:540),`Q = m·L = ${m}·${t?80:540} = <b>${nf(m*(t?80:540))} cal</b>.`,'Calor latente: Q = m·L (a temperatura não muda).',{unit:'cal'});},
 lv=>{const m1=pick([100,200,300,400]),m2=pick([100,200,300,400]),T1=R(1,9)*10,T2=R(1,9)*10;const T=(m1*T1+m2*T2)/(m1+m2);return NUM(`Misturam-se <b>${m1} g</b> de água a <b>${T1} °C</b> com <b>${m2} g</b> de água a <b>${T2} °C</b>. Qual a temperatura de equilíbrio?`,T,`T = ${F(`${m1}·${T1} + ${m2}·${T2}`,`${m1} + ${m2}`)} = <b>${fmt(T)} °C</b>.`,'Média ponderada pelas massas (mesmo calor específico).',{unit:'°C',keys:[','],tol:0.05,answer:fmt(round(T,2))});},
 lv=>{const it=pick([['sólido → líquido','Fusão'],['líquido → gasoso','Vaporização'],['gasoso → líquido','Condensação'],['líquido → sólido','Solidificação'],['sólido → gasoso','Sublimação']]);return MC(`Como se chama a mudança de estado <b>${it[0]}</b>?`,it[1],['Fusão','Vaporização','Condensação','Solidificação','Sublimação'].filter(x=>x!==it[1]),`${it[0]}: ${it[1]}.`,'Revise os nomes das mudanças de fase.');},
 lv=>{const m=R(1,50)*10,c=pick([0.1,0.2,0.5,1]);return NUM(`Qual a capacidade térmica de um corpo de <b>${m} g</b> com c = <b>${fmt(c)} cal/g·°C</b>?`,m*c,`C = m·c = ${m}·${fmt(c)} = <b>${fmt(m*c)} cal/°C</b>.`,'C = m·c.',{unit:'cal/°C'});},
]},
{id:'dilat',name:'Dilatação térmica',icon:'🌉',tip:'ΔL = L₀·α·ΔT (linear); β = 2α (superficial); γ = 3α (volumétrica). A água tem comportamento anômalo entre 0 °C e 4 °C.',
theory:`<div class="formula">ΔL = L<sub>0</sub> · α · ΔT</div><p>α = coeficiente de dilatação linear (°C<sup>−1</sup>). Aço: 12 × 10<sup>−6</sup>; cobre: 17 × 10<sup>−6</sup>; alumínio: 24 × 10<sup>−6</sup>.</p>
<div class="formula">ΔA = A<sub>0</sub>·β·ΔT (β = 2α) · ΔV = V<sub>0</sub>·γ·ΔT (γ = 3α)</div>
<div class="ex">Trilho de aço de 100 m aquecido em 50 °C: ΔL = 100·12×10<sup>−6</sup>·50 = 0,06 m = 6 cm</div>
<p>Furos em chapas <b>aumentam</b> quando aquecidos (dilatam como se fossem do material). A água tem densidade máxima a 4 °C.</p>`,
gens:[
 lv=>{const m=pick([['aço',12],['cobre',17],['alumínio',24]]),L0=pick([10,20,50,100]),dT=pick([10,20,25,50]);const dL=L0*dT*m[1]*1e-3;return NUM(`Uma barra de ${m[0]} (α = ${m[1]} × 10<sup>−6</sup> °C<sup>−1</sup>) de <b>${L0} m</b> é aquecida em <b>${dT} °C</b>. Quanto ela dilata, em <b>milímetros</b>?`,dL,`ΔL = ${L0} · ${m[1]}×10<sup>−6</sup> · ${dT} = ${fmt(dL/1000)} m = <b>${fmt(dL)} mm</b>.`,'ΔL = L₀·α·ΔT; depois converta m → mm (× 1000).',{unit:'mm',keys:[','],tol:0.001});},
 lv=>{const q=pick([['Se o coeficiente de dilatação linear é α, o superficial é:','2α'],['Se o coeficiente de dilatação linear é α, o volumétrico é:','3α']]);return MC(q[0],q[1],['α','2α','3α','α²','α³'].filter(x=>x!==q[1]),`β = 2α e γ = 3α.`,'Área tem 2 dimensões; volume, 3.');},
 lv=>{const s=pick([['A água tem densidade máxima a 4 °C.',true],['Um furo numa chapa metálica diminui quando a chapa é aquecida.',false],['Trilhos de trem têm pequenos espaços entre si por causa da dilatação.',true],['Todos os materiais dilatam na mesma proporção.',false],['Lâminas bimetálicas funcionam porque metais diferentes dilatam de forma diferente.',true]]);return TF(s[0],s[1],'Furos dilatam junto com a chapa; cada material tem seu coeficiente α; a água é anômala entre 0 °C e 4 °C.','Revise a aula de dilatação.');},
 lv=>{const V0=pick([20,40,50,60]),dT=pick([10,20,25,30]);return NUM(`Um tanque recebe <b>${V0} L</b> de gasolina (γ = 1 × 10<sup>−3</sup> °C<sup>−1</sup>) e ela aquece <b>${dT} °C</b>. Quantos litros ela dilata?`,V0*dT*1e-3,`ΔV = ${V0} · 10<sup>−3</sup> · ${dT} = <b>${fmt(V0*dT*1e-3)} L</b>.`,'ΔV = V₀·γ·ΔT.',{unit:'L',keys:[','],tol:0.001});},
 lv=>{const L0=pick([1,2,5,10]),dT=pick([100,200,500]),a=pick([10,20,25]);const dL=L0*a*1e-6*dT;return NUM(`Uma haste de <b>${L0} m</b> (α = ${a} × 10<sup>−6</sup> °C<sup>−1</sup>) é aquecida em <b>${dT} °C</b>. Qual o comprimento final, em metros?`,L0+dL,`ΔL = ${L0}·${a}×10<sup>−6</sup>·${dT} = ${fmt(dL)} m. L = ${L0} + ${fmt(dL)} = <b>${fmt(L0+dL)} m</b>.`,'L = L₀ + ΔL.',{unit:'m',keys:[','],tol:0.0001});},
]},
{id:'gases',name:'Gases ideais',icon:'🎈',tip:'p·V/T = constante (T em kelvin!). Isotérmica: p·V constante. Isobárica: V/T constante. Isovolumétrica: p/T constante. Clapeyron: pV = nRT.',
theory:`<div class="formula">${F('p₁·V₁','T₁')} = ${F('p₂·V₂','T₂')} (T sempre em kelvin)</div>
<ul><li><b>Isotérmica</b> (T constante): p·V = constante</li><li><b>Isobárica</b> (p constante): V/T = constante</li><li><b>Isovolumétrica</b> (V constante): p/T = constante</li><li><b>Adiabática</b>: sem troca de calor</li></ul>
<h3>Clapeyron</h3><div class="formula">p · V = n · R · T</div><p>R = 0,082 atm·L/(mol·K). Nas CNTP (1 atm, 273 K), 1 mol ocupa ≈ 22,4 L.</p>
<div class="ex">Gás a 27 °C (300 K) aquecido a 327 °C (600 K) a pressão constante: o volume dobra.</div>`,
gens:[
 lv=>{const p1=R(1,6),k=pick([2,3,4]),V1=k*R(1,6);return NUM(`Um gás ocupa <b>${V1} L</b> a <b>${p1} atm</b>. Numa transformação isotérmica, a pressão passa a <b>${p1*k} atm</b>. Qual o novo volume?`,V1/k,`p₁V₁ = p₂V₂ → ${p1}·${V1} = ${p1*k}·V₂ → V₂ = <b>${fmt(V1/k)} L</b>.`,'Isotérmica: p·V = constante.',{unit:'L',keys:[',']});},
 lv=>{const T1=pick([200,250,300,400]),f=pick([1.5,2,3]),T2=T1*f,V1=R(2,10);return NUM(`Um gás a <b>${fmt(T1-273)} °C</b> ocupa <b>${V1} L</b>. A pressão constante, é aquecido até <b>${fmt(T2-273)} °C</b>. Qual o novo volume?`,V1*f,`Em kelvin: ${T1} K → ${T2} K. V₂ = ${V1}·${F(T2,T1)} = <b>${fmt(V1*f)} L</b>.`,'Converta para kelvin (+273) e use V/T = constante.',{unit:'L',keys:[',']});},
 lv=>{const T1=pick([200,250,300,400]),f=pick([1.5,2,3]),p1=R(1,5);return NUM(`Um gás em recipiente rígido está a <b>${p1} atm</b> e <b>${T1} K</b>. Aquecido até <b>${T1*f} K</b>, qual a nova pressão?`,p1*f,`p/T constante: p₂ = ${p1}·${F(T1*f,T1)} = <b>${fmt(p1*f)} atm</b>.`,'Volume constante: p/T = constante.',{unit:'atm',keys:[',']});},
 lv=>{const it=pick([['a pressão é constante','Isobárica'],['o volume é constante','Isovolumétrica'],['a temperatura é constante','Isotérmica'],['não há troca de calor com o meio','Adiabática']]);return MC(`Uma transformação gasosa em que <b>${it[0]}</b> é chamada:`,it[1],['Isobárica','Isovolumétrica','Isotérmica','Adiabática'],`Quando ${it[0]}: ${it[1].toLowerCase()}.`,'iso = igual; baros = pressão; thermos = calor.',{keep:true});},
 lv=>{const n=R(1,5);return NUM(`Qual o volume de <b>${n} mol</b> de gás ideal a 1 atm e 273 K? (R = 0,082 atm·L/mol·K)`,n*0.082*273,`V = ${F('nRT','p')} = ${n}·0,082·273 = <b>${fmt(round(n*0.082*273,2))} L</b> (≈ ${fmt(22.4*n)} L).`,'Use pV = nRT.',{unit:'L',keys:[','],tol:0.3});},
]},
{id:'termo',name:'Termodinâmica',icon:'♨️',tip:'1ª lei: Q = τ + ΔU. Isobárica: τ = p·ΔV. Rendimento η = τ/Q_quente. Carnot: η = 1 − T_fria/T_quente (em K).',
theory:`<h3>1ª Lei</h3><div class="formula">Q = τ + ΔU</div><p>Q > 0: gás recebe calor · τ > 0: gás realiza trabalho (expande) · ΔU > 0: temperatura aumenta.</p>
<p>Trabalho a pressão constante: τ = p·ΔV. Isotérmica (gás ideal): ΔU = 0.</p>
<h3>Máquinas térmicas</h3><div class="formula">η = ${F('τ','Q<sub>quente</sub>')} = 1 − ${F('Q<sub>fria</sub>','Q<sub>quente</sub>')}</div>
<h3>Ciclo de Carnot (máximo teórico)</h3><div class="formula">η = 1 − ${F('T<sub>fria</sub>','T<sub>quente</sub>')} (em kelvin)</div>
<h3>2ª Lei</h3><p>O calor flui espontaneamente do quente para o frio. Nenhuma máquina térmica tem rendimento de 100%.</p>`,
gens:[
 lv=>{const Q=R(2,50)*100,tau=R(1,Q/100-1)*100;return NUM(`Um gás recebe <b>${nf(Q)} J</b> de calor e realiza <b>${nf(tau)} J</b> de trabalho. Qual a variação da energia interna?`,Q-tau,`ΔU = Q − τ = ${nf(Q)} − ${nf(tau)} = <b>${nf(Q-tau)} J</b>.`,'1ª lei: Q = τ + ΔU.',{unit:'J'});},
 lv=>{const p=pick([1,2,3,5]),dV=pick([0.01,0.02,0.05,0.1]);return NUM(`Um gás a pressão constante de <b>${p} × 10<sup>5</sup> Pa</b> expande <b>${fmt(dV)} m³</b>. Qual o trabalho realizado?`,p*1e5*dV,`τ = p·ΔV = ${p}×10<sup>5</sup> · ${fmt(dV)} = <b>${nf(p*1e5*dV)} J</b>.`,'τ = p·ΔV.',{unit:'J'});},
 lv=>{const Q1=pick([500,1000,2000,4000]),e=pick([20,25,30,40,50]),w=Math.random()<.5;return w?NUM(`Uma máquina térmica recebe <b>${nf(Q1)} J</b> da fonte quente e realiza <b>${nf(Q1*e/100)} J</b> de trabalho. Qual o rendimento (%)?`,e,`η = ${nf(Q1*e/100)}/${nf(Q1)} = <b>${e}%</b>.`,'η = τ/Q_quente.',{unit:'%'}):NUM(`Uma máquina recebe <b>${nf(Q1)} J</b> por ciclo e tem rendimento de <b>${e}%</b>. Quanto calor rejeita para a fonte fria?`,Q1*(1-e/100),`τ = ${e}% de ${nf(Q1)} = ${nf(Q1*e/100)} J. Q<sub>fria</sub> = ${nf(Q1)} − ${nf(Q1*e/100)} = <b>${nf(Q1*(1-e/100))} J</b>.`,'Q_quente = τ + Q_fria.',{unit:'J'});},
 lv=>{const T1=pick([400,500,600,800,1000]),T2=pick([200,300]);return NUM(`Uma máquina de Carnot opera entre <b>${T1} K</b> e <b>${T2} K</b>. Qual seu rendimento (%)?`,(1-T2/T1)*100,`η = 1 − ${T2}/${T1} = ${fmt(1-T2/T1)} = <b>${fmt((1-T2/T1)*100)}%</b>.`,'η = 1 − T_fria/T_quente (em kelvin).',{unit:'%',keys:[',']});},
 lv=>{const s=pick([['É impossível construir uma máquina térmica com rendimento de 100%.',true],['O calor flui espontaneamente do corpo frio para o quente.',false],['Numa transformação isotérmica de um gás ideal, ΔU = 0.',true],['Numa expansão, o gás realiza trabalho positivo.',true],['Uma geladeira funciona sem consumir energia, violando a 2ª lei.',false]]);return TF(s[0],s[1],'2ª lei: calor vai espontaneamente do quente para o frio e nenhuma máquina converte todo calor em trabalho. Em gás ideal, U depende só de T.','Revise as leis da termodinâmica.');},
]},
{id:'ondas',name:'Ondas e som',icon:'🌊',tip:'v = λ·f; f = 1/T. Som: onda mecânica longitudinal (≈ 340 m/s no ar), não se propaga no vácuo. Luz: eletromagnética transversal.',
theory:`<div class="formula">v = λ · f · f = ${F(1,'T')}</div><p>λ = comprimento de onda (m) · f = frequência (Hz) · T = período (s)</p>
<ul><li><b>Mecânicas</b> precisam de meio (som, ondas na água). <b>Eletromagnéticas</b> propagam-se no vácuo (luz, rádio).</li><li><b>Transversais</b>: vibração perpendicular à propagação (luz). <b>Longitudinais</b>: vibração na direção da propagação (som no ar).</li></ul>
<h3>Som</h3><p>No ar, v ≈ 340 m/s. Altura (grave/agudo) ↔ frequência. Intensidade (volume) ↔ amplitude. Timbre ↔ forma da onda.</p>
<h3>Eco</h3><p>O som vai e volta: d = ${F('v·t',2)}.</p>`,
gens:[
 lv=>{const l=pick([0.5,1,2,5,10]),f=R(2,100);return NUM(`Uma onda tem comprimento de onda <b>${fmt(l)} m</b> e frequência <b>${f} Hz</b>. Qual sua velocidade?`,l*f,`v = λ·f = ${fmt(l)}·${f} = <b>${fmt(l*f)} m/s</b>.`,'v = λ·f.',{unit:'m/s'});},
 lv=>{const f=pick([170,340,680,85,1700,34]);return NUM(`Qual o comprimento de onda de um som de <b>${f} Hz</b> no ar (v = 340 m/s)?`,340/f,`λ = v/f = 340/${f} = <b>${fmt(340/f)} m</b>.`,'λ = v/f.',{unit:'m',keys:[',']});},
 lv=>{const T=pick([0.5,0.2,0.1,0.02,0.01,0.25]);return NUM(`Uma onda tem período de <b>${fmt(T)} s</b>. Qual sua frequência?`,1/T,`f = 1/T = 1/${fmt(T)} = <b>${fmt(1/T)} Hz</b>.`,'f = 1/T.',{unit:'Hz'});},
 lv=>{const t=pick([0.5,1,2,3,4]);return NUM(`Uma pessoa grita diante de um paredão e ouve o eco <b>${fmt(t)} s</b> depois. A que distância está o paredão? (v<sub>som</sub> = 340 m/s)`,340*t/2,`O som vai e volta: d = ${F('340·'+fmt(t),2)} = <b>${fmt(170*t)} m</b>.`,'Divida por 2: o som percorre a distância duas vezes.',{unit:'m'});},
 lv=>{const n=pick([2,3,4]),L=n*pick([1,2,3,4]),f=pick([2,5,10]);return NUM(`A figura mostra <b>${n} comprimentos de onda</b> em <b>${L} m</b>. Se a frequência é <b>${f} Hz</b>, qual a velocidade da onda?`,L/n*f,`λ = ${L}/${n} = ${fmt(L/n)} m. v = λ·f = ${fmt(L/n)}·${f} = <b>${fmt(L/n*f)} m/s</b>.`,'Conte os ciclos completos para achar λ.',{unit:'m/s',visual:waveSVG(n,L+' m')});},
 lv=>{const q=pick([['O som é uma onda:','mecânica e longitudinal'],['A luz é uma onda:','eletromagnética e transversal'],['O que define se um som é grave ou agudo?','A frequência'],['O que define se um som é forte ou fraco?','A amplitude'],['O som NÃO se propaga no:','vácuo']]);const W={'mecânica e longitudinal':['eletromagnética e transversal','mecânica e transversal','eletromagnética e longitudinal'],'eletromagnética e transversal':['mecânica e longitudinal','mecânica e transversal','eletromagnética e longitudinal'],'A frequência':['A amplitude','O timbre','A velocidade'],'A amplitude':['A frequência','O timbre','O comprimento de onda'],'vácuo':['ar','água','aço']};return MC(q[0],q[1],W[q[1]],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de ondas.');},
]},
{id:'optica',name:'Óptica geométrica',icon:'🔦',tip:'Reflexão: i = r (medidos da normal). Espelho plano: imagem simétrica. Gauss: 1/f = 1/p + 1/p\'. Vergência V = 1/f (di, f em m). Snell: n₁·sen i = n₂·sen r; n = c/v.',
theory:`<h3>Reflexão</h3><p>Ângulo de incidência = ângulo de reflexão (medidos em relação à <b>normal</b>). Espelho plano: imagem virtual, direita, do mesmo tamanho, à mesma distância do espelho.</p><p>Dois espelhos com ângulo α: n = ${F('360°','α')} − 1 imagens.</p>
<h3>Espelhos esféricos e lentes</h3><div class="formula">${F(1,'f')} = ${F(1,'p')} + ${F(1,"p'")} · A = −${F("p'",'p')}</div><p>Vergência: V = 1/f (dioptrias, f em metros). Miopia: lente divergente. Hipermetropia: lente convergente.</p>
<h3>Refração</h3><div class="formula">n = ${F('c','v')} · n<sub>1</sub>·sen i = n<sub>2</sub>·sen r</div><p>c = 3 × 10<sup>8</sup> m/s. Ao entrar num meio mais refringente, a luz se aproxima da normal.</p>`,
gens:[
 lv=>{const i=R(10,80),w=Math.random()<.5;return w?NUM(`Um raio incide num espelho plano formando <b>${i}°</b> com a <b>normal</b>. Qual o ângulo de reflexão (com a normal)?`,i,`Pela lei da reflexão, r = i = <b>${i}°</b>.`,'Incidência = reflexão.',{unit:'°'}):NUM(`Um raio forma <b>${i}°</b> com a <b>superfície</b> de um espelho plano. Qual o ângulo de reflexão, medido em relação à normal?`,90-i,`Com a normal: 90° − ${i}° = ${90-i}°. Reflexão = incidência = <b>${90-i}°</b>.`,'Os ângulos são medidos a partir da normal (perpendicular ao espelho).',{unit:'°'});},
 lv=>{const d=R(1,10),w=Math.random()<.5;return w?NUM(`Uma pessoa está a <b>${d} m</b> de um espelho plano. Qual a distância entre ela e sua imagem?`,2*d,`A imagem está ${d} m atrás do espelho: distância = ${d} + ${d} = <b>${2*d} m</b>.`,'A imagem fica à mesma distância do espelho, do outro lado.',{unit:'m'}):NUM(`Uma pessoa se aproxima de um espelho plano a <b>${d} m/s</b>. Com que velocidade se aproxima da própria imagem?`,2*d,`A imagem também se aproxima a ${d} m/s: velocidade relativa = <b>${2*d} m/s</b>.`,'Pessoa e imagem se movem simetricamente.',{unit:'m/s'});},

{id:'mag',name:'Magnetismo',icon:'🧲',tip:'Polos iguais se repelem; cortar um ímã gera dois ímãs. Força magnética: F = |q|·v·B·sen θ; num fio: F = B·i·L·sen θ. Fio reto: B = μ₀·i/(2πd).',
theory:`<h3>Ímãs</h3><ul><li>Polos de mesmo nome se repelem; de nomes diferentes se atraem.</li><li>Não existe monopolo: cortar um ímã gera dois ímãs completos.</li><li>O polo norte da bússola aponta para o norte geográfico (que é um polo sul magnético).</li></ul>
<h3>Eletromagnetismo</h3><p>Oersted: corrente elétrica cria campo magnético. Fio reto:</p><div class="formula">B = ${F('μ₀ · i','2π · d')} (μ₀ = 4π × 10<sup>−7</sup> T·m/A)</div>
<h3>Força magnética</h3><div class="formula">Carga: F = |q| · v · B · sen θ · Fio: F = B · i · L · sen θ</div><p>Carga em repouso ou movendo-se paralela ao campo: F = 0. A força magnética muda a direção, mas não o módulo da velocidade.</p>`,
gens:[
 lv=>{const q=pick([['Se cortarmos um ímã ao meio, obtemos:','dois ímãs, cada um com polo norte e sul',['um polo norte e um polo sul separados','dois pedaços sem magnetismo','dois polos norte']],['Polos magnéticos de mesmo nome:','se repelem',['se atraem','não interagem','se anulam']],['Uma carga elétrica em repouso num campo magnético sofre força:','nula',['máxima','igual ao seu peso','no sentido do campo']],['Quem mostrou que a corrente elétrica cria campo magnético?','Oersted',['Newton','Coulomb','Kepler']],['A força magnética sobre uma carga em movimento altera:','apenas a direção da velocidade',['apenas o módulo da velocidade','a massa da carga','o sinal da carga']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de magnetismo.');},
 lv=>{const B=pick([0.1,0.2,0.5,1,2]),i=R(1,10),L=pick([0.1,0.2,0.5,1,2]);return NUM(`Um fio de <b>${fmt(L)} m</b>, percorrido por <b>${i} A</b>, está perpendicular a um campo de <b>${fmt(B)} T</b>. Qual a força magnética?`,B*i*L,`F = B·i·L = ${fmt(B)}·${i}·${fmt(L)} = <b>${fmt(B*i*L)} N</b>.`,'F = B·i·L (sen 90° = 1).',{unit:'N',keys:[','],tol:0.0001});},
 lv=>{const q=R(1,9),v=pick([1000,2000,5000,10000]),B=pick([0.1,0.2,0.5,1]);const Fv=round(q*1e-6*v*B,8);return NUM(`Uma carga de <b>${q} µC</b> move-se a <b>${nf(v)} m/s</b>, perpendicular a um campo de <b>${fmt(B)} T</b>. Qual a força magnética?`,Fv,`F = |q|·v·B = ${q}×10<sup>−6</sup>·${nf(v)}·${fmt(B)} = <b>${fmt(Fv)} N</b>.`,'F = |q|·v·B (q em coulombs).',{unit:'N',keys:[','],tol:1e-6});},
 lv=>{const i=pick([2,5,10,20]),d=pick([0.1,0.2,0.5,1]);const B=2e-7*i/d;const [m,e]=sciNorm(B);return MC(`Qual o campo magnético a <b>${fmt(d)} m</b> de um fio reto longo com corrente de <b>${i} A</b>? (μ₀ = 4π × 10<sup>−7</sup>)`,SCI(m,e)+' T',[SCI(m,e+1)+' T',SCI(m,e-1)+' T',SCI(m*2 >= 10?m/5:m*2,e)+' T'],`B = ${F('4π×10<sup>−7</sup> · '+i,'2π · '+fmt(d))} = 2×10<sup>−7</sup>·${i}/${fmt(d)} = ${SCI(m,e)} T.`,'B = μ₀i/(2πd) = 2×10⁻⁷·i/d.');},
 lv=>{const s=pick([['Uma carga que se move paralelamente ao campo magnético sofre força nula.',true],['A força magnética altera o módulo da velocidade da carga.',false],['O polo norte da bússola aponta aproximadamente para o norte geográfico.',true],['É possível isolar um único polo magnético.',false]]);return TF(s[0],s[1],'F = qvB·sen θ (θ = 0 → F = 0); a força magnética é perpendicular à velocidade; não existem monopolos.','Revise a aula de magnetismo.');},
]},
{id:'indu',name:'Indução eletromagnética',icon:'🌀',tip:'Φ = B·A·cos θ. Faraday: ε = −ΔΦ/Δt (com N espiras, multiplique por N). Lenz: a corrente induzida se opõe à variação do fluxo. Transformador: Uₛ/Uₚ = Nₛ/Nₚ.',
theory:`<div class="formula">Φ = B · A · cos θ (weber, Wb)</div>
<h3>Lei de Faraday</h3><div class="formula">ε = −N · ${F('ΔΦ','Δt')}</div><p>Só há corrente induzida quando o fluxo <b>varia</b> (ímã em movimento, espira girando…).</p>
<h3>Lei de Lenz</h3><p>A corrente induzida surge com sentido que se <b>opõe à variação</b> do fluxo que a produziu.</p>
<h3>Transformador</h3><div class="formula">${F('U<sub>s</sub>','U<sub>p</sub>')} = ${F('N<sub>s</sub>','N<sub>p</sub>')} · U<sub>p</sub>·i<sub>p</sub> = U<sub>s</sub>·i<sub>s</sub> (ideal)</div><p>Funciona apenas com corrente <b>alternada</b>.</p>`,
gens:[
 lv=>{const B=pick([0.1,0.2,0.5,1,2]),A=pick([0.01,0.02,0.05,0.1,0.5]);return NUM(`Um campo de <b>${fmt(B)} T</b> atravessa perpendicularmente uma espira de <b>${fmt(A)} m²</b>. Qual o fluxo magnético?`,B*A,`Φ = B·A = ${fmt(B)}·${fmt(A)} = <b>${fmt(B*A)} Wb</b>.`,'Φ = B·A (cos 0° = 1).',{unit:'Wb',keys:[','],tol:1e-5});},
 lv=>{const N=pick([1,10,50,100]),dPhi=pick([0.01,0.02,0.05,0.1,0.2]),dt=pick([0.1,0.2,0.5,1]);return NUM(`O fluxo numa bobina de <b>${N}</b> espira${N>1?'s':''} varia <b>${fmt(dPhi)} Wb</b> em <b>${fmt(dt)} s</b>. Qual a fem induzida (em módulo)?`,N*dPhi/dt,`|ε| = N·ΔΦ/Δt = ${N}·${fmt(dPhi)}/${fmt(dt)} = <b>${fmt(N*dPhi/dt)} V</b>.`,'Faraday: ε = N·ΔΦ/Δt.',{unit:'V',keys:[','],tol:1e-4});},
 lv=>{const Up=pick([110,220,127,120]),r=pick([[100,500],[1000,100],[200,1000],[500,50],[100,20]]);return NUM(`Um transformador ideal tem <b>${r[0]}</b> espiras no primário e <b>${r[1]}</b> no secundário. Ligado a <b>${Up} V</b>, qual a tensão no secundário?`,Up*r[1]/r[0],`U<sub>s</sub> = ${Up}·${F(r[1],r[0])} = <b>${fmt(Up*r[1]/r[0])} V</b>.`,'Us/Up = Ns/Np.',{unit:'V',keys:[',']});},
 lv=>{const Up=pick([110,220]),ip=pick([1,2,5]),Us=pick([11,22,10]);return NUM(`Num transformador ideal, o primário recebe <b>${Up} V</b> e <b>${ip} A</b>. Se o secundário fornece <b>${Us} V</b>, qual a corrente no secundário?`,Up*ip/Us,`Potências iguais: ${Up}·${ip} = ${Us}·i<sub>s</sub> → i<sub>s</sub> = <b>${fmt(Up*ip/Us)} A</b>.`,'Transformador ideal: Up·ip = Us·is.',{unit:'A',keys:[',']});},
 lv=>{const q=pick([['O transformador funciona com corrente:','alternada',['contínua','de qualquer tipo, até de pilha','nenhuma']],['Um ímã parado dentro de uma bobina induz corrente?','Não, só há indução quando o fluxo varia',['Sim, sempre','Sim, se o ímã for forte','Só se a bobina for de cobre']],['A Lei de Lenz diz que a corrente induzida:','se opõe à variação do fluxo que a criou',['reforça a variação do fluxo','é sempre nula','depende só da resistência']],['Usinas hidrelétricas geram eletricidade por meio de:','indução eletromagnética',['efeito fotoelétrico','atrito','fissão nuclear']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Indução exige variação de fluxo magnético.');},
]},
{id:'moderna',name:'Física moderna',icon:'⚛️',tip:'Fóton: E = h·f. Efeito fotoelétrico: Ec = h·f − φ (depende da frequência). Relatividade: Δt = γ·Δt₀ (v = 0,6c → γ = 1,25; 0,8c → γ = 5/3). E = m·c². Meia-vida: N = N₀/2ⁿ.',
theory:`<h3>Quantização</h3><div class="formula">E = h · f (h ≈ 6,6 × 10<sup>−34</sup> J·s)</div><p>A luz tem natureza <b>dual</b>: onda e partícula (fóton).</p>
<h3>Efeito fotoelétrico (Einstein)</h3><div class="formula">E<sub>c,máx</sub> = h·f − φ</div><p>φ = função trabalho do metal. Só ocorre acima de uma frequência mínima; aumentar a intensidade aumenta o número de elétrons, não a energia de cada um.</p>
<h3>Relatividade restrita</h3><p>c é igual para todos os observadores. Dilatação do tempo: Δt = γ·Δt<sub>0</sub>, com γ = 1/√(1 − v²/c²). Para v = 0,6c, γ = 1,25; para v = 0,8c, γ = 5/3.</p><div class="formula">E = m · c²</div>
<h3>Radioatividade</h3><p>Após cada meia-vida, a quantidade cai pela metade: N = N<sub>0</sub>/2<sup>n</sup>.</p>`,
gens:[
 lv=>{const E=R(3,10),phi=pick([2.1,2.3,2.5,4.3,1.9]);if(E<=phi)return NUM(`Fóton de 6 eV, φ = 2 eV: Ec?`,4,'6 − 2 = 4 eV.','',{unit:'eV'});return NUM(`Fótons de <b>${E} eV</b> incidem num metal de função trabalho <b>${fmt(phi)} eV</b>. Qual a energia cinética máxima dos elétrons?`,E-phi,`E<sub>c</sub> = ${E} − ${fmt(phi)} = <b>${fmt(E-phi)} eV</b>.`,'Ec = E_fóton − φ.',{unit:'eV',keys:[',']});},
 lv=>{const k=R(1,9);const [m,e]=sciNorm(6.6*k*1e-20);return MC(`Qual a energia de um fóton de frequência <b>${k} × 10<sup>14</sup> Hz</b>? (h = 6,6 × 10<sup>−34</sup> J·s)`,SCI(m,e)+' J',[SCI(m,e+1)+' J',SCI(m,e-1)+' J',SCI(m,-e)+' J'],`E = h·f = 6,6×10<sup>−34</sup> · ${k}×10<sup>14</sup> = ${SCI(m,e)} J.`,'Multiplique coeficientes e some expoentes.');},
 lv=>{const p=pick([[0.6,1.25,[4,8,12,20]],[0.8,5/3,[3,6,9,12]]]);const t0=pick(p[2]);return NUM(`Uma nave viaja a <b>${fmt(p[0])}c</b>. Um relógio a bordo marca <b>${t0} anos</b>. Quanto tempo passa para um observador na Terra? (γ = ${p[0]===0.6?'1,25':'5/3'})`,t0*p[1],`Δt = γ·Δt<sub>0</sub> = ${p[0]===0.6?'1,25':'5/3'} · ${t0} = <b>${fmt(t0*p[1])} anos</b>.`,'O tempo passa mais devagar para quem está em movimento: multiplique por γ.',{unit:'anos'});},
 lv=>{const N0=pick([800,1600,6400,320]),T=pick([2,5,8,30]),n=R(1,4);return NUM(`Uma amostra tem <b>${N0} g</b> de um isótopo com meia-vida de <b>${T} anos</b>. Quanto restará após <b>${n*T} anos</b>?`,N0/2**n,`${n*T}/${T} = ${n} meias-vidas: ${N0}/2<sup>${n}</sup> = <b>${fmt(N0/2**n)} g</b>.`,'Cada meia-vida divide a quantidade por 2.',{unit:'g'});},
 lv=>{const m=pick([1,2,5]);const [a,e]=sciNorm(m*1e-3*9e16);return MC(`Qual a energia equivalente a <b>${m} g</b> de massa? (c = 3 × 10<sup>8</sup> m/s)`,SCI(a,e)+' J',[SCI(a,e-3)+' J',SCI(a,e+3)+' J',SCI(m*3,5)+' J'],`E = m·c² = ${m}×10<sup>−3</sup> · 9×10<sup>16</sup> = ${SCI(a,e)} J.`,'Converta g para kg e use E = m·c².');},
 lv=>{const q=pick([['No efeito fotoelétrico, a energia dos elétrons emitidos depende:','da frequência da luz',['da intensidade da luz','do tempo de exposição','da cor do metal apenas']],['A luz tem natureza:','dual: onda e partícula',['apenas ondulatória','apenas corpuscular','nenhuma das duas']],['Quem explicou o efeito fotoelétrico usando fótons?','Einstein',['Newton','Galileu','Ohm']],['Segundo a relatividade, a velocidade da luz no vácuo é:','a mesma para todos os observadores',['maior para quem se move em direção à fonte','infinita','variável conforme a fonte']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de física moderna.');},
]},
