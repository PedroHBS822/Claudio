function leverSVG(l,r){ return SV(300,130,`<polygon points="150,110 135,128 165,128" fill="#a568cc"/><rect x="20" y="102" width="260" height="8" rx="4" fill="#ff9600"/>${l?`<rect x="30" y="72" width="40" height="30" rx="4" fill="#ddf4ff" stroke="#1899d6" stroke-width="3"/><text x="50" y="92" text-anchor="middle" font-size="13" fill="#1899d6">${l}</text>`:''}${r?`<rect x="230" y="72" width="40" height="30" rx="4" fill="#ffdfe0" stroke="#ea2b2b" stroke-width="3"/><text x="250" y="92" text-anchor="middle" font-size="13" fill="#ea2b2b">${r}</text>`:''}`); }
function springSVG(){ let d='M20,60'; for(let i=0;i<10;i++) d+=` L${30+i*14},${i%2?72:48}`; d+=' L175,60 L190,60'; return SV(300,110,`<rect x="6" y="20" width="14" height="80" fill="#777"/><path d="${d}" fill="none" stroke="#1899d6" stroke-width="3"/><rect x="190" y="38" width="50" height="44" rx="5" fill="#fff4d6" stroke="#ff9600" stroke-width="3"/><text x="215" y="66" text-anchor="middle" font-size="14" fill="#e07b00">m</text><line x1="0" y1="100" x2="300" y2="100" stroke="#777" stroke-width="3"/>`); }

insertSkill('f3','grav',{id:'estatica',name:'Estática e alavancas',icon:'⚖️',tip:'Momento (torque) = F·d. Equilíbrio de alavanca: F₁·d₁ = F₂·d₂. Corpo extenso em equilíbrio: força resultante e momento resultante nulos.',
theory:`<div class="formula">M = F · d</div><p>d é a distância (braço) da linha da força até o ponto de apoio. Unidade: N·m.</p>
<h3>Alavanca em equilíbrio</h3><div class="formula">F<sub>1</sub> · d<sub>1</sub> = F<sub>2</sub> · d<sub>2</sub></div><div class="ex">Gangorra: criança de 20 kg a 3 m equilibra um adulto de 60 kg a 1 m do apoio.</div>
<h3>Condições de equilíbrio</h3><ul><li>Ponto material: força resultante nula.</li><li>Corpo extenso: força resultante nula <b>e</b> momento resultante nulo.</li></ul>
<h3>Centro de massa</h3><div class="formula">x<sub>cm</sub> = ${F('m₁x₁ + m₂x₂','m₁ + m₂')}</div>`,
gens:[
 lv=>{const F=R(2,50)*2,d=pick([0.2,0.5,1,1.5,2]);return NUM(`Uma força de <b>${F} N</b> é aplicada perpendicularmente a <b>${fmt(d)} m</b> do eixo de uma porta. Qual o momento (torque)?`,F*d,`M = F·d = ${F}·${fmt(d)} = <b>${fmt(F*d)} N·m</b>.`,'Torque = força × distância ao eixo.',{unit:'N·m'});},
 lv=>{const m1=pick([20,25,30,40]),d1=pick([1,1.5,2,3]),m2=pick([40,50,60,75,80]);return NUM(`Numa gangorra, uma criança de <b>${m1} kg</b> senta a <b>${fmt(d1)} m</b> do apoio. A que distância do apoio deve sentar um adulto de <b>${m2} kg</b> para equilibrar?`,m1*d1/m2,`${m1}·${fmt(d1)} = ${m2}·d → d = <b>${fmt(round(m1*d1/m2,3))} m</b>.`,'Iguale os momentos dos dois lados.',{unit:'m',keys:[','],tol:0.01,visual:leverSVG(m1+' kg',m2+' kg')});},
 lv=>{const F1=R(2,20)*10,d1=pick([0.1,0.2,0.25,0.5]),d2=pick([1,1.5,2]);return NUM(`Numa alavanca, uma carga de <b>${F1} N</b> está a <b>${fmt(d1)} m</b> do apoio. Qual força mínima aplicar a <b>${fmt(d2)} m</b> do apoio, do outro lado, para equilibrá-la?`,F1*d1/d2,`F·${fmt(d2)} = ${F1}·${fmt(d1)} → F = <b>${fmt(round(F1*d1/d2,3))} N</b>.`,'Braço maior → força menor.',{unit:'N',keys:[','],tol:0.01});},
 lv=>{const m1=R(1,6),m2=R(1,6),x2=pick([2,3,4,6]);return NUM(`Duas massas de <b>${m1} kg</b> (em x = 0) e <b>${m2} kg</b> (em x = ${x2} m) estão numa barra leve. Onde fica o centro de massa?`,m2*x2/(m1+m2),`x<sub>cm</sub> = ${F(`${m1}·0 + ${m2}·${x2}`,`${m1} + ${m2}`)} = <b>${fmt(round(m2*x2/(m1+m2),3))} m</b>.`,'Média das posições ponderada pelas massas.',{unit:'m',keys:[','],tol:0.01});},
 lv=>{const q=pick([['Para um corpo extenso ficar em equilíbrio é preciso:','força resultante nula e momento resultante nulo',['apenas força resultante nula','apenas momento nulo','velocidade constante']],['Maçanetas ficam longe das dobradiças porque:','um braço maior exige menos força para o mesmo torque',['a porta fica mais leve','diminui o atrito','aumenta a massa']],['Uma tesoura é um exemplo de alavanca com o apoio:','entre a força e a resistência (interfixa)',['na ponta','fora da alavanca','sobre a resistência']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de estática.');},
]});
insertSkill('f4','hidro',{id:'hidrodin',name:'Hidrodinâmica (vazão)',icon:'🚰',tip:'Vazão Q = V/Δt = A·v. Continuidade: A₁·v₁ = A₂·v₂ (onde o cano afina, o fluido acelera). Bernoulli: mais velocidade → menos pressão.',
theory:`<div class="formula">Q = ${F('V','Δt')} = A · v</div><p>Vazão em m³/s ou L/s (1 m³ = 1000 L).</p>
<h3>Equação da continuidade</h3><div class="formula">A<sub>1</sub> · v<sub>1</sub> = A<sub>2</sub> · v<sub>2</sub></div><p>Apertar a ponta da mangueira (menor área) faz a água sair mais rápido.</p>
<h3>Bernoulli</h3><p>Num fluido em movimento, onde a velocidade é maior a pressão é menor — é o que ajuda a sustentar a asa do avião.</p>`,
gens:[
 lv=>{const Q=pick([0.5,1,2,5,10]),t=R(2,30)*10;return NUM(`Uma torneira enche <b>${fmt(Q*t)} L</b> em <b>${t} s</b>. Qual a vazão?`,Q,`Q = V/Δt = ${fmt(Q*t)}/${t} = <b>${fmt(Q)} L/s</b>.`,'Vazão = volume ÷ tempo.',{unit:'L/s',keys:[',']});},
 lv=>{const Q=pick([2,4,5,10,20]),V=pick([200,500,1000,2000]);return NUM(`Uma caixa-d'água de <b>${nf(V)} L</b> é enchida por uma mangueira de vazão <b>${Q} L/min</b>. Quanto tempo leva, em minutos?`,V/Q,`t = V/Q = ${nf(V)}/${Q} = <b>${nf(V/Q)} min</b>.`,'Tempo = volume ÷ vazão.',{unit:'min'});},
 lv=>{const A1=pick([4,6,8,10]),k=pick([2,4]),v1=R(1,5);return NUM(`Água flui a <b>${v1} m/s</b> num cano de <b>${A1} cm²</b> de seção, que afina para <b>${A1/k} cm²</b>. Qual a velocidade no trecho estreito?`,v1*k,`A₁v₁ = A₂v₂ → ${A1}·${v1} = ${fmt(A1/k)}·v₂ → v₂ = <b>${v1*k} m/s</b>.`,'Continuidade: área menor → velocidade maior.',{unit:'m/s'});},
 lv=>{const A=pick([0.01,0.02,0.05]),v=R(1,5);return NUM(`Um cano de seção <b>${fmt(A)} m²</b> conduz água a <b>${v} m/s</b>. Qual a vazão em <b>L/s</b>?`,A*v*1000,`Q = A·v = ${fmt(A)}·${v} = ${fmt(A*v)} m³/s = <b>${fmt(A*v*1000)} L/s</b>.`,'Q = A·v; 1 m³ = 1000 L.',{unit:'L/s'});},
 lv=>{const q=pick([['Pelo princípio de Bernoulli, onde a velocidade de um fluido é maior, a pressão é:','menor',['maior','igual','nula']],['Ao apertar a ponta de uma mangueira, a água sai mais rápido porque:','a área diminui e a vazão se mantém',['a pressão da rua aumenta','a água fica mais leve','a vazão aumenta']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de hidrodinâmica.');},
]});
insertSkill('f4','termo',{id:'mhs',name:'Oscilações (MHS)',icon:'〰️',tip:'Massa-mola: T = 2π√(m/k). Pêndulo simples: T = 2π√(L/g) (não depende da massa). f = 1/T. Energia: E = k·A²/2.',
theory:`<p>No <b>movimento harmônico simples</b> o corpo oscila em torno do equilíbrio sob uma força restauradora.</p>
<div class="formula">Massa-mola: T = 2π√(m/k) · Pêndulo: T = 2π√(L/g)</div>
<ul><li>A velocidade é <b>máxima</b> no ponto de equilíbrio; a aceleração é máxima nos extremos.</li><li>O período do pêndulo não depende da massa nem da amplitude (pequenas oscilações).</li><li>Quadruplicar o comprimento do pêndulo dobra o período.</li></ul>
<div class="formula">E<sub>mec</sub> = ${F('k·A²',2)}</div>`,
gens:[
 lv=>{const p=pick([[0.25,3],[1/9,2],[1,6],[1/36,1],[4,12]]);const k=pick([36,144,900]);const m=round(k*p[0],4);return NUM(`Um bloco de <b>${fmt(m)} kg</b> oscila preso a uma mola de <b>k = ${k} N/m</b>. Qual o período? (π = 3)`,p[1],`T = 2π√(m/k) = 6·√(${fmt(m)}/${k}) = 6·${fmt(round(Math.sqrt(p[0]),4))} = <b>${p[1]} s</b>.`,'T = 2π√(m/k).',{unit:'s',visual:springSVG()});},
 lv=>{const p=pick([[10,6],[2.5,3],[0.4,1.2],[0.9,1.8],[1.6,2.4],[3.6,3.6]]);return NUM(`Qual o período de um pêndulo simples de <b>${fmt(p[0])} m</b>? (g = 10 m/s², π = 3)`,p[1],`T = 2π√(L/g) = 6·√(${fmt(p[0])}/10) = <b>${fmt(p[1])} s</b>.`,'T = 2π√(L/g).',{unit:'s',keys:[',']});},
 lv=>{const T=pick([0.5,0.25,2,4,0.1]);return NUM(`Um sistema oscila com período de <b>${fmt(T)} s</b>. Qual a frequência?`,1/T,`f = 1/T = <b>${fmt(1/T)} Hz</b>.`,'f = 1/T.',{unit:'Hz',keys:[',']});},
 lv=>{const k=pick([100,200,400,800]),A=pick([0.1,0.2,0.05]);return NUM(`Uma mola de <b>k = ${k} N/m</b> oscila com amplitude de <b>${fmt(A)} m</b>. Qual a energia mecânica?`,k*A*A/2,`E = kA²/2 = ${k}·${fmt(A)}²/2 = <b>${fmt(k*A*A/2)} J</b>.`,'E = k·A²/2.',{unit:'J',keys:[','],tol:0.001});},
 lv=>{const q=pick([['No MHS, a velocidade é máxima:','na posição de equilíbrio',['nos extremos','sempre','nunca']],['No MHS, a aceleração é máxima:','nos extremos',['na posição de equilíbrio','no meio do caminho','nunca']],['O período de um pêndulo simples NÃO depende:','da massa pendurada',['do comprimento','da gravidade','do local (planeta)']],['Se o comprimento de um pêndulo quadruplica, o período:','dobra',['quadruplica','cai pela metade','não muda']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de oscilações.');},
]});
insertSkill('f4','ondas',{id:'acust',name:'Acústica: cordas e tubos',icon:'🎸',tip:'Corda e tubo aberto: fₙ = n·v/2L. Tubo fechado: fₙ = n·v/4L (só n ímpar). Fonte se aproximando: som mais agudo (Doppler). +10 dB = 10× a intensidade.',
theory:`<h3>Cordas vibrantes e tubos abertos</h3><div class="formula">f<sub>n</sub> = n · ${F('v','2L')} (n = 1, 2, 3…)</div>
<h3>Tubos fechados</h3><div class="formula">f<sub>n</sub> = n · ${F('v','4L')} (n = 1, 3, 5… só ímpares)</div>
<div class="ex">Tubo aberto de 0,85 m (v = 340 m/s): f₁ = 340/1,7 = 200 Hz</div>
<h3>Efeito Doppler</h3><p>Fonte se aproximando → frequência percebida maior (mais agudo); se afastando → mais grave.</p>
<h3>Nível sonoro</h3><p>+10 dB = intensidade 10 vezes maior; +20 dB = 100 vezes.</p>`,
gens:[
 lv=>{const v=pick([100,200,300,400]),L=pick([0.5,1,2]),n=R(1,4);return NUM(`Numa corda de <b>${fmt(L)} m</b>, as ondas se propagam a <b>${v} m/s</b>. Qual a frequência do <b>${n}º harmônico</b>?`,n*v/(2*L),`f = n·v/2L = ${n}·${v}/${fmt(2*L)} = <b>${fmt(n*v/(2*L))} Hz</b>.`,'fₙ = n·v/2L.',{unit:'Hz'});},
 lv=>{const p=pick([[0.5,340],[0.85,200],[1.7,100],[0.34,500]]);return NUM(`Qual a frequência fundamental de um tubo <b>aberto</b> de <b>${fmt(p[0])} m</b>? (v<sub>som</sub> = 340 m/s)`,p[1],`f₁ = v/2L = 340/${fmt(2*p[0])} = <b>${p[1]} Hz</b>.`,'Tubo aberto: f₁ = v/2L.',{unit:'Hz'});},
 lv=>{const p=pick([[0.85,100],[0.5,170],[0.25,340],[0.17,500]]);return NUM(`Qual a frequência fundamental de um tubo <b>fechado</b> de <b>${fmt(p[0])} m</b>? (v<sub>som</sub> = 340 m/s)`,p[1],`f₁ = v/4L = 340/${fmt(4*p[0])} = <b>${p[1]} Hz</b>.`,'Tubo fechado: f₁ = v/4L.',{unit:'Hz'});},
 lv=>{const d=pick([10,20,30]);return MC(`Se o nível sonoro aumenta <b>${d} dB</b>, a intensidade fica:`,`${nf(10**(d/10))} vezes maior`,[`${d} vezes maior`,`${2*d} vezes maior`,`${d/10} vezes maior`],`Cada +10 dB multiplica a intensidade por 10: 10<sup>${d/10}</sup> = ${nf(10**(d/10))}.`,'Escala logarítmica: +10 dB = × 10.');},
 lv=>{const q=pick([['Uma ambulância se aproxima. O som da sirene parece:','mais agudo (frequência maior)',['mais grave (frequência menor)','igual','mais fraco']],['Uma ambulância se afasta. O som da sirene parece:','mais grave (frequência menor)',['mais agudo (frequência maior)','igual','mais forte']],['Num tubo fechado numa extremidade, os harmônicos são:','apenas os ímpares',['apenas os pares','todos','apenas o fundamental']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de acústica.');},
]});
insertSkill('f4','optica',{id:'espectro',name:'Ondas eletromagnéticas',icon:'🌈',tip:'No vácuo, todas viajam a c = 3 × 10⁸ m/s. Ordem de frequência: rádio < micro-ondas < infravermelho < luz visível < ultravioleta < raios X < gama. λ = c/f.',
theory:`<p>Ondas eletromagnéticas não precisam de meio e viajam no vácuo a <b>c = 3 × 10<sup>8</sup> m/s</b>.</p>
<div class="formula">c = λ · f</div>
<p><b>Espectro</b> (frequência crescente): rádio → micro-ondas → infravermelho → <b>luz visível</b> → ultravioleta → raios X → raios gama.</p>
<p>Na luz visível: vermelho tem maior λ (menor f); violeta, menor λ (maior f).</p>
<div class="ex">Rádio FM de 100 MHz: λ = 3×10⁸ / 10⁸ = 3 m</div>`,
gens:[
 lv=>{const S=['ondas de rádio','micro-ondas','infravermelho','luz visível','ultravioleta','raios X','raios gama'];const idx=shuffle([0,1,2,3,4,5,6]).slice(0,4);const hi=Math.random()<.5;const c=hi?Math.max(...idx):Math.min(...idx);return MC(`Qual destas radiações tem <b>${hi?'maior':'menor'} frequência</b>?`,S[c],idx.filter(i=>i!==c).map(i=>S[i]),`Ordem crescente de frequência: ${S.join(' < ')}.`,'Rádio é a de menor frequência; gama, a de maior.');},
 lv=>{const p=pick([[4,750],[5,600],[6,500],[7.5,400]]);return NUM(`Qual o comprimento de onda de uma luz de frequência <b>${fmt(p[0])} × 10<sup>14</sup> Hz</b>? Responda em <b>nanômetros</b> (c = 3 × 10<sup>8</sup> m/s).`,p[1],`λ = c/f = 3×10<sup>8</sup> / ${fmt(p[0])}×10<sup>14</sup> = ${fmt(p[1])}×10<sup>−9</sup> m = <b>${p[1]} nm</b>.`,'λ = c/f; 1 nm = 10⁻⁹ m.',{unit:'nm'});},
 lv=>{const f=pick([100,150,300,50]);return NUM(`Uma rádio FM transmite em <b>${f} MHz</b>. Qual o comprimento de onda? (c = 3 × 10<sup>8</sup> m/s)`,300/f,`λ = 3×10<sup>8</sup> / ${f}×10<sup>6</sup> = <b>${fmt(300/f)} m</b>.`,'MHz = 10⁶ Hz.',{unit:'m',keys:[',']});},
 lv=>{const q=pick([['Na luz visível, a cor de maior comprimento de onda é:','vermelho',['violeta','verde','azul']],['Na luz visível, a cor de maior frequência é:','violeta',['vermelho','amarelo','laranja']],['No vácuo, todas as ondas eletromagnéticas têm a mesma:','velocidade',['frequência','energia','cor']],['A radiação usada nos controles remotos é:','infravermelho',['ultravioleta','raios X','raios gama']],['A radiação responsável pelo bronzeado (e pelo câncer de pele) é:','ultravioleta',['infravermelho','ondas de rádio','micro-ondas']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise o espectro eletromagnético.');},
]});
insertSkill('f5','campo',{id:'capac',name:'Capacitores',icon:'🔋',tip:'C = Q/U. Energia E = C·U²/2. Em paralelo: C_eq = C₁ + C₂. Em série: C_eq = C₁C₂/(C₁ + C₂) (o contrário dos resistores!).',
theory:`<p>Capacitor armazena carga e energia no campo elétrico entre suas placas.</p>
<div class="formula">C = ${F('Q','U')} (farad, F) · E = ${F('C · U²',2)}</div>
<h3>Associações (inverso dos resistores!)</h3><ul><li><b>Paralelo</b>: C<sub>eq</sub> = C<sub>1</sub> + C<sub>2</sub> + …</li><li><b>Série</b>: ${F(1,'C<sub>eq</sub>')} = ${F(1,'C₁')} + ${F(1,'C₂')} → dois: ${F('C₁·C₂','C₁ + C₂')}</li></ul>
<div class="ex">C = 2 µF ligado a 10 V: Q = 20 µC; E = 2·10⁻⁶·100/2 = 100 µJ</div>`,
gens:[
 lv=>{const C=R(1,20),U=R(2,50)*2;return NUM(`Um capacitor de <b>${C} µF</b> é ligado a <b>${U} V</b>. Qual a carga armazenada, em µC?`,C*U,`Q = C·U = ${C} µF · ${U} V = <b>${C*U} µC</b>.`,'Q = C·U.',{unit:'µC'});},

insertSkill('f5','potel',{id:'gerad',name:'Geradores e receptores',icon:'🔌',tip:'Gerador: U = ε − r·i; corrente no circuito i = ε/(R + r); curto-circuito i = ε/r; rendimento η = U/ε. Receptor: U = ε′ + r′·i.',

 lv=>{const e=pick([10,20,12,24]),f=pick([0.5,0.75,0.8,0.9]);return NUM(`Um gerador de <b>ε = ${e} V</b> mantém <b>${fmt(e*f)} V</b> nos terminais. Qual seu rendimento (%)?`,f*100,`η = U/ε = ${fmt(e*f)}/${e} = <b>${fmt(f*100)}%</b>.`,'η = U/ε.',{unit:'%'});},

insertSkill('f5','moderna',{id:'nuclear',name:'Física nuclear',icon:'☢️',tip:'Nêutrons = A − Z. Alfa: A − 4 e Z − 2. Beta (β⁻): Z + 1 e A igual. Gama: não muda A nem Z. Fissão divide núcleos pesados (usinas); fusão une leves (Sol).',

<h3>Energia nuclear</h3><ul><li><b>Fissão</b>: núcleo pesado (urânio-235) se divide — usinas como Angra.</li><li><b>Fusão</b>: núcleos leves (hidrogênio) se unem — energia do Sol.</li></ul>`,

 lv=>{const A=R(200,240),Z=R(84,94);const P=(a,z)=>`A = ${a}, Z = ${z}`;return MC(`Um núcleo com <b>${P(A,Z)}</b> emite uma partícula <b>alfa</b>. O novo núcleo tem:`,P(A-4,Z-2),[P(A-2,Z-4),P(A,Z+1),P(A-4,Z+2)],'Alfa = ⁴₂He: A − 4 e Z − 2.','A partícula alfa é um núcleo de hélio.');},
 lv=>{const A=R(10,140),Z=R(5,60);const P=(a,z)=>`A = ${a}, Z = ${z}`;return MC(`Um núcleo com <b>${P(A,Z)}</b> sofre decaimento <b>beta (β⁻)</b>. O novo núcleo tem:`,P(A,Z+1),[P(A,Z-1),P(A-1,Z),P(A-4,Z-2)],'No β⁻, um nêutron vira próton: Z + 1 e A igual.','Beta muda só o número atômico.');},
 lv=>{const q=pick([['Usinas nucleares como Angra produzem energia por:','fissão nuclear',['fusão nuclear','combustão','efeito fotoelétrico']],['O Sol produz energia por:','fusão nuclear',['fissão nuclear','combustão de gases','reações químicas']],['Na emissão gama, o número de massa e o número atômico:','não mudam',['diminuem 4 e 2','aumentam 1','diminuem 1']],['A radiação mais penetrante é a:','gama',['alfa','beta','infravermelha']]]);return MC(q[0],q[1],q[2],`${q[0]} <b>${q[1]}</b>.`,'Revise a aula de física nuclear.');},
 lv=>{const T=pick([5,8,30]),n=R(2,4);return NUM(`Uma amostra radioativa tem meia-vida de <b>${T} dias</b>. Que fração dela resta após <b>${n*T} dias</b>? (ex.: 1/8)`,1/2**n,`${n} meias-vidas: (1/2)<sup>${n}</sup> = <b>${F(1,2**n)}</b>.`,'Cada meia-vida divide por 2.',{answer:F(1,2**n),key:'1/'+2**n,keys:['/']});},
]});

/* Gerador de "relembrar": transforma os cartões de memória em questões (prática de evocação) */
function cardGen(s){ return lv=>{ const C=s.cards,i=R(0,C.length-1),[f,b]=C[i];
  const sib=s.unit.skills.filter(x=>x!==s&&x.cards);
  const backs=shuffle(C.filter((_,j)=>j!==i).map(c=>c[1])).concat(shuffle(sib.flatMap(x=>x.cards.map(c=>c[1]))));
  const fronts=shuffle(C.filter((_,j)=>j!==i).map(c=>c[0])).concat(shuffle(sib.flatMap(x=>x.cards.map(c=>c[0]))));
  const t=Math.random(); let q;
  if(t<0.55) q=MC(`🧠 <b>Relembre:</b> ${f}`,b,backs,`<b>${f}</b>: ${b}.`,s.tip);
  else if(t<0.8) q=MC(`🧠 <b>A que se refere?</b><br>${b}`,f,fronts,`${b} → <b>${f}</b>.`,s.tip);
  else { const ok=Math.random()<.5; q=TF(`${f}: <b>${ok?b:backs[0]}</b>`,ok,`O correto é: <b>${f}</b>: ${b}.`,s.tip); }
  q.card=true; q.cardKey=cardKey(s.id,i); return q; }; }
ALL.forEach(s=>{ if(s.cards&&s.cards.length>=2){ s.cardGi=s.gens.length; s.gens.push(cardGen(s)); } });

const LSK=BRAND.lsKey;
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n));};
const diffDays=(a,b)=>{const p=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime();};return Math.round((p(b)-p(a))/864e5);};
function defState(){return {name:'Estudante',xp:0,gems:100,hearts:5,heartTs:0,streak:0,best:0,last:null,days:{},goal:20,sound:true,unlockAll:false,theme:'auto',skills:{},cards:{},mist:[],chk:{},trophy:{},nudged:null,cardsDone:0,lessons:0,reviews:0,correct:0,answered:0,perfect:0,ach:{},timedBest:0,created:today()};}
let S=defState();
try{const raw=localStorage.getItem(LSK);if(raw)S=Object.assign(defState(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){}}
const DAY=864e5;
const dayStart=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime();};
/* estado de uma habilidade (com migração do formato antigo int/due para stab/lastT) */
function sk(id){ let s=S.skills[id]; if(!s) s=S.skills[id]={lv:0,ease:2.5,stab:0,lastT:0,c:0,w:0,n:0,g:{}};
  if(s.stab==null){ s.stab=s.lv?(s.int||1):0; s.lastT=s.lv&&s.due?dayStart(addDays(s.due,-(s.int||1))):(s.lv?Date.now():0); delete s.int; delete s.due; }
  if(!s.g) s.g={}; return s; }
const MAXH=5,HEART_MS=30*60*1000,REFILL=50;
function regen(){ if(S.hearts>=MAXH){S.heartTs=0;return;} if(!S.heartTs)S.heartTs=Date.now(); const n=Math.floor((Date.now()-S.heartTs)/HEART_MS); if(n>0){S.hearts=Math.min(MAXH,S.hearts+n);S.heartTs=S.hearts>=MAXH?0:S.heartTs+n*HEART_MS;save();} }
function loseHeart(){ if(S.hearts>=MAXH)S.heartTs=Date.now(); S.hearts=Math.max(0,S.hearts-1); }
function nextHeartIn(){ if(S.hearts>=MAXH||!S.heartTs)return ''; const ms=HEART_MS-(Date.now()-S.heartTs); const m=Math.max(0,Math.floor(ms/60000)),s=Math.max(0,Math.floor(ms%60000/1000)); return `${m}:${pad(s)}`; }
function checkStreak(){ const t=today(); if(S.last&&S.last!==t&&S.last!==addDays(t,-1)&&S.streak>0){ S.streak=0; save(); } }
function markStudy(xp){ const t=today(); let up=false; if(S.last!==t){ S.streak=(S.last===addDays(t,-1))?S.streak+1:1; S.last=t; up=true; } S.best=Math.max(S.best,S.streak); S.days[t]=(S.days[t]||0)+xp; S.xp+=xp; return up; }
const xpToday=()=>S.days[today()]||0;
const lvlOf=xp=>{let n=1;while(25*n*(n+1)<=xp)n++;return n;};
const lvlStart=n=>25*(n-1)*n;
function isUnlocked(i){ return S.unlockAll||i===0||sk(ALL[i].id).lv>=1||sk(ALL[i-1].id).lv>=1; }
/* ===== Modelo de memória (curva do esquecimento) =====
   Retenção estimada R(t) = 0,9^(t/estabilidade): cai para 90% após "stab" dias.
   Revisar quando R chega a ~90% (o momento ideal: difícil o bastante para fortalecer, fácil o bastante para lembrar).
   Quanto mais "esquecido" (R menor) e ainda assim acertado, maior o ganho de estabilidade (efeito do espaçamento). */
const eod=()=>dayStart(today())+DAY;
function retention(id,at){ const s=sk(id); if(s.lv<1||!s.lastT||!s.stab) return 1; const t=((at||Date.now())-s.lastT)/DAY; return Math.pow(0.9,Math.max(0,t)/s.stab); }
function isDue(id){ const s=sk(id); return s.lv>=1&&s.lastT>0&&(eod()-s.lastT)/DAY>=s.stab; }
function nextReviewDays(id){ const s=sk(id); return Math.max(0,Math.ceil((s.lastT+s.stab*DAY-dayStart(today()))/DAY)-1); }
function memUpdate(id,acc){ const s=sk(id); const R=retention(id);
  if(!s.stab||!s.lastT){ s.stab=acc>=0.7?1:0.5; }
  else if(acc>=0.9){ s.stab=Math.max(s.stab+0.5,s.stab*(1+s.ease*(1.3-R))); s.ease=Math.min(3,s.ease+0.05); }
  else if(acc>=0.7){ s.stab=Math.max(s.stab,s.stab*(1+(s.ease-1)*(1.3-R)*0.5)); }
  else { s.stab=Math.max(0.5,s.stab*0.4); s.ease=Math.max(1.3,s.ease-0.15); }
  s.stab=Math.min(round(s.stab,2),365); s.lastT=Date.now(); }
function avgRetention(){ const l=learned(); return l.length?l.reduce((a,id)=>a+retention(id),0)/l.length:0; }
const memColor=R=>R>=0.9?'#58cc02':R>=0.8?'#ffc800':R>=0.65?'#ff9600':'#ff4b4b';
const memLabel=R=>R>=0.9?'fresca':R>=0.8?'esfriando':R>=0.65?'esquecendo':'quase esquecida';
/* ===== Cartões de memória (flashcards) — repetição espaçada por cartão ===== */
function cardKey(id,i){ return id+':'+i; }
function cs(k){ return S.cards[k]||(S.cards[k]={stab:0,lastT:0,ease:2.5,n:0}); }
function cardR(k){ const c=cs(k); if(!c.lastT) return 0; return Math.pow(0.9,((Date.now()-c.lastT)/DAY)/c.stab); }
function cardDue(k){ const c=cs(k); return !c.lastT||(eod()-c.lastT)/DAY>=c.stab; }
function cardRate(k,g){ const c=cs(k),R=c.lastT?cardR(k):1; c.n++;
  if(g===1){ c.stab=Math.max(0.2,(c.stab||0.5)*0.3); c.ease=Math.max(1.3,c.ease-0.2); }
  else if(!c.stab){ c.stab=[0,0,0.6,1,3][g]; }
  else if(g===2){ c.stab=Math.max(c.stab,c.stab*1.2); c.ease=Math.max(1.3,c.ease-0.1); }
  else if(g===3){ c.stab=Math.max(c.stab+0.5,c.stab*(1+c.ease*(1.3-R))); }
  else { c.stab=Math.max(c.stab+1,c.stab*(1+c.ease*(1.3-R))*1.3); c.ease=Math.min(3,c.ease+0.1); }
  c.stab=Math.min(round(c.stab,2),365); c.lastT=Date.now(); }
function cardPool(){ const due=[],fresh=[]; learned().forEach(id=>(SK[id].cards||[]).forEach((_,i)=>{ const k=cardKey(id,i); if(!cs(k).lastT) fresh.push(k); else if(cardDue(k)) due.push(k); })); due.sort((a,b)=>cardR(a)-cardR(b)); return {due,fresh}; }
function cardsToday(){ const p=cardPool(); return p.due.length+Math.min(8,p.fresh.length); }

function normChat(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[?!.,;:]/g,' ').replace(/\s+/g,' ').trim(); }
function findGloss(m){ const w=' '+m+' '; let best=null,bl=0; GLOSS.forEach(g=>g.k.forEach(k=>{ const hit=k.length<=3?w.includes(' '+k+' '):w.includes(k); if(hit&&k.length>bl){best=g;bl=k.length;} })); return best; }
/* calculadora segura (sem eval) */
function evalExpr(src){
  const s=src.replace(/×|x(?=\s*\d)/g,'*').replace(/÷|:/g,'/').replace(/−|–/g,'-').replace(/,/g,'.').replace(/\s+/g,'').replace(/sqrt|raiz/gi,'√');
  let i=0;
  const num=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?|^\.\d+/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);};
  const atom=()=>{ if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v;} if(s[i]==='√'){i++;const v=unary();if(v<0)throw 0;return Math.sqrt(v);} if(s[i]==='π'){i++;return Math.PI;} return num(); };
  const power=()=>{ let b=atom(); if(s[i]==='%'){i++;b/=100;} if(s[i]==='^'){i++;return b**unary();} return b; };
  const unary=()=>{ if(s[i]==='-'){i++;return -unary();} if(s[i]==='+'){i++;return unary();} return power(); };
  const term=()=>{ let v=unary(); while(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=unary();v=o==='*'?v*r:v/r;} return v; };
  const expr=()=>{ let v=term(); while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r;} return v; };
  const v=expr(); if(i!==s.length||!isFinite(v))throw 0; return v;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tutor(raw){
  const m=normChat(raw);
  const q=(L&&L.cur&&L.state!=='result'&&!$('#lesson').classList.contains('hidden'))?L.cur:null;
  const answered=q&&L.state==='feedback';
  const aula=id=>`<br><button class="chip" data-theory="${id}" style="margin-top:8px">📖 Abrir aula: ${SK[id].name}</button>`;
  if(!m) return 'Pode perguntar! 🙂';
  if(/^(oi|ola|opa|bom dia|boa tarde|boa noite|e ai|hey|hello|salve)\b/.test(m)) return `Olá, ${esc(S.name)}! 👋 Eu sou o ${BRAND.tutor}. ${q?'Estou vendo sua questão atual — quer uma <b>dica</b>?':'Pergunte sobre qualquer assunto (ex.: "o que é MMC?") ou digite uma conta.'}`;
  if(/obrigad|valeu|vlw|brigad/.test(m)) return 'Por nada! Continue praticando — a repetição é o segredo. 💪';
  /* porcentagem rápida */
  let pm=raw.replace(/−/g,'-').match(/(-?\d+(?:[.,]\d+)?)\s*%\s*de\s*(-?\d+(?:[.,]\d+)?)/i);
  if(pm){ const p=parseFloat(pm[1].replace(',','.')),v=parseFloat(pm[2].replace(',','.')); return `🧮 ${fmt(p)}% de ${fmt(v)} = ${fmt(v)} × ${fmt(p)}/100 = <b>${fmt(v*p/100)}</b>`; }
  let rm=m.match(/raiz (?:quadrada )?de (\d+(?:\.\d+)?)/); if(rm){ const v=parseFloat(rm[1]); return `🧮 √${fmt(v)} = <b>${fmt(round(Math.sqrt(v),4))}</b>${Number.isInteger(Math.sqrt(v))?` (pois ${Math.sqrt(v)}² = ${v})`:' (aproximadamente)'}`; }
  const ex=raw.replace(/quanto (é|e)|calcule|calcular|resolva|conta|\?|=/gi,'').trim();
  if(/^[\d\s+\-−*/×÷^().,√π%:x]+$/i.test(ex)&&/\d/.test(ex)&&/[+\-−*/×÷^√%:x]/.test(ex)){ try{ const v=evalExpr(ex); return `🧮 ${esc(ex)} = <b>${fmt(round(v,6))}</b>${q&&!answered?'<br><small>Use a calculadora para conferir, mas tente entender o raciocínio! 😉</small>':''}`; }catch(e){} }
  if(q){
    const s=SK[q.skill];
    if(/mostrar resposta|mostra a resposta|revela|revelar/.test(m)){ q.revealed=true; return `Tudo bem! A resposta é <b>${q.answer}</b>.<div class="ex">${q.exp}</div>Entenda o porquê e depois responda. 😉`; }
    if(/resposta|gabarito|qual (e|eh) a certa|qual a certa|resultado/.test(m)){ if(answered) return `✅ A resposta é <b>${q.answer}</b>.<div class="ex">${q.exp}</div>`; return `Tente primeiro! 😄 Uma dica: ${q.hint||s.tip}<br><small>Se quiser mesmo ver, digite <b>mostrar resposta</b>.</small>`; }
    if(/dica|ajuda|nao sei|travei|help|socorro|empaquei|me ajuda/.test(m)) return `💡 <b>Dica:</b> ${q.hint||s.tip}`;
    if(/por que|porque|pq|explica|explique|passo|como (resolv|faz|faco|calcul|chego)|nao entendi|errei|resolucao/.test(m)){ if(answered) return `📝 <b>Resolução:</b><div class="ex">${q.exp}</div>💡 ${s.tip}`; return `🧭 <b>Como pensar (${s.name}):</b><br>${s.tip}<br><br>💡 ${q.hint||''}<br><small>Depois de responder, pergunte "por quê?" para ver a resolução completa.</small>`; }
    if(/conceito|teoria|aula|materia|conteudo|formula|o que (e|eh) isso/.test(m)&&!findGloss(m)) return `📘 <b>${s.name}</b><br>${s.tip}${aula(s.id)}`;
  }
  const g=findGloss(m);
  if(g) return `📘 <b>${g.n}</b><br>${g.t}${aula(g.s)}`;
  if(/formula|formulas/.test(m)) return `Posso te passar fórmulas de: ${BRAND.formulas}… Qual delas?`;
  if(/xp|vida|coracao|ofensiva|streak|gema/.test(m)) return 'Você ganha <b>XP</b> concluindo lições e revisões. Cada erro numa lição custa 1 ❤️ (recupera 1 a cada 30 min, ou pratique na aba Revisar para ganhar vidas). A 🔥 <b>ofensiva</b> conta os dias seguidos em que você estudou.';
  return `Hmm, não encontrei isso na minha memória. 🤔 Tente perguntar sobre um tema (ex.: ${BRAND.askEx}) ou digite uma conta como <b>12*7+3</b>, <b>2^10</b>, <b>raiz de 144</b> ou <b>15% de 80</b>.${q?' Sobre a questão atual, peça uma <b>dica</b>.':''}`;
}

function startFuv(kind,opts={}){

  if(kind==='redo') pool=F.wrong.map(fuvById).filter(Boolean);
  if(kind==='build') pool=pool.filter(q=>q.steps&&q.steps.length>=2);
  if(!pool.length){ toast('Nenhuma questão disponível para esse modo.'); return; }
  const n=opts.n||(kind==='sim10'?10:kind==='sim20'?20:kind==='build'?6:10);
  const qs=opts.ordered?pool.slice(0,n):shuffle(pool).sort((a,b)=>(F.seen[a.id]||0)-(F.seen[b.id]||0)).slice(0,n);
  closeModal(); OPEN_POP=null;
  const exam=opts.exam!=null?opts.exam:kind==='sim10'||kind==='sim20';
  L={mode:'fuv',kind,exam,title:opts.title||'',queue:qs.map(q=>q.id),i:0,total:qs.length,done:0,correct:0,wrong:0,blank:0,combo:0,maxCombo:0,t0:Date.now(),per:{},missed:[],answers:[],state:'answer',sel:null,lives:null,timeLeft:exam?qs.length*180:null,timer:null};

  if(exam) L.timer=setInterval(()=>{ if(!L||L.mode!=='fuv'||L.state==='result')return; L.timeLeft--; fuvTop(); if(L.timeLeft<=0){ toast('⏰ Tempo esgotado!'); fuvFinish(); } },1000);
  fuvRender();
}

function fuvPseudo(q){ const tag=q.tags.find(t=>SK[t]); return {skill:tag||ALL[0].id,type:'mc',prompt:fuvText(q),hint:q.steps&&q.steps.length?'Comece assim: '+fuvStep(q,q.steps[0]):'Identifique o assunto, anote os dados e escolha a fórmula.',answer:`(${LETTERS[q.ans]}) ${fuvAlt(q,q.ans)}`,exp:q.steps&&q.steps.length?q.steps.map((s,i)=>`${i+1}. ${fuvStep(q,s)}`).join('<br>'):(q.why&&q.why[q.ans])||''}; }

function fuvRecord(q,ok,sel){ const F=fv(); F.seen[q.id]=(F.seen[q.id]||0)+1;

/* Diagnóstico de uma questão: o que errou + resolução + o que revisar */
function fuvDiag(q,sel,open){

  const rev=fuvRev(q,ok);
  return `<div class="diag ${ok?'good':'badd'}">${blank?`<div class="dline"><b>⚪ Em branco.</b> A correta é (${LETTERS[q.ans]}) ${fuvAlt(q,q.ans)}.</div>`:ok?`<div class="dline"><b>✅ Correto:</b> (${LETTERS[q.ans]}) ${fuvAlt(q,q.ans)}</div>`:`<div class="dline"><b>❌ Você marcou (${LETTERS[sel]}):</b> ${fuvAlt(q,sel)}</div><div class="dwhy"><b>Onde está o erro:</b> ${fuvStep(q,why)}</div><div class="dline"><b>✅ Correta: (${LETTERS[q.ans]})</b> ${fuvAlt(q,q.ans)}</div>`}

function fuvRev(q,ok){ return q.tags.length?`<div class="revbox"><b>📚 O que revisar</b>${q.tags.map(t=>{const s=SK[t],lv=sk(t).lv;return `<div class="revrow"><span>${s.icon} <b>${s.name}</b><small>${lv?`memória ${Math.round(retention(t)*100)}% · nível ${lv}/5`:'ainda não estudado na trilha'}</small></span><span><button class="btn sm ghost" data-theory="${t}">Aula</button><button class="btn sm" ${lv?`data-practice="${t}"`:`data-start="${t}"`}>${lv?'Praticar':'Estudar'}</button></span></div>`;}).join('')}${!ok&&q.tags.some(t=>sk(t).lv)?'<small class="muted">Esses assuntos foram antecipados na sua revisão espaçada.</small>':''}</div>`:''; }

   <details open><summary><b>📝 Resolução correta</b></summary><ol class="solsteps">${q.steps.map(s=>`<li>${fuvStep(q,s)}</li>`).join('')}</ol></details>
   <div class="dline"><b>Resposta:</b> (${LETTERS[q.ans]}) ${fuvAlt(q,q.ans)}</div>${fuvRev(q,ok)}</div>`);

  const n=L.answers.length,c=L.answers.filter(a=>a.ok).length,secs=Math.round((Date.now()-L.t0)/1000),acc=n?c/n:0;

const IMPORT_HELP=`### FUVEST 2024 · Q12
assuntos: progressão aritmética, probabilidade
Os ângulos internos de um triângulo estão em PA e o maior mede 80°. O menor mede:
A) 20°
B) 30°
C) 40°
D) 50°
E) 60°
gabarito: C
erro A: confundiu a razão com o menor ângulo
resolução:
- Ângulos: a − r, a, a + r
- 3a = 180° ⇒ a = 60°
- 60° + r = 80° ⇒ r = 20°
- Menor: 60° − 20° = 40°`;
/* Assuntos de uma questão pelo texto: pontua cada habilidade pelas palavras-chave do glossário
   (frequência × especificidade: termos de várias palavras valem mais) e fica com as mais fortes */
function autoTags(txt){ const m=' '+normChat(txt)+' ',sc={};
  GLOSS.forEach(g=>{ if(!SK[g.s])return; g.k.forEach(k=>{ if(k.length<4)return; let i=0,n=0; while((i=m.indexOf(' '+k,i))>=0){ n++; i+=k.length+1; } if(n) sc[g.s]=(sc[g.s]||0)+Math.min(n,3)*(k.includes(' ')?3:1)*(k.length>=7?1.5:1); }); });
  const arr=Object.entries(sc).sort((a,b)=>b[1]-a[1]); if(!arr.length) return [];
  return arr.filter(x=>x[1]>=arr[0][1]*0.5).slice(0,3).map(x=>x[0]); }
function mapTag(t){ const n=normChat(t); if(!n)return null; if(SK[n])return n; const bn=ALL.find(s=>normChat(s.name)===n)||ALL.find(s=>normChat(s.name).includes(n)||n.includes(normChat(s.name))); if(bn)return bn.id; const g=findGloss(n); return g&&SK[g.s]?g.s:null; }
function parseImport(raw){
  raw=raw.trim(); const out=[],errs=[];
  if(raw.startsWith('[')||raw.startsWith('{')){ try{ let arr=JSON.parse(raw); if(!Array.isArray(arr)) arr=arr.questoes||[arr];
      arr.forEach((o,k)=>{ const alts=o.alternativas||o.alts||[]; const g=String(o.gabarito??o.ans??'').trim().toUpperCase(); const ans=/^[A-E]$/.test(g)?LETTERS.indexOf(g):+g;
        if(!o.enunciado&&!o.q||alts.length<2||!(ans>=0&&ans<alts.length)){ errs.push(`Item ${k+1}: faltam enunciado, alternativas ou gabarito.`); return; }
        const why=[]; if(o.erros) Object.entries(o.erros).forEach(([L_,t])=>{ why[LETTERS.indexOf(L_.toUpperCase())]=t; });
        const src=o.fonte||o.src||'Importada'; out.push(mkImp(src,o.assuntos||o.tags||[],o.enunciado||o.q,alts,ans,why,o.resolucao||o.steps||[],o.erradas||o.trap||[])); }); }catch(e){ errs.push('JSON inválido: '+e.message); } return {out,errs}; }
  const blocks=raw.split(/^\s*#{2,3}\s*/m).map(b=>b.trim()).filter(Boolean);
  blocks.forEach((b,k)=>{ const lines=b.split('\n'); const src=lines.shift().trim()||'Importada'; let tags=[],en=[],alts=[],ans=-1,why=[],steps=[],traps=[],mode='en';
    lines.forEach(l=>{ const t=l.trim(); let m;
      if(/^#(?!#)/.test(t)) return;
      if(!t){ if(mode==='en') en.push(''); return; }
      if((m=t.match(/^(assuntos?|tags?|mat[eé]rias?)\s*:\s*(.*)$/i))){ tags=m[2].split(/[,;]/).map(x=>x.trim()).filter(Boolean); return; }
      if((m=t.match(/^(gabarito|resposta|correta)\s*:\s*\(?([A-Ea-e])\)?/i))){ ans=LETTERS.indexOf(m[2].toUpperCase()); mode='x'; return; }
      if((m=t.match(/^erro\s*\(?([A-Ea-e])\)?\s*:\s*(.*)$/i))){ why[LETTERS.indexOf(m[1].toUpperCase())]=m[2]; return; }
      if(/^resolu[cç][aã]o\s*:?\s*$/i.test(t)){ mode='res'; return; }
      if((m=t.match(/^resolu[cç][aã]o\s*:\s*(.+)$/i))){ steps=m[1].split('|').map(x=>x.trim()).filter(Boolean); mode='res'; return; }
      if(/^(passos? )?errad[oa]s?\s*:?\s*$/i.test(t)||/^armadilhas?\s*:?\s*$/i.test(t)){ mode='trap'; return; }
      if(mode==='res'||mode==='trap'){ const s=t.replace(/^(\d+[\.\)]|[-•*])\s*/,''); (mode==='res'?steps:traps).push(s); return; }
      if((m=t.match(/^\(?([A-Ea-e])\s*[\)\.\-:]\s*(.+)$/))&&(alts.length===LETTERS.indexOf(m[1].toUpperCase()))){ alts.push(m[2]); mode='alt'; return; }
      if(mode==='alt'&&alts.length){ alts[alts.length-1]+=' '+t; return; }
      en.push(t); });
    const enun=en.join('\n').trim();
    if(!enun||alts.length<2||ans<0||ans>=alts.length){ errs.push(`Questão ${k+1} ("${src.slice(0,40)}"): ${!enun?'sem enunciado':alts.length<2?'alternativas não encontradas (use A) … E))':'gabarito ausente ou inválido'}.`); return; }
    out.push(mkImp(src,tags,enun,alts,ans,why,steps,traps)); });
  return {out,errs}; }
function mkImp(src,tags,q,alts,ans,why,steps,trap){ const set=String(src).split(/[·|–—]/)[0].replace(/\bQ(uest[aã]o)?\s*\d+\b/i,'').trim()||'Importadas';
  let tg=(Array.isArray(tags)?tags:String(tags).split(',')).map(mapTag).filter(Boolean); if(!tg.length) tg=autoTags(q+' '+alts.join(' '));
  let h=0; const str=src+q; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0;
  return {id:'imp'+Math.abs(h).toString(36),origin:'imp',set,src:String(src),area:'',tags:[...new Set(tg)],q:String(q),alts:alts.map(String),ans,why:why.map(x=>x==null?x:String(x)),steps:(steps||[]).map(String),trap:(trap||[]).map(String)}; }
function importModal(){
  modal(`<h2>📥 Importar questões</h2><p class="muted" style="font-size:14px">Cole questões que ainda não estão no banco: FUVEST 2025 e 2026 e os simulados oficiais (em <a href="https://www.fuvest.br" target="_blank" rel="noopener">fuvest.br</a>) ou os simulados do seu cursinho. Escreva a fonte com o ano (ex.: <b>### Simulado FUVEST 2026 · Q12</b>) para saber sempre de onde a questão veio. Uma questão por bloco, começando com <b>###</b> e a fonte. Os <b>assuntos</b> ligam a questão à trilha (se faltar, o app tenta descobrir pelo texto). <b>resolução</b> e <b>erro X</b> são opcionais, mas com eles a correção e o modo Montar resolução ficam muito melhores. Também aceita JSON.</p>

  const f=$('#impfile'); f.addEventListener('change',()=>{ const file=f.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{ $('#imptxt').value=r.result; }; r.readAsText(file); });

function doImport(){ const raw=$('#imptxt').value; if(!raw.trim()){ $('#impmsg').innerHTML='Cole as questões primeiro.'; return; }
  const {out,errs}=parseImport(raw); const F=fv(); let added=0; out.forEach(q=>{ if(!F.imp.some(x=>x.id===q.id)){ F.imp.push(q); added++; } });
  try{ save(); }catch(e){}
  const untagged=out.filter(q=>!q.tags.length).length;
  if(!out.length){ $('#impmsg').innerHTML=`<span style="color:var(--red)">Nenhuma questão reconhecida.</span><br>${errs.slice(0,5).map(esc).join('<br>')}`; return; }
  closeModal(); render(); toast(`📥 ${added} questão${added!==1?'es':''} importada${added!==1?'s':''}${errs.length?` · ${errs.length} com problema`:''}`,3200);
  if(errs.length||untagged) setTimeout(()=>modal(`<h2>Importação concluída</h2><p><b>${added}</b> questões adicionadas.</p>${untagged?`<p class="muted">${untagged} questão(ões) ficaram sem assunto identificado — o diagnóstico por assunto não vai considerá-las. Adicione a linha <b>assuntos:</b> para ligá-las à trilha.</p>`:''}${errs.length?`<p style="color:var(--red)">Problemas:</p><ul style="padding-left:20px;font-size:14px">${errs.slice(0,10).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<div class="actions"><button class="btn block" data-close>Ok</button></div>`),400); }
function exportImp(){ const data=JSON.stringify(fv().imp.map(q=>({fonte:q.src,assuntos:q.tags,enunciado:q.q,alternativas:q.alts,gabarito:LETTERS[q.ans],erros:Object.fromEntries(q.why.map((w,i)=>[LETTERS[i],w]).filter(x=>x[1])),resolucao:q.steps,erradas:q.trap})),null,1);
  modal(`<h2>💾 Exportar questões importadas</h2><p class="muted" style="font-size:14px">Copie este texto e guarde-o (ou cole em "Importar questões" em outro aparelho).</p><textarea id="exptxt" class="imptxt" readonly></textarea><div class="actions"><button class="btn block" data-fa="copyexp">Copiar</button><button class="btn ghost block" data-close>Fechar</button></div>`);
  $('#exptxt').value=data; }

    case 'oprovago': { const m=OFC_MAN.find(x=>x.id===d.pid); closeModal(); ofcRun([m.id],()=>startFuv('oprova',{pool:OFC[m.id],ordered:true,n:OFC[m.id].length,exam:true,title:`${m.label} · ${m.sub.split(' · ')[0]}`})); break; }
    case 'otreinop': { const m=OFC_MAN.find(x=>x.id===d.pid); closeModal(); ofcRun([m.id],()=>startFuv('otreino',{pool:OFC[m.id],title:m.label})); break; }
    case 'osim': case 'otreino': { const tab=S.ofcTab==='ENEM'?'ENEM':'FUVEST'; let pids=OFC_MAN.filter(m=>m.exam===tab).map(m=>m.id); if(pids.length>5) pids=shuffle(pids).slice(0,5); const sim=d.fa==='osim';
      ofcRun(pids,()=>startFuv(d.fa,{pool:pids.flatMap(p=>OFC[p]),exam:sim,title:`${sim?'Simulado':'Treino'} ${tab} · questões oficiais`})); break; }
    case 'set': startFuv('treino',{set:d.set}); break;
    case 'topic': startFuv('treino',{skill:d.skill}); break;

    case 'delyes': { const F=fv(); F.imp=F.imp.filter(q=>q.set!==d.set); save(); closeModal(); render(); toast('Conjunto apagado.'); break; }
    case 'import': importModal(); break;

function fuvKey(e){
  if(L.state==='answer'){ const k=e.key.toUpperCase(); const i=LETTERS.indexOf(k); if(i>=0&&k.length===1){ fuvSelect(i); return; } if(/^[1-5]$/.test(e.key)){ fuvSelect(+e.key-1); return; } if(e.key==='Enter'){ e.preventDefault(); fuvCheck(false); } }
  else if(e.key==='Enter'){ e.preventDefault(); if(L.state==='feedback'||L.state==='build-done'){ fuvNext(); } else if(L.state==='build') fuvBuildCheck(); else if(L.state==='result') quitLesson(); }

  <div class="actions">${S.hearts<MAXH?`<button class="btn blue block" data-act="refill" ${S.gems>=REFILL?'':'disabled'}>Recarregar vidas · 💎 ${REFILL}</button><button class="btn block" data-act="review-all" ${learned().length?'':'disabled'}>🧠 Praticar para ganhar vida</button>`:''}${inLesson?'<button class="btn ghost dark block" data-act="quit">Sair da lição</button>':'<button class="btn ghost block" data-close>Fechar</button>'}</div>`,{noClose:!!inLesson});

let L=null;
const TL={mc:'Escolha a resposta correta',tf:'Verdadeiro ou falso?',input:'Digite a resposta',fill:'Complete a lacuna',bank:'Toque na peça que completa'};
const PRAISE=['Muito bem!','Excelente!','Mandou bem!','Perfeito!','Isso aí!','Incrível!','Show de bola!','Você é fera!'];
function gweight(id,i){ const s=SK[id],g=sk(id).g[i]||[0,0]; let w=1+3*g[1]/(g[0]+g[1]+1); if(i===s.cardGi) w*=0.8; return w; }
function wpick(id,excl){ const s=SK[id]; let idx=s.gens.map((_,i)=>i); if(idx.length>1&&excl!=null) idx=idx.filter(i=>i!==excl); const tot=idx.reduce((a,i)=>a+gweight(id,i),0); let r=Math.random()*tot; for(const i of idx){ r-=gweight(id,i); if(r<=0) return i; } return idx[idx.length-1]; }
function makeQ(id,gi){ const s=SK[id]; const lv=Math.min(5,sk(id).lv); for(let t=0;t<6;t++){ const g=gi==null?wpick(id):gi; try{ const q=s.gens[g](lv); q.skill=id; q.gi=g; q.tries=0; return q; }catch(e){ console.error('Erro no gerador',id,g,e); gi=null; } } return null; }
function qsig(q){ return q.prompt+'|'+(q.sentence||''); }
function buildQs(ids,n,focus){ const out=[],seen=new Set(),ord={},last={}; ids.forEach(id=>ord[id]=focus?[]:shuffle(SK[id].gens.map((_,i)=>i)));
  for(let k=0;out.length<n&&k<n*8;k++){ const id=ids[k%ids.length],o=ord[id]; const gi=o.length?o.shift():wpick(id,last[id]); const q=makeQ(id,gi); if(!q||seen.has(qsig(q)))continue; seen.add(qsig(q)); last[id]=q.gi; out.push(q); }
  return out; }
function weakest(ids,n){ return ids.map(id=>{const s=sk(id);return [id,retention(id)-0.3*(s.w/(s.c+s.w+1))];}).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]); }
function startSession(mode,opts={}){
  regen(); closeModal(); OPEN_POP=null;
  if(mode==='cards') return startCards();
  let qs=[],lives=null,intro=false;
  if(mode==='lesson'){
    if(S.hearts<=0){ heartsModal(false); return; }
    const id=opts.skill; qs=buildQs([id],10); intro=sk(id).lv===0;
    const others=learned().filter(x=>x!==id); if(others.length){ const due=others.filter(isDue); const pool=due.length?due:weakest(others,4); [3,7].forEach(p=>{ const q=makeQ(pick(pool)); if(q){q.review=true;qs.splice(p,1,q);} }); }
  } else if(mode==='review'){
    let ids=opts.ids&&opts.ids.length?opts.ids:weakest(learned(),5); if(!ids.length){ toast('Conclua uma lição primeiro! 📚'); return; }
    qs=buildQs(shuffle(ids),12,true);
  } else if(mode==='chk'){ qs=buildQs(shuffle(opts.ids),12);
  } else if(mode==='unit'){ const ids=UNITS[opts.unit].skills.map(s=>s.id); qs=buildQs(shuffle(ids),15); lives=3;
  } else if(mode==='skill'){ qs=buildQs([opts.skill],10,true);
  } else if(mode==='mistakes'){ const seen=new Set(); (S.mist||[]).forEach(m=>{ const k=m.s+'#'+m.g; if(SK[m.s]&&SK[m.s].gens[m.g]&&!seen.has(k)&&qs.length<12){ seen.add(k); const q=makeQ(m.s,m.g); if(q){ q.mist=m; qs.push(q);} } });
    if(!qs.length){ toast('Seu caderno de erros está vazio! 🎉'); return; }
    if(qs.length<8){ const ids=[...new Set(qs.map(q=>q.skill))]; qs=qs.concat(buildQs(ids,8-qs.length,true)); }
  } else if(mode==='timed'){ const pool=ALL.filter(s=>isUnlocked(s.idx)).map(s=>s.id); opts.pool=pool; qs=buildQs(shuffle(pool).slice(0,8),8);
  } else if(mode==='jump'){ const ids=ALL.filter(s=>s.ui<opts.unit).map(s=>s.id); qs=buildQs(shuffle(ids).slice(0,12),12); lives=3; }
  if(!qs.length){ toast('Não foi possível gerar questões.'); return; }
  L={mode,skill:opts.skill,unit:opts.unit,ids:opts.ids,key:opts.key,pool:opts.pool,queue:qs,i:0,total:qs.length,done:0,correct:0,wrong:0,combo:0,maxCombo:0,t0:Date.now(),per:{},missed:[],lives,timeLeft:mode==='timed'?60:null,state:'answer',sel:null,timer:null};
  $('#lesson').classList.remove('hidden'); document.body.style.overflow='hidden';
  if(mode==='timed'){ L.timer=setInterval(()=>{ if(!L||L.state==='result')return; L.timeLeft--; updTop(); if(L.timeLeft<=0) finish(); },1000); }
  if(intro) renderIntro(); else nextQ();
}
function renderIntro(){

   <p class="muted" style="margin-top:12px;font-size:14px">Leia com atenção: logo em seguida você vai praticar e, amanhã, revisar.</p>`;

/* ---------- Cartões de memória (flashcards) ---------- */
function startCards(){ const p=cardPool(); let keys=p.due.slice(0,15); keys=keys.concat(shuffle(p.fresh).slice(0,Math.max(0,Math.min(8,15-keys.length))));
  if(!keys.length){ toast('Nenhum cartão para hoje! ✅'); return; }
  L={mode:'cards',queue:keys,i:0,total:keys.length,done:0,correct:0,wrong:0,combo:0,maxCombo:0,t0:Date.now(),per:{},missed:[],again:new Set(),state:'front'};
  $('#lesson').classList.remove('hidden'); document.body.style.overflow='hidden'; renderCard(); }
function cardData(k){ const j=k.lastIndexOf(':'),id=k.slice(0,j); return {s:SK[id],c:SK[id].cards[+k.slice(j+1)],id}; }
function renderCard(){
  if(L.i>=L.queue.length) return finish();
  const k=L.queue[L.i],{s,c}=cardData(k),st=cs(k); L.state='front'; L.cur=null;
  $('#lqbox').innerHTML=`<div class="new-tag" style="color:${s.unit.color}">${s.icon} ${s.name}${st.lastT?'':' · ✨ cartão novo'}${L.again.has(k)&&L.queue.indexOf(k)<L.i?' · ⟲ de novo':''}</div><h2 class="qtitle">Você lembra?</h2>
   <div class="flash" id="flash"><div class="fface front"><small>PERGUNTA</small><div>${c[0]}</div></div><div class="fface back"><small>RESPOSTA</small><div>${c[1]}</div><em>${c[0]}</em></div></div>
   <p class="muted center" style="margin-top:14px;font-size:14px">Diga (ou pense) a resposta antes de virar o cartão.</p>`;
  $('#lbody').scrollTop=0; $('#lfoot').className='lfoot';
  $('#lfootin').innerHTML=`<div class="footrow" style="justify-content:center"><button class="btn blue" style="min-width:260px" data-act="flip" id="bCont">Mostrar resposta</button></div>`;
  updTop(); }
function flipCard(){ if(!L||L.state!=='front')return; L.state='back'; $('#flash').classList.add('flipped'); beep(SND.tap);
  const k=L.queue[L.i],c=cs(k); const prev=g=>{ if(g===1) return '&lt;1 d'; const tmp=JSON.parse(JSON.stringify(c)); const back=S.cards[k]; S.cards[k]=tmp; cardRate(k,g); const d=S.cards[k].stab; S.cards[k]=back; return d<1?'1 d':Math.round(d)+' d'; };
  $('#lfootin').innerHTML=`<div class="rate"><button class="rbtn r1" data-rate="1"><b>Errei</b><small>${prev(1)}</small></button><button class="rbtn r2" data-rate="2"><b>Difícil</b><small>${prev(2)}</small></button><button class="rbtn r3" data-rate="3"><b>Lembrei</b><small>${prev(3)}</small></button><button class="rbtn r4" data-rate="4"><b>Fácil</b><small>${prev(4)}</small></button></div>`; }
function rateCard(g){ if(!L||L.state!=='back')return; const k=L.queue[L.i]; cardRate(k,g); S.cardsDone++; const id=cardData(k).id;
  const p=L.per[id]||(L.per[id]={c:0,w:0});
  if(g===1){ L.wrong++; p.w++; L.combo=0; beep(SND.bad); if(!L.again.has(k)){ L.again.add(k); L.queue.push(k); } else L.done++; }
  else { L.correct++; p.c++; L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.done++; beep(SND.ok); }
  L.i++; save(); renderCard(); }
function updTop(){
  const p=L.mode==='timed'?(L.timeLeft/60*100):L.state==='intro'?0:(L.done/L.total*100);
  const bar=$('#lprog'); bar.className='pbar'+(L.mode==='timed'?' blue':L.mode==='cards'?' purple':L.combo>=5?' orange':''); bar.firstElementChild.style.width=Math.max(0,Math.min(100,p))+'%';
  const st=$('#lstat');
  if(L.mode==='lesson'){ st.className='lhearts'; st.innerHTML=`❤️ ${S.hearts}`; }
  else if(L.mode==='timed'){ st.className='ltimer'; st.innerHTML=`⏱ ${Math.max(0,L.timeLeft)}s · ✔ ${L.correct}`; }
  else if(L.lives!=null){ st.className='lhearts'; st.innerHTML='❤️'.repeat(Math.max(0,L.lives))||'💔'; }
  else if(L.mode==='cards'){ st.className='lhearts'; st.innerHTML=`<span style="color:var(--purple)">🗂️ ${Math.min(L.i+1,L.queue.length)}/${L.queue.length}</span>`; }
  else { st.className='lhearts'; st.innerHTML='<span style="color:var(--purple)">∞</span>'; }
}
function nextQ(){
  if(L.mode==='timed'&&L.i>=L.queue.length){ let q=null; for(let t=0;t<5&&!q;t++) q=makeQ(pick(L.pool)); if(q) L.queue.push(q); }
  if(L.i>=L.queue.length) return finish();
  L.cur=L.queue[L.i]; renderQ();
}
function keysHTML(q){ const ks=q.keys||(q.numeric?['−',',','/']:[]); return ks.length?`<div class="keys">${ks.map(k=>`<button type="button" data-key="${k}">${k}</button>`).join('')}</div>`:''; }
function renderQ(){
  const q=L.cur; L.state='answer'; L.sel=null; const box=$('#lqbox');
  let h=`<div class="combo">${L.combo>=3?`🔥 ${L.combo} acertos seguidos!`:''}</div>`;
  if(q.tries>0) h+=`<div class="rev-tag" style="color:var(--orange)">⟲ Erro anterior — tente de novo</div>`;
  else if(q.mist) h+=`<div class="rev-tag" style="color:var(--red)">📕 Caderno de erros · ${SK[q.skill].name}</div>`;

  if(q.type==='mc'){ const g2=q.options.every(o=>stripHtml(o).length<16); h+=`<div class="opts ${g2?'g2':''}" id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${o}</span></button>`).join('')}</div>`; }
  else if(q.type==='tf'){ h+=`<div class="opts tf" id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="e">${i?'✘':'✔'}</span>${o}</button>`).join('')}</div>`; }
  else if(q.type==='input'){ h+=`<input id="ans" class="ansin" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite sua resposta" enterkeyhint="done" aria-label="Resposta">${q.unit?`<div class="unit-note">Responda em: ${q.unit}</div>`:''}${keysHTML(q)}`; }
  else if(q.type==='fill'){ h+=`<div class="sentence">${q.sentence.replace('@@','<input id="ans" class="blank" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Lacuna">')}</div>${keysHTML(q)}`; }
  else if(q.type==='bank'){ h+=`<div class="sentence">${q.sentence.replace('@@','<span class="slot" id="slot"></span>')}</div><div class="tiles" id="tiles">${q.options.map((o,i)=>`<button class="tile" data-i="${i}">${o}</button>`).join('')}</div>`; }
  box.innerHTML=h; $('#lbody').scrollTop=0;
  $('#lfoot').className='lfoot';
  $('#lfootin').innerHTML=`<div class="footrow"><div class="tools">${L.mode==='jump'?'':'<button class="toolbtn" data-act="ltheory" title="Ver aula">📖<span class="t"> Aula</span></button>'}<button class="toolbtn" data-act="lchat" title="Tirar dúvida">💬<span class="t"> Dúvida</span></button></div><button class="btn" id="bCheck" data-act="check" disabled>Verificar</button></div>`;
  const inp=$('#ans'); if(inp){ inp.addEventListener('input',()=>{$('#bCheck').disabled=!inp.value.trim();}); if(matchMedia('(pointer:fine)').matches) setTimeout(()=>inp.focus(),50); }

}
function selectOpt(i){
  const q=L.cur; if(L.state!=='answer'||!q.options||i>=q.options.length) return; L.sel=q.options[i]; beep(SND.tap);
  if(q.type==='bank'){ const slot=$('#slot'); slot.innerHTML=`<button class="tile" data-unslot="1">${q.options[i]}</button>`; document.querySelectorAll('#tiles .tile').forEach((t,j)=>t.classList.toggle('used',j===i)); }
  else document.querySelectorAll('#opts .opt').forEach((b,j)=>b.classList.toggle('sel',j===i));
  $('#bCheck').disabled=false;
}
function unslot(){ if(L.state!=='answer')return; L.sel=null; $('#slot').innerHTML=''; document.querySelectorAll('#tiles .tile').forEach(t=>t.classList.remove('used')); $('#bCheck').disabled=true; }
function check(){
  if(!L||L.state!=='answer')return; const q=L.cur; let ok;
  if(q.type==='mc'||q.type==='tf'||q.type==='bank'){ if(L.sel==null)return; ok=L.sel===q.correct; }
  else { const inp=$('#ans'); const val=inp.value.trim(); if(!val)return;
    if(q.numeric&&isNaN(parseNum(val))&&!q.check(val)){ toast('Formato não reconhecido. Exemplos: 12 · −3 · 2,5 · 3/4'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
    ok=q.check(val); inp.classList.add(ok?'ok':'bad'); inp.readOnly=true; }
  L.state='feedback'; q.tries++;
  const p=L.per[q.skill]||(L.per[q.skill]={c:0,w:0}); const st=sk(q.skill); S.answered++;
  const gs=st.g[q.gi]||(st.g[q.gi]=[0,0]); if(ok) gs[0]++; else gs[1]++;
  if(!ok) logMistake(q); else if(q.tries===1&&L.mode!=='lesson') resolveMistake(q);
  if(q.cardKey&&q.tries===1) cardRate(q.cardKey,ok?3:1);
  if(ok){ p.c++; st.c++; S.correct++; L.correct++; L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.done++; beep(SND.ok); }
  else { p.w++; st.w++; L.wrong++; L.combo=0; beep(SND.bad); if(!L.missed.includes(q)) L.missed.push(q);
    if(L.mode==='lesson') loseHeart(); if(L.lives!=null) L.lives--;
    if(['lesson','review','skill','mistakes','chk'].includes(L.mode)&&q.tries<3) L.queue.push(q); else L.done++;
    if(L.mode==='lesson'||L.lives!=null){ const s=$('#lstat'); s.classList.remove('pulse'); void s.offsetWidth; s.classList.add('pulse'); } }
  if(q.type==='mc'||q.type==='tf'){ document.querySelectorAll('#opts .opt').forEach(b=>{ const o=q.options[+b.dataset.i]; if(o===q.correct)b.classList.add('right'); else if(o===L.sel)b.classList.add('wrong'); b.classList.remove('sel'); }); $('#opts').classList.add('done'); }
  if(q.type==='bank'){ const t=$('#slot .tile'); if(t){ t.style.borderColor=ok?'var(--green)':'var(--red)'; t.style.color=ok?'var(--green-t)':'var(--red-t)'; } }
  const box=$('#lqbox'); box.classList.remove('shake','pulse'); void box.offsetWidth; if(!ok) box.classList.add('shake');
  const ms=box.querySelector('.qwrap .ms'); if(ms) ms.innerHTML=mascot(ok?'happy':'sad');
  save(); updTop();
  const f=$('#lfoot'); f.className='lfoot '+(ok?'ok':'bad');
  const ansTxt=q.answer+(q.unit&&!/R\$/.test(q.answer)?` ${q.unit}`:'');
  $('#lfootin').innerHTML=`<div class="fbtxt"><div class="fbicon">${ok?'✔':'✘'}</div><div style="min-width:0"><div class="fbtitle">${ok?pick(PRAISE):'Resposta correta:'}</div><div class="fbdetail">${ok?`<div class="why">${q.exp||''}</div>`:`<div class="ans">${ansTxt}</div><div class="why">${q.exp||''}</div><div class="savednote">📕 Guardado no caderno de erros — vai voltar para você reaprender.</div>`}</div></div></div><div class="fbactions">${ok?'':'<button class="link" data-act="lchat">💬 Por que errei?</button>'}<button class="btn ${ok?'':'red'}" data-act="cont" id="bCont">Continuar</button></div>`;
  if(L.combo>0&&L.combo%5===0) toast(`🔥 ${L.combo} acertos seguidos!`,1400);
  if(L.mode==='timed'&&ok){ const cur=q; setTimeout(()=>{ if(L&&L.cur===cur&&L.state==='feedback') cont(); },650); }
  else if(matchMedia('(pointer:fine)').matches) setTimeout(()=>{ const b=$('#bCont'); if(b) b.focus({preventScroll:true}); },30);
}
function cont(){
  if(!L||L.state!=='feedback')return;
  if(L.mode==='lesson'&&S.hearts<=0){ heartsModal(true); return; }
  if(L.lives!=null&&L.lives<=0) return finish(true);

function quitLesson(){ if(L&&L.timer)clearInterval(L.timer); L=null; closeModal(); $('#lesson').classList.add('hidden'); document.body.style.overflow=''; closeChat(); render(); }
function askQuit(){

  if(L.mode==='fuv'&&L.exam){ modal(`<div class="center"><h2 style="padding:0">Encerrar o simulado?</h2><p class="muted">As questões não respondidas contam como em branco e você verá a correção comentada.</p></div><div class="actions"><button class="btn block" data-close>Continuar o simulado</button><button class="btn red block" data-fa="endsim">Encerrar e corrigir</button></div>`); return; }
  if(L.mode==='cards'){ return L.done?finish():quitLesson(); }
  modal(`<div class="center"><div style="width:120px;margin:0 auto">${mascot('sad')}</div><h2 style="padding:0">Espere, não vá embora!</h2><p class="muted">Se sair agora, você perderá o progresso desta ${L.mode==='lesson'?'lição':'sessão'}.</p></div><div class="actions"><button class="btn block" data-close>Continuar estudando</button><button class="btn ghost dark block" data-act="quit">Sair</button></div>`);
}
function finish(failed){
  if(!L||L.state==='result')return; if(L.timer)clearInterval(L.timer);
  L.state='result';
  const answered=L.correct+L.wrong, acc=answered?L.correct/answered:0, secs=Math.round((Date.now()-L.t0)/1000);
  let xp=0,gems=0,title='',sub='',fail=!!failed;
  const perfect=L.wrong===0&&answered>0;
  if(L.mode==='lesson'){ xp=15+(perfect?5:0)+Math.min(5,Math.floor(L.maxCombo/5)*2); gems=perfect?10:5; const st=sk(L.skill); st.lv=Math.min(5,st.lv+1); st.n++; S.lessons++; if(perfect)S.perfect++; title=perfect?'Lição perfeita!':'Lição concluída!'; sub=`${SK[L.skill].name} · nível ${st.lv}/5`; }
  else if(['review','skill','mistakes','chk'].includes(L.mode)){ xp=10+Math.min(10,L.correct); gems=3; S.reviews++; const had=S.hearts; S.hearts=Math.min(MAXH,S.hearts+1); if(S.hearts>=MAXH)S.heartTs=0; title=L.mode==='mistakes'?'Erros revisados!':'Revisão concluída!'; sub=had<MAXH?'+1 ❤️ recuperada':'Memória fortalecida 🧠';
    if(L.mode==='chk'){ if(!S.chk[L.key]){ gems+=20; title='Baú aberto! 🎁'; } S.chk[L.key]=today(); } }
  else if(L.mode==='cards'){ xp=Math.min(20,5+L.correct); gems=2; title='Cartões revisados!'; sub=`${L.correct} lembrados · ${L.wrong} para rever`; if(!L.done)fail=true; }
  else if(L.mode==='timed'){ xp=L.correct*2; const rec=L.correct>S.timedBest; if(rec)S.timedBest=L.correct; title='Tempo esgotado!'; sub=rec?`🏆 Novo recorde: ${L.correct} acertos!`:`${L.correct} acertos · recorde ${S.timedBest}`; if(L.correct===0)fail=true; }
  else if(L.mode==='unit'){ const u=UNITS[L.unit]; if(!fail&&L.lives>0){ xp=40; if(!S.trophy[u.id]) gems=50; S.trophy[u.id]=today(); title='Unidade dominada! 🏆'; sub=`Unidade ${L.unit+1} · ${u.title}`; } else { fail=true; title='Quase lá!'; sub='Revise os assuntos em que errou e tente o teste de novo.'; } }
  else if(L.mode==='jump'){ if(!fail&&L.lives>0){ xp=30; gems=20; ALL.filter(s=>s.ui<L.unit).forEach(s=>{ const st=sk(s.id); if(st.lv<1){ st.lv=1; st.stab=1; st.lastT=Date.now(); } }); title='Teste aprovado!'; sub=`Unidade ${L.unit+1} desbloqueada ⏩`; } else { fail=true; title='Não foi dessa vez'; sub='Estude as unidades anteriores e tente de novo.'; } }
  if(L.mode!=='cards') Object.entries(L.per).forEach(([id,p])=>{ if(sk(id).lv>=1) memUpdate(id,p.c/(p.c+p.w||1)); });
  let streakUp=false; if(xp>0) streakUp=markStudy(xp);
  S.gems+=gems; checkAch(); save();
  beep(fail?SND.fail:SND.done); if(!fail) confetti();
  const mm=Math.floor(secs/60),ss=secs%60;
  const rs=(c,hd,v)=>`<div class="rstat" style="--c:${c}"><div class="h">${hd}</div><div class="v">${v}</div></div>`;
  const memIds=L.mode==='cards'?[]:Object.keys(L.per).filter(id=>sk(id).lv>=1).slice(0,5);
  const memBox=memIds.length?`<div class="card memres"><b>🧠 Memória atualizada</b>${memIds.map(id=>{const R=retention(id),nd=nextReviewDays(id);return `<div class="mr"><span>${SK[id].icon} ${SK[id].name}</span><span class="muted">próxima revisão ${nd<=0?'hoje':nd===1?'amanhã':'em '+nd+' dias'}</span></div>`;}).join('')}<small class="muted">Revisar no dia certo faz o intervalo crescer: você passa a lembrar por mais tempo com menos esforço.</small></div>`:'';
  const missed=L.missed.length?`<div class="mistakes"><details><summary>📝 Revisar ${L.missed.length} questão(ões) que você errou</summary>${L.missed.map(q=>`<div class="mq"><div>${q.type==='fill'||q.type==='bank'?q.prompt+'<br>'+q.sentence.replace('@@','<b>___</b>'):q.prompt}</div><div style="margin-top:6px;color:var(--green-t);font-weight:800">✔ ${q.answer}${q.unit&&!/R\$/.test(q.answer)?' '+q.unit:''}</div><div class="muted" style="font-size:14px">${q.exp||''}</div></div>`).join('')}</details></div>`:'';
  $('#lqbox').innerHTML=`<div class="result"><div class="ms">${mascot(fail?'sad':'happy')}</div><h1 class="${fail?'fail':''}">${title}</h1><p class="muted" style="font-weight:800">${sub}</p>
   <div class="rstats">${rs('#ffc800','XP ganho','⚡ '+xp)}${rs('#58cc02',L.mode==='cards'?'Lembrados':'Precisão',Math.round(acc*100)+'%')}${L.mode==='timed'?rs('#1cb0f6','Acertos','✔ '+L.correct):rs('#1cb0f6','Tempo',`⏱ ${mm}:${pad(ss)}`)}</div>
   ${streakUp?`<div class="card" style="border-color:var(--orange);width:100%"><b style="color:var(--orange)">🔥 Ofensiva de ${S.streak} dia${S.streak>1?'s':''}!</b><div class="muted" style="font-size:14px">Volte amanhã para continuar a sequência.</div></div>`:''}
   ${gems?`<div class="muted" style="font-weight:800">+${gems} 💎 gemas</div>`:''}${xpToday()>=S.goal&&xpToday()-xp<S.goal?'<div style="font-weight:900;color:var(--gold-d)">🎯 Meta diária cumprida!</div>':''}
   ${memBox}${missed}</div>`;
  $('#lbody').scrollTop=0; $('#lprog').firstElementChild.style.width=(fail?L.done/L.total*100:100)+'%';
  $('#lfoot').className='lfoot';
  $('#lfootin').innerHTML=`<div class="footrow" style="justify-content:flex-end">${L.mode==='timed'?'<button class="btn ghost" data-act="timed">Jogar de novo</button>':''}${L.mode==='unit'&&fail?`<button class="btn ghost" data-act="review-unit" data-unit="${L.unit}">Revisar a unidade</button>`:''}<button class="btn" data-act="quit" id="bCont">Continuar</button></div>`;
  updTopFinal();
}
function updTopFinal(){ const st=$('#lstat'); if(L&&L.mode==='lesson'){st.innerHTML=`❤️ ${S.hearts}`;} }

/* =====================================================================
   Chat
   ===================================================================== */
let chatStarted=false;
function botMsg(html){ const b=$('#chatb'); const d=document.createElement('div'); d.className='msg bot'; d.innerHTML=html; b.appendChild(d); b.scrollTop=b.scrollHeight; }
function meMsg(t){ const b=$('#chatb'); const d=document.createElement('div'); d.className='msg me'; d.textContent=t; b.appendChild(d); b.scrollTop=b.scrollHeight; }
function chips(){ const inL=L&&L.cur&&L.state!=='result'&&!$('#lesson').classList.contains('hidden'); const c=inL?(L.state==='feedback'?['Por que essa é a resposta?','Explique o conceito','Me dê outra dica']:['Me dê uma dica','Como resolvo?','Explique o conceito','Mostrar resposta']):BRAND.chips; $('#chips').innerHTML=c.map(x=>`<button class="chip" data-chip="${esc(x)}">${x}</button>`).join(''); }
function openChat(){
  const c=$('#chat'); c.classList.add('open'); c.setAttribute('aria-hidden','false'); $('#chatav').innerHTML=mascot();
  const inL=L&&L.cur&&L.state!=='result'&&!$('#lesson').classList.contains('hidden');
  if(!chatStarted){ chatStarted=true; botMsg(`Olá! Eu sou o <b>${BRAND.tutor}</b> ${BRAND.sym}, seu tira-dúvidas. Posso explicar conceitos, dar dicas na questão atual e fazer contas (ex.: <b>2^10</b>, <b>raiz de 144</b>, <b>15% de 80</b>).`); }
  if(inL){ const q=L.cur; if(L.chatQ!==q){ L.chatQ=q; botMsg(`Estou vendo sua questão de <b>${SK[q.skill].name}</b>:<div class="ex">${q.type==='fill'||q.type==='bank'?q.sentence.replace('@@','___'):q.prompt}</div>${L.state==='feedback'?'Quer que eu explique a resolução?':'Quer uma <b>dica</b> ou o <b>método</b> para resolver?'}`); } }
  chips(); if(matchMedia('(pointer:fine)').matches) setTimeout(()=>$('#chatin').focus(),260);
}
function closeChat(){ const c=$('#chat'); c.classList.remove('open'); c.setAttribute('aria-hidden','true'); }
function ask(text){ if(!text.trim())return; meMsg(text); const b=$('#chatb'); const t=document.createElement('div'); t.className='msg bot typing'; t.textContent='•••'; b.appendChild(t); b.scrollTop=b.scrollHeight; setTimeout(()=>{ t.remove(); let r; try{ r=tutor(text); }catch(e){ r='Ops, me confundi. Pode reformular?'; } botMsg(r); chips(); },450+Math.random()*350); }

/* =====================================================================
   Eventos
   ===================================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-node]');
  if(!t){ if(OPEN_POP&&!e.target.closest('.pop')){ OPEN_POP=null; if(VIEW==='learn') render(); } return; }
  const d=t.dataset;
  if(d.view){ VIEW=d.view; OPEN_POP=null; render(); window.scrollTo(0,0); return; }
  if(d.node){ OPEN_POP=OPEN_POP===d.node?null:d.node; render(); beep(SND.tap); return; }
  if(d.start){ closeModal(); startSession('lesson',{skill:d.start}); return; }
  if(d.practice){ startSession('skill',{skill:d.practice}); return; }
  if(d.theory){ openTheory(d.theory,!!(L&&!$('#lesson').classList.contains('hidden')&&L.state!=='result')); return; }
  if(d.guide!=null){ openGuide(+d.guide); return; }
  if(d.jump!=null){ jumpModal(+d.jump); return; }
  if(d.goal){ S.goal=+d.goal; save(); render(); return; }
  if(d.theme){ S.theme=d.theme; save(); render(); return; }
  if(d.toggle){ S[d.toggle]=!S[d.toggle]; save(); render(); return; }
  if(d.key){ const inp=$('#ans'); if(inp&&!inp.readOnly){ const k=d.key==='−'?'-':d.key; const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??inp.value.length; inp.value=inp.value.slice(0,s)+k+inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); inp.dispatchEvent(new Event('input')); } return; }
  if(d.chip){ ask(d.chip); return; }
  if(d.chk){ const u=UNITS.find(x=>d.chk.startsWith(x.id+'-')); const nd=unitNodes(u).find(n=>n.t==='chk'&&n.key===d.chk); startSession('chk',{ids:nd.ids,key:d.chk}); return; }
  if(d.rate){ rateCard(+d.rate); return; }
  if(t.classList.contains('opt')&&L&&L.mode!=='fuv'){ selectOpt(+d.i); return; }
  if(t.classList.contains('tile')&&L){ if(d.unslot) unslot(); else if(d.i!=null) selectOpt(+d.i); return; }
  switch(d.act){
    case 'streak': streakModal(); break;
    case 'gems': gemsModal(); break;
    case 'hearts': heartsModal(false); break;
    case 'level': levelModal(); break;
    case 'review-due': { const ids=dueList(); if(ids.length) startSession('review',{ids:ids.slice(0,6)}); else toast('Nenhuma revisão pendente! ✅'); break; }
    case 'review-all': { const inLesson=L&&!$('#lesson').classList.contains('hidden'); if(inLesson){ if(L.timer)clearInterval(L.timer); L=null; $('#lesson').classList.add('hidden'); } startSession('review',{}); break; }
    case 'mistakes': startSession('mistakes'); break;
    case 'cards': startSession('cards'); break;
    case 'flip': flipCard(); break;
    case 'intro-go': L.state='answer'; nextQ(); break;
    case 'unit': startSession('unit',{unit:+d.unit}); break;
    case 'review-unit': { const u=+d.unit; quitLesson(); startSession('review',{ids:weakest(UNITS[u].skills.map(s=>s.id),5)}); break; }
    case 'mistlist': modal(`<h2>📕 Caderno de erros</h2><p class="muted" style="margin-bottom:10px">Questões que você errou recentemente. No treino, elas voltam com números novos.</p><div class="list">${(S.mist||[]).slice(0,40).map(m=>`<div class="item" style="display:block"><small style="color:${SK[m.s]?SK[m.s].unit.color:'inherit'};font-weight:800">${SK[m.s]?SK[m.s].icon+' '+SK[m.s].name:''}</small><div style="font-size:15px">${esc(m.p)}</div><div style="color:var(--green-t);font-weight:800;font-size:14px">✔ ${esc(m.a)}</div></div>`).join('')}</div><div class="actions"><button class="btn red block" data-act="mistakes">Reaprender agora</button></div>`); break;
    case 'nudge-go': closeModal(); { const ids=dueList(); startSession('review',{ids:ids.slice(0,6)}); } break;
    case 'timed': { if(L&&L.timer)clearInterval(L.timer); L=null; startSession('timed'); break; }
    case 'jump': startSession('jump',{unit:+d.unit}); break;
    case 'refill': if(S.gems>=REFILL){ S.gems-=REFILL; S.hearts=MAXH; S.heartTs=0; save(); closeModal(); toast('❤️ Vidas recarregadas!'); if(L&&L.state==='feedback'){ updTop(); } else render(); } break;
    case 'quit': quitLesson(); break;
    case 'check': check(); break;
    case 'cont': cont(); break;
    case 'ltheory': openTheory(L.cur.skill,true); break;
    case 'lchat': openChat(); break;
    case 'reset': modal(`<h2>Apagar todo o progresso?</h2><p class="muted">XP, ofensiva, níveis e conquistas deste aparelho serão perdidos. Isso não pode ser desfeito.</p><div class="actions"><button class="btn red block" data-act="reset-yes">Sim, apagar tudo</button><button class="btn ghost block" data-close>Cancelar</button></div>`); break;
    case 'reset-yes': S=defState(); save(); closeModal(); VIEW='learn'; render(); toast('Progresso apagado.'); break;
  }
});
$('#lclose').addEventListener('click',askQuit);
$('#fab').addEventListener('click',openChat);
$('#chatclose').addEventListener('click',closeChat);
$('#chatf').addEventListener('submit',e=>{ e.preventDefault(); const i=$('#chatin'); const v=i.value; i.value=''; ask(v); });
document.addEventListener('input',e=>{
  if(e.target.id==='namein'){ S.name=e.target.value.slice(0,24)||'Estudante'; save(); const av=document.querySelector('.avatar'); if(av) av.textContent=(S.name.trim()[0]||'E').toUpperCase(); }
  if(e.target.id==='lsearch'){ const q=normChat(e.target.value); document.querySelectorAll('#view .item[data-name]').forEach(it=>{ it.style.display=!q||it.dataset.name.includes(q)?'':'none'; }); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#chat').classList.contains('open')) closeChat(); else if(modalOpen()&&$('.modal-bg .close')) closeModal(); return; }
  if(!L||$('#lesson').classList.contains('hidden')||modalOpen()) return;
  if(document.activeElement&&document.activeElement.id==='chatin') return;
  if(L.mode==='fuv'){ fuvKey(e); return; }
  if(L.mode==='cards'){ if((e.key==='Enter'||e.key===' ')&&L.state==='front'){ e.preventDefault(); flipCard(); } else if(L.state==='back'&&/^[1-4]$/.test(e.key)) rateCard(+e.key); else if(e.key==='Enter'&&L.state==='result'){ e.preventDefault(); quitLesson(); } return; }
  if(e.key==='Enter'){ e.preventDefault(); if(L.state==='intro'){ L.state='answer'; nextQ(); } else if(L.state==='answer') check(); else if(L.state==='feedback') cont(); else if(L.state==='result') quitLesson(); return; }
  if(L.state==='answer'&&/^[1-9]$/.test(e.key)&&['mc','tf','bank'].includes(L.cur.type)){ selectOpt(+e.key-1); }
});
setInterval(()=>{ const h=S.hearts; regen(); if(S.hearts!==h){ if(!L||$('#lesson').classList.contains('hidden')) render(); } const hn=$('#hnext'); if(hn) hn.textContent=nextHeartIn(); },1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ checkStreak(); regen(); if(!L||$('#lesson').classList.contains('hidden')) render(); } });

/* =====================================================================
   Início
   ===================================================================== */
checkStreak(); render();
setTimeout(()=>{ const d=dueList(); if(d.length&&S.nudged!==today()&&S.last!==today()&&!modalOpen()){ S.nudged=today(); save();
  modal(`<div class="center"><div style="width:120px;margin:0 auto">${mascot()}</div><h2 style="padding:0">Hora de relembrar!</h2><p class="muted">${d.length} assunto${d.length>1?'s estão':' está'} esfriando: <b>${d.slice(0,3).map(id=>SK[id].name).join(', ')}${d.length>3?'…':''}</b>. Uma revisão rápida agora faz você lembrar deles por muito mais tempo.</p></div><div class="actions"><button class="btn block" data-act="nudge-go">Revisar agora (3 min)</button><button class="btn ghost block" data-close>Depois</button></div>`); } },500);
if(!S.lessons&&!localStorage.getItem(LSK+'_hi')){ try{localStorage.setItem(LSK+'_hi','1');}catch(e){} setTimeout(()=>modal(`<div class="center"><div style="width:140px;margin:0 auto">${mascot('happy')}</div><h2 style="padding:0">Bem-vindo ao ${BRAND.app}!</h2><p class="muted">${BRAND.welcome} Eu sou o <b>${BRAND.tutor}</b> e vou te ajudar no caminho!</p></div><div class="actions"><button class="btn block" data-start="${BRAND.first}">Começar do básico</button><button class="btn ghost block" data-close>Explorar a trilha</button></div><p class="muted center" style="font-size:13px;margin-top:12px">Já sabe o básico? Use o botão <b>⏩ Pular</b> nas unidades para fazer um teste de nivelamento.</p>`),350); }
</script>
